seller:
  steps:
    - title: Objects, not files
      text: S3 stores each image as an object with a key and metadata. A prefix such as products/ only looks like a folder.
      target: "#gallery-wrap"
    - title: Upload an image
      text: Select a small image and upload it. The panel shows PutObject with the metadata and the new version id.
      target: "#upload"
    - title: Versions
      text: Upload a file with the same name again. S3 keeps the old version. A lifecycle rule deletes old versions after one day.
      target: "#gallery-wrap"
    - title: Two ways to download
      text: Compare "Through the Engine App" and "Presigned URL". With the presigned URL, the browser downloads from S3 itself.
      target: "#direct"
