graph:
  steps:
    - title: Vertices and edges
      text: Customers and products are vertices. Each purchase is a BOUGHT edge from a customer to a product.
      target: "#graph"
    - title: Compare two customers
      text: Select Lukas, then Ayşe. Lukas buys books only, so his graph is narrow. Ayşe buys in many categories.
      target: "#exp"
    - title: The cold-start problem
      text: Select Elif. She has no orders, so she has no edges. Personal recommendations need history.
      target: "#exp"
