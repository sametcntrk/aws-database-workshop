cart:
  steps:
    - title: One partition per Visitor
      text: The partition key is CART plus your browser id. DynamoDB finds all your items with one Query, at any table size.
      target: "#cart"
    - title: Compare the read cost
      text: Select "Eventually consistent". The panel shows half the read request units. The read can miss a write from the last second.
      target: "#exp-consistent"
    - title: Items expire by themselves
      text: Each item has an expires_at time. DynamoDB deletes the item after 24 hours. TTL deletes cost nothing.
      target: "#rows"
    - title: A burst of shoppers
      text: Start the simulation. 200 synthetic shoppers write to the table at the same time. Look at the writes per second and the latency.
      target: "#sim"
    - title: Go to checkout
      text: Checkout reads this cart, then Aurora writes the order. After the order, DynamoDB empties the cart.
      target: "#go-checkout"
