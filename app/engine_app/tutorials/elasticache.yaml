deals:
  steps:
    - title: The stock is a counter in memory
      text: ElastiCache keeps the deal stock as one number. Each purchase sends DECR, which lowers the number by one.
      target: "#deal"
    - title: Buy one piece
      text: Click "Buy one now". The panel shows DECR. If the result is below zero, the app sends INCR and you get no piece.
      target: "#buy"
    - title: Rush with atomic DECR
      text: Start the rush with "Atomic DECR". Valkey runs one command at a time. The shop sells exactly the stock.
      target: "#sim"
    - title: Rush with read, then write
      text: Select "Read, then write" and start the rush again. Buyers read the same value, and the shop sells pieces it does not have.
      target: "#exp-mode"
    - title: Sessions expire by themselves
      text: Set the TTL to 30 seconds and read the session. The TTL value goes down. At zero, Valkey deletes the session.
      target: "#session"
live:
  steps:
    - title: A sorted set
      text: The leaderboard is a sorted set. Valkey keeps the members in order at every write, so "top 10" is ready at all times.
      target: "#board"
    - title: Counters
      text: The order count uses INCR. The active Visitor count uses a sorted set of last-seen times.
      target: "#counters"
    - title: Place an order
      text: Open checkout in a second tab and place an order. Your persona moves up within 5 seconds.
      target: "#board"
