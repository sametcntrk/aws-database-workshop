reports:
  steps:
    - title: A columnar warehouse
      text: Redshift stores each column separately. A report reads only the columns that it uses.
      target: "#chart-wrap"
    - title: Group by a different column
      text: Select Category, then City. Each report scans the full table, but only two or three columns of it.
      target: "#exp-dim"
    - title: Live data from Aurora
      text: Select "Live from Aurora". This query reads the Aurora tables that the zero-ETL integration copies into Redshift.
      target: "#exp-src"
    - title: Your order in the report
      text: Place an order in checkout, then refresh the status. The newest workshop order shows how many seconds ago Redshift received it.
      target: "#repl"
