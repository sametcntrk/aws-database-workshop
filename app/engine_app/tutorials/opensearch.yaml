search:
  steps:
    - title: OpenSearch is a search index
      text: OpenSearch keeps a copy of the product names and descriptions in an inverted index. The catalog itself stays in DocumentDB.
      target: "#hits"
    - title: Search with a typo
      text: Click "kulaklk (typo)". Fuzziness AUTO accepts one or two wrong letters, so the search still finds headphones.
      target: "#exp"
    - title: Turn off the typo tolerance
      text: Select "Exact words" and search again. The typo now finds nothing. Compare the two calls in the panel.
      target: "#exp-fuzzy"
    - title: Turkish letters
      text: The tr_folded analyzer changes ı to i and ş to s. Select "standard" and search "kablosuz kulaklik". Fewer products match.
      target: "#exp-analyzer"
    - title: Facets come from the same query
      text: The category and price counts are aggregations in the same request. Click a category to filter the results.
      target: "#facets"
stores:
  steps:
    - title: Stores have a geo_point
      text: Each store document has a location field of type geo_point. OpenSearch can filter and sort by distance on this field.
      target: "#map"
    - title: Click the map
      text: Click a place on the map. OpenSearch returns the stores inside the circle, nearest first.
      target: "#map"
    - title: Change the radius
      text: Select 10 km, then 100 km. The geo_distance query in the panel changes, and the list changes with it.
      target: "#exp-km"
