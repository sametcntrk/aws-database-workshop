# Guided shopping journey: one stop per Storefront Section, in the order a shopper uses them.
stops:
  - page: home
    href: /
    title: Home
    text: DocumentDB builds the category menu and the product cards.
  - page: search
    href: /search?q=kablosuz%20kulaklik
    title: Search
    text: OpenSearch finds products, also when the query has a typo.
  - page: product
    href: /p/P0001
    title: Product
    text: Four Engines fill one product page.
  - page: cart
    href: /cart
    title: Cart
    text: DynamoDB keeps your cart in one partition.
  - page: checkout
    href: /checkout
    title: Checkout
    text: Aurora writes the order in one transaction. Five more Engines get updates.
  - page: orders
    href: /orders
    title: My orders
    text: Aurora joins three tables to show your orders.
  - page: reports
    href: /admin/reports
    title: Sales reports
    text: Redshift reports on your order, which zero-ETL copied from Aurora.
