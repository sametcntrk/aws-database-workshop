        steps:
          - who: OpenSearch → Uygulama
            text: "{items} mağaza geldi; her birinin yanında sıralama değeri olarak uzaklığı (km)."
          - who: Uygulama
            text: Uzaklıkları bir basamağa yuvarladı ve mağaza bilgileriyle birleştirdi.
          - who: Uygulama → Tarayıcın
            text: Mağazaları ve isteğin kaydını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: >-
              Haritadaki daireyi 100 km'ye büyüttü, her mağaza için bir işaret koydu ve altındaki listeyi en yakından uzağa çizdi.
          - who: Tarayıcın → OpenStreetMap
            text: >-
              Daire büyüyünce haritanın görünmeyen kısımları için yeni karolar indirildi. Bunlar AWS dışı bir harita servisinden
              gelir; işaretleri (OpenSearch) karoların üstüne koyan tarayıcıdır.
          - who: Sonra
            text: >-
              Haritada başka bir yere tıklarsan ya da Ankara, Frankfurt gibi bir şehir seçersen aynı sorgu o noktayla tekrarlanır.
      remember: >-
        Konumu geo_point olarak sakla; "şu noktaya X km içindekiler, en yakın önce" sorusunu arama motoru, uzak bölgeleri hiç
        açmadan cevaplar. Filtre eler, sıralamayı ayrıca _geo_distance verir.
      why_db: >-
        Neden OpenSearch? Mağaza bulucu; uzaklık filtresi, uzaklığa göre sıralama ve gerekirse metin aramasını bir arada ister.
        OpenSearch bunları aynı index'te sunar. Bedeli: harita görüntüsü ve adres çevirisi onun işi değildir; ayrı bir servis gerekir.

  # ---------------------------------------------------------------- Product: DocumentDB, Keyspaces, Neptune, DynamoDB
  - page: product
    path: /p/P0001
    engines: [docdb]
    use_case: Bir ürün için tek okuma
    title: Daha az alan oku
    why: >-
      Bir ürünün sayfasındasın: adı, fiyatı, açıklaması ve özellikleri tek seferde geldi. Şimdi aynı ürünü sadece kartta
      görünen bilgilerle isteyeceksin ve veritabanından ne kadar az veri geldiğine bakacaksın.
    do: Aydınlık "Card fields only" (sadece kart alanları) butonuna tıkla.
    target: "#exp-proj [data-value=card]"
    action: click
    wait: {method: GET, path: /docdb/api/product/*, query: {projection: card}}
    focus: "#pdp"
    result: The card projection has no description and no attributes, so less data goes over the network.
    panel:
      need: >-
        Ürün sayfası bir ürünün bütün bilgisini gösteriyor: ad, fiyat, stok, açıklama, renk, garanti, etiketler. Liste ve kart
        gibi yerlerde ise sadece birkaç alan gerekiyor. Her yerde bütün dokümanı taşımak, ürün sayısı ve doküman boyutu
        büyüdükçe ağı ve belleği gereksiz yere doldurur.
      concept:
        term: Tek okuma ve projection
        text: >-
          DocumentDB'de bir ürünün bütün bilgisi tek bir dokümanda durur; ürünü getirmek için tablolar birleştirilmez, _id ile
          tek bir okuma yeter. Projection ise "bu dokümanın sadece şu alanlarını getir" demektir. Bir dosya dolabından bütün
          dosyayı değil, sadece kapak sayfasının fotokopisini istemek gibi: dosya yine bir kez açılır, ama elinize daha az
          kâğıt gelir.
        terms:
          - [_id, "Her dokümanın benzersiz anahtarı. Burada ürün numarası (P0001). Üzerinde her zaman bir index vardır."]
          - [find_one, "Tek bir doküman getiren okuma."]
          - [Projection, "Okumada hangi alanların döneceğini seçmek. 1 \"getir\" demek; yazılmayan alanlar gelmez."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde ürün dokümanı için hazırlık
        intro: >-
          Ürün sayfası hiç açılmadan, dokümanın şekli ve hangi ekranın hangi alanları okuyacağı belirlenir. Aşağıdaki beş adım bu
          hazırlığın sırasıdır.
        text:
          - title: Önce ekranların soruları yazılır
            text: >-
              Ürün sayfası "bu ürünün her şeyi", kart ve listeler "ad, fiyat, puan, stok" ister. İki soru aynı dokümandan,
              farklı projection'larla cevaplanır.
            code: |-
              db.products.findOne({ _id: "P0001" })                                         // ürün sayfası
              db.products.findOne({ _id: "P0001" }, { name: 1, price: 1, rating: 1, stock: 1 }) // kart
          - title: Birlikte okunan bilgi birlikte saklanır
            text: >-
              Ürün sayfası özellikleri ve etiketleri her zaman ürünle birlikte gösterir; bu yüzden onlar ayrı koleksiyonda değil,
              dokümanın içinde durur. Böylece sayfa tek okumayla, JOIN olmadan çizilir.
            code: |-
              { _id: "P0001", name: "…", price: 3373.84, tags: ["hızlı kargo", "çevreci"],
                attributes: { renk: "siyah", garanti_ay: 12, agirlik_kg: 2.45 }, description: "…" }
          - title: Sınırsız büyüyen listeler ayrılır
            text: >-
              Yorumlar ya da fiyat geçmişi gibi zamanla sınırsız büyüyen listeler dokümanın içine konmaz; ayrı bir koleksiyonda,
              ürün numarasıyla tutulur. Bir doküman en fazla 16 MB olabilir ve büyük doküman her okumada daha çok veri taşır.
          - title: Her ekran kendi projection'ını kullanır
            text: >-
              Liste ve kartlar sadece gereken alanları ister. Böylece hem ağdan daha az veri geçer hem uygulama sunucusunun
              belleği daha az dolar. Uzun açıklama gibi büyük alanlar sadece ürün sayfasında okunur.
          - title: Okuma kopyalara dağıtılır
            text: >-
              Ürün sayfası çok okunur. Okuma tercihi secondaryPreferred olur: okumalar replica'lara gider, ana kopya yazmalara
              kalır. _id ile okuma her zaman index'le, tek bir dokümana doğrudan gider.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Katalog yönetimi: ürün ekleyen, fiyat, stok ve açıklama güncelleyen arka ofis ekranları ya da tedarikçi dosyalarını
          aktaran bir iş. Hepsi uygulama üzerinden yazar.
        reads: Uygulama, ürün sayfası, kartlar ve sepete ekleme sırasında ürün bilgisi için.
        kind: >-
          Uygulama orkestrasyonu. DocumentDB başka bir veritabanından kendiliğinden veri çekmez. Kendi değişikliklerini ise
          change streams ile dışarı verebilir.
        with: >-
          Ürün sayfası beş veritabanına dokunur: ürünün kendisi DocumentDB'den, görseli nesne deposundan (S3), "baktın" kaydı ve
          "son baktıkların" bir olay tablosundan (Keyspaces), öneriler bir graf veritabanından (Neptune), oturum bellekten
          (ElastiCache). Sayfa bunları ayrı isteklerle alır ve tarayıcı birleştirir.
        best: >-
          Katalog tek yerde tutulur. Ürün bilgisinin kopyası başka yerlere (sepet, olay kaydı, arama index'i) sadece gereken
          alanlarla ve yazıldığı anki değeriyle konur; asıl değer her zaman katalogdan okunur.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Bir ürün kartına (Alpen Kablosuz Kulaklık 1) tıkladın ve /p/P0001 açıldı. Açılırken oturumun güncellendi.
            engines: [elasticache]
          - text: >-
              Sayfa önce ürünün kendisini istedi; "Full document" (bütün doküman) seçiliydi. Uygulama DocumentDB'ye _id ile tek
              bir okuma gönderdi ve bütün doküman geldi. Simülasyonun sol şeridi bu istek. Büyük görsel ayrıca S3'ten geldi.
            engines: [docdb, s3]
          - text: >-
              Ürün gelince sayfa "baktın" kaydını Keyspaces'e yazdırdı, "Son baktıkların" şeridini ve Neptune'dan önerileri istedi
              (sonraki adımlarda bunlara bakacaksın).
            engines: [keyspaces, neptune]
          - text: >-
              Sonra "Card fields only" butonuna bastın. Tarayıcın aynı ürünü projection=card ile istedi; uygulama aynı okumayı
              projection'la gönderdi. Simülasyonun sağ şeridi bu istek. Açıklama ve özellikler sayfadan kalktı.
            engines: [docdb]
      sim:
        kind: projection
        caption: >-
          Gerçek ürün dokümanı (P0001). İki şerit iki ayrı gerçek istek: soldaki sayfa açılırken bütün dokümanı, sağdaki senin
          tıklamanla sadece kart alanlarını istedi. Bayt sayıları alanların JSON hâlinden hesaplanır.
        doc:
          _id: P0001
          name: Alpen Kablosuz Kulaklık 1
          category: Elektronik
          brand: Alpen
          type: Kablosuz Kulaklık
          price: 3373.84
          stock: 128
          color: siyah
          rating: 4.8
          attributes: {renk: siyah, garanti_ay: 12, agirlik_kg: 2.45}
          tags: [hızlı kargo, çevreci]
          description: Alpen markalı siyah kablosuz kulaklık. Elektronik kategorisinde, şık bir ürün.
        lanes:
          - id: full
            title: "t-1 · İstek 1 · Sayfa açılınca · Bütün doküman"
            fields: null
            send: >-
              Ürün sayfasını açtın. Tarayıcın ürünü istedi; uygulama DocumentDB'ye find_one({ _id: "P0001" }) gönderiyor,
              projection yok.
            back: Uygulama bütün dokümanı tarayıcına gönderdi; sayfa adı, fiyatı, açıklamayı ve özellikleri çizecek.
          - id: card
            title: "t0 · İstek 2 · Senin tıklaman · Sadece kart alanları"
            fields: [name, price, rating, category, brand, tags, stock]
            send: >-
              "Card fields only" butonuna bastın. Tarayıcın ürünü projection=card ile istedi; uygulama aynı okumayı yedi alanlık
              bir projection'la gönderiyor.
            back: Uygulama sadece kart alanlarını tarayıcına gönderdi; açıklama ve özellikler sayfadan kalkacak.
        summary: >-
          İki istekte de doküman bir kez, _id ile okundu. Fark ağdan geçen veride: projection yalnızca istenen alanları gönderdi.
          Gerçek ölçümde kart alanları bütün dokümanın yarısından az (aşağıdaki "Gerçek dokümanda ne oldu?" kutusu).
      wire:
        what: >-
          Uygulama, DocumentDB'ye açık tuttuğu bağlantılar üzerinden komutu gönderir (pymongo kütüphanesi).
        dst: "dbws-docdb.cluster-ccgs3qxfidad.eu-central-1.docdb.amazonaws.com : 27017"
        dst_note: >-
          DocumentDB cluster'ının adresi. Okuma tercihi "secondaryPreferred" olduğu için bu okuma replica'ya gider.
        rows:
          - [Şifreleme, TLS, gerçek, DocumentDB'nin sertifikası AWS'nin sertifika dosyasıyla kontrol edilir.]
          - [Protokol, MongoDB wire protokolü (OP_MSG), gerçek, "MongoDB sürücülerinin konuştuğu ikili dil. DocumentDB bu dili anlar."]
          - [Kimlik, "Kullanıcı adı + şifre, bağlantı açılırken", gerçek, "Şifre kodda yazmaz; uygulama onu çalışırken AWS Secrets Manager'dan alır."]
        body_label: Çerçevenin içeriği (okunur hâle getirilmiş)
        body: |-
          OP_MSG   veritabanı: shop
          { find: "products",
            filter: { _id: "P0001" },
            projection: { name: 1, price: 1, rating: 1, category: 1, brand: 1, tags: 1, stock: 1 },
            limit: 1,
            $readPreference: { mode: "secondaryPreferred" } }
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. İki istek de aynı
        kodu çalıştırır; fark adresteki projection seçimi.
      app_code:
        - file: engines/docdb.py
          func: api_product
          title: Ürün isteği (iki istekte de aynı kod)
          sub: Adresteki projection=full ya da projection=card hangi alanların geleceğini seçer.
          lines:
            - {match: '@bp.get("/api/product/<pid>")', say: "Ürün isteği buraya gelir; adres ürün numarasını ve projection seçimini taşır.", tag: Tarayıcı → Uygulama}
            - {match: 'full = request.args.get("projection", "full") == "full"', say: "Bütün doküman mı, sadece kart alanları mı, ona bakar.", tag: Uygulamanın içinde}
            - {match: 'd = db().products.find_one({"_id": pid}, None if full else CARD)', say: "Tek okuma DocumentDB'ye gider: _id ile, gerekiyorsa kart alanları projection'ıyla.", tag: [Uygulama → DocumentDB, DocumentDB → Uygulama], hl: id}
            - {match: 'size = len(json.dumps(d', say: Gelen dokümanın boyutunu bayt olarak hesaplar (isteğin kaydı için)., tag: Uygulamanın içinde}
            - {match: 'return jsonify(ok=False, error=f"Product {pid} does not exist."', say: "Ürün yoksa \"böyle bir ürün yok\" cevabı döner.", tag: Uygulama → Tarayıcı}
            - {match: 'return jsonify(trace.payload(_doc(d)))', say: "_id'nin adını product_id yapar ve ürünü tarayıcıya gönderir.", tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek dokümanda ne oldu?
        intro: >-
          Sayfa açılırken bütün dokümanla giden okuma ve senin tıklamanla kart alanlarıyla giden okuma.
        runs:
          - label: Bütün doküman (sayfa açılınca)
            page_call: {path: /docdb/api/product/P0001, query: {projection: full}}
            metrics: [[Okunan doküman, items], [Cevaptaki ürün verisi, bytes], [Süre, ms]]
          - label: Sadece kart alanları (senin tıklaman)
            trigger: true
            metrics: [[Okunan doküman, items], [Cevaptaki ürün verisi, bytes], [Süre, ms]]
        reading: >-
          İki okumada da tek doküman okundu ve süre birkaç milisaniye. Fark taşınan veride: kart alanları bütün dokümanın yarısından
          az. Tek bir üründe bu birkaç yüz bayt; bir listede 48 ürün ve büyük açıklamalarla fark katlanır. Süre her istekte biraz
          değişir.
      query:
        title: Sayfa DocumentDB'ye ne dedi?
        intro: >-
          İki sütun, simülasyondaki iki isteğin komutu. Tek fark projection parçası. Bir parçanın üzerine gelince cümlede, kodda ve
          açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: one
            say: products koleksiyonundan _id'si P0001 olan tek ürünü
            code: 'db.products.findOne({ _id: "P0001" }'
            name: Hangisi?
            note: _id ile okuma. _id'nin index'i her koleksiyonda hazırdır; veritabanı doğrudan o dokümana gider.
            hl: id
          - id: all
            say: bütün alanlarıyla getir.
            code: )
            name: Hangi alanlar?
            note: Projection yok; dokümanın bütün alanları gelir.
            hl: field
          - id: crd
            say: sadece ad, fiyat, puan, kategori, marka, etiket ve stok alanlarıyla getir.
            code: ', { name: 1, price: 1, rating: 1, category: 1, brand: 1, tags: 1, stock: 1 })'
            name: Hangi alanlar?
            note: Projection. 1 "getir" demek; açıklama, özellikler ve tür gelmez. _id her zaman gelir.
            hl: field
            tag: sadece sağdaki komutta var
        columns:
          - label: Bütün doküman
            sub: Sayfa açılırken giden komut.
            via: Uygulama bu komutu pymongo kütüphanesinin find_one() metoduyla gönderir.
            parts: [one, all]
          - label: Sadece kart alanları
            sub: Senin "Card fields only" tıklamanla giden komut.
            via: Aynı find_one() çağrısı; uygulama ikinci parametre olarak kart alanlarının listesini ekledi.
            parts: [one, crd]
            mark: [crd]
        note: >-
          Dikkat: projection okunan doküman sayısını değiştirmez; doküman yine bir kez okunur. Değişen, okunduktan sonra
          uygulamaya gönderilen alanlardır.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          DocumentDB'nin işi dokümanı verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: DocumentDB → Uygulama
            text: Sadece yedi kart alanı ve _id geldi.
          - who: Uygulama
            text: Boyutu isteğin kaydına yazdı ve _id'nin adını product_id yaptı.
          - who: Uygulama → Tarayıcın
            text: Ürünü ve isteğin kaydını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: >-
              Adı, fiyatı ve puanı yeniden yazdı. Açıklama yerine "The card projection does not return the description" (kart
              projection'ı açıklamayı getirmez) yazdı; özellik listesi kısaldı.
          - who: Sonra
            text: >-
              Görsel değişmedi; S3'ten bir kez gelmişti. "Full document" butonuna basarsan bütün doküman yeniden gelir.
      remember: >-
        Bir ürünün bütün bilgisi tek dokümanda olunca tek okuma yeter. Her ekran sadece ihtiyacı olan alanları projection'la
        ister; doküman yine bir kez okunur ama ağdan daha az veri geçer.
      why_db: >-
        Neden DocumentDB? Ürünün farklı yapıdaki bütün bilgisi tek bir dokümanda ve _id ile tek okumada geliyor; projection
        gereken alanları seçiyor. Bedeli: sınırsız büyüyen listeler (yorumlar) dokümana konmaz, ayrı tutulur.

  - page: product
    path: /p/P0001
    engines: [keyspaces]
    use_case: Kullanıcı başına olay geçmişi
    title: Sayfa, baktığın ürünü Keyspaces'e yazdı
    why: >-
      Bir önceki adımda bu ürünün sayfasını açtın. Sayfa açılırken mağaza arka planda iki iş yaptı: "bu ürüne baktın"
      bilgisini bir veritabanına (Keyspaces) kaydetti, hemen ardından baktığın ürünlerin listesini aynı yerden geri okudu.
      Sayfadaki "Recently viewed" (son baktıkların) şeridi bu listedir. Bu adımda tıklama yok, sadece bakacaksın.
    after: >-
      Şeritteki her ürün, Keyspaces'te sana ait partition'a (kişiye ait deftere) yazılmış bir "view" satırından geliyor.
      Keyspaces sadece senin defterini açtı ve en yeni satırları verdi. "view" olmayan satırları ve aynı ürünün tekrarlarını
      Uygulama ayıkladı, en fazla 8 ürünü şeride koydu. Başka bir ürüne bakıp geri dönersen o ürün şeridin en başına geçer.
    do: Aydınlık "Recently viewed" (son baktıkların) şeridine bak. Sonra kartın altındaki butonla perde arkasını aç.
    target: "#recent-wrap"
    action: look
    wait: {method: GET, path: /keyspaces/api/recent}
    panel:
      need: >-
        Mağaza her ziyaretçinin ne yaptığını (baktığı, sepete eklediği, aradığı ürünleri) kaydediyor. Bu kayıtlar çok
        sık yazılıyor ve hep aynı soruyla okunuyor: "bu kişinin son yaptıkları ne?". Binlerce ziyaretçinin milyonlarca
        satırı arasından sadece senin satırlarını, en yenisi en üstte, hızlıca bulmak gerekiyor.
      concept:
        term: Partition (kişiye ait defter)
        text: >-
          Keyspaces tabloyu partition'lara böler. Her ziyaretçinin satırları kendi partition'ında, yani kendi defterinde
          durur. Defterin hangisi olduğunu user_id söyler. Defterin içindeki satırlar da zamana göre sıralıdır: en yeni
          sayfa en üstte. Yeni bir olay yazılınca deftere en üste eklenir; okurken sadece o defter açılır ve baştan okunur.
          Başka kimsenin defterine bakılmaz.
        terms:
          - [Partition key, "Satırın hangi partition'a gideceğini belirleyen alan. Bu tabloda user_id."]
          - [Clustering key, "Partition içindeki sırayı belirleyen alan. Bu tabloda event_time, yeniden eskiye."]
          - [Keyspaces, "Amazon'un Apache Cassandra uyumlu, sunucusuz geniş sütunlu (wide column) veritabanı."]
          - [Uygulama, "Mağazanın arka uç programı. Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde olay tablosu için hazırlık
        intro: >-
          Ürün sayfası hiç açılmadan, olay tablosu bu sayfanın sorusuna göre kurulur. Keyspaces'te soruyu tablo kurulurken
          seçersin; sonradan değiştirmek yeni bir tablo demektir. Aşağıdaki beş adım bu hazırlığın sırasıdır.
        text:
          - title: Önce sayfanın sorusu yazılır
            text: >-
              Keyspaces'te (ve Cassandra'da) tasarım sorudan başlar. Şeridin sorusu her ziyarette aynıdır: "bu kişinin son
              hareketleri, en yeni önce, en fazla 40". Başka bir soru ("bu ürüne kimler baktı?") ayrı bir tablo ister.
            code: |-
              SELECT product_id, detail, event_type FROM dbws.activity_by_user WHERE user_id = ? LIMIT 40
          - title: Tablo bu soruya göre kurulur
            text: >-
              Partition key user_id: bir kişinin bütün satırları bir arada durur. Clustering key event_time, yeniden eskiye:
              en yeni satır en üstte. TTL de tabloda tanımlanır: her satır 7 gün sonra kendiliğinden silinir. Okurken ORDER BY
              ya da silme işi gerekmez.
            code: |-
              CREATE TABLE dbws.activity_by_user (
                user_id text, event_time timestamp, event_id uuid,
                event_type text, product_id text, detail text,
                PRIMARY KEY ((user_id), event_time, event_id)
              ) WITH CLUSTERING ORDER BY (event_time DESC) AND default_time_to_live = 604800;
          - title: Partition key yükü dağıtmalı
            text: >-
              Tek bir partition saniyede en fazla 3.000 okuma (RCU) ve 1.000 yazma (WCU) birimi alır. user_id iyi bir
              seçimdir, çünkü yük binlerce kişiye dağılır. "Bugünün tarihi" gibi herkesin aynı değeri yazdığı bir partition
              key bütün yükü tek partition'a yığar. CloudWatch'ta StoragePartitionThroughputCapacityExceeded bunu gösterir.
          - title: Partition sınırsız büyümemeli
            text: >-
              Olaylar yıllarca birikirse bir kişinin defteri çok büyür. TTL eski satırları siler; geçmişin tamamı lazımsa
              partition key'e bir zaman parçası eklenir ve her ay yeni bir defter açılır.
            code: |-
              PRIMARY KEY ((user_id, month), event_time, event_id)   -- ör. month = '2026-10'
          - title: Satır, okunurken lazım olanı kendisi taşır
            text: >-
              Keyspaces'te JOIN yoktur. Bu yüzden olay satırı yazılırken ürünün adı ve kategorisi de detail alanına kopyalanır;
              şerit çizilirken katalog yeniden sorulmaz. Bedeli: ürünün adı sonradan değişirse eski satırlar eski adı gösterir.
              Satırlar hiç güncellenmez, sadece eklenir (append-only).
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Uygulama. Kullanıcı bir ürüne bakınca, sepete ekleyince ya da sipariş verince uygulama bir olay satırı yazar.
        reads: Yine uygulama, kişiye özel ekranlar için ("son baktıkların", "hareketlerim").
        kind: >-
          Uygulama orkestrasyonu. Keyspaces başka bir veritabanından kendiliğinden veri çekmez, başka bir veritabanına da
          kendiliğinden veri göndermez; yazan da okuyan da uygulamadır.
        with: >-
          Ürün sayfası Keyspaces'in yanında dört veritabanı daha kullanır: ürünün kendisi bir doküman veritabanından
          (DocumentDB), görseller nesne deposundan (S3, büyük sistemlerde bir CDN ile), öneriler bir graf veritabanından
          (Neptune), oturum bellekte duran bir veritabanından (ElastiCache). Olay satırı bunların hiçbirine bağlanmaz;
          ihtiyaç duyduğu ürün adını yazılırken kopya olarak alır.
        best: >-
          Trafik büyüyünce uygulama olayı tabloya doğrudan değil, önce bir olay akışına bırakır (Amazon Kinesis Data Streams
          ya da Amazon MSK). Küçük bir tüketici program akıştan okuyup tabloya yazar. Böylece sayfa yazmanın bitmesini
          beklemez, ani yükler akışta tamponlanır ve aynı olaylar analiz gibi başka hedeflere de dağıtılabilir.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu sayfa açılırken gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda
          çalışan veritabanları var.
        steps:
          - text: >-
              Mağazada bir müşteri olarak geziyorsun (ör. Ayşe Yılmaz). Şifreyle giriş yok: tarayıcın iki çerez taşıyor.
              lm_visitor bu tarayıcının kimliği; Keyspaces'teki partition'ın da bu kimlik.
          - text: >-
              Bir ürün kartına (Kablosuz Kulaklık) tıkladın ve /p/P0001 açıldı. Sayfa açılır açılmaz arka planda oturum
              kaydın güncellendi (30 dakikalık, bellekte).
            engines: [elasticache]
          - text: >-
              Sayfa önce ürünün kendisini istedi: adı, fiyatı, açıklaması ve özellikleri DocumentDB'den bir doküman olarak
              geldi. Büyük ürün görseli ayrı bir istekle S3'ten geldi.
            engines: [docdb, s3]
          - text: >-
              Ürün bilgisi gelince tarayıcın uygulamaya "bu ürüne baktım" dedi. Uygulama Keyspaces'e bir INSERT gönderdi;
              satırın detail alanına ürünün adı ve kategorisi yazıldı (DocumentDB'den gelen bilginin kopyası).
              Simülasyonun ilk yarısı bu.
            engines: [keyspaces]
          - text: >-
              Hemen ardından iki istek aynı anda gitti: "Son baktıkların" şeridi için Keyspaces'e bir SELECT (simülasyonun
              ikinci yarısı) ve "bunu alanlar şunları da aldı" önerileri için Neptune'a bir sorgu.
            engines: [keyspaces, neptune]
          - text: >-
              Şerit çizildi. Kartlardaki ürün adı Keyspaces satırındaki detail'den geldi, DocumentDB'ye yeniden sorulmadı.
              Kartların görselleri yine S3'ten, her biri ayrı bir istekle.
            engines: [keyspaces, s3]
      now_intro: >-
        Sayfanın açıldığı an. Önce resmin tamamı (simülasyon), sonra aynı anın ayrıntıları: isteğin yolu, uygulamanın
        kodu, Keyspaces'e giden komutlar ve gerçek ölçümler.
      sim:
        kind: partition
        title: "Keyspaces tablosu: dbws.activity_by_user"
        caption: >-
          Tablodan küçük bir kesit: üç ziyaretçinin partition'ı. Ayşe ve Mert'in satırları canlı tablodan; senin
          partition'ındaki eski satırlar örnek. Önce sayfanın INSERT'i, sonra SELECT'i, en sonda uygulamanın gelen satırları
          süzmesi oynuyor. Üstteki iki etiket o anda işi kimin yaptığını gösterir: uygulama mı, Keyspaces mi.
        result_title: Son baktıkların şeridi
        partitions:
          - label: C00002 · Mert
            rows:
              - {time: "26 Eki 09:12", type: view, product: P0090 Kahve Makinesi}
              - {time: "25 Eki 18:40", type: purchase, product: P0044 Bulut Mimarisi}
          - label: "7f3a… (bu tarayıcı)"
            me: true
            rows:
              - {time: "2 dk önce", type: purchase, product: P0021 Akıllı Saat}
              - {time: "3 dk önce", type: view, product: P0021 Akıllı Saat}
              - {time: "5 dk önce", type: view, product: P0131 Mekanik Klavye}
              - {time: "6 dk önce", type: view, product: P0021 Akıllı Saat}
          - label: C00001 · Ayşe
            rows:
              - {time: "26 Eki 10:39", type: search, product: P0084 Algoritmalar}
              - {time: "26 Eki 02:00", type: purchase, product: P0147 Kahve Makinesi}
              - {time: "25 Eki 20:13", type: search, product: P0173 Dambıl Seti}
        insert: {time: "şimdi", type: view, product: P0001 Kablosuz Kulaklık}
        send_insert: >-
          Kablosuz Kulaklık'ın sayfasını açtın ve ürün bilgisi DocumentDB'den geldi. Tarayıcın "bu ürüne baktım" dedi;
          uygulama da Keyspaces'e INSERT gönderiyor. Satırın user_id'si bu tarayıcının kimliği, detail'i ürünün adı.
        send_select: >-
          Şimdi sayfa "Son baktıkların" şeridini istiyor. Uygulama Keyspaces'e SELECT ... WHERE user_id = 7f3a… LIMIT 40
          gönderiyor. Aynı anda öneriler için Neptune'a da ayrı bir istek gidiyor.
        back: >-
          Uygulama listenin en fazla 8 ürününü tarayıcına gönderdi. Tarayıcın şeridi çizecek: adlar satırların detail
          alanından, görseller ayrı isteklerle S3'ten gelecek.
        summary: >-
          Yazma da okuma da tek bir partition'a gitti. Tablo ne kadar büyürse büyüsün, senin geçmişini okumak için sadece
          senin defterin açılır. Keyspaces satırları olduğu gibi verdi; "sadece view, tekrar yok, en fazla 8" kuralları
          uygulamanın kodunda.
      wire:
        what: >-
          Uygulama, Keyspaces'e açık tuttuğu bir bağlantının üzerinden komutu gönderir. Bağlantı her istekte yeniden
          kurulmaz; uygulama çalıştığı sürece açık kalır.
        dst: "cassandra.eu-central-1.amazonaws.com : 9142"
        dst_note: >-
          Keyspaces'in bölge adresi. Bu ad, VPC'nin içindeki interface endpoint'in özel IP'sine çözülür; trafik internete çıkmaz.
        rows:
          - [Şifreleme, TLS, gerçek, Keyspaces sadece şifreli bağlantı kabul eder.]
          - [Protokol, "CQL ikili protokolü, sürüm 4", gerçek, "Cassandra'nın kendi dili, HTTP değil. Komut ve değerler küçük ikili çerçeveler hâlinde gider."]
          - [Kimlik, "SigV4, bağlantı açılırken", gerçek, "Bağlantı ilk açıldığında uygulama, IAM rolünün geçici kimliğiyle imzalı bir doğrulama gönderdi. Şifre yok."]
        body_label: Çerçevenin içeriği (okunur hâle getirilmiş, değer örnek)
        body: |-
          QUERY
            SELECT product_id, detail, event_type FROM dbws.activity_by_user WHERE user_id = ? LIMIT 40
            değer      : '7f3a…'   (bu tarayıcının kimliği)
            tutarlılık : LOCAL_QUORUM   (3 kopyanın 2'sinden oku)
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Her satırın
        etiketi işin nerede olduğunu söyler: mor etiketli satırda bir şey bir yerden bir yere gider (tarayıcıdan uygulamaya,
        uygulamadan Keyspaces'e ya da geri). Gri "Uygulamanın içinde" etiketli satırda iş uygulamanın kendi içinde yapılır,
        hiçbir yere bir şey gitmez.
      app_code:
        - file: engines/keyspaces.py
          func: api_event
          title: "1. Yazma: \"bu ürüne baktın\""
          sub: Sayfa açılır açılmaz gelen istek.
          lines:
            - {match: '@bp.post("/api/events")', say: "Tarayıcıdan gelen \"bu ürüne baktım\" isteği buraya gelir.", tag: [Tarayıcı → Uygulama]}
            - {match: 'cql = f"INSERT INTO', say: Keyspaces'e gidecek INSERT komutu hazırlanır., tag: [Uygulamanın içinde]}
            - {match: 's().execute(s().prepare(cql)', say: "Komut Keyspaces'e gider; soru işaretlerinin yerine senin kimliğin, şu anki zaman ve ürün konur. Keyspaces \"yazıldı\" diye cevap verir.", tag: [Uygulama → Keyspaces, Keyspaces → Uygulama], hl: insert}
            - {match: 'return jsonify(trace.payload({"stored": True}))', say: "Tarayıcıya \"kaydedildi\" cevabı döner.", tag: [Uygulama → Tarayıcı]}
        - file: engines/keyspaces.py
          func: api_recent
          title: "2. Okuma: \"Son baktıkların\""
          sub: Hemen ardından gelen istek.
          lines:
            - {match: '@bp.get("/api/recent")', say: "\"Son baktıkların\" şeridi için gelen istek buraya gelir.", tag: [Tarayıcı → Uygulama]}
            - {match: 'rows = list(s().execute(cql', say: "SELECT komutu gönderilir. Keyspaces senin partition'ından en fazla 40 satırı olduğu gibi geri verir.", tag: [Uygulama → Keyspaces, Keyspaces → Uygulama], hl: where}
            - {match: 'for r in rows:', say: Gelen satırlar tek tek ele alınır., tag: [Uygulamanın içinde], hl: app}
            - {match: 'if r.event_type == "view" and r.product_id not in seen:', say: "Sadece \"view\" satırları ve listede henüz olmayan ürünler geçer. add_to_cart, purchase ve tekrarlar burada elenir.", tag: [Uygulamanın içinde], hl: type}
            - {match: 'recent.append(', say: Geçen ürün listeye eklenir., tag: [Uygulamanın içinde], hl: app}
            - {match: 'return jsonify(trace.payload(recent[:8]))', say: "Listenin ilk 8 ürünü tarayıcıya gönderilir. Şeritte en fazla 8 ürün olmasının sebebi bu.", tag: [Uygulama → Tarayıcı], hl: app}
      live:
        title: Gerçek tabloda ne oldu?
        intro: >-
          Bu sayfa açılırken Keyspaces'e iki gerçek istek gitti. Sayılar o isteklerin kayıtlarından geliyor.
        runs:
          - label: "1. Yazma: INSERT"
            page_call: {path: /keyspaces/api/events}
            metrics: [[Yazılan satır, items], [Kapasite, capacity], [Süre, ms]]
          - label: "2. Okuma: SELECT"
            trigger: true
            metrics: [[Şeritteki ürün, items], [Süre, ms]]
        reading: >-
          INSERT tek bir satır yazdı ve 1 WRU (write request unit, yazma birimi) harcadı. Keyspaces sunucusuz çalışır:
          sunucu kiralamazsın, her okuma ve yazma birimi için ödersin. SELECT senin partition'ından en fazla 40 satır
          okudu; uygulama bunların içinden "view" olanları ve tekrar etmeyenleri ayıklayıp en fazla 8 ürünü şeride koydu.
          Sen bu tarayıcıyla ilk kez geziyorsan şeritte sadece bu ürün vardır. Süre her istekte biraz değişir.
      query:
        title: Sayfa Keyspaces'e ne dedi?
        intro: >-
          Simülasyondaki iki adım, iki gerçek CQL komutundan geliyor (CQL, Cassandra'nın SQL'e benzeyen sorgu dili).
          Solda önce giden yazma, sağda sonra giden okuma var. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada
          aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: ins
            say: activity_by_user tablosuna
            code: INSERT INTO dbws.activity_by_user
            name: Nereye?
            note: Olaylar tablosuna yeni bir satır yaz. dbws, tabloyu içeren keyspace (veritabanı gibi bir klasör).
            hl: table
          - id: cols
            say: kim, ne zaman, ne yaptı ve hangi ürün bilgilerini içeren
            code: (user_id, event_time, event_id, event_type, product_id, detail)
            name: Hangi alanlar?
            note: >-
              Satırın alanları. user_id partition key: satırın hangi deftere gideceğini o belirler. event_time clustering
              key: defterin içindeki sırayı belirler. event_id aynı anda iki olay olursa karışmasınlar diye.
            hl: pk
            indent: 2
          - id: vals
            say: yeni bir satır ekle.
            code: VALUES (?, ?, ?, ?, ?, ?)
            name: Hangi değerler?
            note: >-
              Her ? yerine uygulama gerçek değeri koyar: senin kimliğin, şu anki zaman, yeni bir kimlik, "view", ürün no
              ve ürünün adı. Satır 7 gün sonra kendiliğinden silinir (tablonun TTL ayarı).
            hl: insert
            indent: 2
          - id: sel
            say: activity_by_user tablosundan ürün, açıklama ve olay türünü
            code: SELECT product_id, detail, event_type FROM dbws.activity_by_user
            name: Ne okunuyor?
            note: Sadece şerit için gereken üç alanı oku.
            hl: type
          - id: where
            say: sadece bu tarayıcının partition'ından
            code: WHERE user_id = '7f3a…'
            name: Hangi defter?
            note: >-
              Partition key ile filtre. Keyspaces bu değerden doğru partition'ı bulur ve sadece onu okur. Partition key
              vermeden bu tabloda arama yapamazsın: Keyspaces hangi defteri açacağını bilemez.
            hl: where
            indent: 2
          - id: limit
            say: en fazla 40 satır oku.
            code: LIMIT 40
            name: Kaç tane?
            note: >-
              En yeni 40 satırda dur. Satırlar zaten yeniden eskiye sıralı durduğu için ORDER BY yazmaya gerek yok; ilk 40
              satır en yeni 40 olaydır.
            hl: ck
            indent: 2
        columns:
          - label: "1. Yazma"
            sub: Sayfa açılır açılmaz arka planda giden komut.
            via: >-
              Uygulama bu komutu cassandra-driver kütüphanesiyle gönderir: önce prepare() ile komutu bir kez hazırlatır,
              sonra execute() ile değerleri yollar.
            parts: [ins, cols, vals]
          - label: "2. Okuma"
            sub: Hemen ardından "Son baktıkların" şeridi için giden komut.
            via: >-
              Uygulama bu komutu yine cassandra-driver'ın execute() metoduyla gönderir. Satırları süzme işi bu komutta değil,
              uygulamanın kodunda (bir önceki bölümdeki kesit).
            parts: [sel, where, limit]
        note: >-
          Dikkat: iki komutta da sıralama için bir şey yazmıyoruz. Sıra, tablo kurulurken bir kez belirlendi
          (CLUSTERING ORDER BY event_time DESC). Keyspaces satırları yazarken o sıraya koyuyor, okurken sadece baştan okuyor.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          Keyspaces'in işi satırları verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: Keyspaces → Uygulama
            text: Senin partition'ından {read} satır döndü (en fazla 40). Satırlar en yeniden eskiye sıralı geldi.
          - who: Uygulama
            text: >-
              Satırları tek tek dolaştı: "view" olmayanları (ör. purchase) ve aynı ürünün tekrarlarını attı, kalanların ilk 8'ini tuttu.
          - who: Uygulama → Tarayıcın
            text: "{items} ürünlük listeyi JSON olarak, isteğin kaydıyla (trace) birlikte geri gönderdi."
          - who: Tarayıcın
            text: >-
              Listeyi "Recently viewed" şeridine çizdi. Kartlardaki adlar Keyspaces satırının detail alanından geldi;
              DocumentDB'ye yeniden sorulmadı.
          - who: Tarayıcın → S3
            text: >-
              Her kartın görselini ürün numarasından kurduğu adresle (/s3/api/img/P0001) ayrı ayrı istedi. Bu istekler S3'ün
              uygulama sunucusuna gider; o da S3'ten products/P0001.jpg nesnesini okuyup gönderir. Kartta adı (Keyspaces)
              ve görseli (S3) birleştiren tarayıcıdır.
          - who: Sonra
            text: >-
              Bu satırlar 7 gün sonra TTL ile kendiliğinden silinir. Başka bir ürüne bakarsan yeni bir view satırı partition'ın
              en üstüne girer ve o ürün şeridin başına geçer.
      remember: >-
        Keyspaces'te soruyu tablo tasarlanırken seçersin. "Bu kişinin son olayları" sorusu için satırlar kişiye göre
        partition'lara ayrılır ve zamana göre sıralı tutulur. Bu soru her ölçekte hızlıdır; tasarıma uymayan bir soru
        (ör. "bu ürüne kimler baktı?") için ayrı bir tablo gerekir.
      why_db: >-
        Neden Keyspaces? Olay kayıtları çok sık yazılır, hiç güncellenmez ve hep kişiye göre okunur. Keyspaces bu tür
        yoğun yazmayı sunucu yönetmeden karşılar ve eski satırları TTL ile kendisi siler. Bedeli: JOIN yok, esnek arama
        yok; her yeni soru için tabloyu o soruya göre tasarlaman gerekir.

  - page: product
    path: /p/P0001
    engines: [neptune]
    use_case: Öneriler
    title: Öneriler bir graf üzerinde yürüyüştür
    why: >-
      "Bunu alanlar şunları da aldı" önerileri Neptune adlı bir graf veritabanından geliyor. Graf, bir arkadaşlık ağı
      haritası gibidir: kişiler ve ürünler noktalar, "satın aldı" bilgisi de aralarındaki çizgilerdir. Şimdi önerileri
      bu ürüne göre değil, senin seçtiğin müşteriye göre isteyeceğiz.
    do: Aydınlık "For my persona" (benim için) butonuna tıkla.
    target: "#exp-recs [data-value=persona]"
    action: click
    wait: {method: GET, path: /neptune/api/recs, query: {mode: persona}}
    focus: "#recs-wrap"
    panel:
      need: >-
        İyi bir öneri için şu soru sorulur: "Benim gibi alışveriş yapanlar başka ne aldı?" Bunun cevabı tek bir kayıtta
        yazmaz. Müşteriden aldığı ürünlere, oradan o ürünleri alan diğer müşterilere, oradan da onların aldıklarına
        gitmek gerekir. Sayfa açılırken öneriler "bu ürüne göre" (2 adım) geldi; tıklamanla "sana göre" (3 adım) geldi.
      concept:
        term: Graf ve hop
        text: >-
          Bir graf, noktalar ve onları bağlayan çizgilerden oluşur. Noktalara düğüm (vertex), çizgilere kenar (edge)
          denir. Burada her müşteri ve her ürün bir düğüm, her satın alma da müşteriden ürüne giden bir BOUGHT kenarı.
          Bir kenar boyunca bir adım gitmeye hop denir. Neptune bir düğümden başlar ve kenarları takip eder, tıpkı bir
          haritada yol takip etmek gibi. Hiçbir tabloyu baştan sona taramaz.
        terms:
          - [Düğüm (vertex), "Bir şey: bir müşteri ya da bir ürün."]
          - [Kenar (edge), "İki düğüm arasındaki ilişki. Burada BOUGHT: bu müşteri bu ürünü aldı."]
          - [openCypher, "Graf sorgulama dili. Yolu çizer gibi yazarsın: (müşteri)-[:BOUGHT]->(ürün)."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde öneri grafı için hazırlık
        intro: >-
          Öneri butonuna hiç basılmadan, graf bu sayfanın sorularına göre kurulur ve doldurulur. Aşağıdaki beş adım bu
          hazırlığın sırasıdır.
        text:
          - title: Önce sayfanın soruları yazılır
            text: >-
              Öneri şeridinin iki sorusu var: "bu ürünü alanlar başka ne aldı?" (herkese aynı) ve "benim gibi alanlar ne aldı?"
              (kişiye özel). İkisi de ilişki üzerinden yürüyen sorulardır; graf bu sorular için kurulur.
            code: |-
              (ürün)<-[:BOUGHT]-(müşteri)-[:BOUGHT]->(öneri)                       -- 2 hop
              (sen)-[:BOUGHT]->(ürün)<-[:BOUGHT]-(başkası)-[:BOUGHT]->(öneri)      -- 3 hop
          - title: Model ilişkiye göre kurulur
            text: >-
              Müşteri ve ürün birer düğüm (vertex), her satın alma müşteriden ürüne giden bir BOUGHT kenarı (edge). Sipariş
              no ve adet kenarın özelliğidir. Ürün düğümü sadece öneride gereken özellikleri taşır (ad, kategori); fiyat ve
              stok katalogda kalır. Graf asıl kayıt değildir, sipariş veritabanının bir kopyasıdır.
            code: |-
              (:Customer {~id, name, city})-[:BOUGHT {order_id, qty}]->(:Product {~id, name, category})
          - title: İlk yükleme toplu yapılır
            text: >-
              Geçmiş siparişler düğüm ve kenar dosyaları (openCypher CSV) olarak S3'e konur; Neptune bulk loader hepsini tek
              bir işte yükler. Satır satır yazmaktan çok daha hızlıdır.
            code: |-
              POST https://<cluster>:8182/loader
              { "source": "s3://bucket/graph/", "format": "opencypher", "iamRoleArn": "…", "region": "eu-central-1" }
          - title: Yeni siparişler sürekli eklenir
            text: >-
              Sipariş veritabanına yazılan her sipariş birkaç saniye içinde grafa BOUGHT kenarı olarak eklenir: değişiklik akışı
              (CDC) ya da siparişle aynı transaction'da yazılan bir "outbox" kaydı bir program tarafından okunur ve grafa
              yazılır.
          - title: Yürüyüş kısa ve sınırlı tutulur
            text: >-
              Çok satan bir ürün binlerce müşteriye bağlıdır (süper düğüm) ve her hop sonucu katlar. Öneri sorguları 2–3 hop ile
              sınırlanır, sonuç LIMIT ile kesilir ve plan yayından önce Neptune'un openCypher explain'i ile kontrol edilir.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Asıl sipariş kaydı ilişkisel veritabanına yazılır. Grafa her yeni siparişin BOUGHT kenarlarını bir besleme süreci
          ekler.
        reads: Uygulama, öneri şeritleri için ("bunu alanlar şunları da aldı", "sana özel").
        kind: >-
          Neptune başka bir veritabanından kendiliğinden veri çekmez; graf dışarıdan beslenir. Besleyen ya uygulama ya da
          sipariş veritabanının değişikliklerini dinleyen bir süreçtir.
        with: >-
          Öneri şeridi Neptune'un yanında başka veritabanlarıyla birlikte çalışır: sipariş asıl olarak ilişkisel veritabanında
          (Aurora) durur ve grafı o besler; kartların görselleri nesne deposundan (S3, büyük sistemlerde bir CDN ile) gelir;
          fiyat ve stok gibi sık değişen bilgiler katalogda (DocumentDB) kalır. Kartta fiyat gösterilecekse uygulama önerilen
          ürün numaralarıyla katalogdan toplu bir okuma yapar ve iki sonucu birleştirir.
        best: >-
          Sipariş veritabanının değişiklik akışı (CDC) dinlenir: AWS DMS, Neptune'u hedef olarak alabilir; ya da siparişle
          aynı transaction'da bir "outbox" tablosuna yazılan olayı küçük bir program okuyup grafa ekler. Uygulamanın siparişi
          iki veritabanına ayrı ayrı yazması (dual write) önerilmez: ikinci yazma başarısız olursa iki kayıt birbirini tutmaz.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Mağazada bir müşteri olarak geziyorsun. Seçtiğin müşteri (ör. Ayşe Yılmaz, C00001) tarayıcının lm_persona
              çerezinde duruyor. Bu adımda önemli: "sana göre" yürüyüş bu müşterinin düğümünden başlayacak.
          - text: >-
              Kablosuz Kulaklık'ın sayfası açıktı. Açılırken oturumun güncellendi, ürün DocumentDB'den, görseli S3'ten geldi;
              "baktın" satırı ve "Son baktıkların" şeridi Keyspaces'ten.
            engines: [elasticache, docdb, s3, keyspaces]
          - text: >-
              Aynı anda "Customers who bought this also bought" (bunu alanlar şunları da aldı) şeridi için Neptune'a 2 hop'luk
              bir sorgu gitti: bu üründen başla, onu alanlara git, onların aldıklarına git. Simülasyonun sol şeridi bu istek.
            engines: [neptune]
          - text: >-
              Sonra "For my persona" (benim için) butonuna tıkladın. Tarayıcın aynı adrese bu kez mode=persona ile sordu.
              Uygulama müşteri numaranı çerezden aldı ve Neptune'a 3 hop'luk sorguyu gönderdi. Simülasyonun sağ şeridi bu istek.
            engines: [neptune]
          - text: >-
              Öneriler geldi ve kartlar çizildi. Kartlardaki ad ve kategori Neptune'daki ürün düğümlerinden geldi; görseller
              her kart için ayrı bir istekle S3'ten. Kartlarda fiyat yok, çünkü fiyat grafta tutulmuyor.
            engines: [neptune, s3]
      sim:
        kind: graph-walk
        caption: >-
          Gerçek graftan küçük bir kesit: canlı Neptune'dan okunan müşteriler ve alımları. Gerçek grafta her ürünü
          onlarca müşteri almış; burada her yolu görebilmen için sadece birkaçı var. Bunlar iki farklı algoritma değil,
          aynı sayfanın gönderdiği iki ayrı gerçek istek: soldaki sayfa açılırken giden "bu ürüne göre" sorgusu, sağdaki
          senin tıklamanla giden "sana göre" sorgusu. Uygulama iki öneri modu sunuyor; iki yürüyüş yan yana, aynı hızda.
          Üstteki etiketler o anda işi kimin yaptığını gösterir: uygulama mı, Neptune mu.
        tick_ms: 1600
        summary: >-
          Soldaki yürüyüş herkese aynı önerileri verir ve senin zaten aldıklarını da önerebilir. Sağdaki yürüyüş bir adım
          daha uzun ama sana özel: aldıklarını eler, sana en çok benzeyenlerin seçtiklerini öne çıkarır.
        lanes:
          - id: product
            title: "t-1 · İstek 1 · Sayfa açılınca · Bu ürüne göre (2 hop)"
            start: {id: P0001, label: Kablosuz Kulaklık, type: product}
            start_title: Bu ürün
            start_say: Yürüyüş bu sayfadaki ürünün düğümünden, Kablosuz Kulaklık'tan başlıyor.
            send_say: >-
              Kablosuz Kulaklık'ın sayfası açılırken tarayıcın önerileri istedi (mode=product). Uygulama Neptune'a 2 hop'luk
              openCypher sorgusunu gönderiyor.
            back_say: >-
              Uygulama önerileri olduğu gibi tarayıcına gönderdi; sayma ve sıralama Neptune'da yapıldı. Tarayıcın kartları
              çizecek, görselleri S3'ten isteyecek.
            hops:
              - title: Onu alanlar
                say: "1. hop: Kablosuz Kulaklık'a gelen BOUGHT kenarları takip edildi. Bu ürünü alan 3 müşteriye ulaşıldı."
                nodes:
                  - {id: C00944, label: Ece Koç, type: customer, from: [P0001]}
                  - {id: C00828, label: Selin Çelik, type: customer, from: [P0001]}
                  - {id: C00630, label: Ozan Schmidt, type: customer, from: [P0001]}
              - title: Onların aldıkları
                say: "2. hop: bu 3 müşterinin BOUGHT kenarları takip edildi ve aldıkları ürünlere ulaşıldı. Powerbank'a iki ayrı yoldan gelindi."
                nodes:
                  - {id: P0066, label: Powerbank, type: product, from: [C00944, C00828]}
                  - {id: P0053, label: Dambıl Seti, type: product, from: [C00944]}
                  - {id: P0014, label: Python ile Veri, type: product, from: [C00944]}
                  - {id: P0027, label: Masa Lambası, type: product, from: [C00828]}
                  - {id: P0063, label: Alpen Spor Çantası, type: product, from: [C00630]}
                  - {id: P0028, label: Toros Spor Çantası, type: product, from: [C00630]}
            end_say: >-
              Her ürün kaç farklı müşteriden ulaşıldığına göre sayıldı. Powerbank 2 ile en üstte. Python ile Veri ve
              Toros Spor Çantası da listede, oysa Ayşe bunları zaten almış: bu yürüyüş kimin baktığını bilmez.
          - id: persona
            title: "t0 · İstek 2 · Senin tıklaman · Sana göre (3 hop)"
            start: {id: C00001, label: Ayşe Yılmaz, type: me}
            start_title: Sen
            start_say: Yürüyüş senin seçtiğin müşterinin, Ayşe Yılmaz'ın düğümünden başlıyor.
            send_say: >-
              "For my persona" butonuna tıkladın. Tarayıcın aynı adrese mode=persona ile sordu; uygulama müşteri numaranı
              (C00001) çerezden aldı ve Neptune'a 3 hop'luk sorguyu gönderiyor.
            back_say: >-
              Uygulama sana özel önerileri olduğu gibi tarayıcına gönderdi; eleme, sayma ve sıralama Neptune'da yapıldı.
              Kartların görselleri S3'ten gelecek.
            hops:
              - title: Senin aldıkların
                say: "1. hop: Ayşe'nin BOUGHT kenarları takip edildi. Kesitte Ayşe'nin aldığı 3 ürün var."
                nodes:
                  - {id: P0001, label: Kablosuz Kulaklık, type: product, from: [C00001]}
                  - {id: P0002, label: Hava Temizleyici, type: product, from: [C00001]}
                  - {id: P0019, label: Toros Bulut Mimarisi, type: product, from: [C00001]}
              - title: Aynılarını alanlar
                say: "2. hop: bu ürünlere gelen kenarlar takip edildi. Ayşe ile aynı ürünü almış 5 müşteriye ulaşıldı."
                nodes:
                  - {id: C00630, label: Ozan Schmidt, type: customer, from: [P0001]}
                  - {id: C00226, label: Can Weber, type: customer, from: [P0002]}
                  - {id: C00040, label: Seda Yılmaz, type: customer, from: [P0002]}
                  - {id: C00685, label: Kerem Çelik, type: customer, from: [P0002]}
                  - {id: C00378, label: Naz Yılmaz, type: customer, from: [P0019]}
              - title: Onların aldıkları
                say: >-
                  3. hop: bu 5 müşterinin aldıklarına gidildi. Ayşe'nin zaten aldığı ürünler elendi (üstü çizili).
                  Alpen Spor Çantası'na dört ayrı yoldan gelindi.
                nodes:
                  - {id: P0063, label: Alpen Spor Çantası, type: product, from: [C00630, C00226, C00040, C00378]}
                  - {id: P0114, label: Rhein Bulut Mimarisi, type: product, from: [C00226]}
                  - {id: P0148, label: Yoga Matı, type: product, from: [C00685]}
                  - {id: P0028, label: Toros Spor Çantası, type: product, from: [C00630, C00226], excluded: zaten aldın}
                  - {id: P0030, label: Deri Ceket, type: product, from: [C00378], excluded: zaten aldın}
            end_say: >-
              Kalan ürünler kaç farklı müşteriden ulaşıldığına göre sayıldı. Alpen Spor Çantası 4 ile en üstte; canlı sonuçta
              da Ayşe için ilk sıralarda bu ürün var.
      wire:
        what: >-
          Uygulama sorguyu HTTPS ile Neptune'a gönderir (Python'un requests kütüphanesi). Her istek, uygulamanın IAM
          kimliğiyle ayrı ayrı imzalanır.
        dst: "dbws-neptune.cluster-ccgs3qxfidad.eu-central-1.neptune.amazonaws.com : 8182"
        dst_note: >-
          Neptune cluster'ının adresi. Cluster internete kapalı veri alt ağında; güvenlik grubu sadece bu uygulama
          sunucusundan gelen bağlantıya izin veriyor.
        rows:
          - [Şifreleme, TLS (HTTPS), gerçek, Neptune sadece şifreli bağlantı kabul eder.]
          - [Protokol, "HTTP, POST /openCypher", gerçek, "Neptune'un openCypher kapısı sıradan bir web adresi gibidir; sorgu bir form alanı olarak gider."]
          - [Kimlik, "IAM, SigV4 imzası (servis: neptune-db)", gerçek, "Şifre yok. İsteğin başlıklarına, geçici AWS kimliğiyle hesaplanmış bir imza eklenir; Neptune imzayı kontrol eder."]
        body_label: İsteğin içeriği (okunur hâle getirilmiş, imza değerleri kısaltıldı)
        body: |-
          POST /openCypher HTTP/1.1
          Host: dbws-neptune.cluster-ccgs3qxfidad.eu-central-1.neptune.amazonaws.com:8182
          Content-Type: application/x-www-form-urlencoded
          X-Amz-Date: 20261030T…Z
          X-Amz-Security-Token: …
          Authorization: AWS4-HMAC-SHA256 Credential=…/eu-central-1/neptune-db/aws4_request, SignedHeaders=…, Signature=…

          query=MATCH (me:Customer {`~id`: $cid})-[:BOUGHT]->(:Product)<-[:BOUGHT]-(o:Customer)-[:BOUGHT]->(rec:Product) …
          &parameters={"cid": "C00001"}
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Her satırın
        etiketi işin nerede olduğunu söyler: mor etiketli satırda bir şey bir yerden bir yere gider (tarayıcıdan uygulamaya,
        uygulamadan Neptune'a ya da geri). Gri "Uygulamanın içinde" etiketli satırda iş uygulamanın kendi içinde yapılır,
        hiçbir yere bir şey gitmez. İki istek de aynı kodu çalıştırır; hangi sorgunun seçileceğini adresteki mode belirler.
      app_code:
        - file: engines/neptune.py
          func: api_recs
          title: "1. Öneri isteği (iki istekte de aynı kod)"
          sub: Adresteki mode=product ya da mode=persona hangi sorgunun gideceğini seçer.
          lines:
            - {match: '@bp.get("/api/recs")', say: Öneri isteği buraya gelir., tag: Tarayıcı → Uygulama}
            - {match: 'mode = request.args.get("mode", "product")', say: "Hangi öneri isteniyor: bu ürüne göre mi, sana göre mi?", tag: Uygulamanın içinde}
            - {match: 'params, query = {"cid": persona_id()}, BY_PERSONA', say: "Sana göre ise 3 hop'luk sorguyu seçer; başlangıç, seçtiğin müşteri.", tag: Uygulamanın içinde, hl: hop3}
            - {match: 'params, query = {"pid": request.args.get("product", "P0001")}, BY_PRODUCT', say: "Değilse 2 hop'luk sorguyu seçer; başlangıç, bu sayfadaki ürün.", tag: Uygulamanın içinde, hl: start}
            - {match: 'rows = _q(query, params)', say: "Sorgu Neptune'a gider, en fazla 6 öneri geri gelir (gönderme işi 2. kartta).", tag: [Uygulama → Neptune, Neptune → Uygulama], hl: result}
            - {match: 'return jsonify(trace.payload(rows))', say: "Öneriler olduğu gibi tarayıcıya gider. Uygulama sayma, eleme ya da sıralama yapmaz; hepsi sorgunun içinde.", tag: Uygulama → Tarayıcı}
        - file: engines/neptune.py
          func: _q
          title: "2. Sorguyu Neptune'a gönderme"
          sub: Bütün Neptune sorgularının geçtiği küçük yardımcı.
          lines:
            - {match: 'url = f"https://', say: "Neptune'un adresi: HTTPS, 8182 numaralı kapı, /openCypher yolu.", tag: Uygulamanın içinde}
            - {match: 'body = {"query": query}', say: Sorgu metni isteğin gövdesine konur., tag: Uygulamanın içinde}
            - {match: 'SigV4Auth(', say: "İstek, uygulamanın geçici AWS kimliğiyle imzalanır. Şifre yok.", tag: Uygulamanın içinde}
            - {match: 'resp = requests.post(', say: requests kütüphanesi isteği Neptune'a gönderir ve cevabı bekler., tag: [Uygulama → Neptune, Neptune → Uygulama]}
            - {match: 'return resp.json()["results"]', say: Cevaptaki satırlar alınır., tag: Uygulamanın içinde}
      live:
        title: Gerçek grafta ne oldu?
        intro: >-
          İki gerçek sorgu: sayfa açılırken giden "bu ürüne göre" sorgusu ve senin tıklamanla giden "sana göre" sorgusu.
          Gerçek grafta 1000 müşteri ve 200 ürün var.
        runs:
          - label: Bu ürüne göre (2 hop)
            page_call: {path: /neptune/api/recs, query: {mode: product}}
            metrics: [[Önerilen ürün, items], [Süre, ms]]
          - label: Sana göre (3 hop)
            trigger: true
            metrics: [[Önerilen ürün, items], [Süre, ms]]
        reading: >-
          İki sorgu da en fazla 6 öneri döndürdü. Sağdaki bir hop daha uzun: daha çok kenar takip eder, bu yüzden genelde
          daha uzun sürer. Bu kurulumda Neptune Serverless çalışıyor (en az 1 NCU) ve yük artınca kapasitesini kendisi
          büyütüyor. Bir süre sorulmayan bir sorgunun ilk çalışması birkaç saniye sürebilir, çünkü veri henüz bellekte değildir;
          sonraki çalıştırmalar hızlanır. Ekrandaki puanlar (örn. "71 shared customers") ortak müşteri sayısıdır:
          simülasyondaki küçük sayıların gerçek grafta büyümüş hâli.
      query:
        title: Sayfa Neptune'a ne dedi?
        intro: >-
          İki sütun, simülasyondaki iki yürüyüşün gerçek openCypher sorguları. Yolu bir resim gibi okuyabilirsin: parantez
          bir düğüm, köşeli parantez bir kenar, ok da kenarın yönü.
        cards_title: Parça parça
        parts:
          - id: pstart
            say: Bu ürünün düğümünden başla,
            code: "MATCH (p:Product {`~id`: $pid})"
            name: Nereden?
            note: Başlangıç düğümü bu sayfanın ürünü. $pid yerine ürün no (P0001) gelir.
            hl: start
          - id: pback
            say: onu alan müşterilere git,
            code: "<-[:BOUGHT]-(c:Customer)"
            name: 1. hop
            note: Ürüne gelen BOUGHT kenarlarını geriye doğru takip et. Ok ürünü gösteriyor, çünkü kenar müşteriden ürüne gider.
            hl: hop1
            indent: 2
          - id: pfwd
            say: onların aldığı ürünlere git,
            code: "-[:BOUGHT]->(rec:Product)"
            name: 2. hop
            note: Bu müşterilerin BOUGHT kenarlarını ileri doğru takip et; vardığın ürünler öneri adayları.
            hl: hop2
            indent: 2
          - id: pwhere
            say: bu ürünün kendisini çıkar,
            code: "WHERE rec <> p"
            name: Ne elensin?
            note: Ürünün kendisini kendine önerme. Başka hiçbir şey elenmiyor; senin zaten aldıkların da listede kalabilir.
            hl: exclude
          - id: pret
            say: her ürünü kaç farklı müşteri almış say ve en çok paylaşılan 6 ürünü getir.
            code: "RETURN rec, count(DISTINCT c) AS score ORDER BY score DESC LIMIT 6"
            name: Nasıl sıralansın?
            note: >-
              Her öneri adayına kaç ayrı müşteriden ulaşıldığını say (score), en yüksek 6'yı döndür. Gerçek sorguda
              RETURN ürün no, ad ve kategoriyi de getirir.
            hl: result
          - id: mstart
            say: Senin düğümünden başla, aldığın ürünlere git,
            code: "MATCH (me:Customer {`~id`: $cid})-[:BOUGHT]->(:Product)"
            name: Nereden? + 1. hop
            note: Başlangıç senin seçtiğin müşteri ($cid = C00001). İlk kenar seni aldığın ürünlere götürür.
            hl: hop1
          - id: mback
            say: aynı ürünleri alan diğer müşterilere git,
            code: "<-[:BOUGHT]-(o:Customer)"
            name: 2. hop
            note: O ürünlere gelen kenarlarla, aynı ürünü almış diğer müşterilere (o) ulaş.
            hl: hop2
            indent: 2
          - id: mfwd
            say: onların aldıklarına git,
            code: "-[:BOUGHT]->(rec:Product)"
            name: 3. hop
            note: Bu müşterilerin aldıkları ürünler öneri adayları.
            hl: hop3
            indent: 2
          - id: mwhere
            say: kendini ve zaten aldıklarını çıkar,
            code: "WHERE o <> me AND NOT (me)-[:BOUGHT]->(rec)"
            name: Ne elensin?
            note: >-
              İki eleme: yolu senin üzerinden geri dönen kendini sayma, ve senden rec'e zaten bir BOUGHT kenarı varsa o
              ürünü önerme. Simülasyonda üstü çizilen ürünler bu satır yüzünden elendi.
            hl: exclude
            tag: sadece sağdaki sorguda var
          - id: mret
            say: her ürünü kaç farklı müşteri almış say ve en çok paylaşılan 6 ürünü getir.
            code: "RETURN rec, count(DISTINCT o) AS score ORDER BY score DESC LIMIT 6"
            name: Nasıl sıralansın?
            note: "Soldakiyle aynı sayma: her adaya kaç ayrı müşteriden (o) ulaşıldı."
            hl: result
        columns:
          - label: Bu ürüne göre (2 hop)
            sub: Sayfa ilk açıldığında giden sorgu.
            via: >-
              Uygulama bu sorguyu requests kütüphanesinin post() metoduyla, SigV4 imzalı bir HTTPS isteği olarak gönderir.
            parts: [pstart, pback, pfwd, pwhere, pret]
          - label: Sana göre (3 hop)
            sub: Senin "For my persona" tıklamanla giden sorgu.
            via: >-
              Aynı yoldan gider. Bu sorgunun eleme ve sayma işleri de Neptune'da yapılır; uygulama sonuca dokunmaz.
            parts: [mstart, mback, mfwd, mwhere, mret]
            mark: [mwhere]
        note: >-
          Dikkat: iki sorguda da "tabloyu tara" diyen bir şey yok. Sorgu bir yol çiziyor ve Neptune o yolu başlangıç
          düğümünden takip ediyor. Sağdaki sorgunun farkı başlangıç noktası (ürün yerine sen), bir hop fazlası ve senin
          aldıklarını eleyen NOT (me)-[:BOUGHT]->(rec) parçası.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          Neptune'un işi önerileri verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: Neptune → Uygulama
            text: >-
              {items} öneri geldi: ürün no, ad, kategori ve skor (ortak müşteri sayısı). Eleme, sayma ve sıralama Neptune'da,
              sorgunun içinde yapıldı.
          - who: Uygulama
            text: Satırlara dokunmadı. Sadece isteğin kaydını (trace) cevaba ekledi.
          - who: Uygulama → Tarayıcın
            text: Önerileri ve isteğin kaydını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: >-
              Önerileri "Recommended for …" (sana önerilenler) başlığıyla çizdi. Her kartın altındaki "shared customers"
              (ortak müşteri) sayısı skordur. Kartta fiyat yok, çünkü Neptune'dan fiyat gelmez.
          - who: Tarayıcın → S3
            text: >-
              Her kartın görselini ürün numarasından kurduğu adresle (/s3/api/img/P0063) ayrı ayrı istedi; görseller S3'ten
              geldi. Kartta adı ve skoru (Neptune) görselle (S3) birleştiren tarayıcıdır.
          - who: Sonra
            text: >-
              Yeni bir sipariş grafa BOUGHT kenarı olarak eklendiği anda bir sonraki öneri değişir; grafı baştan hesaplamaya
              gerek yoktur.
      remember: >-
        İlişkiler üzerinden giden sorularda ("benim gibi alanlar ne aldı?") graf veritabanı yolu doğrudan takip eder.
        Bir hop eklemek sorguya bir parça eklemek kadar kolaydır.
      why_db: >-
        Neden Neptune? Aynı soruyu ilişkisel bir veritabanında sorsaydık her hop, büyük bir alımlar tablosuna bir JOIN
        daha demek olurdu; 3 hop, aynı tabloya 3 kez JOIN. Neptune kenarları düğümlerin yanında tutar ve sadece
        başlangıç noktasının çevresini okur. Bedeli: toplamlar, raporlar ve sıradan tablo işleri için uygun değildir;
        satış raporu gibi işler başka bir veritabanında yapılır.

  - page: product
    path: /p/P0001
    engines: [dynamodb]
    use_case: Alışveriş sepeti
    title: Ürünü sepete ekle
    why: >-
      Bir ürünün sayfasındasın. Şimdi bu ürünü sepete ekleyeceksin. Sepet, bu tarayıcıya ait bir kayıt olarak saklanıyor;
      hiç sepetin yoksa ilk eklemede kendiliğinden oluşacak.
    do: Aydınlık "Add to cart" (sepete ekle) butonuna tıkla. Adet 1 kalsın.
    target: "#add"
    action: click
    wait: {method: POST, path: /dynamodb/api/cart/items}
    focus: "#add-msg"
    panel:
      need: >-
        Sepete ekleme anlık olmalı ve aynı ziyaretçinin iki sekmesi aynı anda ekleme yapsa bile hiçbir ekleme kaybolmamalı.
        Ürün sepette yoksa oluşturulmalı, varsa adedi artmalı. Bunu "önce bak, sonra yaz" diye iki adımda yapmak hem yavaş
        hem de iki sekme aynı anda baktığında hatalı olur.
      concept:
        term: Partition, item ve "yoksa oluştur, varsa artır" (upsert)
        text: >-
          DynamoDB tabloyu partition key'e göre parçalara (partition) böler. Senin sepetin bir çekmece gibi: çekmecenin etiketi
          pk = CART#<bu tarayıcı>, içindeki her kart bir item, kartın adı sk = ITEM#<ürün>. UpdateItem bir item'ı adresiyle
          (pk + sk) bulur; ADD qty 1 dersen item yoksa qty = 1 ile oluşturur, varsa 1 artırır. Bakma ve yazma tek komuttur.
        terms:
          - [Item, "DynamoDB'deki tek kayıt. Burada sepetteki bir ürün."]
          - ["pk (partition key)", "Item'ın hangi partition'da durduğunu belirleyen alan. Burada CART#<tarayıcı kimliği>."]
          - ["sk (sort key)", "Aynı partition'daki item'ları ayıran ve sıralayan alan. Burada ITEM#<ürün no>."]
          - [WRU / RRU, "Yazma ve okuma birimleri. On-demand tabloda her istek kullandığı birim kadar ödenir."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde sepet tablosu için hazırlık
        intro: >-
          "Sepete ekle" butonuna hiç basılmadan, sepet tablosu sayfaların sorularına göre kurulur. Aşağıdaki beş adım bu
          hazırlığın sırasıdır.
        text:
          - title: Önce erişim kalıpları yazılır
            text: >-
              DynamoDB'de tasarım sorulardan başlar: "bu ürünü sepete ekle", "bu ziyaretçinin sepetini getir", "bu ürünü
              çıkar". Her biri tek bir anahtar işlemi olmalı; tabloyu tarayan (Scan) bir sayfa olmamalı.
            code: |-
              UpdateItem  pk = CART#<ziyaretçi>, sk = ITEM#<ürün>   → ekle / artır
              Query       pk = CART#<ziyaretçi>                    → bütün sepet
          - title: Anahtar yükü dağıtacak şekilde seçilir
            text: >-
              pk her ziyaretçide farklı olduğu için yük binlerce partition'a dağılır. Bir partition saniyede en fazla 3.000 okuma
              ve 1.000 yazma birimi alır; herkesin aynı pk'ye yazdığı bir tasarım (ör. "SEPETLER") tek partition'ı boğar.
            code: |-
              --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE
          - title: Kapasite modu trafiğe göre seçilir
            text: >-
              Trafik tahmin edilemiyorsa ya da ani zirveler varsa on-demand seçilir: kapasite planlanmaz, istek başına ödenir.
              Trafik düzgün ve tahmin edilebilirse provisioned + auto scaling daha ucuz olabilir.
            code: |-
              --billing-mode PAY_PER_REQUEST
          - title: Yazma tek komutla yapılır
            text: >-
              "Varsa artır, yoksa oluştur" için UpdateItem + ADD kullanılır; önce GetItem sonra PutItem yapılmaz. ADD atomiktir:
              aynı anda gelen iki ekleme sırayla uygulanır, biri kaybolmaz. Kural varsa (en fazla 5) ConditionExpression olarak
              aynı komuta eklenir (Adım 14).
            code: |-
              UpdateExpression = "ADD qty :q SET #n = :n, unit_price = :p, expires_at = :e"
          - title: Terk edilen sepet kendiliğinden silinir
            text: >-
              Her item'a bir silinme zamanı (expires_at) yazılır ve tabloda TTL açılır. DynamoDB süresi geçen item'ları ek yazma
              ücreti almadan siler; silme birkaç gün gecikebileceği için okurken expires_at ayrıca kontrol edilir.
      feed:
        title: Veri nereden geliyor?
        writes: Uygulama. Ürün sayfasındaki "sepete ekle", sepet sayfasındaki silme ve adet değiştirme.
        reads: Uygulama. Sepet sayfası, başlıktaki sepet sayacı ve ödeme adımı.
        kind: >-
          Uygulama orkestrasyonu. DynamoDB başka bir veritabanından kendiliğinden veri çekmez. Kendi değişikliklerini ise
          DynamoDB Streams ile dışarı verebilir.
        with: >-
          Sepet tek başına çalışmaz. Ürünün adı ve fiyatı katalogdan (DocumentDB) gelir ve item'a kopya olarak yazılır. Ödeme
          anında sipariş ilişkisel veritabanına (Aurora) tek bir transaction ile yazılır ve stok orada düşer.
        best: >-
          Sepet hızlı ve bağımsız bir anahtar-değer tablosunda durur; fiyat ve stok ödeme anında asıl kayıttan doğrulanır.
          "Sepetini unuttun" hatırlatması gibi işler için DynamoDB Streams'i bir AWS Lambda fonksiyonu okur.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Mağazada bir müşteri olarak geziyorsun. Şifreyle giriş yok; sepetin bu tarayıcının kimliğine (lm_visitor çerezi)
              bağlı. DynamoDB'de sepetinin adresi CART#<bu kimlik>.
          - text: >-
              Alpen Kablosuz Kulaklık 1'in sayfası açık. Açılırken ürün DocumentDB'den, görseli S3'ten geldi; "baktın" kaydı
              Keyspaces'e yazıldı, öneriler Neptune'dan geldi, oturum güncellendi.
            engines: [docdb, s3, keyspaces, neptune, elasticache]
          - text: >-
              "Add to cart" butonuna bastın. Tarayıcın uygulamaya ürünün numarasını, adını ve fiyatını (sayfadaki DocumentDB
              dokümanından) ve adedi (1) gönderdi.
          - text: >-
              Uygulama DynamoDB'ye bir UpdateItem gönderdi: "bu sepette bu ürünün adedine 1 ekle". Ürün sepette yoktu; item
              oluştu. Hemen ardından uygulama sepetin tamamını bir Query ile okudu. Simülasyon bu iki komutu gösteriyor.
            engines: [dynamodb]
          - text: >-
              Butonun altında "Added" (eklendi) yazdı ve başlıktaki sepet sayacı arttı.
            engines: [dynamodb]
      sim:
        kind: ddb-items
        title: "DynamoDB tablosu: dbws-cart"
        caption: >-
          Sepet tablosundan örnek bir kesit: üç ziyaretçinin sepeti (kimlikler kısaltıldı, satırlar örnek). Sepetin ilk kez bu
          eklemeyle oluşuyorsa senin partition'ın boş başlar. Önce UpdateItem, sonra Query oynuyor.
        rows:
          - {pk: "CART#09bd…", sk: ITEM#P0105, name: Deri Ceket, qty: 1}
          - {pk: "CART#09bd…", sk: ITEM#P0176, name: Bluetooth Hoparlör, qty: 4}
          - {pk: "CART#7f3a… (sen)", sk: ITEM#P0131, name: Mekanik Klavye, qty: 2}
          - {pk: "CART#c41e…", sk: ITEM#P0021, name: Akıllı Saat, qty: 1}
          - {pk: "CART#c41e…", sk: ITEM#P0066, name: Powerbank, qty: 3}
        ops:
          - op: update
            pk: "CART#7f3a… (sen)"
            sk: ITEM#P0001
            name: Alpen Kablosuz Kulaklık 1
            add: 1
            say_send: >-
              "Add to cart"a bastın. Uygulama DynamoDB'ye UpdateItem gönderiyor: pk = senin sepetin, sk = ITEM#P0001, ADD qty 1.
            say_find: >-
              pk değerinden senin partition'ın bulundu; içinde ITEM#P0001 yok. Diğer ziyaretçilerin partition'larına bakılmadı.
            say_write: >-
              Item yoktu: ADD onu qty = 1 ile oluşturdu; ad, fiyat ve silinme zamanı (24 saat sonra) aynı komutla yazıldı.
          - op: query
            pk: "CART#7f3a… (sen)"
            say_send: Uygulama sepetin güncel hâli için Query gönderiyor - pk = senin sepetin, güçlü tutarlı okuma.
            say_read: Senin partition'ındaki bütün item'lar sk sırasıyla okundu; başka partition'a dokunulmadı.
        back: >-
          Uygulama sepeti tarayıcına gönderdi. Butonun altında "Added" yazacak, sepet sayacı artacak.
        summary: >-
          İki komut da sadece senin partition'ına dokundu. UpdateItem "yoksa oluştur, varsa artır" işini tek adımda yaptı; Query
          sepetin bütün item'larını tek okumada getirdi.
      wire:
        what: >-
          Uygulama komutları HTTPS ile DynamoDB'ye gönderir (AWS'nin Python kütüphanesi boto3). Her istek, uygulamanın IAM
          kimliğiyle imzalanır.
        dst: "dynamodb.eu-central-1.amazonaws.com : 443"
        dst_note: >-
          DynamoDB'nin bölge adresi. VPC'deki gateway endpoint sayesinde istek internete çıkmadan AWS'nin iç ağından gider.
        rows:
          - [Şifreleme, TLS (HTTPS), gerçek, DynamoDB sadece şifreli bağlantı kabul eder.]
          - [Protokol, "HTTP, POST /  (JSON gövde)", gerçek, "Her komut bir web isteğidir. Hangi komut olduğunu X-Amz-Target başlığı söyler."]
          - [Kimlik, "IAM, SigV4 imzası (servis: dynamodb)", gerçek, "Şifre yok. İsteğe, geçici AWS kimliğiyle hesaplanmış bir imza eklenir."]
        body_label: İsteğin içeriği (okunur hâle getirilmiş, bazı değerler kısaltıldı)
        body: |-
          POST / HTTP/1.1
          Host: dynamodb.eu-central-1.amazonaws.com
          X-Amz-Target: DynamoDB_20120810.UpdateItem
          Content-Type: application/x-amz-json-1.0

          { "TableName": "dbws-cart",
            "Key": { "pk": {"S": "CART#7f3a…"}, "sk": {"S": "ITEM#P0001"} },
            "UpdateExpression": "ADD qty :q SET #n = :n, unit_price = :p, expires_at = :e",
            "ConditionExpression": "attribute_not_exists(qty) OR qty <= :max",
            "ExpressionAttributeValues": { ":q": {"N": "1"}, ":max": {"N": "4"}, … },
            "ReturnValues": "ALL_NEW", "ReturnConsumedCapacity": "TOTAL" }

          Ardından: X-Amz-Target: DynamoDB_20120810.Query   { "KeyConditionExpression": "pk = :pk", "ConsistentRead": true, … }
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Mor etiketli
        satırda bir şey bir yerden bir yere gider; gri "Uygulamanın içinde" etiketli satırda iş uygulamanın kendi içinde
        yapılır.
      app_code:
        - file: engines/dynamodb.py
          func: api_add
          title: '"Sepete ekle" isteği'
          sub: Senin tıklamanla gelen istek; iki komut gönderir.
          lines:
            - {match: '@bp.post("/api/cart/items")', say: "\"Sepete ekle\" isteği buraya gelir: ürün no, ad, fiyat ve adet.", tag: Tarayıcı → Uygulama}
            - {match: 'pk, sk = f"CART#{visitor_id()}", f"ITEM#{pid}"', say: "Item'ın adresini kurar: senin sepetin (pk) ve bu ürün (sk).", tag: Uygulamanın içinde, hl: key}
            - {match: 'UpdateExpression="ADD qty :q SET', say: "Ne yazılacağını hazırlar: adede ekle; ad, fiyat ve 24 saat sonraki silinme zamanını yaz.", tag: Uygulamanın içinde, hl: add}
            - {match: 'kwargs["ConditionExpression"] = "attribute_not_exists(qty) OR qty <= :max"', say: "\"Limit\" kutusu işaretliyse en fazla 5 kuralını koşul olarak ekler (Adım 14).", tag: Uygulamanın içinde}
            - {match: 'resp = table().update_item(**kwargs)', say: "boto3 komutu gönderir; item yoksa oluşur, varsa adedi artar.", tag: [Uygulama → DynamoDB, DynamoDB → Uygulama], hl: add}
            - {match: 'units, cost = _units(resp, "Write")', say: Cevaptan harcanan yazma birimini okur (isteğin kaydı için)., tag: Uygulamanın içinde}
            - {match: 'items = get_cart(True)', say: "Sepetin güncel hâlini almak için ikinci komut (Query) gider.", tag: [Uygulama → DynamoDB, DynamoDB → Uygulama], hl: key}
            - {match: 'return jsonify(trace.payload({"items": items, "refused": refused}))', say: Sepet tarayıcıya gider., tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek tabloda ne oldu?
        intro: Senin tıklamanla DynamoDB'ye giden iki gerçek komut.
        runs:
          - label: UpdateItem + Query (senin tıklaman)
            trigger: true
            metrics: [["UpdateItem kapasitesi", capacity], ["UpdateItem süresi", ms], ["Query kapasitesi", e1.capacity], ["Query süresi", e1.ms], [Sepetteki ürün çeşidi, data.items.length]]
        reading: >-
          UpdateItem 1 yazma birimi harcadı (item 1 KB'tan küçük). Query, sepetin bütün item'larını güçlü tutarlı okuyarak getirdi
          ve küçük bir sepet için 1 okuma birimi harcadı. Süreler her istekte değişir: uygulama sunucusu bir süre DynamoDB'ye
          istek göndermediyse ilk komutta bağlantı yeniden kurulur ve yüzlerce milisaniye sürebilir; sıradaki komutlar
          çoğu zaman birkaç milisaniyedir. Sepetinde başka ürünler varsa çeşit sayısı daha büyüktür.
      query:
        title: Sayfa DynamoDB'ye ne dedi?
        intro: >-
          İki sütun, simülasyondaki iki komut. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: key
            say: Bu sepetteki bu ürünün item'ını bul,
            code: "table.update_item(Key={'pk': 'CART#7f3a…', 'sk': 'ITEM#P0001'},"
            name: Hangi item?
            note: Anahtar. pk senin sepetin, sk sepetteki ürün. DynamoDB anahtarla doğrudan item'a gider.
            hl: key
          - id: upd
            say: adedine 1 ekle (yoksa 1 ile oluştur), adını, fiyatını ve silinme zamanını yaz,
            code: "  UpdateExpression='ADD qty :q SET #n = :n, unit_price = :p, expires_at = :e',"
            name: Ne yazılsın?
            note: ADD qty :q, item yoksa onu qty = :q ile oluşturur, varsa :q kadar artırır. SET diğer alanları yazar.
            hl: add
          - id: cnd
            say: "ama sadece adedi 4'ü geçmiyorsa,"
            code: "  ConditionExpression='attribute_not_exists(qty) OR qty <= :max',"
            name: Hangi koşulla?
            note: "\"Limit 5 per product\" işaretli olduğu için kural da gider: :max = 5 − 1 = 4. Ürün sepette yoksa koşul tutar."
            hl: add
          - id: cap
            say: ve harcanan kapasiteyi söyle.
            code: "  ReturnConsumedCapacity='TOTAL')"
            name: Ek bilgi
            note: Cevapta bu isteğin kaç birim harcadığını geri istemek.
            hl: add
          - id: q
            say: Sonra bu sepetin bütün item'larını,
            code: "table.query(KeyConditionExpression=Key('pk').eq('CART#7f3a…'),"
            name: Hangi item'lar?
            note: Query, bir partition'ın item'larını sk sırasıyla okur. Sadece senin sepetin okunur.
            hl: key
          - id: cr
            say: en son yazılanı kesin görecek şekilde oku.
            code: "  ConsistentRead=True, ReturnConsumedCapacity='TOTAL')"
            name: Nasıl okunsun?
            note: Güçlü tutarlı okuma; az önceki yazma kesin görünür. Bedeli, tutarlı olmayan okumanın iki katı birim (Adım 15).
            hl: key
        columns:
          - label: 1. UpdateItem
            sub: Senin "Add to cart" tıklamanla giden ilk komut.
            via: Uygulama bu komutu boto3 kütüphanesinin update_item() metoduyla gönderir.
            parts: [key, upd, cnd, cap]
          - label: 2. Query
            sub: Hemen ardından, sepetin güncel hâli için giden komut.
            via: Uygulama bu komutu boto3'ün query() metoduyla gönderir.
            parts: [q, cr]
        note: >-
          Dikkat: UpdateItem'da "item var mı?" diye soran bir parça yok. ADD, olmayan bir item'ı kendisi oluşturur; bu yüzden
          önce okumaya gerek kalmaz.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          DynamoDB'nin işi iki cevabı verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: DynamoDB → Uygulama
            text: UpdateItem'ın cevabı (item'ın yeni hâli ve harcanan birim) ve Query'nin cevabı (sepetin item'ları) geldi.
          - who: Uygulama
            text: Item'ları sayfanın beklediği şekle çevirdi (ITEM#P0001 → P0001, sayılar ondalıktan sayıya).
          - who: Uygulama → Tarayıcın
            text: Sepeti ve isteğin kaydını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: >-
              Butonun altına "Added" yazdı. Sepet sayacını gelen sepetteki adetlerin toplamından hesapladı ve kendi hafızasında
              (localStorage) tuttu.
          - who: Sonra
            text: >-
              Bir sonraki adımda adet kutusuna 5 yazacaksın; ardından aynı butonla "en fazla 5" kuralını deneyeceksin (Adım 14).
              Sepet 24 saat sonra TTL ile kendiliğinden silinir.
      remember: >-
        DynamoDB'de bir item'ı adresiyle (pk + sk) bulursun. UpdateItem + ADD, "yoksa oluştur, varsa artır" işini tek adımda ve
        atomik yapar; önce okumaya gerek yoktur.
      why_db: >-
        Neden DynamoDB? Sepet, ziyaretçi başına küçük ve çok sık değişen bir veri. DynamoDB bunu anahtarla, her ölçekte birkaç
        milisaniyede okur ve yazar; atomik ADD, koşullu yazma ve TTL'yi kendisi sunar. Bedeli: anahtarı bilmeden esnek sorgu
        yapamazsın; tablo sorulara göre önceden tasarlanır.

  - page: product
    path: /p/P0001
    engines: [dynamodb]
    use_case: Koşullu yazma
    title: Kuralı bozacak bir yazma hazırla
    why: >-
      Sepet kuralı: bir üründen en fazla 5 adet. Az önceki adımda sepete 1 adet ekledin. Şimdi 5 adet daha eklemeyi
      deneyeceğiz; bu, toplamı 6 yapar ve kuralı bozar.
    do: Aydınlık adet (quantity) kutusuna 5 yaz.
    target: "#qty"
    action: type
    wait: {value: "5"}

  - page: product
    path: /p/P0001
    engines: [dynamodb]
    use_case: Koşullu yazma
    title: Bir koşul kötü bir yazmayı durdurur
    why: >-
      Sepet DynamoDB adlı veritabanında duruyor. Sayfa "5 adet ekle" derken yanına bir koşul da koyuyor: "sadece toplam 5'i
      geçmeyecekse yaz". Bu, bir kapı görevlisine benzer: kontrol eder ve uygun değilse içeri almaz. Kontrol ve yazma tek
      hamlede yapılır.
    do: Aydınlık "Add to cart" (sepete ekle) butonuna tıkla. Üstteki "Limit 5 per product" kutusu işaretli kalsın.
    target: "#add"
    action: click
    wait: {method: POST, path: /dynamodb/api/cart/items, body: {qty: "5"}}
    focus: "#add-msg"
    panel:
      need: >-
        Sepete "5 adet daha" yazılmadan önce mevcut adedin kontrol edilmesi gerekiyor. Bunu uygulama yapsaydı, önce
        okuyup sonra yazması gerekirdi; aynı anda iki sekmeden ekleme yapılırsa ikisi de eski değeri görüp kuralı
        aşabilirdi. Kontrolün veritabanının içinde, yazmayla aynı anda yapılması gerekiyor.
      concept:
        term: Koşullu yazma (ConditionExpression)
        text: >-
          DynamoDB'ye bir yazma gönderirken yanına bir koşul ekleyebilirsin. DynamoDB önce koşulu, item'ın o anki
          değerine bakarak kontrol eder. Koşul doğruysa yazar, yanlışsa hiçbir şey yazmaz ve "koşul tutmadı" der. Kontrol
          ile yazma tek bir adımdır, arada başka bir yazma araya giremez. Item, DynamoDB'de bir kayıt (bir satır) demek.
        terms:
          - [Item, "DynamoDB'deki tek bir kayıt. Burada sepetindeki bir ürün."]
          - ["pk + sk (anahtar)", "Item'ı bulmanın adresi. pk sepetin (CART#…), sk sepetteki ürün (ITEM#P0001)."]
          - [WRU, "Write request unit: DynamoDB'de yazma başına ödenen birim. Reddedilen koşullu yazma da 1 WRU harcar."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde sepet tablosu için hazırlık
        intro: >-
          "Sepete ekle" butonuna hiç basılmadan, sepet tablosu sayfaların sorularına ve sepet kurallarına göre kurulur.
          Aşağıdaki beş adım bu hazırlığın sırasıdır.
        text:
          - title: Önce sayfaların soruları yazılır
            text: >-
              DynamoDB'de tasarım erişim kalıplarından başlar. Sepetin üç işi var: sepeti getir, ürünü ekle ya da artır,
              ürünü çıkar. Her biri tek bir anahtar işlemi olmalı; tabloyu tarayan (Scan) bir sayfa olmamalı.
            code: |-
              Query       pk = CART#<ziyaretçi>                  → bütün sepet
              UpdateItem  pk = CART#<ziyaretçi>, sk = ITEM#<ürün>  → tek ürün
          - title: Anahtar ve TTL tabloda tanımlanır
            text: >-
              pk sepeti, sk ürünü gösterir. Trafik tahmin edilemediği için kapasite modu on-demand seçilir. TTL açılır:
              expires_at zamanı geçen item'ları DynamoDB ücretsiz siler; silme birkaç gün gecikebilir, bu yüzden okurken
              expires_at ayrıca kontrol edilir.
            code: |-
              aws dynamodb create-table --table-name dbws-cart --billing-mode PAY_PER_REQUEST \
                --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \
                --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE
              aws dynamodb update-time-to-live --table-name dbws-cart \
                --time-to-live-specification Enabled=true,AttributeName=expires_at
          - title: Kural yazmanın içine konur
            text: >-
              "Bir üründen en fazla 5 adet" için önce okuyup sonra yazılmaz; kural yazmaya ConditionExpression olarak eklenir
              ve DynamoDB kontrolle yazmayı tek adımda yapar. Adet ADD ile artırılır: iki sekme aynı anda eklese de biri
              kaybolmaz. Birden fazla item birlikte değişecekse TransactWriteItems kullanılır.
            code: |-
              UpdateExpression    = "ADD qty :q ..."
              ConditionExpression = "attribute_not_exists(qty) OR qty <= :max"
          - title: Fiyat kopyalanır, ödemede doğrulanır
            text: >-
              Sepet sayfası hızlı çizilsin diye item'a ürünün adı ve o anki fiyatı kopya olarak yazılır. Ama ödeme anında
              fiyat ve stok asıl kayıttan (katalog ve sipariş veritabanı) yeniden okunur ve sipariş transaction içinde yazılır;
              sepetteki kopya fiyat tek başına doğru kabul edilmez.
          - title: Ret de bir sonuçtur ve ölçülür
            text: >-
              Koşulu tutmayan yazma beklenen bir cevaptır (ConditionalCheckFailedException); uygulama onu yakalayıp anlaşılır
              bir mesaj gösterir. Ret de kapasite harcar; CloudWatch'ta ConditionalCheckFailedRequests ile izlenir.
      feed:
        title: Veri nereden geliyor?
        writes: Uygulama. Ürün sayfasındaki "sepete ekle", sepet sayfasındaki silme ve adet değiştirme.
        reads: Uygulama. Sepet sayfası, başlıktaki sepet sayacı ve ödeme adımı.
        kind: >-
          Uygulama orkestrasyonu. DynamoDB başka bir veritabanından kendiliğinden veri çekmez. Ama kendi değişikliklerini
          dışarı verebilir: DynamoDB Streams açıksa her yazma, 24 saat boyunca okunabilen bir değişiklik kaydı olur.
        with: >-
          Sepet tek başına çalışmaz. Ürünün adı ve fiyatı katalogdan (DocumentDB) gelir ve item'a kopya olarak yazılır.
          Ödeme anında sipariş ilişkisel veritabanına (Aurora) tek bir transaction ile yazılır ve stok orada düşer; sepet
          ondan sonra boşaltılır. Sepet sayfasındaki görseller nesne deposundan (S3) gelir.
        best: >-
          Sipariş verilince sepet, siparişin asıl kaydına (ilişkisel veritabanı) dönüşür ve sepet boşaltılır. "Sepetini
          unuttun" hatırlatması ya da analiz gibi işler için DynamoDB Streams'i bir AWS Lambda fonksiyonu okur; uygulama
          bu işleri sayfanın isteğine eklemez, böylece sayfa yavaşlamaz.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adıma gelene kadar gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda
          çalışan veritabanları var.
        steps:
          - text: >-
              Mağazada bir müşteri olarak geziyorsun. Şifreyle giriş yok; sepetin bu tarayıcının kimliğine bağlı
              (lm_visitor çerezi). DynamoDB'de sepetinin adresi CART#<bu kimlik>.
          - text: >-
              Kablosuz Kulaklık'ın sayfası açık. Açılırken oturumun güncellendi, ürün DocumentDB'den, görseli S3'ten geldi;
              "baktın" satırı Keyspaces'e yazıldı, öneriler Neptune'dan geldi.
            engines: [elasticache, docdb, s3, keyspaces, neptune]
          - text: >-
              Bir önceki adımda "Add to cart" (sepete ekle) butonuna bastın ve sepetine 1 adet girdi: DynamoDB'de ITEM#P0001,
              qty = 1. Item'a ürünün adı ve fiyatı da yazıldı; bunlar sayfadaki DocumentDB dokümanından alınan kopyalar.
            engines: [dynamodb]
          - text: >-
              Sonra adet kutusuna 5 yazdın ve "Limit 5 per product" işaretliyken yine "Add to cart"a bastın. Tarayıcın
              uygulamaya "5 adet ekle, limit açık" dedi; uygulama DynamoDB'ye koşullu bir UpdateItem gönderdi. Simülasyonun
              sol şeridi bu istek.
            engines: [dynamodb]
          - text: >-
              Toplam 6 olacağı için DynamoDB yazmadı. Uygulama sepeti yeniden okudu ve butonun altında kırmızı "en fazla 5"
              mesajı çıktı. Sepetinde hâlâ 1 adet var. Sağ şerit ise aynı istek koşulsuz gitseydi ne olacağını gösteriyor;
              o istek gönderilmedi.
            engines: [dynamodb]
      sim:
        kind: condition-write
        caption: >-
          Sepet tablosundan örnek bir kesit: üç ziyaretçinin sepetindeki altı item. Senin sepetinde Kablosuz Kulaklık'tan
          1 adet var. Solda senin gerçek isteğin (koşullu), sağda aynı istek koşulsuz gitseydi ne olurdu; sağdaki gerçekte
          gönderilmedi. Üstteki etiketler o anda işi kimin yaptığını gösterir: uygulama mı, DynamoDB mi.
        add: 5
        max: 5
        labels: {cond: Koşulla (senin isteğin), free: Koşulsuz ("Limit" kutusu kapalı olsaydı)}
        send_cond: >-
          Adet kutusuna 5 yazıp "Add to cart"a bastın. Tarayıcın "5 adet ekle, limit açık" dedi. Uygulama kuralı koşula
          çeviriyor (:max = 5 − 5 = 0) ve UpdateItem'ı koşuluyla birlikte DynamoDB'ye gönderiyor.
        back_cond: >-
          Uygulama "koşul tutmadı" cevabını yakaladı, sepeti yeniden okudu (Query) ve "en fazla 5 adet" mesajıyla tarayıcına
          gönderdi. Butonun altında kırmızı mesaj çıkacak.
        send_free: >-
          Olsaydı: "Limit" kutusu kapalı olsaydı uygulama aynı UpdateItem'ı koşulsuz gönderirdi.
        back_free: >-
          Uygulama sepeti yeniden okur ve 6 adetlik sepeti tarayıcına gönderirdi; kimse uyarılmazdı.
        rows:
          - {pk: "CART#7f3a…", sk: ITEM#P0001, name: Kablosuz Kulaklık, qty: 1, target: true}
          - {pk: "CART#7f3a…", sk: ITEM#P0131, name: Mekanik Klavye, qty: 2}
          - {pk: "CART#c41e…", sk: ITEM#P0021, name: Akıllı Saat, qty: 1}
          - {pk: "CART#c41e…", sk: ITEM#P0066, name: Powerbank, qty: 3}
          - {pk: "CART#09bd…", sk: ITEM#P0105, name: Deri Ceket, qty: 1}
          - {pk: "CART#09bd…", sk: ITEM#P0176, name: Bluetooth Hoparlör, qty: 4}
        summary: >-
          İki istek de aynı item'ı aynı anahtarla, tek okumada buldu. Fark tek bir şey: koşul. Koşul olunca DynamoDB
          kuralı kendisi korudu; koşul olmasa sepete 6 adet yazılırdı.
      wire:
        what: >-
          Uygulama komutu HTTPS ile DynamoDB'ye gönderir (AWS'nin Python kütüphanesi boto3). Her istek, uygulamanın IAM
          kimliğiyle imzalanır.
        dst: "dynamodb.eu-central-1.amazonaws.com : 443"
        dst_note: >-
          DynamoDB'nin bölge adresi. VPC'deki gateway endpoint sayesinde istek internete çıkmadan AWS'nin iç ağından gider.
        rows:
          - [Şifreleme, TLS (HTTPS), gerçek, DynamoDB sadece şifreli bağlantı kabul eder.]
          - [Protokol, "HTTP, POST /  (JSON gövde)", gerçek, "Her komut bir web isteğidir. Hangi komut olduğunu X-Amz-Target başlığı söyler: UpdateItem."]
          - [Kimlik, "IAM, SigV4 imzası (servis: dynamodb)", gerçek, "Şifre yok. İsteğe, geçici AWS kimliğiyle hesaplanmış bir imza eklenir."]
        body_label: İsteğin içeriği (okunur hâle getirilmiş, bazı değerler kısaltıldı)
        body: |-
          POST / HTTP/1.1
          Host: dynamodb.eu-central-1.amazonaws.com
          X-Amz-Target: DynamoDB_20120810.UpdateItem
          Content-Type: application/x-amz-json-1.0
          Authorization: AWS4-HMAC-SHA256 Credential=…/eu-central-1/dynamodb/aws4_request, SignedHeaders=…, Signature=…

          { "TableName": "dbws-cart",
            "Key": { "pk": {"S": "CART#7f3a…"}, "sk": {"S": "ITEM#P0001"} },
            "UpdateExpression": "ADD qty :q SET #n = :n, unit_price = :p, expires_at = :e",
            "ConditionExpression": "attribute_not_exists(qty) OR qty <= :max",
            "ExpressionAttributeValues": { ":q": {"N": "5"}, ":max": {"N": "0"}, … },
            "ReturnValues": "ALL_NEW", "ReturnConsumedCapacity": "TOTAL" }

          Koşul tutmazsa cevap: HTTP 400, "__type": "…#ConditionalCheckFailedException"
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Her satırın
        etiketi işin nerede olduğunu söyler: mor etiketli satırda bir şey bir yerden bir yere gider (tarayıcıdan uygulamaya,
        uygulamadan DynamoDB'ye ya da geri). Gri "Uygulamanın içinde" etiketli satırda iş uygulamanın kendi içinde yapılır,
        hiçbir yere bir şey gitmez.
      app_code:
        - file: engines/dynamodb.py
          func: api_add
          title: '"Sepete ekle" isteği'
          sub: Senin tıklamanla gelen istek.
          lines:
            - {match: '@bp.post("/api/cart/items")', say: "\"Sepete ekle\" isteği buraya gelir: ürün, adet (5) ve \"Limit\" kutusunun durumu.", tag: Tarayıcı → Uygulama}
            - {match: 'UpdateExpression="ADD qty :q SET', say: "Ne yazılacağını hazırlar: adede 5 ekle; ad, fiyat ve silinme zamanını yaz.", tag: Uygulamanın içinde, hl: add}
            - {match: 'kwargs["ConditionExpression"] = "attribute_not_exists(qty) OR qty <= :max"', say: "\"Limit\" kutusu işaretliyse komuta koşulu ekler.", tag: Uygulamanın içinde, hl: cond}
            - {match: 'kwargs["ExpressionAttributeValues"][":max"] = MAX_QTY - qty', say: "Kuralı sayıya çevirir: :max = 5 − 5 = 0. Bu hesabı uygulama yapar, DynamoDB değil.", tag: Uygulamanın içinde, hl: cond}
            - {match: 'resp = table().update_item(**kwargs)', say: "boto3 komutu gönderir. Koşul tutarsa DynamoDB yazar ve item'ın yeni hâlini döner.", tag: [Uygulama → DynamoDB, DynamoDB → Uygulama], hl: key}
            - {match: 'except table().meta.client.exceptions.ConditionalCheckFailedException:', say: "Koşul tutmazsa DynamoDB bir hata döner; uygulama onu yakalar ve \"en fazla 5 adet\" mesajını hazırlar.", tag: Uygulamanın içinde, hl: cond}
            - {match: 'items = get_cart(True)', say: "Sepetin güncel hâlini almak için DynamoDB'ye ikinci bir komut (Query) gider.", tag: [Uygulama → DynamoDB, DynamoDB → Uygulama]}
            - {match: 'return jsonify(trace.payload({"items": items, "refused": refused}))', say: Sepet ve varsa ret mesajı tarayıcıya gider., tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek tabloda ne oldu?
        intro: Senin tıklamanla DynamoDB'ye giden gerçek istek ve cevabı.
        runs:
          - label: Senin isteğin (koşullu)
            trigger: true
            metrics: [[Sonuç, data.refused, {set: "Reddedildi ✗", empty: "Yazıldı ✓"}], [Kapasite, capacity], [Süre, ms]]
        reading: >-
          DynamoDB koşulu kontrol etti ve yazmayı reddetti; sepetinde hâlâ 1 adet var. Ekrandaki kırmızı mesaj bu
          reddin sonucu. Reddedilen yazma da 1 WRU harcadı: DynamoDB kontrol için item'ı okumak zorundaydı. Sonuç
          "Yazıldı" görünüyorsa sepetinde bu üründen hiç yoktu: önceki adımı (sepete 1 adet ekleme) atlamış olabilirsin.
      query:
        title: Sayfa DynamoDB'ye ne dedi?
        intro: >-
          İki sütun, simülasyondaki iki tarafın komutu. Solda senin gönderdiğin koşullu komut, sağda "Limit" kutusu
          kapalıyken gidecek komut. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: key
            say: Bu sepetteki bu ürünün item'ını bul,
            code: "table.update_item(Key={'pk': 'CART#7f3a…', 'sk': 'ITEM#P0001'},"
            name: Hangi item?
            note: >-
              Anahtar: pk senin sepetin, sk sepetteki ürün. DynamoDB anahtarla item'a doğrudan gider; tabloyu taramaz.
            hl: key
          - id: upd
            say: adedine 5 ekle, adını, fiyatını ve silinme zamanını yaz,
            code: "UpdateExpression='ADD qty :q SET #n = :n, unit_price = :p, expires_at = :e',"
            name: Ne yazılsın?
            note: >-
              ADD qty :q adedi :q (5) kadar artırır; item yoksa 5 ile oluşturur. SET diğer alanları yazar. expires_at,
              sepetin 24 saat sonra kendiliğinden silinme zamanıdır (TTL).
            hl: add
            indent: 2
          - id: cond
            say: "ama sadece item yoksa ya da adedi 0'dan fazla değilse,"
            code: "ConditionExpression='attribute_not_exists(qty) OR qty <= :max',"
            name: Hangi koşulla?
            note: >-
              Koşul. attribute_not_exists(qty): sepette bu ürün hiç yoksa yaz. qty <= :max: varsa, adedi :max'ı
              geçmiyorsa yaz. Uygulama :max'ı 5 − 5 = 0 olarak gönderdi; senin adedin 1, yani koşul tutmadı.
            hl: cond
            indent: 2
            tag: sadece soldaki komutta var
          - id: cap
            say: ve ne kadar kapasite harcandığını da söyle.
            code: "ReturnConsumedCapacity='TOTAL')"
            name: Ek bilgi
            note: DynamoDB'den bu isteğin kaç birim harcadığını cevapta geri istemek. Paneldeki "Kapasite" sayısı buradan geliyor.
            hl: result
            indent: 2
        columns:
          - label: Koşulla (senin isteğin)
            sub: Senin "Add to cart" tıklamanla giden komut ("Limit 5 per product" işaretli).
            via: >-
              Uygulama bu komutu boto3 kütüphanesinin update_item() metoduyla gönderir. :max değerini (5 − 5 = 0) hesaplayıp
              koyan da uygulamadır.
            parts: [key, upd, cond, cap]
            mark: [cond]
          - label: Koşulsuz
            sub: '"Limit 5 per product" kutusu kapalıyken gidecek komut.'
            via: Aynı update_item() çağrısı, ConditionExpression olmadan.
            parts: [key, upd, cap]
        note: >-
          Dikkat: kural "en fazla 5" ama komutta 5 yazmıyor, 0 yazıyor. Uygulama koşulu "şimdiki adet + eklenecek ≤ 5"
          yerine "şimdiki adet ≤ 5 − eklenecek" olarak gönderiyor, çünkü DynamoDB koşulda item'ın şimdiki değerine bakar.
          Sağdaki komutun tek farkı ConditionExpression parçasının olmaması: DynamoDB bu durumda hiçbir şeyi kontrol etmez.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          DynamoDB'nin işi cevabı verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: DynamoDB → Uygulama
            text: >-
              Koşul tutmadı: DynamoDB ConditionalCheckFailedException döndü ve hiçbir şey yazmadı. Bu kontrol de 1 WRU
              harcadı. (Sepetinde bu üründen hiç yoksa koşul tutar ve 5 adet yazılır.)
          - who: Uygulama
            text: >-
              Hatayı yakaladı ve "en fazla 5 adet" mesajını hazırladı. Sonra sepetin güncel hâlini okumak için DynamoDB'ye
              ikinci bir komut (Query) gönderdi.
          - who: Uygulama → Tarayıcın
            text: Sepeti ve ret mesajını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: >-
              Butonun altına kırmızı mesajı yazdı. Sepetteki adet değişmedi; başlıktaki sepet sayacını tarayıcın gelen sepetten
              yeniden hesapladı ve kendi hafızasında (localStorage) tuttu.
          - who: Sonra (ödeme)
            text: >-
              Ödemeye geçersen sepet bir siparişe dönüşür: sipariş Aurora'ya tek bir transaction ile yazılır ve stok orada düşer.
              Ardından sepet DynamoDB'de boşaltılır.
          - who: Sonra
            text: >-
              Sepet item'ları 24 saat sonra TTL ile kendiliğinden silinir. Sipariş verilirse sepet boşaltılır.
      remember: >-
        Bir kuralı korumak için önce okuyup sonra yazma; kuralı yazmanın içine koşul olarak koy. Kontrol ve yazma tek
        adımda olunca, aynı anda gelen iki istek kuralı birlikte aşamaz.
      why_db: >-
        Neden DynamoDB? Sepet, ziyaretçi başına küçük ve çok sık değişen bir veri. DynamoDB bunu anahtarla, her ölçekte
        birkaç milisaniyede okur ve yazar; koşullu yazma ve TTL'yi kendisi sunar. Bedeli: anahtarı bilmeden esnek
        sorgu yapamazsın ve tablo, hangi sorular sorulacağına göre önceden tasarlanır.

  # ---------------------------------------------------------------- Cart: DynamoDB
  - page: cart
    path: /cart
    engines: [dynamodb]
    use_case: Okuma tutarlılığı
    title: Sepeti yarı maliyetle oku
    why: >-
      Sepet sayfasındasın. Sepetin, az önce eklediğin ürünlerle listelendi. Şimdi aynı sepeti daha ucuz bir okuma türüyle
      isteyeceksin ve neyin değiştiğine bakacaksın.
    do: Aydınlık "Eventually consistent" (sonunda tutarlı) butonuna tıkla.
    target: "#exp-consistent [data-value=false]"
    action: click
    wait: {method: GET, path: /dynamodb/api/cart, query: {consistent: "false"}}
    focus: "#cart"
    result: The Query used half the read request units (RRU).
    panel:
      need: >-
        Sepet sayfası çok sık okunur. Her okuma para ve kapasite harcar. Ama ödeme adımında sepetin en son hâli kesin olarak
        okunmalı: bir saniye önce eklenen ürün eksik görünürse sipariş yanlış olur. İki ihtiyaç farklı: biri ucuz olsun, diğeri
        kesin olsun.
      concept:
        term: Güçlü ve sonunda tutarlı okuma (strong / eventual consistency)
        text: >-
          DynamoDB her item'ı bir bölgenin birden fazla veri merkezinde (Availability Zone) kopyalar hâlinde tutar. Bir yazma
          önce ana kopyaya gelir, diğer kopyalara genellikle bir saniyeden kısa sürede ulaşır. Güçlü tutarlı okuma ana kopyaya sorar
          ve en son yazmayı kesin görür. Sonunda tutarlı okuma herhangi bir kopyaya sorar; yarı fiyatına okur ama az önceki
          yazmayı henüz görmeyebilir. Üç şubesi olan bir bankada bakiyeye merkez şubeden ya da en yakın şubeden bakmak gibi.
        terms:
          - [Güçlü tutarlı okuma, "En son başarılı yazmayı kesin döndürür. 4 KB'a kadar 1 okuma birimi (RRU)."]
          - [Sonunda tutarlı okuma, "Herhangi bir kopyadan okur; çok yeni bir yazmayı kaçırabilir. 4 KB'a kadar 0,5 RRU."]
          - [Availability Zone, "Bir AWS bölgesindeki birbirinden ayrı veri merkezleri. Kopyalar farklı AZ'lerde durur."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde okuma tutarlılığı için hazırlık
        intro: >-
          Sepet sayfası hiç açılmadan, her ekranın hangi okuma türünü kullanacağı belirlenir. Aşağıdaki beş adım bu hazırlığın
          sırasıdır.
        text:
          - title: Önce her ekranın ihtiyacı yazılır
            text: >-
              Her okuma için şu sorulur: "bir saniye önceki bir yazmayı kaçırmak sorun olur mu?". Sepet listesi ve başlıktaki
              sayaç için olmaz; ödeme özeti ve stok kontrolü için olur.
            code: |-
              Sepet sayfası  → ConsistentRead = false   (ucuz)
              Ödeme özeti    → ConsistentRead = true    (kesin)
          - title: Okuma türü her istekte seçilir
            text: >-
              Tutarlılık tablo ayarı değil, isteğin parametresidir. Aynı tablo, aynı item farklı ekranlarda farklı türle
              okunabilir. Varsayılan sonunda tutarlıdır; güçlü okuma açıkça istenir.
            code: |-
              table.query(KeyConditionExpression=Key("pk").eq(pk), ConsistentRead=True)
          - title: Maliyet hesaplanır
            text: >-
              Güçlü okuma, sonunda tutarlı okumanın iki katı birim harcar (4 KB başına 1 ve 0,5 RRU). Çok okunan ekranlarda
              sonunda tutarlı okumak okuma faturasını yarıya indirir.
          - title: İndeks ve bölgeler arası kopya sınırları bilinir
            text: >-
              Global secondary index'ler ve başka bölgelere kopyalanan tablolar (global tables) güçlü tutarlı okumayı her durumda
              sunmaz. Kesin okuma gereken sorular ana tabloya, yazmanın yapıldığı bölgeye sorulur.
          - title: Kendi yazdığını görmek ayrıca düşünülür
            text: >-
              "Ekledim ama listede yok" hissi kullanıcıyı şaşırtır. Bu yüzden yazmanın hemen arkasından gelen okuma (ekledikten
              sonra sepeti göstermek) güçlü yapılır; sonraki sayfa açılışları sonunda tutarlı olabilir.
      feed:
        title: Veri nereden geliyor?
        writes: Uygulama. Ürün sayfasındaki "sepete ekle", sepet sayfasındaki silme ve adet değiştirme.
        reads: Uygulama. Sepet sayfası, başlıktaki sepet sayacı ve ödeme adımı (her biri farklı tutarlılıkla).
        kind: >-
          Uygulama orkestrasyonu. Kopyalama DynamoDB'nin kendi içindedir: kopyaları kendisi tutar, uygulama bunu görmez.
        with: >-
          Sepet sayfasındaki ürün adları ve fiyatlar sepet item'larının içinde kopya olarak durur (katalogdan, DocumentDB);
          ödemede sipariş ilişkisel veritabanına (Aurora) yazılır.
        best: >-
          Okuma türü ekran ekran seçilir: kesinlik gereken yerde güçlü, gerisinde sonunda tutarlı. Böylece hem doğruluk hem
          maliyet korunur.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Başlıktaki "Cart" (sepet) bağlantısına tıkladın ve sepet sayfası açıldı. Açılırken oturumun güncellendi.
            engines: [elasticache]
          - text: >-
              Sayfa sepeti istedi; "Strongly consistent" (güçlü tutarlı) seçiliydi. Uygulama DynamoDB'ye güçlü tutarlı bir Query
              gönderdi; 1 okuma birimi harcandı. Simülasyonun sol şeridi bu istek.
            engines: [dynamodb]
          - text: >-
              Sepetin listelendi: ürün adları ve fiyatlar item'ların içinden (sepete eklerken katalogdan kopyalanan bilgiler).
            engines: [dynamodb]
          - text: >-
              Sonra "Eventually consistent" butonuna bastın. Tarayıcın aynı sepeti consistent=false ile istedi; uygulama aynı
              Query'yi sonunda tutarlı gönderdi; 0,5 okuma birimi harcandı. Simülasyonun sağ şeridi bu istek.
            engines: [dynamodb]
      sim:
        kind: replicas
        caption: >-
          Senin sepetindeki bir item'ın kopyaları (burada üç kopya çiziyoruz). Bir an önce adedi 1'den 2'ye çıkaran bir yazma olduğunu varsayıyoruz ve
          kopyalardan biri onu henüz almamış (gerçekte bu aralık genelde bir saniyeden kısadır). Solda güçlü okuma, sağda
          sonunda tutarlı okuma; ikisi de gerçek istek.
        key: ITEM#P0001 qty
        old: 1
        new: 2
        lag: [c]
        nodes:
          - {id: a, label: "Kopya 1 · ana (AZ-a)"}
          - {id: b, label: "Kopya 2 (AZ-b)"}
          - {id: c, label: "Kopya 3 (AZ-c)"}
        state_say: >-
          Adedi 2 yapan yazma ana kopyaya ve ikinci kopyaya ulaştı; üçüncü kopyada hâlâ eski değer (1) var.
        lanes:
          - id: strong
            title: "t-1 · İstek 1 · Sayfa açılınca · Güçlü tutarlı"
            reads: [a]
            cost: 1 RRU
            send: >-
              Sepet sayfasını açtın. Tarayıcın sepeti istedi; uygulama DynamoDB'ye ConsistentRead=True ile Query gönderiyor.
            read_say: Güçlü okuma ana kopyaya gidiyor; ana kopya en son yazmayı her zaman bilir.
            got_say: "Cevap: qty = 2, en son değer. Bedeli 1 okuma birimi."
            back: Uygulama sepeti tarayıcına gönderdi.
          - id: eventual
            title: "t0 · İstek 2 · Senin tıklaman · Sonunda tutarlı"
            reads: [c]
            cost: 0,5 RRU
            send: >-
              "Eventually consistent" butonuna bastın. Tarayıcın sepeti consistent=false ile istedi; uygulama aynı Query'yi
              ConsistentRead=False ile gönderiyor.
            read_say: Sonunda tutarlı okuma herhangi bir kopyaya gidebilir; bu kez yazmayı henüz almamış olana denk geldi.
            got_say: "Cevap: qty = 1, bir an önceki değer. Bedeli 0,5 okuma birimi. Kısa süre sonra bütün kopyalar 2 olur."
            back: Uygulama sepeti tarayıcına gönderdi; bu senaryoda bir an önceki hâliyle.
        summary: >-
          Güçlü okuma en son yazmayı kesin gördü ve iki kat ödedi. Sonunda tutarlı okuma yarı fiyatına okudu ama çok yeni bir
          yazmayı kaçırabildi. Gerçek denemende sepet bir süredir değişmediği için iki okuma da aynı sepeti gösterdi.
      wire:
        what: >-
          Uygulama komutu HTTPS ile DynamoDB'ye gönderir (boto3 kütüphanesi). Her istek, uygulamanın IAM kimliğiyle imzalanır.
        dst: "dynamodb.eu-central-1.amazonaws.com : 443"
        dst_note: >-
          DynamoDB'nin bölge adresi. VPC'deki gateway endpoint sayesinde istek internete çıkmadan AWS'nin iç ağından gider.
        rows:
          - [Şifreleme, TLS (HTTPS), gerçek, DynamoDB sadece şifreli bağlantı kabul eder.]
          - [Protokol, "HTTP, POST /  (JSON gövde)", gerçek, "Komutun adı X-Amz-Target başlığında: Query."]
          - [Kimlik, "IAM, SigV4 imzası (servis: dynamodb)", gerçek, "Şifre yok. İsteğe, geçici AWS kimliğiyle hesaplanmış bir imza eklenir."]
        body_label: İsteğin içeriği (okunur hâle getirilmiş)
        body: |-
          POST / HTTP/1.1
          X-Amz-Target: DynamoDB_20120810.Query

          { "TableName": "dbws-cart",
            "KeyConditionExpression": "pk = :pk",
            "ExpressionAttributeValues": { ":pk": {"S": "CART#7f3a…"} },
            "ConsistentRead": false,
            "ReturnConsumedCapacity": "TOTAL" }
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. İki istek de aynı
        kodu çalıştırır; fark tek bir değer (ConsistentRead).
      app_code:
        - file: engines/dynamodb.py
          func: api_cart
          title: Sepet isteği
          sub: Adresteki consistent=true ya da consistent=false okuma türünü seçer.
          lines:
            - {match: '@bp.get("/api/cart")', say: "Sepet isteği buraya gelir.", tag: Tarayıcı → Uygulama}
            - {match: 'consistent = request.args.get("consistent", "true") == "true"', say: "Güçlü mü, sonunda tutarlı mı? Varsayılan güçlü.", tag: Uygulamanın içinde, hl: node}
            - {match: 'items = get_cart(consistent)', say: "Sepeti okuyan ortak fonksiyonu çağırır (yandaki kart).", tag: Uygulamanın içinde}
            - {match: 'return jsonify(trace.payload({"items": items, "total":', say: "Sepeti ve toplam tutarı tarayıcıya gönderir; toplamı uygulama hesaplar.", tag: Uygulama → Tarayıcı}
        - file: engines/dynamodb.py
          func: get_cart
          title: Sepeti okuyan fonksiyon
          sub: Sepet sayfası, ekleme sonrası ve ödeme aynı fonksiyonu kullanır.
          lines:
            - {match: 'pk = f"CART#{visitor_id()}"', say: "Senin sepetinin anahtarını kurar.", tag: Uygulamanın içinde}
            - {match: 'resp = table().query(KeyConditionExpression=Key("pk").eq(pk), ConsistentRead=consistent,', say: "Query DynamoDB'ye gider; okuma türü bu satırda seçilir.", tag: [Uygulama → DynamoDB, DynamoDB → Uygulama], hl: node}
            - {match: 'units, cost = _units(resp, "Read")', say: Harcanan okuma birimini cevaptan okur., tag: Uygulamanın içinde}
            - {match: 'items = [{"product_id": it["sk"].split("#", 1)[1]', say: "Item'ları sayfanın beklediği şekle çevirir (ITEM#P0001 → P0001).", tag: Uygulamanın içinde}
      live:
        title: Gerçek tabloda ne oldu?
        intro: >-
          Sayfa açılırken giden güçlü okuma ve senin tıklamanla giden sonunda tutarlı okuma.
        runs:
          - label: Güçlü tutarlı (sayfa açılınca)
            page_call: {path: /dynamodb/api/cart, query: {consistent: "true"}}
            metrics: [[Okuma birimi, capacity], [Okunan item, items], [Süre, ms]]
          - label: Sonunda tutarlı (senin tıklaman)
            trigger: true
            metrics: [[Okuma birimi, capacity], [Okunan item, items], [Süre, ms]]
        reading: >-
          Aynı sepet, aynı item'lar; güçlü okuma 1, sonunda tutarlı okuma 0,5 okuma birimi harcadı. Sepet bir süredir değişmediği
          için iki okuma da aynı sonucu verdi. Fark sadece bir yazmanın hemen arkasından okunduğunda görülebilir. Sepet boş
          olsa bile her Query en az bu kadar birim harcar. Süre her istekte biraz değişir.
      query:
        title: Sayfa DynamoDB'ye ne dedi?
        intro: >-
          İki sütun, simülasyondaki iki isteğin komutu. Tek fark bir parça. Bir parçanın üzerine gelince cümlede, kodda ve
          açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: q
            say: Bu sepetin bütün item'larını
            code: "table.query(KeyConditionExpression=Key('pk').eq('CART#7f3a…'),"
            name: Hangi item'lar?
            note: Senin partition'ının bütün item'ları, sk sırasıyla.
            hl: node
          - id: st
            say: en son yazmayı kesin görecek şekilde oku.
            code: "  ConsistentRead=True)"
            name: Nasıl okunsun?
            note: Güçlü okuma; ana kopyaya sorar. 4 KB'a kadar 1 RRU.
            hl: node
          - id: ev
            say: herhangi bir kopyadan, yarı fiyatına oku.
            code: "  ConsistentRead=False)"
            name: Nasıl okunsun?
            note: Sonunda tutarlı okuma. 4 KB'a kadar 0,5 RRU; çok yeni bir yazmayı kaçırabilir.
            hl: node
            tag: sadece sağdaki komutta var
        columns:
          - label: Güçlü tutarlı
            sub: Sayfa açılırken giden komut.
            via: Uygulama bu komutu boto3 kütüphanesinin query() metoduyla gönderir.
            parts: [q, st]
          - label: Sonunda tutarlı
            sub: Senin "Eventually consistent" tıklamanla giden komut.
            via: Aynı query() çağrısı; sadece ConsistentRead değeri değişti.
            parts: [q, ev]
            mark: [ev]
        note: >-
          Dikkat: komutta hangi kopyanın okunacağı yazmıyor. ConsistentRead sadece "en son yazmayı kesin görmem gerekiyor mu?"
          sorusunun cevabıdır; kopyayı DynamoDB seçer.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          DynamoDB'nin işi item'ları verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: DynamoDB → Uygulama
            text: Sepetin item'ları ve harcanan birim (0,5 RRU) geldi.
          - who: Uygulama
            text: Item'ları sayfanın beklediği şekle çevirdi ve toplam tutarı hesapladı.
          - who: Uygulama → Tarayıcın
            text: Sepeti, toplamı ve isteğin kaydını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: Sepet tablosunu yeniden çizdi; görünen bir değişiklik yok.
          - who: Sonra (ödeme)
            text: >-
              Ödeme sayfası sepeti her zaman güçlü tutarlı okur (consistent=true), çünkü sipariş en son adetle yazılmalı.
      remember: >-
        Okuma türünü ekran ekran seç: kesinlik gereken yerde güçlü okuma (en son yazmayı görür, iki kat birim), gerisinde
        sonunda tutarlı okuma (yarı fiyatına, çok yeni bir yazmayı kaçırabilir).
      why_db: >-
        Neden DynamoDB? Sepet çok okunur; DynamoDB her okumada tutarlılığı ve bedeli seçmeye izin verir ve kopyaları kendisi
        yönetir. Bedeli: global secondary index'lerde ve bölgeler arası kopyalarda güçlü okuma her zaman mümkün değildir.

  - page: cart
    path: /cart
    engines: [dynamodb]
    use_case: Ani yük
    title: Bir anda gelen alıcı dalgası
    why: >-
      Sepet sayfasının altında bir deneme düğmesi var: 200 sanal alıcı aynı anda sepetlerine ürün ekleyecek. Bir kampanya
      başladığında gerçekte olan budur. Veritabanının bu ani dalgayı nasıl karşıladığına bakacaksın.
    do: Aydınlık "Start the simulation" (denemeyi başlat) butonuna tıkla. Birkaç saniye sürer.
    target: "#sim-run"
    action: click
    wait: {method: POST, path: /dynamodb/api/simulate, any: true}
    focus: "#sim-out"
    result: Look at the writes per second and the latency percentiles.
    panel:
      need: >-
        Kampanya anında yüzlerce kişi aynı saniyede sepetine ürün ekler. Sepet tablosunun bu dalgayı, önceden kapasite
        ayarlamadan ve her yazmayı birkaç milisaniyede bitirerek karşılaması gerekiyor. Dalga bitince de boşta duran kapasite
        için para ödenmemeli.
      concept:
        term: On-demand kapasite ve partition'lara dağılım
        text: >-
          On-demand modda DynamoDB'ye kapasite söylemezsin; her istek kadar ödersin ve tablo gelen yüke göre kendini ayarlar.
          Yük partition'lara dağılır: farklı anahtarlar farklı partition'lara gider ve her partition kendi payını taşır. Bir
          market düşün: kasa sayısı kalabalığa göre açılır, ama herkes aynı kasaya sıraya girerse o kasa tıkanır. Bu yüzden
          anahtarın yükü dağıtması gerekir.
        terms:
          - [On-demand, "Kapasite planı yok; istek başına ödeme. Ani ve tahmin edilemeyen yük için."]
          - [Throttle (geri çevirme), "Bir partition'ın sınırı aşılınca fazla isteğin reddedilmesi; uygulama yeniden dener."]
          - ["p50 / p95 / p99", "Yazmaların yüzde 50'si, 95'i, 99'u bu sürenin altında bitti. p99 en yavaş yüzde 1'i gösterir."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde ani yük için hazırlık
        intro: >-
          Kampanya başlamadan, tablonun kapasite modu ve anahtar tasarımı ani yüke göre seçilir. Aşağıdaki beş adım bu
          hazırlığın sırasıdır.
        text:
          - title: Önce yükün şekli yazılır
            text: >-
              Normal günde saniyede kaç yazma var, kampanya anında kaç katına çıkıyor, ne kadar sürüyor? Ani ve tahmin
              edilemeyen zirveler on-demand'i, düzgün ve bilinen yük provisioned + auto scaling'i gösterir.
          - title: Kapasite modu seçilir
            text: >-
              On-demand tabloda kapasite ayarı yoktur. Tablo, daha önce ulaştığı en yüksek trafiğin iki katına kadar anında
              çıkabilir; daha büyük sıçramalarda kısa süreli geri çevirme görülebilir. Bilinen büyük bir kampanyadan önce tablo
              ısıtılabilir (warm throughput).
            code: |-
              aws dynamodb update-table --table-name dbws-cart --billing-mode PAY_PER_REQUEST
          - title: Anahtar yükü dağıtır
            text: >-
              Bir partition saniyede en fazla 1.000 yazma birimi alır. Her alıcının kendi pk'si olduğu için yük binlerce
              partition'a dağılır. Herkesin aynı pk'ye yazdığı bir sayaç ya da "bugünün siparişleri" anahtarı tek partition'ı
              boğar; gerekirse anahtara bir son ek (#0 … #9) eklenerek yük bölünür (write sharding).
            code: |-
              pk = "CART#<ziyaretçi>"          (dağınık, iyi)
              pk = "ORDERS#2026-10-30"         (sıcak, kötü)  →  "ORDERS#2026-10-30#" + rastgele(0..9)
          - title: Geri çevirme için yeniden deneme hazırlanır
            text: >-
              AWS SDK'ları geri çevrilen isteği bekleme süresini artırarak (exponential backoff) kendiliğinden yeniden dener.
              Uygulama bu ayarları bilir ve yazmanın iki kez yapılması sorun olmayacak şekilde (idempotent) tasarlanır.
          - title: Ölçülür ve alarm kurulur
            text: >-
              CloudWatch'ta ConsumedWriteCapacityUnits, ThrottledRequests ve SuccessfulRequestLatency izlenir. Geri çevirme
              görülürse önce anahtar dağılımına bakılır.
      feed:
        title: Veri nereden geliyor?
        writes: Uygulama. Gerçekte her alıcının "sepete ekle" isteği; burada 200 sanal alıcının denemesi.
        reads: Uygulama, sepet sayfası ve ödeme için.
        kind: >-
          Uygulama orkestrasyonu. Yazmalar doğrudan uygulamadan gelir; DynamoDB yükü kendi partition'larına kendisi dağıtır.
        with: >-
          Gerçek bir kampanyada sepet dalgasının arkasından ödeme dalgası gelir: siparişler ilişkisel veritabanına (Aurora),
          fırsat stoğu bellekteki sayaca (ElastiCache) yazılır. Her birinin ani yük planı ayrı yapılır.
        best: >-
          Ani yük beklenen tablolar on-demand çalışır, anahtarları yükü dağıtacak şekilde seçilir ve SDK'nın yeniden deneme
          ayarları açık tutulur. Yük testi gerçek kampanyadan önce, gerçek anahtar dağılımıyla yapılır.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Sepet sayfasındasın. Açılırken oturumun güncellendi ve sepetin DynamoDB'den okundu.
            engines: [elasticache, dynamodb]
          - text: >-
              "Start the simulation" butonuna bastın; adet listesinde 1000 seçili. Tarayıcın uygulamaya "1000 yazmalık bir
              dalga başlat" dedi.
          - text: >-
              Uygulama 32 iş parçacığıyla aynı anda DynamoDB'ye PutItem gönderdi. Yazmalar 200 sanal alıcının farklı anahtarlarına
              gitti; her item 10 dakika sonra kendiliğinden silinecek. Simülasyonun sol şeridi bu dalga.
            engines: [dynamodb]
          - text: >-
              Bitince uygulama süreleri sıraladı ve saniyedeki yazma sayısını, p50, p95, p99 sürelerini hesaplayıp gönderdi;
              sayfada sonuç kutuları çizildi. Bu deneme saatte en fazla 3 kez yapılabilir.
            engines: [dynamodb]
      sim:
        kind: spread
        caption: >-
          Küçük bir örnek: 8 partition, 5 dalga, her dalgada 16 yazma; her partition bir dalgada en fazla 4 yazma alabiliyor
          (gerçek sınır saniyede 1.000 yazma birimidir). Solda gerçek denemedeki gibi dağınık anahtarlar, sağda olsaydı: herkes
          aynı anahtara yazsaydı. Sağdaki gönderilmedi.
        partitions: 8
        waves: 5
        per_wave: 16
        limit: 4
        labels:
          spread: "t0 · Senin denemen · 200 alıcı, dağınık anahtarlar"
          hot: "Olsaydı · Aynı yazmalar · Tek anahtar (sıcak partition)"
        send_spread: >-
          "Start the simulation"a bastın. Uygulama PutItem'ları aynı anda gönderiyor; her alıcının anahtarı farklı.
        back_spread: >-
          Uygulama süreleri sıraladı, p50/p95/p99'u hesapladı ve sonucu tarayıcına gönderdi.
        send_hot: >-
          Olsaydı: uygulama aynı yazmaları tek bir anahtarla (ör. pk = "KAMPANYA") gönderseydi.
        back_hot: >-
          Uygulama geri çevrilen yazmaları beklemeli olarak yeniden denemek zorunda kalırdı; sürenin uzun kuyruğu (p99) büyürdü.
        summary: >-
          Aynı sayıda yazma: anahtarlar dağınıkken her partition payını taşıdı ve hiçbir yazma geri çevrilmedi. Tek anahtarda
          bütün yük bir partition'a bindi ve sınırı aşan yazmalar geri çevrildi. Ani yükü taşıyan şey kapasite kadar anahtar
          tasarımıdır.
      wire:
        what: >-
          Uygulama yazmaları HTTPS ile DynamoDB'ye gönderir (boto3 kütüphanesi), 32 iş parçacığıyla aynı anda. Bağlantılar
          yeniden kullanılır; her istek SigV4 ile imzalanır.
        dst: "dynamodb.eu-central-1.amazonaws.com : 443"
        dst_note: >-
          DynamoDB'nin bölge adresi. VPC'deki gateway endpoint sayesinde istekler internete çıkmadan gider.
        rows:
          - [Şifreleme, TLS (HTTPS), gerçek, DynamoDB sadece şifreli bağlantı kabul eder.]
          - [Protokol, "HTTP, POST /  (JSON gövde)", gerçek, "Her yazma ayrı bir web isteği: X-Amz-Target = PutItem."]
          - [Kimlik, "IAM, SigV4 imzası (servis: dynamodb)", gerçek, "Şifre yok. Her isteğe geçici AWS kimliğiyle hesaplanmış bir imza eklenir."]
        body_label: Bir yazmanın içeriği (okunur hâle getirilmiş)
        body: |-
          POST / HTTP/1.1
          X-Amz-Target: DynamoDB_20120810.PutItem

          { "TableName": "dbws-cart",
            "Item": { "pk": {"S": "SIM#1793395000#137"}, "sk": {"S": "ITEM#P0037"}, "qty": {"N": "1"}, "expires_at": {"N": "…"} },
            "ReturnConsumedCapacity": "TOTAL" }
          × 1000, 32 tanesi aynı anda
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Yazmaların aynı
        anda gönderilmesini uygulama sağlıyor.
      app_code:
        - file: engines/dynamodb.py
          func: api_simulate
          title: '"Denemeyi başlat" isteği'
          sub: Senin tıklamanla gelen istek; 1000 yazma gönderir.
          lines:
            - {match: '@bp.post("/api/simulate")', say: "Deneme isteği buraya gelir; adres kaç yazma yapılacağını taşır.", tag: Tarayıcı → Uygulama}
            - {match: 'with simlimit.run(visitor_id(), body.get("requests", 1000)) as n:', say: "Saatte 3 deneme ve deneme başına en fazla 2000 yazma sınırını kontrol eder.", tag: Uygulamanın içinde}
            - {match: 'r = table().put_item(Item={"pk": f"{run}#{i % 200}"', say: "Bir yazma: 200 sanal alıcıdan birinin anahtarıyla bir item. Anahtarlar farklı olduğu için yük dağılır.", tag: [Uygulama → DynamoDB, DynamoDB → Uygulama], hl: part}
            - {match: 'with ThreadPoolExecutor(max_workers=32) as pool:', say: "32 iş parçacığı açar; yazmalar 32'şer 32'şer aynı anda gider.", tag: Uygulamanın içinde}
            - {match: 'latencies.sort()', say: "Her yazmanın süresini sıralar.", tag: Uygulamanın içinde}
            - {match: '"p50_ms": round(latencies[len(latencies) // 2], 1)', say: "Ortanca (p50), p95 ve p99 sürelerini ve saniyedeki yazma sayısını hesaplar.", tag: Uygulamanın içinde}
            - {match: 'return jsonify(trace.payload(stats))', say: Sonuçlar tarayıcıya gider., tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek denemede ne oldu?
        intro: >-
          Senin başlattığın gerçek deneme. Sayılar uygulamanın ölçtüğü sürelerden geliyor.
        runs:
          - label: 1000 yazma (senin denemen)
            trigger: true
            metrics: [[Yazma, data.requests], [Saniyede yazma, data.per_second], [p50, data.p50_ms], [p95, data.p95_ms], [p99, data.p99_ms], [Harcanan birim, capacity]]
        reading: >-
          Süreler milisaniye. Yazmaların yarısı p50'den, yüzde 99'u p99'dan kısa sürdü; p99 en yavaş yüzde 1'i gösterir. Bu
          süreleri uygulama ölçüyor: 32 iş parçacığı aynı küçük sunucuda sırayla işlem gördüğü için bekleme de süreye giriyor.
          DynamoDB'nin kendi yazma süresi (CloudWatch'ta SuccessfulRequestLatency) genelde birkaç milisaniyedir. Saniyedeki yazma
          sayısını da uygulama sunucusu sınırlıyor; DynamoDB daha fazlasını kaldırırdı. Her şey her denemede biraz değişir. Kutu
          boşsa deneme sınırına (saatte 3) takıldın.
      query:
        title: Uygulama DynamoDB'ye ne dedi?
        intro: >-
          Simülasyondaki iki şeridin komutu. Tek fark anahtar. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı
          yer parlar.
        cards_title: Parça parça
        parts:
          - id: put
            say: Yeni bir item yaz,
            code: "table.put_item(Item={"
            name: Ne yapılsın?
            note: PutItem, verilen anahtarla bir item yazar; aynı anahtarda item varsa üstüne yazar.
            hl: part
          - id: k1
            say: anahtarı bu alıcıya özel olsun,
            code: "  'pk': 'SIM#<deneme>#<alıcı 0–199>', 'sk': 'ITEM#<ürün>',"
            name: Hangi anahtar?
            note: 200 farklı pk değeri; yük partition'lara dağılır.
            hl: part
          - id: k2
            say: anahtarı herkes için aynı olsun,
            code: "  'pk': 'KAMPANYA', 'sk': 'ITEM#<ürün>#<alıcı>',"
            name: Hangi anahtar?
            note: Tek bir pk değeri; bütün yazmalar aynı partition'a gider ve onun sınırını aşar.
            hl: part
            tag: sadece sağdaki komutta var
          - id: ttl
            say: ve 10 dakika sonra silinsin.
            code: "  'qty': 1, 'expires_at': <şimdi + 600> })"
            name: Ne kadar kalsın?
            note: TTL alanı; deneme item'ları 10 dakika sonra ücretsiz silinir.
            hl: part
        columns:
          - label: Dağınık anahtarlar
            sub: Senin denemende 1000 kez, 32'şer 32'şer giden komut.
            via: Uygulama bu komutu boto3'ün put_item() metoduyla, bir iş parçacığı havuzundan gönderir.
            parts: [put, k1, ttl]
          - label: "Olsaydı: tek anahtar"
            sub: Gönderilmeyen, karşılaştırma için yazılmış komut.
            via: Aynı put_item() çağrısı; sadece pk değeri herkes için aynı.
            parts: [put, k2, ttl]
            mark: [k2]
        note: >-
          Dikkat: iki komut arasında kapasite ayarı farkı yok; ikisi de aynı on-demand tabloya gidiyor. Fark sadece anahtarın
          değeri. Ani yükte geri çevrilmeyi belirleyen çoğu zaman tablonun ayarı değil, anahtarın dağılımıdır.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          DynamoDB her yazmaya ayrı ayrı cevap verdi. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: DynamoDB → Uygulama
            text: Her PutItem için harcanan birim (1 WRU) ve "tamam" cevabı geldi; 1000 cevap.
          - who: Uygulama
            text: Süreleri sıraladı; p50, p95, p99 ve saniyedeki yazma sayısını hesapladı, harcanan birimleri topladı.
          - who: Uygulama → Tarayıcın
            text: Ölçümleri ve isteğin kaydını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: Sayfadaki beş sonuç kutusunu çizdi (writes, writes per second, median, 95th, 99th percentile).
          - who: Sonra
            text: >-
              Deneme item'ları 10 dakika sonra TTL ile kendiliğinden silinir; gerçek sepetler etkilenmez.
      remember: >-
        Ani yükü taşıyan iki şey var: kapasite planı gerektirmeyen bir mod (on-demand) ve yükü partition'lara dağıtan anahtarlar.
        Herkesin aynı anahtara yazdığı bir tasarım, kapasite ne olursa olsun tek partition'ı tıkar.
      why_db: >-
        Neden DynamoDB? Sepet ani dalgalar alır; DynamoDB on-demand modda kapasite planı olmadan, her ölçekte birkaç
        milisaniyede yazar ve yükü kendi partition'larına dağıtır. Bedeli: tek bir anahtar sınırlıdır; anahtar tasarımı yanlışsa
        geri çevirme görülür.

  # ---------------------------------------------------------------- Deals: ElastiCache
  - page: deals
    path: /deals
    engines: [elasticache]
    use_case: Atomik sayaç
    title: DECR ile bir tane satın al
    why: >-
      Fırsatlar sayfasındasın. Günün fırsat ürününden kaç tane kaldığı yazıyor. Şimdi bir tane satın alacaksın ve kalan adedin
      nasıl tek hamlede azaldığına bakacaksın.
    do: Aydınlık "Buy one now" (hemen bir tane al) butonuna tıkla.
    target: "#buy"
    action: click
    wait: {method: POST, path: /elasticache/api/deal/buy}
    focus: "#deal"
    result: DECR returned the new stock in one atomic command.
    panel:
      need: >-
        Fırsat ürününün kalan adedi binlerce kişi tarafından aynı anda azaltılabilir. Her alımda adet tam bir azalmalı, iki kişi
        aynı son parçayı alamamalı ve cevap anında gelmeli. "Kaç tane kaldı, bak; sonra bir eksiğini yaz" diye iki adımda
        yapmak, aynı anda gelen alımlarda yanlış sonuç verir (Adım 19).
      concept:
        term: Atomik komut (DECR)
        text: >-
          DECR bir sayacı tek komutta bir azaltır ve yeni değeri söyler. Okuma ve yazma aynı komutun içindedir; ElastiCache
          (Valkey) komutları her anahtar için tek tek sırayla çalıştırdığı için iki DECR asla aynı değeri görmez. Bir bilet
          kuyruğunda numaratör gibi: her basan bir sonraki numarayı alır, iki kişi aynı numarayı alamaz.
        terms:
          - [DECR, "Sayacı 1 azaltır ve yeni değeri döndürür. Okuma ve yazma tek komut."]
          - [INCR, "Sayacı 1 artırır. Burada \"parçayı geri ver\" için."]
          - [Atomik, "Bölünemez: işlem ya tamamen olur ya hiç olmaz; arasına başka bir işlem giremez."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde fırsat sayacı için hazırlık
        intro: >-
          "Buy" butonuna hiç basılmadan, sayaç ve satın alma kuralı hazırlanır. Aşağıdaki beş adım bu hazırlığın sırasıdır.
        text:
          - title: Önce satın almanın sorusu yazılır
            text: >-
              "Bir parça kaldıysa bana ver, kalmadıysa söyle" - bu tek bir atomik işlem olmalı. Cevapta kalan adet de gelmeli ki
              sayfa güncellensin.
            code: |-
              DECR lm:deal:stock   →  sonuç ≥ 0 ise satın aldın, sonuç < 0 ise parça kalmadı
          - title: Sayaç kampanyadan önce kurulur
            text: >-
              Kalan adet asıl stok kaydından alınır ve bellekte tek bir tamsayı anahtar olarak yazılır; kampanya bitince
              kendiliğinden silinsin diye bir bitiş zamanı verilir.
            code: |-
              SET lm:deal:stock 50
              EXPIREAT lm:deal:stock <kampanya bitişi>
          - title: Eksiye düşme önceden düşünülür
            text: >-
              DECR sıfırın altına da iner. Basit yol: sonuç eksiyse "tükendi" denir ve INCR ile sayaç geri alınır. Sayacın hiç
              eksiye inmemesi isteniyorsa kontrol ve azaltma tek bir Lua betiğinde yapılır.
            code: |-
              EVAL "local v = tonumber(redis.call('GET', KEYS[1])) if v and v > 0 then return redis.call('DECR', KEYS[1]) end return -1" 1 lm:deal:stock
          - title: Sayaçtan sonra asıl kayıt yazılır
            text: >-
              Sayaç sadece kapıdaki ilk elemedir. Parçayı alan kişinin siparişi ilişkisel veritabanına transaction ile yazılır;
              ödeme başarısız olursa sayaç INCR ile geri artırılır.
          - title: Sayaç izlenir ve karşılaştırılır
            text: >-
              Kampanya boyunca satılan adet (başlangıç − sayaç) siparişlerle karşılaştırılır. Fark varsa (ör. geri verilmeyen
              parçalar) asıl kayda göre düzeltilir.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Kampanyayı başlatan iş (sayacı kurar) ve her alımda uygulama (DECR; tükendiyse INCR ile geri alır).
        reads: Uygulama, fırsatın göründüğü her sayfa için (ana sayfa, fırsatlar sayfası).
        kind: >-
          Uygulama orkestrasyonu. ElastiCache başka bir veritabanından kendiliğinden veri çekmez; sayacı biri kurar ve uygulama
          değiştirir.
        with: >-
          Parçayı alan kişi onu fırsat fiyatıyla sepetine ekleyebilir (DynamoDB); siparişin asıl kaydı ödemede ilişkisel
          veritabanına (Aurora) yazılır. Ürün bilgisi katalogdan (DocumentDB), görseli nesne deposundan (S3) gelir.
        best: >-
          Sayaç hızlı karar içindir, asıl kayıt veritabanındadır. Satın alma akışı: DECR (bellek) → sipariş transaction'ı
          (veritabanı) → başarısızsa INCR. Sayaç kaybolursa asıl kayıttan yeniden kurulur.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Ana sayfadaki fırsat kutusuna ya da üst menüdeki "Deals" bağlantısına tıkladın; fırsatlar sayfası açıldı. Açılırken
              oturumun güncellendi.
            engines: [elasticache]
          - text: >-
              Sayfa fırsatı istedi: kart bilgisi (HGETALL lm:deal) ve kalan adet (GET lm:deal:stock) bellekten geldi; görsel
              S3'ten.
            engines: [elasticache, s3]
          - text: >-
              "Buy one now" butonuna bastın. Tarayıcın uygulamaya "bir tane al" dedi; uygulama ElastiCache'e tek bir komut
              gönderdi: DECR lm:deal:stock. Simülasyon bu komutu gösteriyor.
            engines: [elasticache]
          - text: >-
              Cevap gelen yeni değer oldu (ör. 44). Uygulama "0 veya üstü, satın aldın" dedi; sayfada "You got one" (bir tane
              aldın) ve kalan adet yazdı.
            engines: [elasticache]
      sim:
        kind: kv
        title: "ElastiCache (Valkey) belleği: fırsat anahtarları"
        caption: >-
          Bellekteki fırsat anahtarları, canlı değerleriyle. Sayaç 45 iken bir DECR geldiğini oynatıyoruz; senin denemende
          değer, o anki stoktan bir eksik olur.
        keys:
          - {key: "lm:deal", type: hash, value: "product_id P0001, name Alpen Kablosuz Kulaklık 1, price 2024.3, old_price 3373.84, …", slot: 3299}
          - {key: "lm:deal:stock", type: string, value: "45", slot: 1725}
        commands:
          - cmd: DECR
            key: lm:deal:stock
            returns: "44"
            set: "44"
            say_send: >-
              "Buy one now"a bastın. Tarayıcın "bir tane al" dedi; uygulama ElastiCache'e tek komut gönderiyor: DECR lm:deal:stock.
            say_find: >-
              lm:deal:stock anahtarının yeri hesaplandı (slot 1725). Bu anahtar için komutlar tek tek sırayla çalışır; şu an
              başka hiçbir komut bu sayaca dokunamaz.
            say_back: >-
              Okuma ve yazma tek hamlede: 45 okundu, 44 yazıldı ve 44 cevap olarak döndü. Arada başka bir alıcı giremedi.
        back: >-
          Uygulama cevaba baktı: 44, yani 0 veya üstü - satın aldın. Sonucu tarayıcına gönderdi; sayfada "You got one. 44 pieces
          left" yazacak.
        summary: >-
          Tek komut, tek anahtar. DECR okumayı ve yazmayı tek hamlede yaptığı için aynı anda bin kişi bassa da her biri farklı bir
          sayı alır; sayı 0'ın altına inince parça bitmiştir.
      wire:
        what: >-
          Uygulama, ElastiCache'e açık tuttuğu bağlantılar üzerinden komutu gönderir (redis-py kütüphanesi, cluster istemcisi).
        dst: "dbws-cache-qtkvec.serverless.euc1.cache.amazonaws.com : 6379"
        dst_note: >-
          ElastiCache Serverless'ın adresi. Bu ad, VPC'nin içindeki uç noktaya çözülür; cache internete kapalıdır.
        rows:
          - [Şifreleme, TLS, gerçek, ElastiCache Serverless sadece şifreli bağlantı kabul eder.]
          - [Protokol, RESP (Redis/Valkey protokolü), gerçek, "Her komut kısa bir metin çerçevesidir: komut adı ve parametreleri."]
          - [Kimlik, "ACL kullanıcısı + şifre, bağlantı açılırken", gerçek, "Şifre kodda yazmaz; uygulama onu çalışırken AWS Secrets Manager'dan alır."]
        body_label: Komut ve cevap (okunur hâle getirilmiş)
        body: |-
          DECR lm:deal:stock
            → (integer) 44

          Ağdaki ham hâli (RESP): *2\r\n$4\r\nDECR\r\n$13\r\nlm:deal:stock\r\n   cevap:  :44\r\n
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. "Satın aldın mı?"
        kararını uygulama, ElastiCache'in döndürdüğü sayıya bakarak verir.
      app_code:
        - file: engines/elasticache.py
          func: api_buy
          title: '"Bir tane al" isteği'
          sub: Senin tıklamanla gelen istek.
          lines:
            - {match: '@bp.post("/api/deal/buy")', say: "\"Bir tane al\" isteği buraya gelir.", tag: Tarayıcı → Uygulama}
            - {match: 'left = cmd("DECR"', say: "Tek komut: sayacı bir azalt ve yeni değeri söyle.", tag: [Uygulama → ElastiCache, ElastiCache → Uygulama], hl: key}
            - {match: 'won = left >= 0', say: "Karar uygulamada: yeni değer 0 veya üstüyse satın aldın.", tag: Uygulamanın içinde}
            - {match: 'cmd("INCR"', say: "Değer eksiye düştüyse parça yoktu; sayacı INCR ile geri artırır.", tag: [Uygulama → ElastiCache, ElastiCache → Uygulama]}
            - {match: 'return jsonify(trace.payload({"won": won, "stock": max(left, 0)}))', say: "Sonucu ve kalan adedi (eksiyse 0) tarayıcıya gönderir.", tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek bellekte ne oldu?
        intro: Senin tıklamanla ElastiCache'e giden gerçek komut.
        runs:
          - label: DECR (senin tıklaman)
            trigger: true
            metrics: [[Sonuç, data.won, {set: "Satın aldın ✓", empty: "Tükendi ✗"}], [Kalan adet, data.stock], [Süre, ms]]
        reading: >-
          DECR tek komutta sayacı azalttı ve yeni değeri döndürdü; süre genelde 1–2 milisaniye ve her istekte biraz değişir. Kalan
          adet, sen ve diğer ziyaretçiler aldıkça azalır. "Tükendi" görürsen sayaç sıfıra inmişti; uygulama onu INCR ile geri aldı.
      query:
        title: Sayfa ElastiCache'e ne dedi?
        intro: >-
          Tek bir komut. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: d
            say: Sayacı bir azalt
            code: DECR
            name: Ne yapılsın?
            note: Okuma, bir çıkarma ve yazma; hepsi tek komut. Cevap yeni değerdir.
            hl: key
          - id: k
            say: (lm:deal:stock) ve yeni değeri söyle.
            code: "  lm:deal:stock"
            name: Hangi anahtar?
            note: Fırsatın kalan adedi. Anahtar yoksa DECR onu 0 kabul eder ve -1 yazar; bu yüzden sayaç önceden kurulur.
            hl: key
        columns:
          - label: Bir tane al
            sub: Senin "Buy one now" tıklamanla giden komut.
            via: Uygulama bu komutu redis-py kütüphanesinin decr() metoduyla gönderir; "aldın mı?" kararını cevaba bakarak kendisi verir.
            parts: [d, k]
        note: >-
          Dikkat: komutta "stok sıfırdan büyükse" diye bir koşul yok. DECR her zaman azaltır; eksiye inmeyi fark eden ve geri alan
          uygulamadır. Koşulu da ElastiCache'in içinde yaptırmak istenirse bir Lua betiği kullanılır.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          ElastiCache'in işi yeni değeri verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: ElastiCache → Uygulama
            text: Sayacın yeni değeri tek bir sayı olarak geldi.
          - who: Uygulama
            text: >-
              Sayı 0 veya üstüyse "satın aldın" dedi. Eksi olsaydı parça kalmamıştı; INCR ile sayacı geri alıp "tükendi" derdi.
          - who: Uygulama → Tarayıcın
            text: Sonucu, kalan adedi ve isteğin kaydını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: >-
              "You got one. N pieces left" yazdı ve kalan adedi güncelledi; bir de "fırsat fiyatıyla sepete ekle" butonu çıktı.
          - who: Sonra (DynamoDB)
            text: >-
              O butona basarsan ürün fırsat fiyatıyla sepetine eklenir: bu kez yazma DynamoDB'ye gider. Sipariş verilene kadar
              asıl satış kaydı yoktur.
      remember: >-
        Paylaşılan bir sayacı tek bir atomik komutla (DECR, INCR) değiştir. Okuma ve yazma aynı komutta olunca aynı anda gelen
        alımlar birbirini ezemez; kararı komutun döndürdüğü yeni değere göre ver.
      why_db: >-
        Neden ElastiCache? Fırsat sayacı çok sık ve aynı anda değişen küçük bir değer. ElastiCache onu bellekte tutar, atomik
        DECR'i milisaniyenin altında çalıştırır. Bedeli: sayaç asıl kayıt değildir; satışın kendisi veritabanına yazılır.

  - page: deals
    path: /deals
    engines: [elasticache]
    use_case: Yarış durumu
    title: Güvensiz yolu seç
    why: >-
      Fırsat ürününün stoğu ElastiCache'te bellekte duran bir sayaç. "Önce oku, sonra yaz" yolunda her alıcı önce stoğu
      okur, sonra bir eksiğini yazar. Aynı anda iki alıcı aynı değeri okuyabilir.
    do: Aydınlık "Read, then write" (önce oku, sonra yaz) butonuna tıkla.
    target: "#exp-mode [data-value=naive]"
    action: click
    wait: {click: true}

  - page: deals
    path: /deals
    engines: [elasticache]
    use_case: Yarış durumu
    title: İzdihamı başlat
    why: >-
      Şimdi 300 alıcı aynı anda 10 parçalık stoğu almaya çalışacak. Bu bir yarış: herkes aynı sayaca aynı anda
      koşuyor. Kazananı belirleyen şey, sayacın nasıl azaltıldığı.
    do: Aydınlık "Start the rush" (izdihamı başlat) butonuna tıkla.
    target: "#sim-run"
    action: click
    wait: {method: POST, path: /elasticache/api/deal/simulate, body: {mode: naive}, any: true}
    focus: "#sim-out"
    panel:
      need: >-
        Fırsat ürününün stoğu sınırlı ve çok kişi aynı anda almak istiyor. Stoktan fazla satılmaması gerekiyor: 10 parça
        varsa tam 10 kişi almalı. Sorun şu: "stoğu oku, 0'dan büyükse bir eksiğini yaz" iki ayrı adım ve iki adımın
        arasında başka alıcılar da okuyabiliyor.
      concept:
        term: Yarış durumu (race condition) ve atomik işlem
        text: >-
          Bir dükkânda tek bir ürün kalmış ve iki satıcı aynı anda rafa bakıp "bir tane var" diyor. İkisi de ürünü
          satıyor ama rafta sadece bir tane var. Buna yarış durumu denir. Çözüm, bakmak ve almak işini tek hamlede yapmak:
          buna atomik işlem denir. ElastiCache'in (Valkey) DECR komutu sayacı tek hamlede azaltır ve yeni değeri söyler.
          Valkey komutları tek tek sırayla çalıştırdığı için iki DECR asla aynı değeri göremez.
        terms:
          - [GET / SET, "GET sayacı okur, SET sayaca bir değer yazar. İki ayrı komut."]
          - [DECR, "Sayacı 1 azaltır ve yeni değeri döndürür. Okuma ve yazma tek komut."]
          - [ElastiCache (Valkey), "Veriyi bellekte tutan, mikrosaniyeler içinde cevap veren anahtar-değer veritabanı."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde fırsat stoğu için hazırlık
        intro: >-
          İzdiham başlamadan önce, kampanya için bellekte bir sayaç ve bir fırsat kartı hazırlanır. Aşağıdaki beş adım bu
          hazırlığın sırasıdır.
        text:
          - title: Önce sayfanın soruları yazılır
            text: >-
              Fırsat sayfasının iki işi var: "kaç parça kaldı?" (çok sık okunur) ve "bir tane al" (çok sayıda kişi aynı anda,
              aynı değere yazar). İkisi de tek bir anahtar üzerinde, bellekte, milisaniyenin altında cevaplanmalıdır.
            code: |-
              GET  lm:deal:stock    → kaç parça kaldı
              DECR lm:deal:stock    → bir tane al, yeni değeri söyle
          - title: Kampanya başlamadan sayaç kurulur
            text: >-
              Fırsat kartı (ürün no, ad, indirimli fiyat) katalogdan kopyalanıp bir hash olarak, kalan adet de asıl stok
              kaydından alınıp bir tamsayı olarak belleğe yazılır. Satış sırasında katalog ya da stok veritabanı sorulmaz.
            code: |-
              HSET lm:deal product_id P0021 name "Akıllı Saat" price 1199.94
              SET  lm:deal:stock 50
          - title: Paylaşılan değer tek bir atomik komutla değişir
            text: >-
              "Önce oku, sonra yaz" yapılmaz. DECR sayacı tek hamlede azaltır; sonuç eksiye düşerse parça kalmamıştır ve INCR
              ile geri verilir. Birden fazla şey birlikte kontrol edilecekse (ör. stok ve "kişi başı en fazla 1") hepsi tek bir
              Lua betiğinde, yine tek hamlede çalışır.
            code: |-
              EVAL "if tonumber(redis.call('GET', KEYS[1])) > 0 then return redis.call('DECR', KEYS[1]) else return -1 end" 1 lm:deal:stock
          - title: Sayaç kapıdaki ilk elemedir
            text: >-
              Asıl satış kaydı (sipariş, ödeme) ilişkisel bir veritabanına transaction ile yazılır. Ödeme başarısız olursa sayaç
              INCR ile geri artırılır. Satış bitince satılan adetler siparişlerle karşılaştırılır; sayaç kaybolursa asıl
              kayıttan yeniden kurulur.
          - title: Tek anahtar tek bir parçadadır
            text: >-
              ElastiCache yüke göre büyür ve anahtarları parçalara (shard) dağıtır, ama tek bir sayaç her zaman tek bir
              parçadadır. Çok büyük kampanyalarda stok birkaç anahtara bölünür (ör. lm:deal:stock:1 … :4) ve alıcılar bu
              anahtarlara dağıtılır.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Satış başlarken sayacı asıl stok kaydından kuran bir iş; satış sırasında her alıcının isteğiyle uygulama (DECR).
        reads: Uygulama, fırsat sayfasındaki "kalan adet" için.
        kind: >-
          Uygulama orkestrasyonu. ElastiCache başka bir veritabanından kendiliğinden veri çekmez; içine ne yazılırsa onu
          tutar.
        with: >-
          Fırsat sayfası ElastiCache'in yanında başka veritabanlarına dayanır: fırsat kartındaki ürün adı ve fiyat kampanya
          başlarken katalogdan (DocumentDB) kopyalanır; görsel nesne deposundan (S3, büyük sistemlerde bir CDN ile) gelir;
          satın almanın asıl kaydı sipariş veritabanına (Aurora) yazılır.
        best: >-
          Asıl gerçek her zaman veritabanındadır. Satış bitince satılan adetler veritabanındaki siparişlerle karşılaştırılır.
          Sayaç kaybolursa (ör. bir bakım sırasında) asıl kayıttan yeniden kurulur.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Mağazada bir müşteri olarak geziyorsun. Şifreyle giriş yok: tarayıcın lm_visitor çereziyle tanınıyor. Bu
              kimlik, birazdan kurulacak geçici sayacın adında da kullanılacak (lm:sim:<kimlik>).
          - text: >-
              "Deals" (fırsatlar) sayfasını açtın. Oturumun güncellendi; fırsat kartı da bellekten geldi: ürün no, ad ve
              indirimli fiyat bir hash'ten (lm:deal), kalan adet bir sayaçtan (lm:deal:stock). Ürün görseli S3'ten geldi.
            engines: [elasticache, s3]
          - text: >-
              Bir önceki adımda "Read, then write" (önce oku, sonra yaz) yolunu seçtin. Bu sadece sayfadaki bir seçim; henüz
              hiçbir istek gitmedi.
          - text: >-
              "Start the rush" (izdihamı başlat) butonuna bastın. Tarayıcın uygulamaya "300 alıcı, 10 parça, önce oku sonra
              yaz" dedi. Uygulama gerçek fırsat stoğuna dokunmadan bu deneme için geçici bir sayaç kurdu ve 300 alıcıyı aynı
              anda koşturdu; her alıcı ElastiCache'e önce GET, sonra SET gönderdi. Simülasyonun sol şeridi bu tur.
            engines: [elasticache]
          - text: >-
              Aynı istekte uygulama sayacı yeniden 10'a kurdu ve aynı 300 alıcıyı bu kez DECR ile koşturdu (sağ şerit). Sonra
              geçici sayacı sildi ve iki turun sonucunu gönderdi; sayfada sonuç kutusu çizildi. Bu deneme saatte en fazla 3 kez
              yapılabilir.
            engines: [elasticache]
      sim:
        kind: race
        caption: >-
          Küçük bir örnek: 3 parçalık stok ve 6 alıcı. Gerçek denemede 300 alıcı ve 10 parça var; burada her adımı
          görebilmen için sayılar küçük. Alıcılar ikişer ikişer neredeyse aynı anda geliyor. İki şerit, senin tek bir
          gerçek isteğinin içindeki iki tur: önce senin seçtiğin "önce oku, sonra yaz" yolu, hemen ardından aynı alıcı ve
          stokla atomik DECR. Üstteki etiketler o anda işi kimin yaptığını gösterir: uygulama mı, ElastiCache mi.
        key: lm:sim
        stock: 3
        buyers: [Ayşe, Mert, Elif, Lukas, Zeynep, Can]
        tick_ms: 1100
        send: >-
          "Start the rush" butonuna bastın. Uygulama bu deneme için geçici bir sayaç kurdu ve 6 alıcıyı aynı anda başlatıyor;
          her alıcı ElastiCache'e kendi komutlarını gönderecek.
        back: >-
          Uygulama kazananları saydı, fazla satışı hesapladı, geçici sayacı sildi ve sonucu tarayıcına gönderdi; sayfada sonuç
          kutusu çizilecek.
        labels: {naive: 't0 · 1. tur · Senin seçtiğin · "Önce oku, sonra yaz"', atomic: "t0 · 2. tur · Aynı istekte · Atomik DECR"}
      wire:
        what: >-
          Uygulama, ElastiCache'e açık tuttuğu bağlantılar üzerinden komutları gönderir (redis-py kütüphanesi, cluster
          istemcisi). 300 alıcı 48 iş parçacığına bölünür; komutlar aynı anda yola çıkar.
        dst: "dbws-cache-qtkvec.serverless.euc1.cache.amazonaws.com : 6379"
        dst_note: >-
          ElastiCache Serverless'ın adresi. Bu ad, VPC'nin içindeki uç noktaya çözülür; cache internete kapalıdır.
        rows:
          - [Şifreleme, TLS, gerçek, ElastiCache Serverless sadece şifreli bağlantı kabul eder.]
          - [Protokol, RESP (Redis/Valkey protokolü), gerçek, "Her komut kısa bir metin çerçevesidir: komut adı ve parametreleri. HTTP değil."]
          - [Kimlik, "ACL kullanıcısı + şifre, bağlantı açılırken", gerçek, "Şifre kodda yazmaz; uygulama onu çalışırken AWS Secrets Manager'dan alır."]
        body_label: Bir alıcının komutları (okunur hâle getirilmiş; sağda cevap)
        body: |-
          "Önce oku, sonra yaz":
            GET lm:sim:7f3a…               → "10"
            (uygulama işi 1–4 ms)
            SET lm:sim:7f3a… 9 EX 600      → OK

          Atomik:
            DECR lm:sim:7f3a…              → 9

          Ağdaki ham hâli (RESP): *2\r\n$4\r\nDECR\r\n$43\r\nlm:sim:7f3a…\r\n
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Her satırın
        etiketi işin nerede olduğunu söyler: mor etiketli satırda bir şey bir yerden bir yere gider (tarayıcıdan uygulamaya,
        uygulamadan ElastiCache'e ya da geri). Gri "Uygulamanın içinde" etiketli satırda iş uygulamanın kendi içinde
        yapılır, hiçbir yere bir şey gitmez. Yarışın olduğu yer, iki mor satırın arasındaki gri satırlar.
      app_code:
        - file: engines/elasticache.py
          func: api_simulate
          title: '"İzdihamı başlat" isteği'
          sub: Senin tıklamanla gelen istek; iki tur da bu kodda.
          lines:
            - {match: '@bp.post("/api/deal/simulate")', say: "\"İzdihamı başlat\" isteği buraya gelir: seçtiğin yol, alıcı sayısı ve stok.", tag: Tarayıcı → Uygulama}
            - {match: 'r().set(key, stock, ex=600)', say: "Bu deneme için geçici bir sayaç kurulur: stok 10; 10 dakika sonra kendiliğinden silinir.", tag: [Uygulama → ElastiCache, ElastiCache → Uygulama], hl: counter}
            - {match: 'won = r().decr(key) >= 0', say: "Atomik yol: tek komut. ElastiCache azaltır ve yeni değeri döner; 0 veya üstüyse satın aldı.", tag: [Uygulama → ElastiCache, ElastiCache → Uygulama], hl: decr}
            - {match: 'current = int(r().get(key))', say: "\"Önce oku\": sayacın değeri istenir.", tag: [Uygulama → ElastiCache, ElastiCache → Uygulama], hl: get}
            - {match: 'time.sleep(random.uniform(0.001, 0.004))', say: "Uygulama işi (ödeme kontrolü gibi) 1–4 ms sürer. Yarış tam bu aralıkta olur.", tag: Uygulamanın içinde, hl: naive}
            - {match: 'won = current > 0', say: "Karar uygulamada verilir: okunan değer 0'dan büyükse \"satın aldı\".", tag: Uygulamanın içinde, hl: naive}
            - {match: 'r().set(key, current - 1, ex=600)', say: "\"Sonra yaz\": okunan değerin bir eksiği yazılır. Arada başkası yazdıysa onunki ezilir.", tag: [Uygulama → ElastiCache, ElastiCache → Uygulama], hl: set}
            - {match: 'return jsonify(trace.payload({"mode": mode', say: "İki turun sonuçları tek bir cevapta tarayıcıya gider.", tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek izdihamda ne oldu?
        intro: >-
          Senin başlattığın gerçek deneme iki tur çalıştı: önce "önce oku, sonra yaz" yoluyla, hemen ardından aynı alıcı
          ve stok sayısıyla atomik DECR ile. İki tur da ElastiCache'te geçici bir sayaçla çalışır, gerçek stoğa dokunmaz.
        runs:
          - label: '"Önce oku, sonra yaz" (senin denemen)'
            trigger: true
            metrics: [[Alıcı, data.buyers], [Stok, data.stock], [Satılan, data.winners], [Fazla satış, data.oversold], ["Süre (p50, ms)", data.p50_ms]]
          - label: Atomik DECR (aynı denemede)
            trigger: true
            metrics: [[Alıcı, data.buyers], [Stok, data.stock], [Satılan, data.atomic.winners], [Fazla satış, data.atomic.oversold], ["Süre (p50, ms)", data.atomic.p50_ms]]
        reading: >-
          Atomik DECR tam stok kadar sattı ve fazla satış 0. "Önce oku, sonra yaz" yolunda alıcılar okuma ile yazma
          arasında birbirinin değerini ezdi ve stoktan fazla satıldı; fazla satış sayısı her denemede değişir, çünkü kimin
          ne zaman araya girdiği şansa bağlı. Süre (p50), alıcıların yarısının bu süreden kısa sürede cevap aldığı süredir
          (milisaniye). Güvensiz yol okuma ile yazma arasında uygulama işi yaptığı için daha yavaştır.
      query:
        title: Uygulama ElastiCache'e ne dedi?
        intro: >-
          Simülasyondaki iki tarafın komutları. Solda her alıcının gönderdiği iki ayrı komut, sağda tek komut. Bir
          parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: get
            say: Sayacı oku,
            code: v = GET lm:sim
            name: 1. komut
            note: Sayacın o anki değerini oku. Bu cevap yola çıktığı an eskimeye başlar; başka alıcılar sayacı değiştirebilir.
            hl: get
          - id: work
            say: biraz iş yap,
            code: "# ... uygulama işi (1–4 ms)"
            name: Arada
            note: >-
              Gerçek bir uygulama okuma ile yazma arasında iş yapar (ödeme kontrolü gibi). Denemede bu 1–4 ms'lik bir
              bekleme. Yarış tam bu aralıkta olur.
            hl: naive
          - id: set
            say: 0'dan büyükse bir eksiğini yaz.
            code: "if v > 0: SET lm:sim v-1"
            name: 2. komut
            note: >-
              Okunan değerin bir eksiğini yaz. Bu arada başka bir alıcı da aynı v'yi okuduysa, ikisi de aynı değeri yazar:
              iki satış olur, sayaç bir azalır.
            hl: set
          - id: decr
            say: Sayacı tek hamlede bir azalt ve yeni değeri söyle; sonuç 0 veya üstüyse satın aldın.
            code: "DECR lm:sim   → sonuç >= 0 ise kazandın"
            name: Tek komut
            note: >-
              DECR okuma ve yazmayı tek komutta yapar. Valkey komutları sırayla çalıştırır, bu yüzden her alıcı farklı bir
              sonuç görür: 2, 1, 0, sonra −1, −2... Eksi sonuç "parça kalmadı" demek.
            hl: decr
        columns:
          - label: '"Önce oku, sonra yaz"'
            sub: Senin "Read, then write" seçip "Start the rush" tıklamanla giden komutlar (her alıcı için).
            via: >-
              Uygulama bu komutları redis-py kütüphanesinin get() ve set() metotlarıyla gönderir. "0'dan büyükse" kararı
              iki komutun arasında, uygulamada verilir.
            parts: [get, work, set]
          - label: Atomik DECR
            sub: '"Atomic DECR" seçiliyken giden komut (her alıcı için).'
            via: Uygulama bu komutu redis-py'nin decr() metoduyla gönderir; karar için ElastiCache'in döndüğü sayıya bakar.
            parts: [decr]
        note: >-
          Dikkat: soldaki iki komut tek tek doğru çalışıyor; hata komutlarda değil, aralarındaki boşlukta. ElastiCache
          her komutu doğru yaptı, ama iki komutun arasında başka alıcıların komutları da çalıştı. Sağdaki tek komutta
          böyle bir boşluk yok.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          ElastiCache her komuta ayrı ayrı cevap verdi. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: ElastiCache → Uygulama
            text: >-
              Her alıcının komutuna tek tek cevap geldi: GET sayacın değerini, SET "OK", DECR sayacın yeni değerini döndü.
          - who: Uygulama
            text: >-
              Kazananları saydı, fazla satışı (satılan − stok) ve süreleri (p50, p95) hesapladı. Aynı istekte atomik turu da
              çalıştırdı ve sonunda geçici sayacı sildi.
          - who: Uygulama → Tarayıcın
            text: İki turun sonuçlarını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: Sonuç kutusunu çizdi; Perde arkası iki turu yan yana gösteriyor.
          - who: Sonra
            text: >-
              Gerçek fırsat stoğu bu denemeden etkilenmedi; deneme ayrı, geçici bir sayaçla çalıştı.
      remember: >-
        Bir değeri okuyup ona göre yazıyorsan, araya başkası girebilir. Sayaç gibi paylaşılan bir değeri tek bir atomik
        komutla (DECR, INCR) değiştir; okuma ile yazma arasında boşluk bırakma.
      why_db: >-
        Neden ElastiCache? Fırsat stoğu çok sayıda kişinin aynı anda okuduğu ve değiştirdiği küçük bir değer. ElastiCache
        bunu bellekte tutar, mikrosaniyeler içinde cevap verir ve DECR gibi atomik komutları hazır sunar. Bedeli: veri
        bellekte durur; kalıcı kayıt (siparişin kendisi) Aurora gibi bir veritabanına yazılır.

  - page: deals
    path: /deals
    engines: [elasticache]
    use_case: Süreli oturum (TTL)
    title: Oturumu kısa ömürlü yap
    why: >-
      Fırsatlar sayfasının altında "Your session" (oturumun) bölümü var. Oturumun bellekte belli bir süre yaşıyor. Önce bu
      süreyi seçeceksin.
    do: Aydınlık "TTL" listesinden "30 seconds" (30 saniye) seç.
    target: "#ttl"
    action: change
    wait: {change: true}

  - page: deals
    path: /deals
    engines: [elasticache]
    use_case: Süreli oturum (TTL)
    title: Oturumu süresiyle birlikte yaz
    why: >-
      Süreyi seçtin. Şimdi oturumunu bu süreyle yeniden yazdıracaksın ve sürenin her okumada nasıl azaldığına bakacaksın.
    do: Aydınlık "Refresh the session" (oturumu yenile) butonuna tıkla.
    target: "#ttl-set"
    action: click
    wait: {method: POST, path: /elasticache/api/session, body: {ttl: "*"}}
    focus: "#session"
    result: HSET wrote the fields, and EXPIRE set the TTL.
    panel:
      need: >-
        Mağaza her ziyaretçinin kim olduğunu ve en son nerede olduğunu kısa süreliğine hatırlamalı. Ziyaretçi gidince bu bilgi
        kendiliğinden silinmeli; binlerce eski oturumu temizlemek için ayrı bir program çalıştırmak hem iş hem risk olur. Bir de
        "şu an kaç kişi aktif?" sorusu anında cevaplanmalı.
      concept:
        term: TTL (yaşam süresi) ve bellekteki oturum
        text: >-
          Bir anahtara TTL verirsen ElastiCache onu o kadar saniye sonra kendisi siler. Kütüphaneden ödünç alınan bir kitabın
          iade tarihi gibi: tarih gelince kitap rafa döner, kimse hatırlatmak zorunda kalmaz. Oturum bir hash olarak yazılır
          (persona, son sayfa, zaman); her sayfa açılışında yeniden yazılıp süresi baştan başlatılır. Ziyaretçi gelmeyi
          bırakınca süre biter ve oturum kaybolur.
        terms:
          - [TTL, "Bir anahtarın kalan ömrü (saniye). Sıfır olunca anahtar silinir."]
          - [HSET, "Bir hash'in alanlarını yazar: persona, last_page, seen_at."]
          - [EXPIRE, "Bir anahtara saniye cinsinden yaşam süresi verir."]
          - [Sorted set (ZADD), "Her üyesinin bir puanı olan, puana göre sıralı küme. Burada üye ziyaretçi, puan son görülme zamanı."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde oturum deposu için hazırlık
        intro: >-
          Oturum ilk kez yazılmadan, nerede ve ne kadar süre tutulacağı belirlenir. Aşağıdaki beş adım bu hazırlığın sırasıdır.
        text:
          - title: Önce oturumun soruları yazılır
            text: >-
              Her istekte "bu ziyaretçi kim, hangi persona, en son nerede?" sorulur; ayrıca "son 5 dakikada kaç kişi aktif?".
              Birincisi tek bir anahtarla, ikincisi zamana göre sıralı bir kümeyle cevaplanır.
            code: |-
              HGETALL lm:session:<ziyaretçi>                         → oturum
              ZCOUNT  lm:active <şimdi − 300> +inf                     → son 5 dakikada aktif olanlar
          - title: Oturum uygulama sunucusunda değil, ortak bir yerde tutulur
            text: >-
              Ziyaretçinin istekleri farklı uygulama sunucularına düşebilir. Oturum sunucunun belleğinde tutulursa diğer sunucu
              onu bilmez; bu yüzden hepsinin eriştiği ortak bir bellek deposuna (ElastiCache) yazılır.
          - title: Süre yazmayla birlikte verilir
            text: >-
              Her yazmada süre yeniden başlatılır; böylece aktif ziyaretçinin oturumu yaşar, gidenin oturumu kendiliğinden düşer.
              Yazma ve süre tek bir transaction'da (MULTI) ya da tek komutta gönderilirse arada süresiz bir anahtar kalmaz.
            code: |-
              MULTI
                HSET   lm:session:<ziyaretçi> persona C00001 last_page /deals seen_at 1793395000
                EXPIRE lm:session:<ziyaretçi> 1800
              EXEC
          - title: Bellek dolarsa ne olacağı bilinir
            text: >-
              Süresi dolan anahtarlar silinir; ama bellek dolarsa ElastiCache tahliye (eviction) kuralına göre başka anahtarları
              da silebilir. Oturum kaybı kabul edilebilir bir veri olduğu için bu sorun değildir; kalıcı olması gereken veri burada
              tutulmaz.
          - title: Aktiflik kümesi de temizlenir
            text: >-
              Sorted set'in üyelerinin ayrı ayrı süresi yoktur. "Aktif ziyaretçiler" kümesinden eski üyeler düzenli olarak puana
              göre silinir; aksi hâlde küme sonsuz büyür.
            code: |-
              ZREMRANGEBYSCORE lm:active -inf <şimdi − 3600>
      feed:
        title: Veri nereden geliyor?
        writes: Uygulama, her sayfa açılışında arka planda (ve bu adımda senin butonunla).
        reads: Uygulama, oturum bilgisi gereken her istekte; ayrıca canlı ekranlardaki "aktif ziyaretçi" sayısı için.
        kind: >-
          Uygulama orkestrasyonu. ElastiCache başka bir veritabanından kendiliğinden veri çekmez; oturumu uygulama yazar ve okur.
        with: >-
          Oturum, ziyaretçinin kimliğini (lm_visitor çerezi) diğer veritabanlarıyla paylaşır: aynı kimlik DynamoDB'de sepetin
          anahtarı, Keyspaces'te olay geçmişinin partition'ıdır. Oturum kısa ömürlü bir kopya; kalıcı kayıtlar o veritabanlarında.
        best: >-
          Oturum ve önbellek gibi kaybı kabul edilebilir, sık okunan ve süreli veri bellekte, TTL ile tutulur. Kaybı kabul
          edilemeyen veri (sipariş, ödeme) kalıcı bir veritabanına yazılır.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Fırsatlar sayfasını açtığında, her sayfada olduğu gibi oturumun arka planda 30 dakikalık süreyle yeniden yazıldı.
            engines: [elasticache]
          - text: >-
              Bir önceki adımda TTL listesinden "30 seconds"u seçtin. Bu sadece sayfadaki bir seçimdi; istek gitmedi.
          - text: >-
              "Refresh the session" butonuna bastın. Tarayıcın uygulamaya "oturumumu 30 saniyelik süreyle yaz" dedi; uygulama
              ElastiCache'e üç komut gönderdi: HSET (alanlar), EXPIRE (süre), ZADD (aktif ziyaretçiler kümesi). Simülasyon bu
              komutları gösteriyor.
            engines: [elasticache]
          - text: >-
              Hemen ardından sayfa oturumu okudu (HGETALL ve TTL); kutuda oturumun alanları ve kalan süre (30 civarı) göründü.
              "Read the session" butonuna her basışında süre azalır; 30 saniye sonra oturum silinmiş olur.
            engines: [elasticache]
      sim:
        kind: kv
        title: "ElastiCache (Valkey) belleği: oturum anahtarları"
        caption: >-
          Oturumla ilgili iki anahtar (kimlik kısaltıldı). Önce yazma isteğinin üç komutu, sonra okuma isteğinin iki komutu
          oynuyor. Değerler senin denemenle aynı biçimde.
        keys:
          - {key: "lm:session:7f3a…", type: hash, value: "persona C00001, last_page /deals, seen_at … (TTL 1800 sn)", slot: "…"}
          - {key: "lm:active", type: sorted set, value: "7f3a… → 1793394900, c41e… → 1793394600, …", slot: 542}
        commands:
          - cmd: HSET
            key: "lm:session:7f3a…"
            returns: "0 (alanlar güncellendi)"
            set: "persona C00001, last_page /deals, seen_at 1793395000 (TTL 1800 sn)"
            say_send: '"Refresh the session"a bastın. Uygulama ilk komutu gönderiyor: HSET, oturumun alanlarını yaz.'
          - cmd: EXPIRE
            key: "lm:session:7f3a…"
            returns: "1 (süre verildi)"
            set: "persona C00001, last_page /deals, seen_at 1793395000 (TTL 30 sn)"
            say_send: "Uygulama ikinci komutu gönderiyor: EXPIRE … 30, yani bu anahtar 30 saniye sonra silinsin."
            say_back: Anahtarın süresi 30 saniyeye ayarlandı; ElastiCache onu zamanı gelince kendisi silecek.
          - cmd: ZADD
            key: lm:active
            returns: "0 (üyenin puanı güncellendi)"
            set: "7f3a… → 1793395000, c41e… → 1793394600, …"
            say_send: "Üçüncü komut: ZADD lm:active <şimdi> <ziyaretçi>; aktif ziyaretçiler kümesinde senin zamanın güncellenir."
          - cmd: TTL
            key: "lm:session:7f3a…"
            returns: "30"
            say_send: "Sayfa hemen ardından oturumu okuyor; uygulama HGETALL ve TTL gönderiyor (simülasyonda TTL'yi gösteriyoruz)."
            say_back: "Kalan süre: 30 saniye. Her okumada azalır; sıfıra inince anahtar yok olur."
        back: >-
          Uygulama sonuçları tarayıcına gönderdi; kutuda oturumun alanları ve kalan süre görünecek.
        summary: >-
          Yazma, süre ve aktiflik üç ayrı komutla gitti; silme için hiçbir komut gönderilmeyecek. 30 saniye sonra ElastiCache
          oturumu kendisi silecek.
      wire:
        what: >-
          Uygulama, ElastiCache'e açık tuttuğu bağlantılar üzerinden komutları gönderir (redis-py kütüphanesi, cluster istemcisi).
        dst: "dbws-cache-qtkvec.serverless.euc1.cache.amazonaws.com : 6379"
        dst_note: >-
          ElastiCache Serverless'ın adresi. Bu ad, VPC'nin içindeki uç noktaya çözülür; cache internete kapalıdır.
        rows:
          - [Şifreleme, TLS, gerçek, ElastiCache Serverless sadece şifreli bağlantı kabul eder.]
          - [Protokol, RESP (Redis/Valkey protokolü), gerçek, "Her komut kısa bir metin çerçevesidir; üç komut art arda gider."]
          - [Kimlik, "ACL kullanıcısı + şifre, bağlantı açılırken", gerçek, "Şifre kodda yazmaz; uygulama onu çalışırken AWS Secrets Manager'dan alır."]
        body_label: Komutlar ve cevaplar (okunur hâle getirilmiş)
        body: |-
          HSET   lm:session:7f3a… persona C00001 last_page /deals seen_at 1793395000   → (integer) 0
          EXPIRE lm:session:7f3a… 30                                                   → (integer) 1
          ZADD   lm:active 1793395000 7f3a…                                            → (integer) 0
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Süreyi seçmek ve
        sınırlamak uygulamanın işi; silmek ElastiCache'in.
      app_code:
        - file: engines/elasticache.py
          func: api_session
          title: '"Oturumu yenile" isteği'
          sub: Senin tıklamanla gelen istek; her sayfa açılışında da arka planda aynı istek gider.
          lines:
            - {match: '@bp.post("/api/session")', say: "Oturum yazma isteği buraya gelir; adres süreyi (ttl) taşır.", tag: Tarayıcı → Uygulama}
            - {match: 'ttl = max(10, min(int(body.get("ttl", 1800)), 86400))', say: "Süreyi 10 saniye ile 1 gün arasında tutar; verilmezse 30 dakika.", tag: Uygulamanın içinde}
            - {match: 'key = f"lm:session:{visitor_id()}"', say: "Anahtar adını kurar: lm:session: + bu tarayıcının kimliği.", tag: Uygulamanın içinde, hl: key}
            - {match: 'cmd("HSET"', say: "Birinci komut: oturumun alanlarını yazar (persona, son sayfa, zaman).", tag: [Uygulama → ElastiCache, ElastiCache → Uygulama], hl: key}
            - {match: 'cmd("EXPIRE"', say: "İkinci komut: anahtara yaşam süresi verir.", tag: [Uygulama → ElastiCache, ElastiCache → Uygulama], hl: key}
            - {match: 'cmd("ZADD"', say: "Üçüncü komut: aktif ziyaretçiler kümesinde senin zamanını günceller.", tag: [Uygulama → ElastiCache, ElastiCache → Uygulama], hl: key}
            - {match: 'return jsonify(trace.payload({"ttl": ttl}))', say: Verilen süreyi tarayıcıya söyler., tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek bellekte ne oldu?
        intro: >-
          Senin tıklamanla giden yazma isteği: üç komut ve her birinin süresi.
        runs:
          - label: Yazma (senin tıklaman)
            trigger: true
            metrics: [[HSET, ms], [EXPIRE, e1.ms], [ZADD, e2.ms], [Verilen süre (sn), data.ttl]]
        reading: >-
          Her komut yaklaşık bir milisaniye sürdü; süreler her istekte biraz değişir. Mağaza sekmesindeki kutuda kalan süre
          verdiğin süreye çok yakındır; "Read the session"a sonra basarsan azaldığını görürsün. Süre bitince HGETALL boş döner ve TTL -2 olur
          (anahtar yok).
      query:
        title: Sayfa ElastiCache'e ne dedi?
        intro: >-
          İki sütun: senin tıklamanla giden yazma komutları ve hemen ardından giden okuma komutları.
        cards_title: Parça parça
        parts:
          - id: hs
            say: Bu tarayıcının oturumuna persona, son sayfa ve zamanı yaz,
            code: "HSET lm:session:7f3a… persona C00001 last_page /deals seen_at 1793395000"
            name: Ne yazılsın?
            note: Hash'in alanları. Anahtar yoksa oluşur; varsa alanlar güncellenir.
            hl: key
          - id: ex
            say: bu oturum 30 saniye sonra silinsin,
            code: "EXPIRE lm:session:7f3a… 30"
            name: Ne kadar yaşasın?
            note: Saniye cinsinden süre. Her yeni EXPIRE süreyi baştan başlatır.
            hl: key
          - id: za
            say: ve aktif ziyaretçiler kümesinde zamanımı güncelle.
            code: "ZADD lm:active 1793395000 7f3a…"
            name: Kim aktif?
            note: Puan son görülme zamanı (saniye). "Son 5 dakikada kaç kişi?" sorusu bu kümeden puan aralığıyla cevaplanır.
            hl: key
          - id: hg
            say: Oturumun bütün alanlarını
            code: "HGETALL lm:session:7f3a…"
            name: Ne okunsun?
            note: Hash'in bütün alanları. Süre bittiyse boş döner.
            hl: key
          - id: tt
            say: ve kalan süresini getir.
            code: "TTL lm:session:7f3a…"
            name: Ne kadar kaldı?
            note: Kalan saniye. -1 "süresiz", -2 "böyle bir anahtar yok" demek.
            hl: key
        columns:
          - label: Yaz (senin tıklaman)
            sub: '"Refresh the session" ile giden komutlar.'
            via: Uygulama bu komutları redis-py kütüphanesinin hset(), expire() ve zadd() metotlarıyla, art arda gönderir.
            parts: [hs, ex, za]
          - label: Oku (hemen ardından)
            sub: Sayfanın kendiliğinden gönderdiği okuma.
            via: Uygulama bu komutları redis-py'nin hgetall() ve ttl() metotlarıyla gönderir.
            parts: [hg, tt]
        note: >-
          Dikkat: hiçbir yerde "sil" komutu yok. Silme işini EXPIRE'ın verdiği süre yapar; ElastiCache zamanı gelince anahtarı
          kendisi kaldırır.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          ElastiCache'in işi cevapları verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: ElastiCache → Uygulama
            text: Üç komutun her birine kısa bir sayı cevabı geldi (kaç alan eklendi, süre verildi mi, üye eklendi mi).
          - who: Uygulama → Tarayıcın
            text: Verilen süreyi gönderdi.
          - who: Tarayıcın → Uygulama → ElastiCache
            text: Sayfa hemen oturumu okumak için ikinci bir istek gönderdi; uygulama HGETALL ve TTL ile okudu.
          - who: Tarayıcın
            text: Oturumun alanlarını ve kalan süreyi kutuya yazdı.
          - who: Sonra
            text: >-
              30 saniye sonra oturum anahtarı ElastiCache tarafından silinir. Ama başka bir sayfa açarsan oturum yeniden 30
              dakikalık süreyle yazılır.
      remember: >-
        Kısa ömürlü veriyi bellekte bir süreyle (TTL) yaz; silme işini veritabanı kendisi yapar. Her yazmada süre baştan başlar,
        böylece aktif olan yaşar, giden kendiliğinden düşer.
      why_db: >-
        Neden ElastiCache? Oturum her istekte okunan, küçük, süreli ve kaybı kabul edilebilir bir veri. ElastiCache onu bellekte,
        bütün uygulama sunucularının ortak eriştiği bir yerde tutar ve süresi bitince kendisi siler. Bedeli: bellek kalıcı
        değildir; kalıcı olması gereken veri burada tutulmaz.

  # ---------------------------------------------------------------- Checkout: Aurora and the fan-out
  - page: checkout
    path: /checkout
    engines: [aurora]
    use_case: Transaction ve geri alma
    title: Ödemeyi başarısız yap
    why: >-
      Ödeme sayfasındasın; sepetindeki ürünler ve toplam tutar listelendi. Önce, ödemenin yarıda başarısız olacağı bir deneme
      hazırlayacaksın.
    do: Aydınlık "Make the payment fail" (ödemeyi başarısız yap) kutusunu işaretle.
    target: "#exp-fail"
    action: click
    wait: {click: true}

  - page: checkout
    path: /checkout
    engines: [aurora]
    use_case: Transaction ve geri alma
    title: Siparişi ver ve geri alınışını izle
    why: >-
      Kutu işaretli: ödeme, stok düşüldükten hemen sonra başarısız olacak. Şimdi siparişi verip veritabanının yarım kalan işi
      nasıl topladığına bakacaksın.
    do: Aydınlık "Place the order" (siparişi ver) butonuna tıkla.
    target: "#place"
    action: click
    wait: {method: POST, path: /aurora/api/orders, body: {fail_after_stock: "true"}}
    focus: "#flow"
    result: BEGIN, the stock UPDATE, then ROLLBACK. No order row exists and the stock is back.
    panel:
      need: >-
        Bir sipariş birkaç yazmadan oluşur: stoğu düşür, sipariş satırını yaz, sipariş kalemlerini yaz. Bunların yarısı yapılıp
        yarısı yapılamazsa (ör. ödeme stok düştükten sonra başarısız olursa) stok eksilir ama sipariş olmaz; mağaza olmayan bir
        satışı stoktan düşmüş olur. Ya hepsi olmalı ya hiçbiri.
      concept:
        term: Transaction, COMMIT ve ROLLBACK
        text: >-
          Transaction, birden fazla komutu tek bir iş gibi çalıştırır. BEGIN ile başlar; aradaki değişiklikleri sadece bu
          transaction görür. COMMIT hepsini birden kalıcı yapar; ROLLBACK hepsini birden geri alır. Bir kasada alışverişi
          bitirmek gibi: ürünler okutulur ama ödeme olmazsa fiş iptal edilir ve hiçbir ürün eksilmiş sayılmaz. Bu garantilerin
          adı ACID'dir.
        terms:
          - [BEGIN, "Transaction'ı başlatır. Bundan sonraki komutlar tek bir işin parçası."]
          - [COMMIT, "Transaction'daki bütün değişiklikleri kalıcı ve herkese görünür yapar."]
          - [ROLLBACK, "Transaction'daki bütün değişiklikleri geri alır; hiçbir şey olmamış gibi."]
          - [Satır kilidi (row lock), "UPDATE edilen satırı transaction bitene kadar başka yazmalara kapatır; iki ödeme aynı son parçayı satamaz."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde sipariş veritabanı için hazırlık
        intro: >-
          Sipariş butonuna hiç basılmadan, tablolar, kurallar ve bağlantı düzeni hazırlanır. Aşağıdaki beş adım bu hazırlığın
          sırasıdır.
        text:
          - title: Önce siparişin adımları yazılır
            text: >-
              "Sipariş ver" şu demektir: her ürünün stoğunu düşür (yeterliyse), bir sipariş satırı yaz, her ürün için bir
              sipariş kalemi yaz. Hepsi tek bir transaction'da; biri bile başarısız olursa hiçbiri olmaz.
            code: |-
              BEGIN;
                UPDATE products SET stock = stock - :qty WHERE product_id = :pid AND stock >= :qty;
                INSERT INTO orders …;  INSERT INTO order_items …;
              COMMIT;   -- ya da hata olursa ROLLBACK;
          - title: Kurallar tabloya yazılır
            text: >-
              Stok eksiye düşemez (CHECK), her sipariş kalemi var olan bir siparişe ve ürüne bağlıdır (FOREIGN KEY). Kurallar
              veritabanında olunca hangi uygulama yazarsa yazsın bozulmaz.
            code: |-
              CREATE TABLE products (product_id text PRIMARY KEY, …, stock int NOT NULL CHECK (stock >= 0));
              CREATE TABLE order_items (order_id text REFERENCES orders ON DELETE CASCADE,
                                        product_id text REFERENCES products, qty int, unit_price numeric(10,2),
                                        PRIMARY KEY (order_id, product_id));
          - title: Stok güncellemesi koşulla yazılır
            text: >-
              "Önce oku, sonra düşür" yapılmaz; düşürme koşulla tek komutta yapılır (AND stock >= qty). Komut 0 satır
              etkilediyse stok yetmemiştir ve transaction geri alınır. UPDATE satırı kilitler; aynı anda gelen ikinci ödeme o
              satırı bekler.
          - title: Bağlantılar havuzdan kullanılır
            text: >-
              Her istekte yeni bağlantı açmak (TLS + kimlik doğrulama) pahalıdır ve ani yükte veritabanının bağlantı sınırını
              doldurur. Uygulama bir bağlantı havuzu kullanır ya da araya Amazon RDS Proxy konur; bağlantılar yeniden kullanılır.
          - title: Yazma ve okuma uç noktaları ayrılır
            text: >-
              Aurora'nın bir yazma (writer) ve bir okuma (reader) uç noktası vardır. Siparişler yazma ucuna, raporlar ve
              listeler okuma ucuna gider. Veri tek bir paylaşılan depolamada, üç Availability Zone'da altı kopya olarak tutulur.
      feed:
        title: Veri nereden geliyor?
        writes: Uygulama, ödeme adımında (sipariş ve stok). Stok ayrıca depo ve tedarik sistemlerinden güncellenir.
        reads: Uygulama, sipariş geçmişi ve sipariş detayı için; raporlar okuma ucundan.
        kind: >-
          Uygulama orkestrasyonu. Aurora siparişin asıl kaydıdır. Kendi değişikliklerini dışarı verebilir: zero-ETL ile analiz
          veritabanına (Redshift) birkaç saniye içinde kopyalanır.
        with: >-
          Ödeme sayfası sepeti DynamoDB'den güçlü tutarlı okur. Sipariş Aurora'da onaylanınca (COMMIT) beş veritabanı daha
          güncellenir (Adım 25). Sipariş geri alınırsa (ROLLBACK) onlara hiçbir şey gönderilmez ve sepet olduğu gibi kalır.
        best: >-
          Asıl sipariş tek bir ilişkisel veritabanında, tek transaction'da yazılır. Diğer sistemlere sadece COMMIT'ten sonra
          ve olay olarak (kuyruk ya da outbox) haber verilir; böylece geri alınan bir sipariş başka hiçbir yerde iz bırakmaz.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Sepetten "Checkout" (ödeme) sayfasına geçtin. Açılırken oturumun güncellendi ve sepetin DynamoDB'den güçlü
              tutarlı okundu; ürünler ve toplam listelendi.
            engines: [elasticache, dynamodb]
          - text: >-
              Bir önceki adımda "Make the payment fail" kutusunu işaretledin. Bu sadece sayfadaki bir seçimdi; istek gitmedi.
          - text: >-
              "Place the order" butonuna bastın. Tarayıcın uygulamaya sepetteki ürünleri ve "ödeme başarısız olsun" bilgisini
              gönderdi. Uygulama Aurora'ya bir bağlantı açtı ve transaction'ı başlattı (BEGIN).
            engines: [aurora]
          - text: >-
              Stok düşürüldü (UPDATE); satır kilitlendi. Tam o anda deneme gereği ödeme başarısız oldu ve uygulama ROLLBACK
              gönderdi. Stok eski hâline döndü, sipariş satırı hiç yazılmadı. Simülasyonun sol şeridi bu istek.
            engines: [aurora]
          - text: >-
              Sipariş olmadığı için diğer veritabanlarına hiçbir şey gönderilmedi; sepetin DynamoDB'de olduğu gibi kaldı. Sayfada
              "The transaction rolled back" (transaction geri alındı) yazdı.
            engines: [aurora]
      sim:
        kind: txn
        caption: >-
          Aurora'daki iki tablodan küçük bir kesit (stok değeri örnek). Solda senin denemen: ödeme stok düştükten sonra
          başarısız oluyor. Sağda olsaydı: ödeme başarılı olsaydı; bunu Adım 25'te gerçekten yapacaksın.
        tables:
          products: {key: product_id, cols: [product_id, name, stock], rows: [{product_id: P0001, name: Alpen Kablosuz Kulaklık 1, stock: 128}]}
          orders: {key: order_id, cols: [order_id, customer_id, status, total], rows: [{order_id: W17933…a1, customer_id: C00002, status: delivered, total: 1299.90}]}
        lanes:
          - id: fail
            title: "t0 · Senin denemen · Ödeme başarısız → ROLLBACK"
            send: >-
              "Place the order"a bastın. Uygulama Aurora'ya bir bağlantı açtı ve komutları sırayla gönderiyor.
            ops:
              - {do: begin, sql: "BEGIN;", say: "Transaction başladı. Bundan sonraki değişiklikleri sadece bu transaction görür."}
              - {do: update, table: products, key: P0001, set: {stock: 127}, sql: "UPDATE products SET stock = stock - 1 WHERE product_id = 'P0001' AND stock >= 1;", say: "Stok 128'den 127'ye düştü ama henüz kalıcı değil; satır kilitlendi. Başka bir ödeme bu satırı bekler."}
              - {do: fail, sql: "-- ödeme adımı: HATA", say: "Deneme gereği ödeme başarısız oldu. Uygulama devam etmiyor; sipariş satırı yazılmayacak."}
              - {do: rollback, sql: "ROLLBACK;", say: "ROLLBACK: transaction'daki bütün değişiklikler geri alındı. Stok yine 128, kilit kalktı."}
            end_say: Hiçbir şey olmamış gibi - stok aynı, sipariş yok.
            back: >-
              Uygulama "rolled back" sonucunu tarayıcına gönderdi; sayfa diğer veritabanlarına hiçbir istek göndermeyecek.
          - id: ok
            title: "Olsaydı · Ödeme başarılı → COMMIT (Adım 25)"
            send: Olsaydı - uygulama aynı transaction'ı başlatırdı.
            ops:
              - {do: begin, sql: "BEGIN;", say: Transaction başladı.}
              - {do: update, table: products, key: P0001, set: {stock: 127}, sql: "UPDATE products SET stock = stock - 1 WHERE … AND stock >= 1;", say: "Stok 127 oldu (beklemede)."}
              - {do: insert, table: orders, row: {order_id: W17933…7c, customer_id: C00001, status: processing, total: 3373.84}, sql: "INSERT INTO orders VALUES ('W17933…7c', 'C00001', …, 'processing', 3373.84);", say: Sipariş satırı yazıldı (beklemede).}
              - {do: commit, sql: "COMMIT;", say: "COMMIT: stok ve sipariş birlikte kalıcı oldu ve herkese göründü."}
            end_say: İkisi birlikte kalıcı oldu.
            back: Uygulama sipariş numarasını tarayıcına gönderirdi; sayfa diğer beş veritabanını güncellemeye başlardı.
        summary: >-
          Aynı başlangıç, iki son. Ödeme başarısız olunca ROLLBACK bütün değişiklikleri tek hamlede geri aldı; başarılı olunca
          COMMIT hepsini birlikte kalıcı yaptı. Arada yarım kalmış bir durum hiçbir zaman başkalarına görünmedi.
      wire:
        what: >-
          Uygulama bu istek için Aurora'ya yeni bir bağlantı açar (psycopg kütüphanesi): TLS el sıkışması ve kullanıcı adı/şifre
          doğrulaması her istekte yeniden yapılır. Sonra SQL komutlarını bu bağlantı üzerinden sırayla gönderir.
        dst: "dbws-aurora.cluster-ccgs3qxfidad.eu-central-1.rds.amazonaws.com : 5432"
        dst_note: >-
          Aurora cluster'ının yazma (writer) adresi; yazmalar her zaman bu adrese gider. Cluster internete kapalı veri alt
          ağında duruyor ve kapasitesini yüke göre değiştiriyor (Serverless v2, 0,5–4 ACU).
        rows:
          - [Şifreleme, "TLS (sslmode=require)", gerçek, Bağlantı şifrelenmeden kurulmaz.]
          - [Protokol, PostgreSQL wire protokolü, gerçek, "PostgreSQL istemcilerinin konuştuğu ikili dil; her SQL komutu bir mesaj olarak gider."]
          - [Kimlik, "Kullanıcı adı + şifre, bağlantı açılırken", gerçek, "Şifre kodda yazmaz; uygulama onu AWS Secrets Manager'dan alır."]
        body_label: Bu bağlantı üzerinden giden komutlar (sırasıyla)
        body: |-
          BEGIN;
          UPDATE products SET stock = stock - 1 WHERE product_id = 'P0001' AND stock >= 1;   → UPDATE 1
          -- ödeme adımı başarısız
          ROLLBACK;
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Hatayı yakalayıp
        ROLLBACK gönderen uygulamadır; geri almayı yapan veritabanıdır.
      app_code:
        - file: engines/aurora.py
          func: api_order
          title: '"Siparişi ver" isteği'
          sub: Senin tıklamanla gelen istek.
          lines:
            - {match: '@bp.post("/api/orders")', say: "Sipariş isteği buraya gelir: ürünler, adetler, fiyatlar ve \"ödeme başarısız olsun\" seçimi.", tag: Tarayıcı → Uygulama}
            - {match: 'with conn() as c, c.cursor() as cur:', say: "Aurora'ya yeni bir bağlantı açar (TLS + kullanıcı adı/şifre).", tag: [Uygulama → Aurora, Aurora → Uygulama]}
            - {match: 'sql(cur, "BEGIN", "BEGIN;"', say: "Transaction'ı başlatır.", tag: [Uygulama → Aurora, Aurora → Uygulama], hl: sql}
            - {match: 'sql(cur, "UPDATE (stock)"', say: "Her ürünün stoğunu, yetiyorsa, tek komutta düşürür.", tag: [Uygulama → Aurora, Aurora → Uygulama], hl: sql}
            - {match: 'if cur.rowcount == 0:', say: "Komut hiçbir satırı değiştirmediyse stok yetmemiştir: hata.", tag: Uygulamanın içinde}
            - {match: 'raise RuntimeError("Experiment: the payment step failed after the stock update.")', say: "Deneme seçiliyse ödeme adımı burada başarısız olur.", tag: Uygulamanın içinde}
            - {match: 'sql(cur, "ROLLBACK", "ROLLBACK;",', say: "Herhangi bir hatada ROLLBACK gönderir; Aurora bütün değişiklikleri geri alır.", tag: [Uygulama → Aurora, Aurora → Uygulama], hl: sql}
            - {match: 'return jsonify(trace.payload({"order_id": order_id if result == "committed" else None', say: "Sonucu (\"committed\" ya da \"rolled back\") tarayıcıya gönderir.", tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek veritabanında ne oldu?
        intro: Senin tıklamanla Aurora'ya giden gerçek komutlar.
        runs:
          - label: Sipariş denemesi (senin tıklaman)
            trigger: true
            metrics: [[Sonuç, data.result], ["BEGIN", ms], ["UPDATE (değişen satır)", e1.items], ["UPDATE süresi", e1.ms], ["ROLLBACK", e2.ms]]
        reading: >-
          UPDATE 1 satırı değiştirdi (stok yetiyordu), ardından ROLLBACK geldi ve değişiklik geri alındı. Sipariş numarası yok,
          stok değişmedi. Komutların her biri birkaç milisaniye sürer; bağlantı her istekte yeniden açıldığı için isteğin toplam
          süresi komutların toplamından uzundur. Sepetin boşsa sipariş verilemez; önce Adım 12'de bir ürün ekle.
      query:
        title: Uygulama Aurora'ya ne dedi?
        intro: >-
          Senin denemende sırayla giden üç SQL komutu. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: bg
            say: Bir transaction başlat;
            code: "BEGIN;"
            name: Ne zaman başlasın?
            note: Bundan sonraki komutlar tek bir işin parçası; değişiklikleri sadece bu bağlantı görür.
            hl: sql
          - id: up
            say: P0001'in stoğunu 1 azalt,
            code: "UPDATE products SET stock = stock - 1"
            name: Ne değişsin?
            note: Stoğu okuyup yazmaz; düşürmeyi tek komutta yapar. Satır transaction bitene kadar kilitlenir.
            hl: sql
          - id: wh
            say: ama sadece stok yetiyorsa;
            code: "  WHERE product_id = 'P0001' AND stock >= 1;"
            name: Hangi koşulla?
            note: Stok yetmiyorsa komut 0 satır değiştirir; uygulama bunu görüp siparişi durdurur.
            hl: sql
            indent: 2
          - id: rb
            say: ödeme başarısız oldu, her şeyi geri al.
            code: "ROLLBACK;"
            name: Nasıl bitsin?
            note: BEGIN'den beri yapılan bütün değişiklikler geri alınır; kilit kalkar.
            hl: sql
        columns:
          - label: Senin denemen
            sub: Senin "Place the order" tıklamanla giden komutlar ("Make the payment fail" işaretli).
            via: Uygulama bu komutları psycopg kütüphanesinin cursor.execute() metoduyla, aynı bağlantı üzerinden sırayla gönderir.
            parts: [bg, up, wh, rb]
        note: >-
          Dikkat: ROLLBACK'te "stoğu geri artır" diye bir komut yok. Geri almayı veritabanı kendisi yapar; uygulama sadece
          "vazgeçtim" der. Bu yüzden yarım kalan bir sipariş hiçbir zaman başkalarına görünmez.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          Aurora'nın işi ROLLBACK'i onaylayınca bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: Aurora → Uygulama
            text: Her komutun onayı geldi; ROLLBACK'ten sonra bağlantı kapandı.
          - who: Uygulama → Tarayıcın
            text: '"rolled back" sonucunu ve hata mesajını tek bir JSON cevabında gönderdi.'
          - who: Tarayıcın
            text: >-
              Akıştaki Aurora satırını kırmızı yaptı ve "The transaction rolled back. Nothing else ran, and your cart is
              unchanged." yazdı. Diğer veritabanlarına istek göndermedi.
          - who: Sonra
            text: >-
              Bir sonraki adımda kutunun işaretini kaldırıp gerçek bir sipariş vereceksin; o zaman COMMIT olacak ve beş veritabanı
              daha güncellenecek (Adım 25).
      remember: >-
        Birlikte olması gereken yazmaları tek bir transaction'a koy: ya hepsi olur (COMMIT) ya hiçbiri (ROLLBACK). Geri almayı
        veritabanı yapar; yarım kalmış bir sipariş hiçbir zaman görünmez.
      why_db: >-
        Neden Aurora PostgreSQL? Sipariş, stok ve kalemler arasındaki ilişkiler ve "ya hepsi ya hiçbiri" garantisi ilişkisel
        bir veritabanının temel işidir. Aurora bunu PostgreSQL uyumlu olarak ve altı kopyalı bir depolamayla sunar. Bedeli: tek
        bir yazma ucu vardır ve bağlantılar dikkatle yönetilmelidir.

  - page: checkout
    path: /checkout
    engines: [aurora]
    use_case: Bir sipariş, altı veritabanı
    title: Ödemenin başarılı olmasına izin ver
    why: >-
      Şimdi gerçek bir sipariş vereceksin. Önce, bir önceki adımda işaretlediğin "ödemeyi başarısız yap" kutusunu
      kaldıracaksın.
    do: Aydınlık "Make the payment fail" kutusunun işaretini kaldır.
    target: "#exp-fail"
    action: click
    wait: {click: true}

  - page: checkout
    path: /checkout
    engines: [aurora, dynamodb, elasticache, keyspaces, influxdb, neptune]
    use_case: Bir sipariş, altı veritabanı
    title: Siparişi ver
    why: >-
      Kutu boş: bu kez ödeme başarılı olacak. Siparişi verince altı veritabanının sırayla güncellendiğini sayfadaki listede
      göreceksin.
    do: Aydınlık "Place the order" (siparişi ver) butonuna tıkla.
    target: "#place"
    action: click
    wait: {method: POST, path: /neptune/api/purchase}
    focus: "#flow"
    result: Six databases stored the part of the order that each one is good at.
    panel:
      need: >-
        Bir sipariş verildiğinde mağazanın birçok parçası bunu öğrenmeli: siparişin asıl kaydı yazılmalı, sepet boşalmalı, canlı
        sıralama güncellenmeli, alışveriş geçmişine eklenmeli, operasyon grafiğinde sayılmalı ve öneriler bu alışverişi
        bilmeli. Her biri farklı bir veritabanında, kendi işine en uygun yerde. Önemli olan, asıl sipariş kesinleşmeden hiçbirine
        dokunulmaması ve biri başarısız olsa da siparişin bozulmaması.
      concept:
        term: Asıl kayıt ve yayılma (fan-out)
        text: >-
          Siparişin tek bir asıl kaydı vardır: ilişkisel veritabanındaki transaction. O kesinleşince (COMMIT) diğer sistemlere
          haber verilir ve her biri kendi kopyasını ya da sayacını günceller. Bir düğün davetiyesi gibi: önce tarih kesinleşir,
          sonra herkese haber gider; davetiyelerden biri geç ulaşsa da düğünün tarihi değişmez. Bu adımda haber vermeyi
          tarayıcıdaki sayfa sırayla yapıyor; gerçek sistemlerde bu iş bir kuyruğa ya da olay yoluna verilir.
        terms:
          - [Asıl kayıt (source of truth), "Bir bilginin doğru kabul edilen tek yeri. Sipariş için Aurora."]
          - [Fan-out, "Bir olayın birden fazla sisteme yayılması."]
          - [Outbox, "Siparişle aynı transaction'da yazılan \"haber verilecek olaylar\" tablosu; bir program onu okuyup dağıtır."]
          - [Uygulama, "Mağazanın arka uç programı. Her veritabanı için ayrı bir uygulama sunucusu var; tarayıcı her birine ayrı istek gönderir."]
      prior:
        title: Gerçek bir sistemde siparişin yayılması için hazırlık
        intro: >-
          Sipariş butonuna hiç basılmadan, asıl kaydın nerede olacağı ve diğer sistemlere nasıl haber verileceği belirlenir.
          Aşağıdaki beş adım bu hazırlığın sırasıdır.
        text:
          - title: Önce kimin neyi bilmesi gerektiği yazılır
            text: >-
              Sipariş kimleri ilgilendiriyor? Sepet (boşalsın), canlı sıralama (tutar eklensin), alışveriş geçmişi (olay),
              operasyon ölçümü (sayaç), öneriler (BOUGHT kenarı), analiz (rapor). Her biri için "geç kalırsa ne olur?" sorulur.
          - title: Tek bir asıl kayıt seçilir
            text: >-
              Sipariş ve stok tek bir ilişkisel veritabanında, tek transaction'da yazılır. Diğerleri asıl kayıt değil; kopyadır,
              sayaçtır ya da özettir ve gerekirse asıl kayıttan yeniden kurulur.
          - title: Haber, kesinleşmeden sonra ve kayıpsız verilir
            text: >-
              Siparişle aynı transaction'da bir outbox satırı yazılır; COMMIT'ten sonra bir program onu okur ve olayı bir kuyruğa
              ya da olay yoluna (Amazon SQS, Amazon EventBridge) bırakır. Böylece sipariş geri alınırsa haber de hiç çıkmaz;
              sipariş kesinleşirse haber kaybolmaz.
            code: |-
              BEGIN;
                INSERT INTO orders …;  INSERT INTO order_items …;
                INSERT INTO outbox (event, payload) VALUES ('OrderPlaced', '{"order_id": "W…", …}');
              COMMIT;
          - title: Her alıcı kendi kuyruğundan okur
            text: >-
              Olay her ilgili sisteme ayrı bir kuyrukla dağıtılır (EventBridge kuralları ya da SNS → SQS). Biri yavaşlasa ya da
              dursa diğerleri etkilenmez; duran sistem kaldığı yerden devam eder.
          - title: Alıcılar tekrarlanan olaya hazırlıklıdır
            text: >-
              Kuyruklar bir olayı nadiren iki kez teslim edebilir. Her alıcı olayı sipariş numarasıyla tanır ve ikinci kez
              işlemez (idempotent): sepeti iki kez boşaltmak sorun değildir, ama tutarı sıralamaya iki kez eklemek sorundur.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Siparişin asıl kaydını uygulama Aurora'ya yazar. Diğer beş veritabanı bu siparişten türeyen bilgiyi alır.
        reads: >-
          Her veritabanını kendi ekranı okur: sipariş geçmişi (Aurora), sepet (DynamoDB), canlı sıralama (ElastiCache),
          hareketlerim (Keyspaces), operasyon grafiği (InfluxDB), öneriler (Neptune), raporlar (Redshift).
        kind: >-
          Motorlar birbirinden kendiliğinden veri çekmez; yayılmayı olay altyapısı yapar. Motorlar arasındaki yaygın doğrudan
          bağlantı analiz tarafındadır: ilişkisel veritabanından analiz deposuna zero-ETL (ör. Aurora → Redshift).
        with: >-
          Bu sayfada altı veritabanı birlikte çalışır; yedincisi (Redshift) siparişi Aurora'dan zero-ETL ile birkaç saniye
          içinde kendisi alır. Ödeme sayfası sepeti de DynamoDB'den okumuştu.
        best: >-
          Asıl kayıt tek transaction'da; yayılma COMMIT'ten sonra, outbox + kuyruk ya da olay yoluyla; her alıcı kendi
          kuyruğundan ve idempotent okur. Yayılmayı tarayıcıya bırakmak güvenli değildir: sayfa kapanırsa yarım kalır.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Ödeme sayfasındasın; sepetin DynamoDB'den okunmuştu. Bir önceki adımda "ödemeyi başarısız yap" kutusunun
              işaretini kaldırdın.
            engines: [dynamodb]
          - text: >-
              "Place the order" butonuna bastın. Tarayıcın sepetteki ürünleri Aurora'nın uygulama sunucusuna gönderdi; Aurora
              stoğu düşürüp siparişi ve kalemlerini tek transaction'da yazdı ve COMMIT etti. Sipariş numarası geldi.
            engines: [aurora]
          - text: >-
              Sipariş kesinleşince tarayıcıdaki sayfa beş isteği sırayla gönderdi; her biri o veritabanının kendi uygulama
              sunucusuna gitti: sepeti boşalt, sıralamaya tutarı ekle, satın alma olayını yaz, siparişi say, BOUGHT kenarlarını
              ekle.
            engines: [dynamodb, elasticache, keyspaces, influxdb, neptune]
          - text: >-
              Sayfadaki listede her satır sırayla yeşile döndü. Birkaç saniye içinde Redshift de siparişi Aurora'dan zero-ETL
              ile aldı (raporlar sayfası).
            engines: [redshift]
      sim:
        kind: fanout
        title: "Bir sipariş, altı veritabanı (senin siparişinin sırası)"
        sender: Tarayıcıdaki sayfa
        sender_label: Tarayıcıdaki sayfa (ödeme sayfası)
        caption: >-
          Senin siparişinde gerçekten olan sıra. Her satır ayrı bir istek ve ayrı bir veritabanı; sayfa birini bitirince
          diğerine geçiyor. Üstteki etiketler o anda işi kimin yaptığını gösterir.
        steps:
          - engine: aurora
            label: Aurora PostgreSQL
            cmd: "BEGIN; UPDATE products …; INSERT INTO orders …; INSERT INTO order_items …; COMMIT;"
            say_send: '"Place the order"a bastın. Sayfa siparişi Aurora''nın uygulama sunucusuna gönderiyor.'
            say_done: "Aurora tek transaction'da stoğu düşürdü, siparişi ve kalemleri yazdı ve COMMIT etti. Asıl kayıt hazır."
          - engine: dynamodb
            label: DynamoDB
            cmd: "BatchWriteItem: sepetteki her item için DeleteItem"
            say_send: Sipariş kesinleşti. Sayfa ikinci isteği gönderiyor - sepeti boşalt.
            say_done: DynamoDB sepetin item'larını sildi.
          - engine: elasticache
            label: ElastiCache
            cmd: "ZINCRBY lm:leaderboard <tutar> <müşteri>;  INCR lm:orders:today"
            say_send: Üçüncü istek - canlı sıralamaya tutarı ekle.
            say_done: ElastiCache sıralamada müşterinin puanını artırdı ve bugünün sipariş sayacını bir artırdı.
          - engine: keyspaces
            label: Keyspaces
            cmd: "INSERT INTO activity_by_user (…, event_type) VALUES (…, 'purchase')"
            say_send: Dördüncü istek - alışveriş geçmişine bir satın alma olayı yaz.
            say_done: Keyspaces senin partition'ına bir "purchase" satırı ekledi.
          - engine: influxdb
            label: Timestream for InfluxDB
            cmd: "orders,channel=workshop count=1i <zaman>"
            say_send: Beşinci istek - operasyon grafiği için siparişi say.
            say_done: InfluxDB zaman damgalı bir nokta yazdı (count = 1).
          - engine: neptune
            label: Neptune
            cmd: "UNWIND $rows … CREATE (c)-[:BOUGHT {order_id, qty}]->(p)"
            say_send: Altıncı istek - önerilerin bilmesi için BOUGHT kenarlarını ekle.
            say_done: Neptune müşteriden her ürüne bir BOUGHT kenarı ekledi; bir sonraki öneri bunu bilir.
        back: >-
          Altı istek de bitti; sayfa "Order … is placed" (sipariş verildi) yazdı. Biri başarısız olsaydı listede kırmızı görünürdü
          ama sipariş yine geçerli olurdu - asıl kayıt Aurora'da.
        summary: >-
          Asıl kayıt önce ve tek başına kesinleşti; diğer beşi ondan türedi. Burada yayılmayı tarayıcı sırayla yaptı. Gerçek bir
          sistemde bu iş COMMIT'ten sonra bir kuyruğa verilir; sayfa kapansa ya da bir veritabanı dursa da haber kaybolmaz.
      wire:
        what: >-
          Altı ayrı istek, altı ayrı uygulama sunucusu, altı ayrı protokol. Paket 3 son isteği (Neptune) gösteriyor; diğerlerinin
          özeti aşağıda.
        dst: "dbws-neptune.cluster-ccgs3qxfidad.eu-central-1.neptune.amazonaws.com : 8182"
        dst_note: >-
          Son isteğin hedefi Neptune. Her veritabanı kendi uç noktasında ve internete kapalı veri alt ağında duruyor.
        rows:
          - [Şifreleme, Hepsinde TLS, gerçek, Altı bağlantının hepsi şifreli.]
          - [Protokol, "Her motorun kendi dili", gerçek, "PostgreSQL, DynamoDB HTTP/JSON, RESP, CQL, InfluxDB HTTP, openCypher HTTP."]
          - [Kimlik, "IAM (SigV4) ya da şifre", gerçek, "DynamoDB, Keyspaces, Neptune IAM ile; Aurora, ElastiCache, InfluxDB Secrets Manager'daki şifreyle."]
        body_label: Altı isteğin hedefleri (sırasıyla)
        body: |-
          1. Aurora      dbws-aurora.cluster-….rds.amazonaws.com:5432            PostgreSQL, TLS, şifre
          2. DynamoDB    dynamodb.eu-central-1.amazonaws.com:443                 HTTPS + SigV4 (BatchWriteItem)
          3. ElastiCache dbws-cache-qtkvec.serverless.euc1.cache.amazonaws.com:6379   RESP, TLS, ACL kullanıcısı
          4. Keyspaces   cassandra.eu-central-1.amazonaws.com:9142               CQL, TLS, SigV4
          5. InfluxDB    f9a4tsktku-….timestream-influxdb.eu-central-1.on.aws:8086   HTTPS, kullanıcı adı + şifre
          6. Neptune     dbws-neptune.cluster-….neptune.amazonaws.com:8182       HTTPS + SigV4 (openCypher)
      code_intro: >-
        Kod bilmen gerekmiyor. Bu adımda yayılmayı yöneten kod uygulamada değil, tarayıcıya gelen ödeme sayfasının içinde.
        Solda o sayfanın gerçek kodundan satırlar, sağda Türkçesi. Gri etiketli satırlar tarayıcının kendi içinde çalışır.
      app_code:
        - file: templates/pages/checkout.html
          where: tarayıcıda çalışan sayfa kodu
          start: '$("#place").addEventListener("click", async () => {'
          title: '"Siparişi ver" düğmesinin kodu (tarayıcıda)'
          sub: Altı isteği sırayla gönderen kod.
          lines:
            - {match: 'order = await api("/aurora/api/orders"', say: "Önce siparişi Aurora'nın uygulama sunucusuna gönderir ve cevabı bekler.", tag: [Tarayıcı → Uygulama (Aurora), Uygulama (Aurora) → Tarayıcı]}
            - {match: 'if (order.result !== "committed") {', say: "Aurora geri aldıysa burada durur; diğer veritabanlarına hiçbir şey gitmez.", tag: Tarayıcının içinde}
            - {match: '["dynamodb", () => api("/dynamodb/api/cart", { method: "DELETE"', say: Sepeti boşaltma isteği., tag: Tarayıcı → Uygulama (DynamoDB)}
            - {match: '["elasticache", () => api("/elasticache/api/leaderboard/add"', say: Sıralamaya tutar ekleme isteği., tag: Tarayıcı → Uygulama (ElastiCache)}
            - {match: '["keyspaces", () => api("/keyspaces/api/events", { body: { type: "purchase"', say: Satın alma olayı isteği., tag: Tarayıcı → Uygulama (Keyspaces)}
            - {match: '["influxdb", () => api("/influxdb/api/orders-metric"', say: Siparişi sayma isteği., tag: Tarayıcı → Uygulama (InfluxDB)}
            - {match: '["neptune", () => api("/neptune/api/purchase"', say: BOUGHT kenarları isteği., tag: Tarayıcı → Uygulama (Neptune)}
            - {match: 'try { await fn(); mark(step, true, "done"); } catch (e) { mark(step, false, "failed"); }', say: "Hepsini sırayla çalıştırır; biri başarısız olursa satırı kırmızı yapar ve devam eder.", tag: Tarayıcının içinde}
      live:
        title: Gerçek sistemde ne oldu?
        intro: >-
          Senin siparişinle giden altı gerçek istek. Her kutu bir veritabanı.
        runs:
          - label: Aurora (sipariş)
            page_call: {path: /aurora/api/orders}
            metrics: [[Sonuç, data.result], [Toplam (₺), data.total]]
          - label: DynamoDB (sepeti boşalt)
            page_call: {path: /dynamodb/api/cart}
            metrics: [[Silinen item, items], [Süre, ms]]
          - label: ElastiCache (sıralama)
            page_call: {path: /elasticache/api/leaderboard/add}
            metrics: [[ZINCRBY, ms], [INCR, e1.ms]]
          - label: Keyspaces (olay)
            page_call: {path: /keyspaces/api/events}
            metrics: [[Yazılan satır, items], [Süre, ms]]
          - label: InfluxDB (sayaç)
            page_call: {path: /influxdb/api/orders-metric}
            metrics: [[Yazılan nokta, items], [Süre, ms]]
          - label: Neptune (kenarlar)
            trigger: true
            metrics: [[Eklenen kenar, items], [Süre, ms]]
        reading: >-
          Aurora siparişi "committed" olarak yazdı; ardından beş istek sırayla bitti. Süreler veritabanından veritabanına ve
          istekten isteğe değişir. Ödeme sayfası açılırken sepet de okunmuştu; DynamoDB kutusu boşsa sepet boş olabilir.
      query:
        title: Sayfa veritabanlarına ne dedi?
        intro: >-
          Altı isteğin her biri kendi veritabanının dilinde. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer
          parlar.
        cards_title: Parça parça
        parts:
          - id: au
            say: Aurora'da siparişi tek transaction'da yaz,
            code: "BEGIN; UPDATE products …; INSERT INTO orders …; INSERT INTO order_items …; COMMIT;"
            name: 1. Asıl kayıt
            note: Stok, sipariş ve kalemler birlikte; ya hepsi ya hiçbiri (Adım 23).
            hl: app
          - id: dd
            say: DynamoDB'de sepeti boşalt,
            code: "BatchWriteItem: DeleteItem × <sepetteki item>"
            name: 2. Sepet
            note: Senin partition'ındaki bütün item'lar tek toplu istekle silinir.
            hl: app
          - id: ec
            say: ElastiCache'te sıralamaya tutarı ekle,
            code: "ZINCRBY lm:leaderboard <tutar> <müşteri>; INCR lm:orders:today"
            name: 3. Canlı sıralama
            note: Sorted set'te müşterinin puanı artar; sıralama her yazmada hazır kalır (Adım 33).
            hl: app
          - id: ks
            say: Keyspaces'e satın alma olayını yaz,
            code: "INSERT INTO activity_by_user (…) VALUES (…, 'purchase', …)"
            name: 4. Geçmiş
            note: Senin partition'ına yeni bir satır (Adım 10, 27).
            hl: app
          - id: ix
            say: InfluxDB'de siparişi say,
            code: "orders,channel=workshop count=1i <zaman>"
            name: 5. Ölçüm
            note: Line protocol; ölçüm adı, etiket, alan ve zaman damgası (Adım 34).
            hl: app
          - id: np
            say: ve Neptune'a BOUGHT kenarlarını ekle.
            code: "UNWIND $rows AS r MATCH (c {~id: r.c}) MATCH (p {~id: r.p}) CREATE (c)-[:BOUGHT {order_id: r.o, qty: 1}]->(p)"
            name: 6. Öneriler
            note: Her ürün için bir kenar; bir sonraki öneri hemen değişir (Adım 11).
            hl: app
        columns:
          - label: Bir sipariş, altı istek
            sub: Senin "Place the order" tıklamanla, sırayla giden istekler.
            via: >-
              Sayfa her isteği fetch ile ilgili veritabanının uygulama sunucusuna gönderir; her uygulama kendi kütüphanesiyle
              (psycopg, boto3, redis-py, cassandra-driver, influxdb-client, requests) kendi veritabanına konuşur.
            parts: [au, dd, ec, ks, ix, np]
        note: >-
          Dikkat: veritabanları birbirine hiç konuşmuyor; hiçbiri diğerinden veri çekmiyor. Her birine haber veren tarayıcıdaki
          sayfa. Tek istisna analiz tarafı: Redshift siparişi Aurora'dan zero-ETL ile kendisi alır.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          Altı cevabın her biri sayfadaki listede bir satırı yeşile çevirdi. Bundan sonrası tarayıcında ve diğer ekranlarda.
        steps:
          - who: Altı veritabanı → Tarayıcın
            text: Her uygulama kendi cevabını gönderdi; sayfa her satırı sırayla "done" yaptı.
          - who: Tarayıcın
            text: >-
              Sepet sayacını sıfırladı ve "Order … is placed" yazdı; sipariş geçmişine ve rapora giden bağlantıları gösterdi.
          - who: Aurora → Redshift
            text: >-
              Birkaç saniye içinde zero-ETL siparişi Redshift'e kopyaladı; raporlar sayfası onu gösterecek (Adım 30, 31). Bu,
              workshop'taki tek motor-motor bağlantısı.
          - who: Sonra
            text: >-
              Siparişin "Orders" sayfasında (Aurora, Adım 26), "My activity"de (Keyspaces), canlı sıralamada (ElastiCache) ve
              önerilerde (Neptune) göründüğünü görebilirsin.
      remember: >-
        Siparişin tek bir asıl kaydı var ve o önce kesinleşir. Diğer sistemler ondan türeyen bilgiyi sonra alır. Gerçek bir
        sistemde bu yayılma tarayıcıya değil, outbox ve kuyruğa verilir.
      why_db: >-
        Neden altı veritabanı? Her biri siparişin bir parçasını en iyi yaptığı işle tutuyor: Aurora kesin kaydı, DynamoDB hızlı
        sepeti, ElastiCache anlık sıralamayı, Keyspaces kişi başı geçmişi, InfluxDB zaman serisini, Neptune ilişkileri. Bedeli:
        aralarındaki tutarlılığı mimari sağlamalıdır; hiçbiri diğerini kendiliğinden güncellemez.

  - page: orders
    path: /orders
    engines: [aurora]
    use_case: İlişkili tabloları birleştirme (JOIN)
    title: Siparişlerin üç tablodan gelir
    why: >-
      Siparişlerim sayfasındasın. Her satırda bir sipariş, tarihi, durumu, içindeki ürünler ve toplamı görünüyor. Bu adımda
      tıklama yok, sadece bakacaksın.
    do: Aydınlık sipariş listesine bak. Sonra kartın altındaki butonla perde arkasını aç.
    target: "#orders"
    action: look
    wait: {method: GET, path: /aurora/api/orders}
    result: The query joins on order_id and product_id.
    panel:
      need: >-
        Bir siparişin bilgisi tek yerde durmaz: siparişin kendisi (tarih, durum, toplam), içindeki kalemler (hangi üründen kaç
        tane) ve ürünün adı ayrı ayrı tutulur. Sayfa bunları tek bir listede birleştirmeli. Her bilgiyi tek yerde tutup gerekince
        birleştirmek, aynı bilgiyi her yere kopyalamaktan daha az hata demektir.
      concept:
        term: Tablolar, anahtarlar ve JOIN
        text: >-
          İlişkisel bir veritabanında her bilgi türü kendi tablosunda durur: orders, order_items, products. Tablolar
          anahtarlarla birbirine bağlanır: bir kalem hangi siparişe ait (order_id) ve hangi ürün (product_id). JOIN, bu
          anahtarları takip ederek satırları birleştirir; bir kütüphanede fiş numarasından ödünç kaydına, oradan kitabın
          kartına gitmek gibi. Her adım bir index'le doğrudan yapılır.
        terms:
          - [Birincil anahtar (primary key), "Bir satırı benzersiz tanıtan sütun. orders için order_id, products için product_id."]
          - [Yabancı anahtar (foreign key), "Başka bir tablonun anahtarını gösteren sütun. order_items.product_id → products."]
          - [JOIN, "İki tablonun satırlarını ortak bir anahtar üzerinden birleştirmek."]
          - [GROUP BY, "Satırları bir sütuna göre gruplayıp her grup için tek satır üretmek (count, string_agg)."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde sipariş tabloları için hazırlık
        intro: >-
          Siparişlerim sayfası hiç açılmadan, tablolar, anahtarlar ve index'ler bu sayfanın sorusuna göre kurulur. Aşağıdaki
          beş adım bu hazırlığın sırasıdır.
        text:
          - title: Önce veri modeli kurulur
            text: >-
              Her bilgi bir kez ve kendi tablosunda tutulur (normalizasyon): sipariş başlığı orders'ta, kalemler order_items'ta,
              ürün adı products'ta. Ürünün adı değişirse tek yerde değişir.
            code: |-
              orders(order_id PK, customer_id FK, visitor_id, order_date, status, total)
              order_items(order_id FK, product_id FK, qty, unit_price, PRIMARY KEY (order_id, product_id))
              products(product_id PK, name, category, price, stock)
          - title: İlişkiler veritabanına yazılır
            text: >-
              Yabancı anahtarlar (REFERENCES) olmayan bir siparişe kalem eklenmesini ya da var olmayan bir ürünün satılmasını
              engeller. Sipariş silinirse kalemleri de silinir (ON DELETE CASCADE).
          - title: Sayfanın sorusuna index kurulur
            text: >-
              "Bu ziyaretçinin siparişleri" sorusu için orders(visitor_id) üzerinde bir index kurulur; JOIN'ler birincil
              anahtarların index'lerini kullanır. Index olmasaydı her sayfa açılışında bütün orders tablosu taranırdı.
            code: |-
              CREATE INDEX ON orders (visitor_id);
              CREATE INDEX ON orders (customer_id);
          - title: Plan kontrol edilir
            text: >-
              EXPLAIN ANALYZE ile sorgunun hangi index'leri kullandığı ve kaç satır okuduğu görülür (Adım 32). Tablo büyüdükçe
              plan yeniden kontrol edilir.
            code: |-
              EXPLAIN ANALYZE SELECT … FROM orders o JOIN order_items oi USING (order_id) … WHERE o.visitor_id = $1 …;
          - title: Okumalar okuma ucuna gider
            text: >-
              Liste ve rapor gibi sadece okuyan sorgular Aurora'nın okuma ucuna (reader endpoint) gönderilir; yazma ucu
              siparişlere kalır. Okuma kopyaları depolamayı paylaştığı için gecikmeleri genelde milisaniyeler düzeyindedir.
      feed:
        title: Veri nereden geliyor?
        writes: Uygulama, ödeme adımında (sipariş ve kalemler); durum değişiklikleri sipariş takip sisteminden.
        reads: Uygulama, siparişlerim sayfası ve sipariş detayı için.
        kind: >-
          Uygulama orkestrasyonu. Aurora siparişin asıl kaydıdır; değişikliklerini zero-ETL ile analiz deposuna (Redshift)
          kendisi aktarır.
        with: >-
          Sipariş listesi tek veritabanından gelir; ama aynı sipariş başka yerlerde kopya olarak durur: Redshift'te rapor için,
          Keyspaces'te alışveriş geçmişinde, Neptune'da önerilerde. Asıl ve doğru olan Aurora'daki kayıttır.
        best: >-
          İşlemsel veri (sipariş) normalize tablolarda ve tek veritabanında tutulur; okuma yükü okuma ucuna, analiz yükü ayrı bir
          analiz deposuna (zero-ETL) verilir. Böylece rapor sorguları siparişleri yavaşlatmaz.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Bir önceki adımda bir sipariş verdin. Şimdi "Orders" (siparişlerim) sayfasını açtın. Açılırken oturumun güncellendi.
            engines: [elasticache]
          - text: >-
              Sayfa siparişlerini istedi; uygulama Aurora'ya tek bir SELECT gönderdi. Bu SELECT üç tabloyu anahtarlarıyla
              birleştirip her sipariş için tek bir satır üretti. Simülasyon bu SELECT'i adım adım gösteriyor.
            engines: [aurora]
          - text: >-
              Liste çizildi: sipariş numarası, tarih, durum ("processing"), ürün adları ve toplam. Hiç siparişin yoksa liste boş
              görünür.
            engines: [aurora]
      sim:
        kind: join
        title: Üç tablo, bir SELECT
        caption: >-
          Üç tablodan küçük bir kesit (satırlar örnek; numaralar kısaltıldı). Senin ziyaretçi kimliğin 7f3a…; iki siparişin
          var, biri iki kalemli. Başka bir ziyaretçinin siparişi de tabloda ama sorgu ona hiç bakmıyor.
        visitor: 7f3a…
        orders:
          - {order_id: W1793396741, visitor_id: 7f3a…, order_date: "2026-10-31 10:25", total: 10890.26}
          - {order_id: W1793390012, visitor_id: c41e…, order_date: "2026-10-31 08:40", total: 1299.90}
          - {order_id: W1793380550, visitor_id: 7f3a…, order_date: "2026-10-30 22:10", total: 951.92}
        items:
          - {order_id: W1793396741, product_id: P0001, qty: 1}
          - {order_id: W1793396741, product_id: P0131, qty: 2}
          - {order_id: W1793390012, product_id: P0021, qty: 1}
          - {order_id: W1793380550, product_id: P0066, qty: 1}
        products:
          - {product_id: P0001, name: Alpen Kablosuz Kulaklık 1}
          - {product_id: P0021, name: Bosphorus Akıllı Saat 21}
          - {product_id: P0066, name: Rhein Powerbank 66}
          - {product_id: P0131, name: Kapadokya Mekanik Klavye 131}
        send: >-
          "Orders" sayfasını açtın. Tarayıcın siparişlerini istedi; uygulama Aurora'ya tek bir SELECT gönderiyor (üç tablo,
          JOIN, GROUP BY).
        back: >-
          Uygulama satırları tarayıcına gönderdi; tarihi biçimleyip tabloyu çizecek.
        summary: >-
          Üç tablo, tek bir SELECT. Her adım bir anahtarla doğrudan yapıldı: ziyaretçiden siparişlere, siparişten kalemlere,
          kalemden ürüne. Sonunda GROUP BY her siparişi tek satıra indirdi.
      wire:
        what: >-
          Uygulama bu istek için Aurora'ya yeni bir bağlantı açar (psycopg kütüphanesi) ve tek bir SELECT gönderir.
        dst: "dbws-aurora.cluster-ccgs3qxfidad.eu-central-1.rds.amazonaws.com : 5432"
        dst_note: >-
          Aurora cluster'ının yazma adresi. Bu okuma okuma ucuna (cluster-ro) da gönderilebilirdi; uygulama tek bir adres
          kullanıyor. Cluster internete kapalı veri alt ağında duruyor.
        rows:
          - [Şifreleme, "TLS (sslmode=require)", gerçek, Bağlantı şifrelenmeden kurulmaz.]
          - [Protokol, PostgreSQL wire protokolü, gerçek, "SQL metni ve parametreleri ayrı mesajlar olarak gider."]
          - [Kimlik, "Kullanıcı adı + şifre, bağlantı açılırken", gerçek, "Şifre kodda yazmaz; uygulama onu AWS Secrets Manager'dan alır."]
        body_label: Gönderilen SQL
        body: |-
          SELECT o.order_id, o.order_date, o.status, o.total, count(oi.*) AS lines, string_agg(p.name, ', ') AS products
          FROM orders o JOIN order_items oi USING (order_id) JOIN products p USING (product_id)
          WHERE o.visitor_id = $1
          GROUP BY o.order_id ORDER BY o.order_date DESC LIMIT 20;      -- $1 = '7f3a…'
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Birleştirmeyi
        veritabanı yapar; uygulama sadece sonucu sayfaya uygun biçime getirir.
      app_code:
        - file: engines/aurora.py
          func: api_orders
          title: Siparişlerim isteği
          sub: Sayfa açılırken gelen istek.
          lines:
            - {match: '@bp.get("/api/orders")', say: "Siparişlerim isteği buraya gelir.", tag: Tarayıcı → Uygulama}
            - {match: 'q = """SELECT o.order_id', say: "SQL'i hazırlar: üç tablo, JOIN, ziyaretçiye göre filtre, siparişe göre gruplama.", tag: Uygulamanın içinde}
            - {match: 'with conn() as c, c.cursor() as cur:', say: "Aurora'ya bir bağlantı açar.", tag: [Uygulama → Aurora, Aurora → Uygulama]}
            - {match: 'sql(cur, "SELECT (JOIN)", q, {"vid": visitor_id()}', say: "SELECT'i ziyaretçi kimliğiyle gönderir; birleştirmeyi Aurora yapar.", tag: [Uygulama → Aurora, Aurora → Uygulama]}
            - {match: 'rows = [dict(zip(cols, r)) for r in cur.fetchall()]', say: "Gelen satırları sütun adlarıyla eşleştirir.", tag: Uygulamanın içinde}
            - {match: 'return jsonify(trace.payload([{**r, "order_date": r["order_date"].isoformat()', say: "Tarihi ve toplamı JSON'a uygun biçime çevirip tarayıcıya gönderir.", tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek veritabanında ne oldu?
        intro: Sayfa açılırken Aurora'ya giden gerçek SELECT.
        runs:
          - label: Siparişlerim (sayfa açılınca)
            trigger: true
            metrics: [[Dönen sipariş satırı, items], [Süre, ms]]
        reading: >-
          Dönen satır sayısı senin sipariş sayın (en fazla 20). Hiç sipariş vermediysen 0'dır; Adım 25'te sipariş verdiysen en az
          1. Süre birkaç milisaniye ile birkaç on milisaniye arasında değişir; bağlantı her istekte yeniden açıldığı için ilk
          komut daha uzun sürebilir.
      query:
        title: Uygulama Aurora'ya ne dedi?
        intro: >-
          Tek bir SQL komutu, parça parça. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: sel
            say: Her sipariş için numarasını, tarihini, durumunu, toplamını, kalem sayısını ve ürün adlarını getir;
            code: "SELECT o.order_id, o.order_date, o.status, o.total, count(oi.*) AS lines, string_agg(p.name, ', ') AS products"
            name: Ne getirilsin?
            note: count kalemleri sayar, string_agg ürün adlarını virgülle birleştirir; ikisi de grup başına çalışır.
            hl: app
          - id: frm
            say: siparişleri kalemleriyle sipariş numarasından, kalemleri ürünlerle ürün numarasından birleştir;
            code: "FROM orders o JOIN order_items oi USING (order_id) JOIN products p USING (product_id)"
            name: Nereden?
            note: USING (order_id), "iki tabloda aynı adlı sütun eşit olsun" demek. Her JOIN bir anahtar araması.
            hl: app
          - id: whr
            say: sadece bu ziyaretçinin siparişlerini al;
            code: "WHERE o.visitor_id = $1"
            name: Hangileri?
            note: orders(visitor_id) index'i sayesinde sadece senin siparişlerin okunur.
            hl: app
          - id: grp
            say: her siparişi tek satıra indir, en yenisi üstte, en fazla 20.
            code: "GROUP BY o.order_id ORDER BY o.order_date DESC LIMIT 20"
            name: Nasıl?
            note: Kalem başına çıkan satırlar sipariş başına toplanır; liste tarihe göre yeniden eskiye sıralanır.
            hl: app
        columns:
          - label: Siparişlerim
            sub: Sayfa açılırken giden komut.
            via: Uygulama bu komutu psycopg kütüphanesinin cursor.execute() metoduyla, ziyaretçi kimliğini parametre olarak gönderir.
            parts: [sel, frm, whr, grp]
        note: >-
          Dikkat: komutta "önce şunu bul, sonra şuna git" diye bir sıra yok. Ne istendiği yazılır; hangi sırayla ve hangi
          index'le yapılacağına PostgreSQL'in planlayıcısı karar verir (Adım 32).
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          Aurora'nın işi satırları verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: Aurora → Uygulama
            text: "{items} satır geldi; her biri bir sipariş, ürün adları birleştirilmiş."
          - who: Uygulama
            text: Tarihi ISO biçimine, toplamı sayıya çevirdi.
          - who: Uygulama → Tarayıcın
            text: Siparişleri ve isteğin kaydını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: Tarihi Türkçe biçimde, toplamı lira olarak yazıp tabloyu çizdi.
          - who: Sonra
            text: >-
              Aynı siparişler birkaç saniye içinde Redshift'e de kopyalandı; raporlar sayfasında onları şehre göre toplayacaksın
              (Adım 29–31).
      remember: >-
        Her bilgiyi bir kez, kendi tablosunda tut ve gerekince anahtarlarla birleştir (JOIN). Neyi istediğini yaz; nasıl
        yapılacağına veritabanının planlayıcısı karar verir.
      why_db: >-
        Neden Aurora PostgreSQL? Siparişler, kalemler ve ürünler arasındaki ilişkiler ve bunları tek komutta birleştirmek
        ilişkisel veritabanının temel işidir. Bedeli: çok büyük analiz sorguları burada değil, ayrı bir analiz deposunda çalışır.

  # ---------------------------------------------------------------- Activity: Keyspaces
  - page: activity
    path: /account/activity
    engines: [keyspaces]
    use_case: Olay geçmişi
    title: Persona'nın geçmişini oku
    why: >-
      "My activity" (hareketlerim) sayfasındasın. Bu tarayıcıyla yaptıkların listelendi: baktığın ürünler, verdiğin sipariş.
      Şimdi seçtiğin müşterinin (persona) daha uzun geçmişine bakacaksın.
    do: Aydınlık "My persona (seeded)" (benim persona'm) butonuna tıkla.
    target: "#exp-who [data-value=persona]"
    action: click
    wait: {method: GET, path: /keyspaces/api/activity, query: {who: persona}}
    focus: "#feed"
    result: Keyspaces read one partition, newest first, and stopped after the limit.
    panel:
      need: >-
        Hareketler sayfası bir kişinin son yaptıklarını, en yenisi üstte gösteriyor. Tabloda binlerce kişinin milyonlarca satırı
        var; sayfa sadece bir kişinin satırlarını, sıralı ve hızlı istiyor. Kişi kim olursa olsun (bu tarayıcı ya da seçilen
        müşteri) soru aynı.
      concept:
        term: Partition ve sıralı okuma
        text: >-
          Keyspaces her kişinin satırlarını kendi partition'ında, yani kendi defterinde tutar; defterin içinde satırlar zamana
          göre yeniden eskiye sıralıdır. Okurken sadece o defter açılır ve baştan istenen kadar sayfa okunur. Hangi defterin
          açılacağını partition key (user_id) söyler: bu tarayıcının kimliği ya da seçilen müşterinin numarası.
        terms:
          - [Partition key, "Hangi deftere bakılacağını söyleyen alan. Bu tabloda user_id."]
          - [Clustering key, "Defterin içindeki sıra. Burada event_time, yeniden eskiye."]
          - [LIMIT, "Baştan kaç satır okunacağı. Sıra hazır olduğu için ilk 20 satır en yeni 20 olaydır."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde hareket geçmişi için hazırlık
        intro: >-
          Hareketler sayfası hiç açılmadan, tablo bu sayfanın sorusuna göre kurulur. Aşağıdaki beş adım bu hazırlığın sırasıdır.
        text:
          - title: Önce sayfanın sorusu yazılır
            text: >-
              "Bu kişinin son 20 hareketi, en yeni önce". Kişi bazen ziyaretçinin kendisi, bazen seçilen müşteridir; ikisi de
              aynı soru, sadece partition key değişir.
            code: |-
              SELECT event_time, event_type, product_id, detail FROM dbws.activity_by_user WHERE user_id = ? LIMIT 20
          - title: Sıra tabloda tanımlanır
            text: >-
              Clustering key event_time DESC; satırlar yazılırken yerine konur. Okurken ORDER BY yazılmaz ve sıralama işi yapılmaz.
            code: |-
              PRIMARY KEY ((user_id), event_time, event_id)) WITH CLUSTERING ORDER BY (event_time DESC)
          - title: Sayfalama token ile yapılır
            text: >-
              Daha eski hareketler için OFFSET kullanılmaz; sürücü bir sonraki sayfanın yerini (paging state) verir ve okuma
              kaldığı yerden devam eder. Böylece 1000. sayfa da ilk sayfa kadar hızlıdır.
          - title: Eski olaylar kendiliğinden silinir
            text: >-
              Tablonun varsayılan TTL'si olaylara bir ömür verir; süresi dolan satırlar silinir ve partition sınırsız büyümez.
              Daha uzun saklanması gereken geçmiş, analiz deposuna (ör. S3) aktarılır.
          - title: Tutarlılık okumaya göre seçilir
            text: >-
              Kendi yaptığını hemen görmesi gereken ekranlar LOCAL_QUORUM okur; gecikmeyi kaldırabilen ekranlar LOCAL_ONE ile
              yarı maliyetine okur (Adım 28).
      feed:
        title: Veri nereden geliyor?
        writes: Uygulama. Ürün sayfası açılınca "view", sipariş verilince "purchase" ve benzeri olaylar.
        reads: Uygulama, "My activity" (hareketlerim) sayfası ve "son baktıkların" şeridi için.
        kind: >-
          Uygulama orkestrasyonu: Keyspaces'e yazan da ondan okuyan da uygulamadır. Kopyalama Keyspaces'in kendi içindedir: her
          satırı üç kopya olarak kendisi tutar.
        with: >-
          Hareketler sayfasındaki ürün adları satırların detail alanında, yazıldıkları anki kopyalarıyla durur (katalogdan,
          DocumentDB). Satın alma olayının asıl siparişi ilişkisel veritabanındadır (Aurora).
        best: >-
          Yoğun yazılan ve kişiye göre okunan olaylar geniş sütunlu bir tabloda, kişi başına partition'larla tutulur. Trafik çok
          büyüyünce olaylar önce bir akışa (Kinesis, MSK) yazılır ve oradan tabloya aktarılır.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              "My activity" sayfasını açtın. Açılırken oturumun güncellendi.
            engines: [elasticache]
          - text: >-
              Sayfa "This browser" (bu tarayıcı) seçiliyken geçmişi istedi; uygulama Keyspaces'e bu tarayıcının partition'ı için
              SELECT gönderdi. Baktığın ürünler ve verdiğin sipariş listelendi. Simülasyonun ilk okuması bu.
            engines: [keyspaces]
          - text: >-
              Sonra "My persona (seeded)" butonuna bastın. Tarayıcın aynı isteği who=persona ile gönderdi; uygulama bu kez seçtiğin
              müşterinin numarasıyla (ör. C00001) okudu. Simülasyonun ikinci okuması bu.
            engines: [keyspaces]
          - text: >-
              Liste müşterinin geçmişiyle doldu: aramalar, istek listesine eklemeler, sepetten çıkarmalar, satın almalar; en yenisi
              üstte.
            engines: [keyspaces]
      sim:
        kind: partition
        title: "Keyspaces tablosu: dbws.activity_by_user"
        caption: >-
          Tablodan küçük bir kesit: üç partition. C00001'in satırları canlı tablodan; bu tarayıcının satırları senin önceki
          adımlarına benzeyen örnekler. İki okuma iki ayrı gerçek istek: önce sayfa açılırken, sonra senin tıklamanla.
        result_title: Sayfaya giden hareketler
        partitions:
          - label: "7f3a… (bu tarayıcı)"
            me: true
            rows:
              - {time: "10 dk önce", type: purchase, product: P0001 Alpen Kablosuz Kulaklık 1}
              - {time: "25 dk önce", type: view, product: P0001 Alpen Kablosuz Kulaklık 1}
          - label: C00001 · Ayşe
            rows:
              - {time: "26 Eki 10:39", type: search, product: P0084 Anadolu Algoritmalar 84}
              - {time: "26 Eki 02:00", type: purchase, product: P0147 Nordwind Kahve Makinesi 147}
              - {time: "25 Eki 20:13", type: search, product: P0173 Anadolu Dambıl Seti 173}
              - {time: "25 Eki 17:50", type: wishlist, product: P0112 Kapadokya Robot Süpürge 112}
              - {time: "25 Eki 14:13", type: remove_from_cart, product: P0076 Nordwind Oyuncu Mouse 76}
              - {time: "25 Eki 13:43", type: search, product: P0053 Nordwind Dambıl Seti 53}
          - label: C00002 · Mert
            rows:
              - {time: "26 Eki 09:12", type: view, product: P0090 Kapadokya Sırt Çantası 90}
              - {time: "25 Eki 18:40", type: purchase, product: P0044 Bulut Mimarisi 44}
        reads:
          - partition: "7f3a… (bu tarayıcı)"
            limit: 20
            say_send: >-
              "My activity" sayfasını açtın. Uygulama SELECT … WHERE user_id = '7f3a…' LIMIT 20 gönderiyor (t-1, İstek 1).
            say_read: Keyspaces sadece bu tarayıcının partition'ını açtı ve 2 satırı baştan okudu.
          - partition: C00001 · Ayşe
            limit: 20
            say_send: >-
              "My persona" butonuna bastın. Uygulama aynı SELECT'i user_id = 'C00001' ile gönderiyor (t0, İstek 2).
            say_read: >-
              Keyspaces sadece C00001'in partition'ını açtı ve satırları baştan okudu; en yeni olay en üstte. Gerçek tabloda 20.
              satırda durur (LIMIT 20).
        back: >-
          Uygulama satırları tarayıcına gönderdi; liste persona'nın geçmişiyle dolacak.
        summary: >-
          İki istek, iki farklı partition, aynı soru. Keyspaces her seferinde sadece bir defteri açtı ve hazır sırayla baştan okudu;
          tablonun geri kalanına hiç dokunmadı.
      wire:
        what: >-
          Uygulama, Keyspaces'e açık tuttuğu bağlantı üzerinden komutu gönderir (cassandra-driver). Bağlantı her istekte yeniden
          kurulmaz.
        dst: "cassandra.eu-central-1.amazonaws.com : 9142"
        dst_note: >-
          Keyspaces'in bölge adresi. Bu ad, VPC'nin içindeki interface endpoint'in özel IP'sine çözülür; trafik internete çıkmaz.
        rows:
          - [Şifreleme, TLS, gerçek, Keyspaces sadece şifreli bağlantı kabul eder.]
          - [Protokol, "CQL ikili protokolü, sürüm 4", gerçek, "Cassandra'nın kendi dili; tutarlılık seviyesi her komutun yanında gider."]
          - [Kimlik, "SigV4, bağlantı açılırken", gerçek, "Uygulama IAM rolünün geçici kimliğiyle imzalı bir doğrulama gönderdi. Şifre yok."]
        body_label: Çerçevenin içeriği (okunur hâle getirilmiş)
        body: |-
          QUERY
            SELECT event_time, event_type, product_id, detail FROM dbws.activity_by_user WHERE user_id = ? LIMIT 20
            değer      : 'C00001'
            tutarlılık : LOCAL_QUORUM
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Hangi deftere
        bakılacağını uygulama seçer: bu tarayıcı mı, persona mı.
      app_code:
        - file: engines/keyspaces.py
          func: api_activity
          title: Hareketler isteği (iki istekte de aynı kod)
          sub: Adresteki who=visitor ya da who=persona hangi partition'ın okunacağını seçer.
          lines:
            - {match: '@bp.get("/api/activity")', say: "Hareketler isteği buraya gelir.", tag: Tarayıcı → Uygulama}
            - {match: 'who = request.args.get("who", "visitor")', say: "Kimin geçmişi isteniyor: bu tarayıcı mı, persona mı?", tag: Uygulamanın içinde}
            - {match: 'level = request.args.get("consistency", "LOCAL_QUORUM")', say: "Hangi tutarlılıkla okunacak (Adım 28).", tag: Uygulamanın içinde}
            - {match: 'uid = persona_id() if who == "persona" else visitor_id()', say: "Partition key'i seçer: persona'nın numarası ya da tarayıcının kimliği (çerezlerden).", tag: Uygulamanın içinde, hl: pk}
            - {match: 'rows = list(s().execute(SimpleStatement(cql, consistency_level=', say: "SELECT Keyspaces'e gider; satırlar sırayla döner.", tag: [Uygulama → Keyspaces, Keyspaces → Uygulama], hl: where}
            - {match: 'return jsonify(trace.payload([{"event_time": r.event_time.isoformat()', say: Satırları sayfanın beklediği şekle çevirip tarayıcıya gönderir., tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek tabloda ne oldu?
        intro: Sayfa açılırken bu tarayıcı için giden okuma ve senin tıklamanla persona için giden okuma.
        runs:
          - label: Bu tarayıcı (sayfa açılınca)
            page_call: {path: /keyspaces/api/activity, query: {who: visitor}}
            metrics: [[Okunan satır, items], [Süre, ms]]
          - label: Persona (senin tıklaman)
            trigger: true
            metrics: [[Okunan satır, items], [Süre, ms]]
        reading: >-
          Bu tarayıcının partition'ında sadece senin bu oturumdaki hareketlerin var; persona'nın partition'ında kurulumdan gelen
          uzun bir geçmiş var ve okuma 20 satırda durdu. Persona'nın örnek geçmişi 7 gün sonra TTL ile silinir; o zaman liste
          kısalır. Süre her istekte biraz değişir.
      query:
        title: Uygulama Keyspaces'e ne dedi?
        intro: >-
          İki sütun, iki isteğin komutu. Tek fark partition key'in değeri. Bir parçanın üzerine gelince cümlede, kodda ve
          açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: sel
            say: Olayların zamanını, türünü, ürününü ve açıklamasını
            code: "SELECT event_time, event_type, product_id, detail FROM dbws.activity_by_user"
            name: Ne okunsun?
            note: Sayfanın gösterdiği dört alan.
            hl: type
          - id: wv
            say: bu tarayıcının partition'ından
            code: "  WHERE user_id = '7f3a…'"
            name: Hangi defter?
            note: Partition key; bu tarayıcının kimliği.
            hl: where
          - id: wp
            say: seçtiğin müşterinin partition'ından
            code: "  WHERE user_id = 'C00001'"
            name: Hangi defter?
            note: Aynı tablo, başka bir defter. Partition key olmadan bu tabloda arama yapılamaz.
            hl: where
            tag: sadece sağdaki komutta var
          - id: lim
            say: en yeni 20 tanesini oku.
            code: "  LIMIT 20"
            name: Kaç tane?
            note: Satırlar zaten yeniden eskiye sıralı; ilk 20 satır en yeni 20 olaydır.
            hl: ck
        columns:
          - label: Bu tarayıcı
            sub: Sayfa açılırken giden komut.
            via: Uygulama bu komutu cassandra-driver'ın execute() metoduyla, seçilen tutarlılık seviyesiyle gönderir.
            parts: [sel, wv, lim]
          - label: Persona
            sub: Senin "My persona" tıklamanla giden komut.
            via: Aynı execute() çağrısı; uygulama partition key olarak persona'nın numarasını koydu.
            parts: [sel, wp, lim]
            mark: [wp]
        note: >-
          Dikkat: iki komutta da ORDER BY yok. Sıra tablo kurulurken bir kez belirlendi; okuma sadece baştan okur.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          Keyspaces'in işi satırları verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: Keyspaces → Uygulama
            text: "{items} satır geldi, en yenisi üstte."
          - who: Uygulama
            text: Zamanı ISO biçimine çevirdi; satırları tür, ürün ve açıklamayla listeledi.
          - who: Uygulama → Tarayıcın
            text: Hareketleri ve isteğin kaydını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: Listeyi persona'nın hareketleriyle yeniden çizdi.
          - who: Sonra
            text: Bir sonraki adımda aynı okumayı daha ucuz bir tutarlılıkla (LOCAL_ONE) yapacaksın.
      remember: >-
        Keyspaces'te kişi başına bir partition ve zamana göre sıralı satırlar, "bu kişinin son hareketleri" sorusunu her ölçekte
        tek bir defter okumasıyla cevaplar. Partition key'i değiştirmek başka bir defteri açmaktır.
      why_db: >-
        Neden Keyspaces? Olaylar çok sık yazılır, hiç güncellenmez ve hep kişiye göre okunur. Keyspaces bunu sunucusuz, partition
        başına sıralı ve TTL'li olarak sunar. Bedeli: JOIN ve esnek sorgu yoktur; her yeni soru yeni bir tablo tasarımı ister.

  - page: activity
    path: /account/activity
    engines: [keyspaces]
    use_case: Ayarlanabilir tutarlılık
    title: Tek kopyayı yarı maliyetle oku
    why: >-
      Persona'nın geçmişi listelendi. Şimdi aynı listeyi daha ucuz bir okuma türüyle isteyeceksin ve neyin değiştiğine
      bakacaksın.
    do: Aydınlık "LOCAL_ONE" butonuna tıkla.
    target: "#exp-cl [data-value=LOCAL_ONE]"
    action: click
    wait: {method: GET, path: /keyspaces/api/activity, query: {consistency: LOCAL_ONE}}
    focus: "#feed"
    result: The result is the same here; the read cost is half.
    panel:
      need: >-
        Hareketler listesi sık okunur. Her okuma para harcar. Ama kullanıcı bir şey yaptıktan hemen sonra listeye bakıyorsa,
        yaptığı şeyi görmeli. İki ihtiyaç farklı: biri ucuz olsun, diğeri en yeni yazmayı kesin göstersin.
      concept:
        term: Tutarlılık seviyesi (LOCAL_QUORUM ve LOCAL_ONE)
        text: >-
          Keyspaces her satırı bir bölgenin üç farklı veri merkezinde (Availability Zone) üç kopya olarak tutar. Yazma her zaman
          en az iki kopyaya ulaşınca onaylanır (LOCAL_QUORUM). Okurken seçersin: LOCAL_QUORUM iki kopyaya sorar ve en yenisini
          alır, bu yüzden onaylanmış her yazmayı görür; LOCAL_ONE tek bir kopyaya sorar, yarı fiyatına okur ama çok yeni bir
          yazmayı kaçırabilir. Üç arkadaştan ikisine sorup en güncel cevabı almak ya da birine sorup geçmek gibi.
        terms:
          - [LOCAL_QUORUM, "Üç kopyanın ikisine sorar. Onaylanmış her yazmayı görür."]
          - [LOCAL_ONE, "Tek kopyaya sorar. Yarı maliyet; çok yeni bir yazmayı kaçırabilir."]
          - [Replica (kopya), "Aynı satırın farklı Availability Zone'lardaki kopyaları."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde tutarlılık seviyesi için hazırlık
        intro: >-
          Liste hiç okunmadan, her ekranın hangi tutarlılıkla okuyacağı belirlenir. Aşağıdaki beş adım bu hazırlığın sırasıdır.
        text:
          - title: Önce her okumanın ihtiyacı yazılır
            text: >-
              "Bir an önceki bir yazmayı kaçırmak sorun olur mu?" Kullanıcının kendi işleminden hemen sonra gösterilen liste için
              olur; arka plandaki raporlar ve öneriler için olmaz.
          - title: Yazma tutarlılığı sabittir
            text: >-
              Keyspaces'te yazmalar her zaman LOCAL_QUORUM'dur: üç kopyadan ikisi onaylamadan yazma tamamlanmaz. Bu yüzden
              LOCAL_QUORUM okuma, onaylanmış her yazmayı görür (2 + 2 > 3).
          - title: Okuma seviyesi her komutta seçilir
            text: >-
              Tutarlılık tablo ayarı değil, komutun parametresidir. Sürücüde varsayılan bir seviye tanımlanır, gereken komutlarda
              değiştirilir.
            code: |-
              SimpleStatement(cql, consistency_level=ConsistencyLevel.LOCAL_ONE)
          - title: Maliyet ve hız hesaplanır
            text: >-
              LOCAL_ONE okuma, LOCAL_QUORUM okumanın yarı birimini harcar. Çok okunan, gecikmeye dayanıklı ekranlarda okuma
              faturası yarıya iner. Süre farkı küçüktür ve ağ koşullarına göre değişir.
          - title: Kendi yazdığını görme kuralı korunur
            text: >-
              Kullanıcının az önce yaptığı işlemi göstermesi gereken ekran LOCAL_QUORUM'da kalır. LOCAL_ONE sadece gecikmenin fark
              edilmeyeceği yerlerde kullanılır.
      feed:
        title: Veri nereden geliyor?
        writes: Uygulama. Ürün sayfası açılınca "view", sipariş verilince "purchase" ve benzeri olaylar.
        reads: Uygulama, "My activity" (hareketlerim) sayfası ve "son baktıkların" şeridi için.
        kind: >-
          Uygulama orkestrasyonu: Keyspaces'e yazan da ondan okuyan da uygulamadır. Kopyalama Keyspaces'in kendi içindedir: her
          satırı üç kopya olarak kendisi tutar.
        with: >-
          Hareketler sayfasındaki ürün adları satırların detail alanında, yazıldıkları anki kopyalarıyla durur (katalogdan,
          DocumentDB). Satın alma olayının asıl siparişi ilişkisel veritabanındadır (Aurora).
        best: >-
          Yoğun yazılan ve kişiye göre okunan olaylar geniş sütunlu bir tabloda, kişi başına partition'larla tutulur. Trafik çok
          büyüyünce olaylar önce bir akışa (Kinesis, MSK) yazılır ve oradan tabloya aktarılır.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Bir önceki adımda persona'nın geçmişini LOCAL_QUORUM ile okudun (sayfadaki varsayılan). Bu, simülasyonun sol şeridi.
            engines: [keyspaces]
          - text: >-
              "LOCAL_ONE" butonuna bastın. Tarayıcın aynı isteği consistency=LOCAL_ONE ile gönderdi; uygulama aynı SELECT'i tek
              kopyaya soracak şekilde gönderdi. Simülasyonun sağ şeridi bu istek.
            engines: [keyspaces]
          - text: >-
              Liste aynı kaldı: bu partition'a son anda kimse yazmadığı için tek kopya da güncel. Okuma yarı birim harcadı.
            engines: [keyspaces]
      sim:
        kind: replicas
        engine_label: Keyspaces
        caption: >-
          Persona'nın en yeni satırının üç kopyası. Fark görülebilsin diye bir an önce yeni bir olay yazıldığını ve bir kopyanın
          onu henüz almadığını varsayıyoruz. Solda LOCAL_QUORUM, sağda LOCAL_ONE; ikisi de gerçek istek.
        key: C00001 en yeni olay
        old: search P0084
        new: view P0021
        lag: [c]
        nodes:
          - {id: a, label: "Kopya 1 (AZ-a)"}
          - {id: b, label: "Kopya 2 (AZ-b)"}
          - {id: c, label: "Kopya 3 (AZ-c)"}
        state_say: >-
          Yeni olay (view P0021) iki kopyaya yazıldı ve onaylandı; üçüncü kopya onu birazdan alacak.
        lanes:
          - id: quorum
            title: "t-1 · İstek 1 · Önceki okuma · LOCAL_QUORUM"
            reads: [b, c]
            pick: newest
            cost: "1 okuma birimi"
            send: Persona'nın geçmişi istendi; uygulama SELECT'i LOCAL_QUORUM ile gönderiyor.
            read_say: LOCAL_QUORUM iki kopyaya sordu; biri eski, biri yeni değeri verdi. Keyspaces en yenisini seçti.
            got_say: "Cevap: view P0021, en yeni olay. İki kopyadan biri güncel olduğu için kaçırılmadı."
            back: Uygulama listeyi tarayıcına gönderdi.
          - id: one
            title: "t0 · İstek 2 · Senin tıklaman · LOCAL_ONE"
            reads: [c]
            cost: "0,5 okuma birimi"
            send: '"LOCAL_ONE"a bastın. Uygulama aynı SELECT''i LOCAL_ONE ile gönderiyor.'
            read_say: LOCAL_ONE tek bir kopyaya sordu; bu kez yeni olayı henüz almamış olana denk geldi.
            got_say: "Cevap: search P0084, bir an önceki en yeni olay. Yarı fiyatına; birazdan bütün kopyalar güncel olur."
            back: Uygulama listeyi tarayıcına gönderdi; bu senaryoda yeni olay listede yok.
        summary: >-
          LOCAL_QUORUM iki kopyaya sorduğu için onaylanmış yeni yazmayı kesin gördü. LOCAL_ONE yarı fiyatına okudu ama tek kopyaya
          sorduğu için çok yeni bir yazmayı kaçırabildi. Gerçek denemende kimse yazmadığı için iki okuma da aynıydı.
      wire:
        what: >-
          Uygulama, Keyspaces'e açık tuttuğu bağlantı üzerinden komutu gönderir (cassandra-driver). Bağlantı her istekte yeniden
          kurulmaz.
        dst: "cassandra.eu-central-1.amazonaws.com : 9142"
        dst_note: >-
          Keyspaces'in bölge adresi. Bu ad, VPC'nin içindeki interface endpoint'in özel IP'sine çözülür; trafik internete çıkmaz.
        rows:
          - [Şifreleme, TLS, gerçek, Keyspaces sadece şifreli bağlantı kabul eder.]
          - [Protokol, "CQL ikili protokolü, sürüm 4", gerçek, "Cassandra'nın kendi dili; tutarlılık seviyesi her komutun yanında gider."]
          - [Kimlik, "SigV4, bağlantı açılırken", gerçek, "Uygulama IAM rolünün geçici kimliğiyle imzalı bir doğrulama gönderdi. Şifre yok."]
        body_label: Çerçevenin içeriği (okunur hâle getirilmiş)
        body: |-
          QUERY
            SELECT event_time, event_type, product_id, detail FROM dbws.activity_by_user WHERE user_id = ? LIMIT 20
            değer      : 'C00001'
            tutarlılık : LOCAL_ONE      ← çerçevenin içinde, komutla birlikte gider
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Tutarlılık seviyesi
        komutla birlikte gider; tablo aynı kalır.
      app_code:
        - file: engines/keyspaces.py
          func: api_activity
          title: Hareketler isteği
          sub: Adresteki consistency=LOCAL_ONE okumanın seviyesini seçer.
          lines:
            - {match: '@bp.get("/api/activity")', say: "Hareketler isteği buraya gelir.", tag: Tarayıcı → Uygulama}
            - {match: 'level = request.args.get("consistency", "LOCAL_QUORUM")', say: "Adresteki tutarlılık seviyesini okur; varsayılan LOCAL_QUORUM.", tag: Uygulamanın içinde, hl: node}
            - {match: 'rows = list(s().execute(SimpleStatement(cql, consistency_level=LEVELS.get(level', say: "SELECT'i bu seviyeyle Keyspaces'e gönderir.", tag: [Uygulama → Keyspaces, Keyspaces → Uygulama], hl: node}
            - {match: 'return jsonify(trace.payload([{"event_time": r.event_time.isoformat()', say: Satırları tarayıcıya gönderir., tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek tabloda ne oldu?
        intro: Önceki adımdaki LOCAL_QUORUM okuması ve senin tıklamanla giden LOCAL_ONE okuması.
        runs:
          - label: LOCAL_QUORUM (önceki okuma)
            page_call: {path: /keyspaces/api/activity, query: {consistency: LOCAL_QUORUM, who: persona}}
            metrics: [[Okunan satır, items], [Süre, ms]]
          - label: LOCAL_ONE (senin tıklaman)
            trigger: true
            metrics: [[Okunan satır, items], [Süre, ms]]
        reading: >-
          İki okuma da aynı satırları döndürdü. LOCAL_ONE, LOCAL_QUORUM'un yarı okuma birimini harcar (bu ekran birimi göstermiyor).
          Süre farkı küçüktür ve her istekte değişir; LOCAL_ONE bazen daha yavaş bile görünebilir. Asıl fark bedel ve garantidir.
      query:
        title: Uygulama Keyspaces'e ne dedi?
        intro: >-
          İki sütun, iki isteğin komutu. CQL metni aynı; fark, komutun yanında giden tutarlılık seviyesi.
        cards_title: Parça parça
        parts:
          - id: sel
            say: C00001'in en yeni 20 olayını
            code: "SELECT event_time, event_type, product_id, detail FROM dbws.activity_by_user WHERE user_id = 'C00001' LIMIT 20"
            name: Ne okunsun?
            note: Bir önceki adımdaki komutun aynısı.
            hl: node
          - id: q
            say: üç kopyadan ikisine sorarak oku.
            code: "-- consistency_level = LOCAL_QUORUM"
            name: Kaç kopyaya sorulsun?
            note: Onaylanmış her yazmayı görür. Varsayılan seviye.
            hl: node
          - id: o
            say: tek bir kopyaya sorarak, yarı maliyetle oku.
            code: "-- consistency_level = LOCAL_ONE"
            name: Kaç kopyaya sorulsun?
            note: Yarı maliyet; çok yeni bir yazmayı kaçırabilir.
            hl: node
            tag: sadece sağdaki komutta var
        columns:
          - label: LOCAL_QUORUM
            sub: Önceki adımdaki okuma.
            via: Uygulama bu komutu cassandra-driver'ın execute() metoduyla, SimpleStatement'a seviyeyi koyarak gönderir.
            parts: [sel, q]
          - label: LOCAL_ONE
            sub: Senin "LOCAL_ONE" tıklamanla giden komut.
            via: Aynı execute() çağrısı; sadece consistency_level değişti.
            parts: [sel, o]
            mark: [o]
        note: >-
          Dikkat: tutarlılık seviyesi CQL metninin içinde değil; sürücü onu komutun yanında ayrı bir alan olarak gönderir. Aynı
          sorgu metni farklı seviyelerle çalıştırılabilir.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          Keyspaces'in işi satırları verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: Keyspaces → Uygulama
            text: "{items} satır geldi; tek bir kopyadan."
          - who: Uygulama → Tarayıcın
            text: Hareketleri tarayıcıya gönderdi.
          - who: Tarayıcın
            text: Listeyi yeniden çizdi; görünen bir değişiklik yok.
          - who: Sonra
            text: >-
              Raporlar sayfasında bambaşka bir soru soracaksın: bütün siparişleri şehre göre topla. O soru bir analiz deposuna
              gider (Redshift, Adım 29).
      remember: >-
        Okuma tutarlılığını ekran ekran seç: kendi yazdığını görmesi gereken yerde LOCAL_QUORUM, gecikmeye dayanıklı yerde
        yarı maliyetli LOCAL_ONE.
      why_db: >-
        Neden Keyspaces? Olay geçmişi çok okunur ve çoğu ekran bir anlık gecikmeyi kaldırır. Keyspaces her okumada tutarlılığı ve
        bedeli seçtirir ve kopyaları kendisi yönetir. Bedeli: tutarlılık seçimini uygulama doğru yapmalıdır.

  # ---------------------------------------------------------------- Reports: Redshift
  - page: reports
    path: /admin/reports
    engines: [redshift]
    use_case: Geçmiş üzerinde analiz
    title: Satış geçmişini şehre göre topla
    why: >-
      Raporlar sayfasındasın. Bir yıllık satışlar aya göre toplanmış bir grafikte görünüyor. Şimdi aynı satışları şehre göre
      toplatacaksın.
    do: Aydınlık "City" (şehir) butonuna tıkla.
    target: "#exp-dim [data-value=city]"
    action: click
    wait: {method: GET, path: /redshift/api/report, query: {dim: city}}
    focus: "#chart-wrap"
    result: The SQL has GROUP BY city. Redshift scanned many rows but only the needed columns.
    panel:
      need: >-
        Rapor, bir yılın bütün satış kalemlerini okuyup şehre göre toplamalı: binlerce, büyük mağazalarda milyarlarca satır. Bu
        sorgu her satırın sadece birkaç alanını kullanır (şehir, sipariş, adet, tutar). Satırları baştan sona okumak, gerekmeyen
        alanları da diskten okumak demek; rapor yavaşlar ve aynı veritabanındaki siparişleri de yavaşlatır.
      concept:
        term: Sütun bazlı depolama (columnar)
        text: >-
          Redshift bir tabloyu satır satır değil, sütun sütun saklar: bütün şehirler bir blokta, bütün tutarlar başka bir blokta.
          Bir rapor sadece kullandığı sütunların bloklarını okur. Bir tablodaki "tutar" sütununu toplamak için bütün tabloyu değil,
          sadece o sütunu bir cetvelle aşağı doğru okumak gibi. Aynı türden değerler yan yana durduğu için çok iyi sıkışır.
        terms:
          - [Sütun bazlı (columnar), "Her sütun ayrı bloklarda saklanır; sorgu sadece gereken sütunları okur."]
          - [GROUP BY, "Satırları bir sütuna göre gruplayıp toplamak (şehre göre ciro)."]
          - [SORTKEY / DISTKEY, "Satırların diskte hangi sırayla ve hangi düğümlere dağıtılarak durduğu."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde analiz deposu için hazırlık
        intro: >-
          Rapor hiç açılmadan, satış tablosu analiz sorgularına göre kurulur ve doldurulur. Aşağıdaki beş adım bu hazırlığın
          sırasıdır.
        text:
          - title: Önce raporların soruları yazılır
            text: >-
              "Aya göre", "kategoriye göre", "şehre göre" ciro, sipariş ve adet. Hepsi çok satırı okuyup az sayıda sütunu toplayan
              sorgular; tek bir satırı bulmak isteyen yok.
            code: |-
              SELECT city, count(DISTINCT order_id), sum(qty), sum(amount) FROM sales GROUP BY 1 ORDER BY 4 DESC
          - title: Tablo raporlara uygun kurulur
            text: >-
              Raporların çoğu bir tarih aralığı seçtiği için tarih SORTKEY olur: Redshift gereksiz blokları tarihe bakarak atlar.
              Sık JOIN edilen anahtar DISTKEY olur: aynı müşterinin satırları aynı düğümde durur.
            code: |-
              CREATE TABLE sales (order_id varchar(16), order_date date SORTKEY, customer_id varchar(8) DISTKEY,
                                  city varchar(32), category varchar(32), product_id varchar(8), qty smallint, amount decimal(12,2));
          - title: Veri toplu yüklenir
            text: >-
              Analiz deposuna satır satır INSERT yapılmaz; dosyalar S3'e konur ve COPY ile paralel yüklenir. Canlı veri ise
              işlemsel veritabanından zero-ETL ile akar (Adım 30).
            code: |-
              COPY sales FROM 's3://bucket/sales/' IAM_ROLE '…' FORMAT AS PARQUET;
          - title: Kapasite iş yüküne göre seçilir
            text: >-
              Redshift Serverless'ta sunucu seçilmez; taban kapasite (RPU) verilir ve sorgu geldikçe ölçeklenir, boşta ödeme
              yapılmaz. Sürekli yoğun panolar için sağlanan (provisioned) cluster daha ekonomik olabilir.
          - title: Sorgu planı ve süre izlenir
            text: >-
              EXPLAIN ile sorgunun hangi sütunları taradığı ve verinin düğümler arasında taşınıp taşınmadığı görülür; sistem
              tablolarında (SYS_QUERY_HISTORY) sorgu süreleri izlenir.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Kullanıcı yazmaz. Geçmiş satışlar toplu yükleme ile (ör. S3'ten COPY) gelir; canlı siparişler işlemsel veritabanından
          zero-ETL ile kendiliğinden kopyalanır.
        reads: Rapor ekranları, panolar ve analistlerin sorguları.
        kind: >-
          Motordan motora: Aurora'nın değişiklikleri zero-ETL entegrasyonuyla Redshift'e akar; arada uygulama ya da yazılmış bir
          veri hattı yoktur. Geçmiş veri ise toplu yüklemeyle gelir.
        with: >-
          Raporun her satırı başka bir veritabanında doğdu: sipariş Aurora'da yazıldı, Redshift onun kopyasını tutuyor. Aynı
          sipariş Keyspaces'te olay, ElastiCache'te sıralama puanı olarak da durur; rapor için doğru kaynak Redshift'teki kopyadır.
        best: >-
          Analiz sorguları işlemsel veritabanında değil, sütun bazlı bir analiz deposunda çalışır. İşlemsel veri ona zero-ETL ile
          kod yazmadan, saniyeler içinde akar; ağır raporlar siparişleri hiç yavaşlatmaz.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              "Reports" (raporlar) sayfasını açtın. Açılırken oturumun güncellendi.
            engines: [elasticache]
          - text: >-
              Sayfa "History (seeded)" ve "Month" seçiliyken raporu istedi; uygulama Redshift'e aya göre gruplayan bir sorgu
              gönderdi ve grafik çizildi.
            engines: [redshift]
          - text: >-
              "City" butonuna bastın. Tarayıcın aynı raporu dim=city ile istedi; uygulama sorguyu şehre göre gruplayacak şekilde
              değiştirip gönderdi. Simülasyonun sol şeridi bu sorgu.
            engines: [redshift]
          - text: >-
              Grafik ve tablo şehirlerle yeniden çizildi: her şehir için sipariş sayısı, adet ve ciro.
            engines: [redshift]
      sim:
        kind: columnar
        caption: >-
          Satış tablosundan 8 satırlık örnek bir kesit; gerçek tabloda bir yıllık binlerce kalem var. Sorgu 8 sütundan 4'ünü
          kullanıyor (altı çizili). Solda Redshift'in sütun bazlı okuması, sağda olsaydı: aynı sorgu satır bazlı bir veritabanında.
        cols: [order_id, order_date, customer_id, city, category, product_id, qty, amount]
        used: [city, order_id, qty, amount]
        group: city
        sum: amount
        result_title: "Şehre göre ciro (₺)"
        labels:
          col: "t0 · Senin tıklaman · Sütun bazlı (Redshift)"
          row: "Olsaydı · Aynı sorgu · Satır bazlı veritabanı"
        send_col: >-
          "City"ye bastın. Uygulama Redshift'e GROUP BY city sorgusunu gönderiyor.
        back_col: Uygulama şehir satırlarını tarayıcına gönderdi; grafik yeniden çizilecek.
        send_row: Olsaydı - aynı sorgu satır bazlı bir veritabanına gitseydi.
        back_row: Sonuç aynı olurdu; ama her satır bütün alanlarıyla okunmuş olurdu.
        rows:
          - {order_id: O1001, order_date: "2026-03-02", customer_id: C00001, city: İstanbul, category: Elektronik, product_id: P0001, qty: 1, amount: 3373.84}
