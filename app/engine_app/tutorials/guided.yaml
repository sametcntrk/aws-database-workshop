        rows:
          - [Şifreleme, TLS, gerçek, ElastiCache Serverless sadece şifreli bağlantı kabul eder.]
          - [Protokol, RESP (Redis/Valkey protokolü), gerçek, "Her komut ayrı bir çerçeve; her biri bir gidiş-dönüş."]
          - [Kimlik, "ACL kullanıcısı + şifre, bağlantı açılırken", gerçek, "Şifre kodda yazmaz; uygulama onu AWS Secrets Manager'dan alır."]
        body_label: Komutlar ve cevaplar (okunur hâle getirilmiş)
        body: |-
          ZREVRANGE lm:leaderboard 0 9 WITHSCORES   → C00002 1168114.91, C00001 468561.35, C00487 237363.13, …
          GET lm:orders:today                       → "6"
          ZCOUNT lm:active 1793397600 +inf          → 3
          GET lm:name:C00487                        → "Mehmet Yılmaz"     (ve persona olmayan her üye için birer GET)
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Sıralamayı ElastiCache
        hazır tutar; adları birleştiren uygulamadır.
      app_code:
        - file: engines/elasticache.py
          func: api_lb
          title: Liderlik tablosu isteği
          sub: Sayfa açılırken ve her 5 saniyede gelen istek.
          lines:
            - {match: '@bp.get("/api/leaderboard")', say: "Liderlik tablosu isteği buraya gelir.", tag: Tarayıcı → Uygulama}
            - {match: 'top = cmd("ZREVRANGE"', say: "İlk 10 üyeyi puanlarıyla ister; sıralama hazır.", tag: [Uygulama → ElastiCache, ElastiCache → Uygulama], hl: member}
            - {match: 'orders = cmd("GET", "GET lm:orders:today"', say: Bugünkü sipariş sayacını ister., tag: [Uygulama → ElastiCache, ElastiCache → Uygulama]}
