            - {match: 'name = names.get(member) or r().get(f"lm:name:{member}") or member', say: "Persona değilse adını ayrı bir GET ile sorar; her üye için bir komut daha.", tag: [Uygulama → ElastiCache, ElastiCache → Uygulama]}
            - {match: 'return jsonify(trace.payload({"top": rows, "orders_today":', say: "İlk 10'u, sipariş sayısını ve aktif ziyaretçi sayısını tarayıcıya gönderir.", tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek bellekte ne oldu?
        intro: Sayfa açılırken ElastiCache'e giden komutlar.
        runs:
          - label: Liderlik tablosu (sayfa açılınca)
            trigger: true
            metrics: [[ZREVRANGE, ms], [GET (sayaç), e1.ms], [ZCOUNT, e2.ms], [Bugünkü sipariş, data.orders_today], [Aktif ziyaretçi, data.active_visitors]]
        reading: >-
          Her komut yaklaşık bir milisaniye. Ad sorgularının (GET lm:name:…) süresi isteğin kaydına yazılmıyor ama her biri ayrı bir
          gidiş-dönüş. Bugünkü sipariş ve aktif ziyaretçi sayısı mağazanın o anki durumuna göre değişir.
      query:
        title: Uygulama ElastiCache'e ne dedi?
        intro: >-
          Üç ana komut ve ad sorguları. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: zr
            say: Liderlik tablosunun en yüksek puanlı 10 üyesini puanlarıyla getir,
            code: "ZREVRANGE lm:leaderboard 0 9 WITHSCORES"
            name: Kimler önde?
            note: 0 ile 9 sıra numaralarıdır (ilk 10). REV, en yüksekten başla demek.
            hl: member
          - id: gt
            say: bugünkü sipariş sayısını getir,
            code: "GET lm:orders:today"
            name: Kaç sipariş?
            note: Her siparişte INCR ile artan sayaç.
            hl: member
          - id: zc
            say: son 5 dakikada görülen ziyaretçileri say,
            code: "ZCOUNT lm:active <şimdi − 300> +inf"
            name: Kaç kişi aktif?
            note: Puanı son görülme zamanı olan sıralı kümede bir zaman aralığını saymak.
            hl: member
          - id: nm
            say: ve persona olmayan her üyenin adını ayrı ayrı getir.
            code: "GET lm:name:<id>   (her üye için)"
            name: Adlar
            note: Tek bir MGET ile bir kerede alınabilirdi; burada her biri ayrı bir komut.
            hl: member
        columns:
          - label: Canlı ekran
            sub: Sayfa açılırken (ve her 5 saniyede) giden komutlar.
            via: Uygulama bu komutları redis-py kütüphanesinin zrevrange(), get() ve zcount() metotlarıyla, sırayla gönderir.
            parts: [zr, gt, zc, nm]
        note: >-
          Dikkat: komutlarda "sırala" diye bir şey yok. Sıralama ZINCRBY ile her yazmada yapıldı; okuma sadece baştan aldı.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          ElastiCache'in işi cevapları verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: ElastiCache → Uygulama
            text: İlk 10 üye ve puanları, sipariş sayacı, aktif ziyaretçi sayısı ve adlar geldi.
          - who: Uygulama
            text: Her üyeye sıra numarasını ve adını ekledi, puanları iki basamağa yuvarladı.
          - who: Uygulama → Tarayıcın
            text: Tabloyu ve sayaçları tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: Tabloyu ve sayaçları çizdi; 5 saniye sonra aynı isteği yeniden gönderecek.
          - who: Sonra
            text: Operasyon ekranına geçeceksin; orada zaman serisi verisi bir zaman veritabanında (InfluxDB) duruyor (Adım 34).
      remember: >-
        Sıralı küme sıralamayı yazarken korur; okumak sadece baştan almaktır. Ekranın her yenilemesi birkaç komut ve birkaç
        milisaniyedir; ek gidiş-dönüşleri tek bir komutta toplamak hızı korur.
      why_db: >-
        Neden ElastiCache? Canlı sıralama her saniye okunur ve her siparişte değişir; ElastiCache'in sorted set'i bunu bellekte,
        yazarken sıralayarak ve milisaniyenin altında sunar. Bedeli: sıralama bir kopyadır; asıl ciro siparişlerden hesaplanır.

  # ---------------------------------------------------------------- Ops: InfluxDB
  - page: ops
    path: /admin/ops
    engines: [influxdb]
    use_case: Time-series metrics
    title: One value per time window
    why: >-
      Each sensor reading is one point: a time, tags and a value. aggregateWindow calculates one mean per window. A larger window returns fewer points.
    do: Click the lit button "1 h".
    target: "#exp-win [data-value='1h']"
    action: click
    wait: {method: GET, path: /influxdb/api/series, query: {window: 1h}}
    focus: "#temp-wrap"
    result: The Flux query has range, filter and aggregateWindow. Fewer, smoother points came back. The raw points stay in the bucket.

  # ---------------------------------------------------------------- Graph: Neptune
  - page: graph
    path: /admin/graph
    engines: [neptune]
    use_case: Relationship analysis
    title: The neighbourhood of a customer
    why: Lukas Weber buys books only. Other customers bought the same books. A graph query follows edges. It does not join tables.
    do: Select "Lukas Weber" in the lit list.
    target: "#who"
    action: change
    wait: {method: GET, path: /neptune/api/graph, query: {persona: C00004}}
    focus: "#graph"
    result: The graph shows Lukas, his books, and other buyers of the same books.

  # ---------------------------------------------------------------- Seller: S3
  - page: seller
    path: /seller
    engines: [s3]
    use_case: Private files, direct download
    title: A presigned URL
    why: >-
      The bucket is private. The Engine App signs a URL with its IAM role. The browser then downloads the object from S3 itself, and the bytes do not go through EC2.
    do: Click the lit button "Presigned URL, straight from S3".
    target: "#via-presign"
    action: click
    wait: {method: GET, path: /s3/api/presign/*}
    focus: "#direct"
    result: The URL host is the S3 endpoint. The query string has X-Amz-Signature and X-Amz-Expires.

  - page: seller
    path: /seller
    engines: [s3]
    use_case: Object storage
    title: Upload an image as an object
    why: S3 stores each file as an object with a key, the bytes and metadata. Versioning keeps the old version when you upload to the same key again.
    do: In the lit form, select a small JPEG or PNG file, then click "Upload".
    target: "#upload"
    action: click
    wait: {method: POST, path: /s3/api/upload}
    focus: "#gallery-wrap"
    result: PutObject stored your file with its metadata and returned a new version ID. The uploads/ list shows the object.
