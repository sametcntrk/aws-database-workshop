  # ---------------------------------------------------------------- Search: OpenSearch
  - page: search
    path: /search?q=kablosuz%20kulaklik
    engines: [opensearch]
    use_case: Metin araması
    title: Analyzer hangi kelimelerin eşleşeceğine karar verir
    why: >-
      Arama sayfasındasın; arama kutusunda Türkçe harfler olmadan "kablosuz kulaklik" yazılı ve ürünler listelendi. Şimdi
      arama motorunun kelimeleri nasıl işlediğini değiştirip sonucun ve puanların nasıl değiştiğine bakacaksın.
    do: Aydınlık "standard" butonuna tıkla. Bu, aramayı Türkçe harfleri olduğu gibi tutan ayarla tekrarlar.
    target: "#exp-analyzer [data-value=standard]"
    action: click
    wait: {method: GET, path: /opensearch/api/search, query: {analyzer: standard}}
    focus: "#hits"
    result: The same products came back with a lower score. With the standard analyzer, "kulaklik" matches the name only through fuzziness.
    panel:
      need: >-
        Ziyaretçiler aramayı çoğu zaman Türkçe harfler olmadan yazar: "kulaklik", "hoparlor". Ürün adlarında ise "Kulaklık",
        "Hoparlör" yazıyor. Aramanın bu iki yazımı aynı kelime sayması, ayrıca 200 ürünün içinden en ilgili olanları en
        üste koyması gerekiyor. Bunu bir veritabanında "LIKE '%kulak%'" gibi satır satır tarayarak yapmak hem yavaş hem kaba
        olurdu.
      concept:
        term: Ters index (inverted index) ve analyzer
        text: >-
          Arama motoru her ürünün adını kelimelere böler ve bir "kelime → geçtiği ürünler" listesi tutar. Buna ters index
          denir; bir kitabın sonundaki dizine benzer, ama her kelime için. Kelimeye bölme ve onları sadeleştirme işini
          analyzer yapar: harfleri küçültür, isterse ı'yı i'ye, ö'yü o'ya çevirir. Aynı analyzer hem ürün yazılırken hem
          arama yapılırken çalışır; iki taraf aynı kelimeyi üretirse eşleşme olur. Eşleşen her ürüne bir skor (relevance)
          verilir; en yüksek skor en üstte.
        terms:
          - [Token, "Analyzer'ın ürettiği tek bir kelime. \"Kablosuz Kulaklık\" → kablosuz, kulaklik."]
          - [tr_folded, "Bu mağazanın analyzer'ı: Türkçe küçük harf + Türkçe harfleri sadeleştirme (ı→i, ö→o, ş→s)."]
          - [standard, "Varsayılan analyzer: küçültür ama Türkçe harfleri olduğu gibi tutar (kulaklık)."]
          - [Fuzziness, "Bir iki harf farkla yazılmış kelimeleri de eşleştirme. AUTO, kelime uzunluğuna göre 1–2 harf fark kabul eder."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde arama index'i için hazırlık
        intro: >-
          Arama kutusu hiç kullanılmadan, ürünler arama motoruna kendi analyzer'larıyla yazılır. Aşağıdaki beş adım bu
          hazırlığın sırasıdır.
        text:
          - title: Önce aramanın soruları yazılır
            text: >-
              Ziyaretçi nasıl yazacak? Türkçe harfsiz ("kulaklik"), yazım hatalı ("kulaklk"), birden fazla kelimeyle. Hangi
              alan daha önemli? Adda geçen kelime, açıklamada geçenden değerlidir. Bu kararlar index kurulmadan verilir.
            code: |-
              multi_match: { query: "kablosuz kulaklik", fields: ["name^3", "description"], fuzziness: "AUTO" }
          - title: Dil için bir analyzer tanımlanır
            text: >-
              Türkçe için harf küçültme Türkçe kurallarla yapılır (I → ı, İ → i) ve ardından harfler sadeleştirilir
              (asciifolding). Böylece "Kulaklık" index'e "kulaklik" olarak yazılır ve ASCII aramalar onu bulur.
            code: |-
              "analysis": { "filter": { "tr_lower": { "type": "lowercase", "language": "turkish" } },
                            "analyzer": { "tr_folded": { "tokenizer": "standard", "filter": ["tr_lower", "asciifolding"] } } }
          - title: Aynı alan iki şekilde index'lenebilir
            text: >-
              Bir alan hem sadeleştirilmiş hem orijinal hâliyle tutulabilir (multi-field). Böylece aynı veriyle hem esnek arama
              hem birebir eşleşme yapılır; kategori gibi alanlar ise analyzer'sız keyword olarak tutulur (filtre ve sayım için).
            code: |-
              "name": { "type": "text", "analyzer": "tr_folded", "fields": { "std": { "type": "text", "analyzer": "standard" } } },
              "category": { "type": "keyword" }
          - title: Analyzer önceden denenir
            text: >-
              _analyze ile bir metnin hangi token'lara bölündüğü görülür. Analyzer sonradan değiştirilirse bütün ürünlerin
              yeniden index'lenmesi gerekir; bu yüzden yayından önce denenir.
            code: |-
              POST products/_analyze { "analyzer": "tr_folded", "text": "Kablosuz Kulaklık" }  →  ["kablosuz", "kulaklik"]
          - title: Kapasite parçalara bölünür
            text: >-
              Index parçalara (shard) bölünür ve her parçanın bir kopyası (replica) başka bir sunucuda durur; bir sunucu düşse
              de arama çalışır. Bu katalogda products index'i 5 parçalı ve her parçanın 1 kopyası var, domain 3 sunucudan oluşuyor.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Arama index'ine kullanıcı yazmaz. Ürünlerin asıl kaydı katalog veritabanındadır; arama motoru ondan beslenir.
        reads: Uygulama, arama sayfası ve arama kutusunun öneri listesi için.
        kind: >-
          OpenSearch başka bir veritabanından kendiliğinden veri çekmez; birinin onu beslemesi gerekir. Besleme ya bir ara
          servisle (Amazon OpenSearch Ingestion) ya da kataloğun değişikliklerini okuyan bir programla yapılır.
        with: >-
          Arama sonucundaki ürünlerin asıl kaydı katalogdadır (DocumentDB); kartlardaki görseller nesne deposundan (S3) gelir.
          Kartta arama motorunun döndürdüğü alanlar (ad, fiyat, kategori) gösterilir; daha fazla bilgi gerekirse ürün sayfası
          kataloğa sorar.
        best: >-
          Katalog tek yerde tutulur; arama index'i ondan otomatik beslenir. DocumentDB'nin OpenSearch ile zero-ETL
          entegrasyonu önce bütün ürünleri yükler, sonra her değişikliği change streams ile birkaç saniye içinde taşır.
          Uygulama aynı ürünü iki yere ayrı ayrı yazmaz.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Arama sayfası "kablosuz kulaklik" aramasıyla açıldı; Türkçe harfler olmadan, birçok kişinin yazdığı gibi. Açılırken
              oturumun güncellendi.
            engines: [elasticache]
          - text: >-
              Sayfa açılırken tarayıcın uygulamaya aramayı gönderdi; uygulama OpenSearch'e "ad ve açıklamada ara, adı 3 kat
              önemli say, yazım hatasına izin ver" dedi. tr_folded seçiliydi. Simülasyonun sol şeridi bu istek.
            engines: [opensearch]
          - text: >-
              5 ürün listelendi, her birinin yanında bir skor. Soldaki kategori ve fiyat sayıları aynı cevaptan geldi. Kartların
              görselleri S3'ten.
            engines: [opensearch, s3]
          - text: >-
              Sonra "standard" butonuna bastın. Tarayıcın aynı aramayı analyzer=standard ile istedi; uygulama bu kez adın
              Türkçe harfleri koruyan kopyasında (name.std) aradı. Simülasyonun sağ şeridi bu istek.
            engines: [opensearch]
          - text: >-
              Aynı 5 ürün geldi ama skorları biraz düştü. "kulaklik" bu alanda birebir yok; fuzziness açık olduğu için bir harf
              farkla "kulaklık" eşleşti.
            engines: [opensearch]
      sim:
        kind: inverted-index
        caption: >-
          Ürün adlarının ters index'inden küçük bir kesit: 7 gerçek ürün. Solda tr_folded ile index'lenmiş ad alanı, sağda
          standard ile index'lenmiş kopyası (name.std). İki şerit iki ayrı gerçek istek: soldaki sayfa açılırken, sağdaki senin
          tıklamanla gitti. Skorlar gerçek sonuçlardan.
        docs:
          - {id: P0136, name: Bosphorus Kablosuz Kulaklık 136}
