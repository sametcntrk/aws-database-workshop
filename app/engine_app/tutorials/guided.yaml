        body: |-
          QUERY
            SELECT product_id, detail, event_type FROM dbws.activity_by_user WHERE user_id = ? LIMIT 40
            değer      : '7f3a…'   (bu tarayıcının kimliği)
            tutarlılık : LOCAL_QUORUM   (3 kopyanın 2'sinden oku)
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Her satırın
        etiketi işin nerede olduğunu söyler: mor etiketli satırda bir şey bir yerden bir yere gider (tarayıcıdan uygulamaya,
        uygulamadan Keyspaces'e ya da geri). Gri "Uygulamanın içinde" etiketli satırda iş uygulamanın kendi içinde yapılır,
        hiçbir yere bir şey gitmez.
      app_code:
        - file: engines/keyspaces.py
          func: api_event
          title: "1. Yazma: \"bu ürüne baktın\""
          sub: Sayfa açılır açılmaz gelen istek.
          lines:
            - {match: '@bp.post("/api/events")', say: "Tarayıcıdan gelen \"bu ürüne baktım\" isteği buraya gelir.", tag: [Tarayıcı → Uygulama]}
            - {match: 'cql = f"INSERT INTO', say: Keyspaces'e gidecek INSERT komutu hazırlanır., tag: [Uygulamanın içinde]}
            - {match: 's().execute(s().prepare(cql)', say: "Komut Keyspaces'e gider; soru işaretlerinin yerine senin kimliğin, şu anki zaman ve ürün konur. Keyspaces \"yazıldı\" diye cevap verir.", tag: [Uygulama → Keyspaces, Keyspaces → Uygulama], hl: insert}
            - {match: 'return jsonify(trace.payload({"stored": True}))', say: "Tarayıcıya \"kaydedildi\" cevabı döner.", tag: [Uygulama → Tarayıcı]}
        - file: engines/keyspaces.py
          func: api_recent
          title: "2. Okuma: \"Son baktıkların\""
          sub: Hemen ardından gelen istek.
          lines:
            - {match: '@bp.get("/api/recent")', say: "\"Son baktıkların\" şeridi için gelen istek buraya gelir.", tag: [Tarayıcı → Uygulama]}
            - {match: 'rows = list(s().execute(cql', say: "SELECT komutu gönderilir. Keyspaces senin partition'ından en fazla 40 satırı olduğu gibi geri verir.", tag: [Uygulama → Keyspaces, Keyspaces → Uygulama], hl: where}
            - {match: 'for r in rows:', say: Gelen satırlar tek tek ele alınır., tag: [Uygulamanın içinde], hl: app}
            - {match: 'if r.event_type == "view" and r.product_id not in seen:', say: "Sadece \"view\" satırları ve listede henüz olmayan ürünler geçer. add_to_cart, purchase ve tekrarlar burada elenir.", tag: [Uygulamanın içinde], hl: type}
            - {match: 'recent.append(', say: Geçen ürün listeye eklenir., tag: [Uygulamanın içinde], hl: app}
            - {match: 'return jsonify(trace.payload(recent[:8]))', say: "Listenin ilk 8 ürünü tarayıcıya gönderilir. Şeritte en fazla 8 ürün olmasının sebebi bu.", tag: [Uygulama → Tarayıcı], hl: app}
      live:
        title: Gerçek tabloda ne oldu?
        intro: >-
          Bu sayfa açılırken Keyspaces'e iki gerçek istek gitti. Sayılar o isteklerin kayıtlarından geliyor.
        runs:
          - label: "1. Yazma: INSERT"
            page_call: {path: /keyspaces/api/events}
            metrics: [[Yazılan satır, items], [Kapasite, capacity], [Süre, ms]]
          - label: "2. Okuma: SELECT"
            trigger: true
            metrics: [[Şeritteki ürün, items], [Süre, ms]]
        reading: >-
          INSERT tek bir satır yazdı ve 1 WRU (write request unit, yazma birimi) harcadı. Keyspaces sunucusuz çalışır:
          sunucu kiralamazsın, her okuma ve yazma birimi için ödersin. SELECT senin partition'ından en fazla 40 satır
          okudu; uygulama bunların içinden "view" olanları ve tekrar etmeyenleri ayıklayıp en fazla 8 ürünü şeride koydu.
          Sen bu tarayıcıyla ilk kez geziyorsan şeritte sadece bu ürün vardır. Süre her istekte biraz değişir.
      query:
        title: Sayfa Keyspaces'e ne dedi?
        intro: >-
          Simülasyondaki iki adım, iki gerçek CQL komutundan geliyor (CQL, Cassandra'nın SQL'e benzeyen sorgu dili).
          Solda önce giden yazma, sağda sonra giden okuma var. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada
          aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: ins
            say: activity_by_user tablosuna
            code: INSERT INTO dbws.activity_by_user
            name: Nereye?
            note: Olaylar tablosuna yeni bir satır yaz. dbws, tabloyu içeren keyspace (veritabanı gibi bir klasör).
            hl: table
          - id: cols
            say: kim, ne zaman, ne yaptı ve hangi ürün bilgilerini içeren
            code: (user_id, event_time, event_id, event_type, product_id, detail)
            name: Hangi alanlar?
            note: >-
              Satırın alanları. user_id partition key: satırın hangi deftere gideceğini o belirler. event_time clustering
              key: defterin içindeki sırayı belirler. event_id aynı anda iki olay olursa karışmasınlar diye.
            hl: pk
            indent: 2
          - id: vals
            say: yeni bir satır ekle.
            code: VALUES (?, ?, ?, ?, ?, ?)
            name: Hangi değerler?
            note: >-
              Her ? yerine uygulama gerçek değeri koyar: senin kimliğin, şu anki zaman, yeni bir kimlik, "view", ürün no
              ve ürünün adı. Satır 7 gün sonra kendiliğinden silinir (tablonun TTL ayarı).
            hl: insert
            indent: 2
          - id: sel
            say: activity_by_user tablosundan ürün, açıklama ve olay türünü
            code: SELECT product_id, detail, event_type FROM dbws.activity_by_user
            name: Ne okunuyor?
            note: Sadece şerit için gereken üç alanı oku.
            hl: type
          - id: where
            say: sadece bu tarayıcının partition'ından
            code: WHERE user_id = '7f3a…'
            name: Hangi defter?
            note: >-
              Partition key ile filtre. Keyspaces bu değerden doğru partition'ı bulur ve sadece onu okur. Partition key
              vermeden bu tabloda arama yapamazsın: Keyspaces hangi defteri açacağını bilemez.
            hl: where
            indent: 2
          - id: limit
            say: en fazla 40 satır oku.
            code: LIMIT 40
            name: Kaç tane?
            note: >-
              En yeni 40 satırda dur. Satırlar zaten yeniden eskiye sıralı durduğu için ORDER BY yazmaya gerek yok; ilk 40
              satır en yeni 40 olaydır.
            hl: ck
            indent: 2
        columns:
          - label: "1. Yazma"
            sub: Sayfa açılır açılmaz arka planda giden komut.
            via: >-
              Uygulama bu komutu cassandra-driver kütüphanesiyle gönderir: önce prepare() ile komutu bir kez hazırlatır,
              sonra execute() ile değerleri yollar.
            parts: [ins, cols, vals]
          - label: "2. Okuma"
            sub: Hemen ardından "Son baktıkların" şeridi için giden komut.
            via: >-
              Uygulama bu komutu yine cassandra-driver'ın execute() metoduyla gönderir. Satırları süzme işi bu komutta değil,
              uygulamanın kodunda (bir önceki bölümdeki kesit).
            parts: [sel, where, limit]
        note: >-
          Dikkat: iki komutta da sıralama için bir şey yazmıyoruz. Sıra, tablo kurulurken bir kez belirlendi
          (CLUSTERING ORDER BY event_time DESC). Keyspaces satırları yazarken o sıraya koyuyor, okurken sadece baştan okuyor.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          Keyspaces'in işi satırları verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: Keyspaces → Uygulama
            text: Senin partition'ından {read} satır döndü (en fazla 40). Satırlar en yeniden eskiye sıralı geldi.
          - who: Uygulama
            text: >-
              Satırları tek tek dolaştı: "view" olmayanları (ör. purchase) ve aynı ürünün tekrarlarını attı, kalanların ilk 8'ini tuttu.
          - who: Uygulama → Tarayıcın
            text: "{items} ürünlük listeyi JSON olarak, isteğin kaydıyla (trace) birlikte geri gönderdi."
          - who: Tarayıcın
            text: >-
              Listeyi "Recently viewed" şeridine çizdi. Kartlardaki adlar Keyspaces satırının detail alanından geldi;
              DocumentDB'ye yeniden sorulmadı.
          - who: Tarayıcın → S3
            text: >-
              Her kartın görselini ürün numarasından kurduğu adresle (/s3/api/img/P0001) ayrı ayrı istedi. Bu istekler S3'ün
              uygulama sunucusuna gider; o da S3'ten products/P0001.jpg nesnesini okuyup gönderir. Kartta adı (Keyspaces)
              ve görseli (S3) birleştiren tarayıcıdır.
          - who: Sonra
            text: >-
              Bu satırlar 7 gün sonra TTL ile kendiliğinden silinir. Başka bir ürüne bakarsan yeni bir view satırı partition'ın
              en üstüne girer ve o ürün şeridin başına geçer.
      remember: >-
        Keyspaces'te soruyu tablo tasarlanırken seçersin. "Bu kişinin son olayları" sorusu için satırlar kişiye göre
        partition'lara ayrılır ve zamana göre sıralı tutulur. Bu soru her ölçekte hızlıdır; tasarıma uymayan bir soru
        (ör. "bu ürüne kimler baktı?") için ayrı bir tablo gerekir.
      why_db: >-
        Neden Keyspaces? Olay kayıtları çok sık yazılır, hiç güncellenmez ve hep kişiye göre okunur. Keyspaces bu tür
        yoğun yazmayı sunucu yönetmeden karşılar ve eski satırları TTL ile kendisi siler. Bedeli: JOIN yok, esnek arama
        yok; her yeni soru için tabloyu o soruya göre tasarlaman gerekir.

  - page: product
    path: /p/P0001
    engines: [neptune]
    use_case: Öneriler
    title: Öneriler bir graf üzerinde yürüyüştür
    why: >-
      "Bunu alanlar şunları da aldı" önerileri Neptune adlı bir graf veritabanından geliyor. Graf, bir arkadaşlık ağı
      haritası gibidir: kişiler ve ürünler noktalar, "satın aldı" bilgisi de aralarındaki çizgilerdir. Şimdi önerileri
      bu ürüne göre değil, senin seçtiğin müşteriye göre isteyeceğiz.
    do: Aydınlık "For my persona" (benim için) butonuna tıkla.
    target: "#exp-recs [data-value=persona]"
    action: click
    wait: {method: GET, path: /neptune/api/recs, query: {mode: persona}}
    focus: "#recs-wrap"
    panel:
      need: >-
        İyi bir öneri için şu soru sorulur: "Benim gibi alışveriş yapanlar başka ne aldı?" Bunun cevabı tek bir kayıtta
        yazmaz. Müşteriden aldığı ürünlere, oradan o ürünleri alan diğer müşterilere, oradan da onların aldıklarına
        gitmek gerekir. Sayfa açılırken öneriler "bu ürüne göre" (2 adım) geldi; tıklamanla "sana göre" (3 adım) geldi.
      concept:
        term: Graf ve hop
        text: >-
          Bir graf, noktalar ve onları bağlayan çizgilerden oluşur. Noktalara düğüm (vertex), çizgilere kenar (edge)
          denir. Burada her müşteri ve her ürün bir düğüm, her satın alma da müşteriden ürüne giden bir BOUGHT kenarı.
          Bir kenar boyunca bir adım gitmeye hop denir. Neptune bir düğümden başlar ve kenarları takip eder, tıpkı bir
          haritada yol takip etmek gibi. Hiçbir tabloyu baştan sona taramaz.
        terms:
          - [Düğüm (vertex), "Bir şey: bir müşteri ya da bir ürün."]
          - [Kenar (edge), "İki düğüm arasındaki ilişki. Burada BOUGHT: bu müşteri bu ürünü aldı."]
          - [openCypher, "Graf sorgulama dili. Yolu çizer gibi yazarsın: (müşteri)-[:BOUGHT]->(ürün)."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde öneri grafı için hazırlık
        intro: >-
          Öneri butonuna hiç basılmadan, graf bu sayfanın sorularına göre kurulur ve doldurulur. Aşağıdaki beş adım bu
          hazırlığın sırasıdır.
        text:
          - title: Önce sayfanın soruları yazılır
            text: >-
              Öneri şeridinin iki sorusu var: "bu ürünü alanlar başka ne aldı?" (herkese aynı) ve "benim gibi alanlar ne aldı?"
              (kişiye özel). İkisi de ilişki üzerinden yürüyen sorulardır; graf bu sorular için kurulur.
            code: |-
              (ürün)<-[:BOUGHT]-(müşteri)-[:BOUGHT]->(öneri)                       -- 2 hop
              (sen)-[:BOUGHT]->(ürün)<-[:BOUGHT]-(başkası)-[:BOUGHT]->(öneri)      -- 3 hop
          - title: Model ilişkiye göre kurulur
            text: >-
              Müşteri ve ürün birer düğüm (vertex), her satın alma müşteriden ürüne giden bir BOUGHT kenarı (edge). Sipariş
              no ve adet kenarın özelliğidir. Ürün düğümü sadece öneride gereken özellikleri taşır (ad, kategori); fiyat ve
              stok katalogda kalır. Graf asıl kayıt değildir, sipariş veritabanının bir kopyasıdır.
            code: |-
              (:Customer {~id, name, city})-[:BOUGHT {order_id, qty}]->(:Product {~id, name, category})
          - title: İlk yükleme toplu yapılır
            text: >-
              Geçmiş siparişler düğüm ve kenar dosyaları (openCypher CSV) olarak S3'e konur; Neptune bulk loader hepsini tek
              bir işte yükler. Satır satır yazmaktan çok daha hızlıdır.
            code: |-
              POST https://<cluster>:8182/loader
              { "source": "s3://bucket/graph/", "format": "opencypher", "iamRoleArn": "…", "region": "eu-central-1" }
          - title: Yeni siparişler sürekli eklenir
            text: >-
              Sipariş veritabanına yazılan her sipariş birkaç saniye içinde grafa BOUGHT kenarı olarak eklenir: değişiklik akışı
              (CDC) ya da siparişle aynı transaction'da yazılan bir "outbox" kaydı bir program tarafından okunur ve grafa
              yazılır.
          - title: Yürüyüş kısa ve sınırlı tutulur
            text: >-
              Çok satan bir ürün binlerce müşteriye bağlıdır (süper düğüm) ve her hop sonucu katlar. Öneri sorguları 2–3 hop ile
              sınırlanır, sonuç LIMIT ile kesilir ve plan yayından önce Neptune'un openCypher explain'i ile kontrol edilir.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Asıl sipariş kaydı ilişkisel veritabanına yazılır. Grafa her yeni siparişin BOUGHT kenarlarını bir besleme süreci
          ekler.
        reads: Uygulama, öneri şeritleri için ("bunu alanlar şunları da aldı", "sana özel").
        kind: >-
          Neptune başka bir veritabanından kendiliğinden veri çekmez; graf dışarıdan beslenir. Besleyen ya uygulama ya da
          sipariş veritabanının değişikliklerini dinleyen bir süreçtir.
        with: >-
          Öneri şeridi Neptune'un yanında başka veritabanlarıyla birlikte çalışır: sipariş asıl olarak ilişkisel veritabanında
          (Aurora) durur ve grafı o besler; kartların görselleri nesne deposundan (S3, büyük sistemlerde bir CDN ile) gelir;
          fiyat ve stok gibi sık değişen bilgiler katalogda (DocumentDB) kalır. Kartta fiyat gösterilecekse uygulama önerilen
          ürün numaralarıyla katalogdan toplu bir okuma yapar ve iki sonucu birleştirir.
        best: >-
          Sipariş veritabanının değişiklik akışı (CDC) dinlenir: AWS DMS, Neptune'u hedef olarak alabilir; ya da siparişle
          aynı transaction'da bir "outbox" tablosuna yazılan olayı küçük bir program okuyup grafa ekler. Uygulamanın siparişi
          iki veritabanına ayrı ayrı yazması (dual write) önerilmez: ikinci yazma başarısız olursa iki kayıt birbirini tutmaz.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Mağazada bir müşteri olarak geziyorsun. Seçtiğin müşteri (ör. Ayşe Yılmaz, C00001) tarayıcının lm_persona
              çerezinde duruyor. Bu adımda önemli: "sana göre" yürüyüş bu müşterinin düğümünden başlayacak.
          - text: >-
              Kablosuz Kulaklık'ın sayfası açıktı. Açılırken oturumun güncellendi, ürün DocumentDB'den, görseli S3'ten geldi;
              "baktın" satırı ve "Son baktıkların" şeridi Keyspaces'ten.
            engines: [elasticache, docdb, s3, keyspaces]
          - text: >-
              Aynı anda "Customers who bought this also bought" (bunu alanlar şunları da aldı) şeridi için Neptune'a 2 hop'luk
              bir sorgu gitti: bu üründen başla, onu alanlara git, onların aldıklarına git. Simülasyonun sol şeridi bu istek.
            engines: [neptune]
          - text: >-
              Sonra "For my persona" (benim için) butonuna tıkladın. Tarayıcın aynı adrese bu kez mode=persona ile sordu.
              Uygulama müşteri numaranı çerezden aldı ve Neptune'a 3 hop'luk sorguyu gönderdi. Simülasyonun sağ şeridi bu istek.
            engines: [neptune]
          - text: >-
              Öneriler geldi ve kartlar çizildi. Kartlardaki ad ve kategori Neptune'daki ürün düğümlerinden geldi; görseller
              her kart için ayrı bir istekle S3'ten. Kartlarda fiyat yok, çünkü fiyat grafta tutulmuyor.
            engines: [neptune, s3]
      sim:
        kind: graph-walk
        caption: >-
          Gerçek graftan küçük bir kesit: canlı Neptune'dan okunan müşteriler ve alımları. Gerçek grafta her ürünü
          onlarca müşteri almış; burada her yolu görebilmen için sadece birkaçı var. Bunlar iki farklı algoritma değil,
          aynı sayfanın gönderdiği iki ayrı gerçek istek: soldaki sayfa açılırken giden "bu ürüne göre" sorgusu, sağdaki
          senin tıklamanla giden "sana göre" sorgusu. Uygulama iki öneri modu sunuyor; iki yürüyüş yan yana, aynı hızda.
          Üstteki etiketler o anda işi kimin yaptığını gösterir: uygulama mı, Neptune mu.
        tick_ms: 1600
        summary: >-
          Soldaki yürüyüş herkese aynı önerileri verir ve senin zaten aldıklarını da önerebilir. Sağdaki yürüyüş bir adım
          daha uzun ama sana özel: aldıklarını eler, sana en çok benzeyenlerin seçtiklerini öne çıkarır.
        lanes:
          - id: product
            title: "t-1 · İstek 1 · Sayfa açılınca · Bu ürüne göre (2 hop)"
            start: {id: P0001, label: Kablosuz Kulaklık, type: product}
            start_title: Bu ürün
            start_say: Yürüyüş bu sayfadaki ürünün düğümünden, Kablosuz Kulaklık'tan başlıyor.
            send_say: >-
              Kablosuz Kulaklık'ın sayfası açılırken tarayıcın önerileri istedi (mode=product). Uygulama Neptune'a 2 hop'luk
