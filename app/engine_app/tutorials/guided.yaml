          func: api_report
          title: Rapor isteği
          sub: Adresteki dim=city hangi sütuna göre gruplanacağını seçer.
          lines:
            - {match: '@bp.get("/api/report")', say: "Rapor isteği buraya gelir; adres gruplama sütununu (dim) ve kaynağı taşır.", tag: Tarayıcı → Uygulama}
            - {match: 'dim = request.args.get("dim", "month")', say: "Neye göre gruplanacak: ay, kategori ya da şehir.", tag: Uygulamanın içinde}
            - {match: 'expr, alias = DIMENSIONS.get(dim, DIMENSIONS["month"])', say: "Seçime karşılık gelen SQL ifadesini alır (city).", tag: Uygulamanın içinde}
            - {match: 'q = f"""SELECT {expr} AS {alias}, count(DISTINCT order_id)', say: "Sorguyu kurar: grupla, siparişleri say, adet ve tutarı topla, ciroya göre sırala.", tag: Uygulamanın içinde}
            - {match: 'cols, rows = run("SELECT (report)", q, note)', say: "Sorgu Redshift'e gider (yeni bir bağlantıyla); toplamlar döner.", tag: [Uygulama → Redshift, Redshift → Uygulama]}
            - {match: 'return jsonify(trace.payload({"columns": cols, "rows":', say: Sütun adları ve satırlar tarayıcıya gider., tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek analiz deposunda ne oldu?
        intro: Sayfa açılırken giden aya göre rapor ve senin tıklamanla giden şehre göre rapor.
        runs:
          - label: Aya göre (sayfa açılınca)
            page_call: {path: /redshift/api/report, query: {dim: month}}
            metrics: [[Dönen satır (ay), items], [Süre, ms]]
          - label: Şehre göre (senin tıklaman)
            trigger: true
            metrics: [[Dönen satır (şehir), items], [Süre, ms]]
        reading: >-
          Bir yıllık binlerce satış kalemi okundu ama uygulamaya sadece ay ya da şehir sayısı kadar satır döndü. Süre birkaç yüz
          milisaniye; bunun bir kısmı her sorguda yeni bağlantı kurulmasından. Redshift Serverless bir süre boşta kaldıysa ilk
          sorgu daha uzun sürebilir. Süre her istekte değişir.
      query:
        title: Uygulama Redshift'e ne dedi?
        intro: >-
          İki sütun, iki isteğin sorgusu. Tek fark gruplama sütunu. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı
          yer parlar.
        cards_title: Parça parça
        parts:
          - id: m
            say: Her ay için
            code: "SELECT date_trunc('month', order_date)::date AS month,"
            name: Neye göre?
            note: Tarihi ayın ilk gününe yuvarlar; aynı aydaki satırlar bir grup olur.
            hl: col
          - id: c
            say: Her şehir için
            code: "SELECT city AS city,"
            name: Neye göre?
            note: Şehir sütunu. Redshift sadece bu sütunun bloğunu okur.
            hl: col
            tag: sadece sağdaki sorguda var
          - id: agg
            say: sipariş sayısını, adet ve ciro toplamını hesapla,
            code: "  count(DISTINCT order_id) AS orders, sum(qty) AS units, sum(amount) AS revenue"
            name: Ne hesaplansın?
            note: Üç toplam; Redshift bunları paralel olarak, sadece order_id, qty ve amount sütunlarını okuyarak hesaplar.
            hl: col
          - id: frm
            say: satış tablosunda grupla ve en yüksek ciro üstte olsun.
            code: "FROM sales GROUP BY 1 ORDER BY revenue DESC LIMIT 24"
            name: Nereden ve nasıl?
            note: GROUP BY 1, "SELECT'teki ilk sütuna göre grupla" demek.
            hl: col
        columns:
          - label: Aya göre
            sub: Sayfa açılırken giden sorgu.
            via: Uygulama bu sorguyu redshift_connector kütüphanesinin cursor.execute() metoduyla gönderir.
            parts: [m, agg, frm]
          - label: Şehre göre
            sub: Senin "City" tıklamanla giden sorgu.
            via: Aynı çağrı; uygulama sadece gruplama ifadesini değiştirdi.
            parts: [c, agg, frm]
            mark: [c]
        note: >-
          Dikkat: sorguda "sadece şu sütunları oku" diye bir şey yok. SELECT'te ve GROUP BY'da geçen sütunlar, okunacak blokları
          kendiliğinden belirler. SELECT * yazmak bu avantajı yok eder.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          Redshift'in işi toplamları verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: Redshift → Uygulama
            text: "{items} satır geldi: her şehir için sipariş, adet ve ciro."
          - who: Uygulama
            text: Bağlantıyı kapattı; sayıları JSON'a uygun biçime çevirdi.
          - who: Uygulama → Tarayıcın
            text: Sütun adlarını, satırları ve isteğin kaydını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: Grafiği ve tabloyu şehirlerle yeniden çizdi.
          - who: Sonra
            text: >-
              Bu rapor kurulumda yüklenen geçmişi okuyor. Bir sonraki adımda Aurora'nın canlı kopyasını okuyacaksın; senin siparişin
              de orada.
      remember: >-
        Çok satırı okuyup az sütunu toplayan sorgular sütun bazlı bir analiz deposunda çalışır: sorgu sadece kullandığı sütunları
        okur ve aynı türden değerler yan yana sıkıştırılmış durur.
      why_db: >-
        Neden Redshift? Satış raporu milyonlarca satırı birkaç sütun üzerinden toplar; Redshift bunu sütun bazlı depolama ve
        paralel işleme ile yapar. Bedeli: tek bir satırı hızlıca bulmak ya da sık güncellemek için uygun değildir; o iş işlemsel
        veritabanınındır.

  - page: reports
    path: /admin/reports
    engines: [redshift, aurora]
    use_case: Zero-ETL
    title: Aurora'nın canlı kopyasını oku
    why: >-
      Raporlar sayfasındasın; şimdiye kadar kurulumda yüklenen geçmişe baktın. Şimdi aynı raporu, siparişlerin gerçekten yazıldığı
      veritabanının canlı kopyasından isteyeceksin. Adım 25'te verdiğin sipariş de orada.
    do: Aydınlık "Live from Aurora" (Aurora'dan canlı) butonuna tıkla.
    target: "#exp-src [data-value=live]"
    action: click
    wait: {method: GET, path: /redshift/api/report, query: {source: live}}
    focus: "#chart-wrap"
    result: This query reads the Aurora tables that zero-ETL copied into Redshift.
    panel:
      need: >-
        Rapor güncel olmalı: az önce verilen sipariş birkaç saniye içinde rapora girmeli. Ama ağır rapor sorguları siparişlerin
        yazıldığı veritabanında çalışırsa ödeme sayfasını yavaşlatır. Verinin kopyası analiz deposuna, kod yazmadan ve sürekli
        akmalı.
      concept:
        term: Zero-ETL entegrasyonu
        text: >-
          Zero-ETL, Aurora'daki her değişikliği (yeni sipariş, güncellenen stok) Redshift'e kendiliğinden ve birkaç saniye içinde
          taşır. Aurora değişiklikleri zaten bir kayıt defterine (log) yazar; entegrasyon bu defteri okur ve Redshift'teki kopyaya
          uygular. Bir mağazanın satış fişlerinin kopyasının otomatik olarak muhasebeye gitmesi gibi: kasada kimse ekstra bir şey
          yapmaz.
        terms:
          - [Zero-ETL, "Kaynaktan analiz deposuna, veri hattı kodu yazmadan, sürekli ve otomatik kopyalama."]
          - [CDC (değişiklik yakalama), "Kaynağın değişiklik kaydını okuyup her değişikliği hedefe uygulama."]
          - [aurora_live, "Redshift'te, Aurora'nın kopyalanan tablolarının durduğu veritabanı."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde zero-ETL için hazırlık
        intro: >-
          Canlı rapor hiç açılmadan, kaynak veritabanı ve analiz deposu birbirine bağlanır. Aşağıdaki beş adım bu hazırlığın
          sırasıdır.
        text:
          - title: Önce hangi tabloların raporlanacağı belirlenir
            text: >-
              Siparişler, kalemler, ürünler ve müşteriler raporun kaynağı. Bunlar işlemsel veritabanında normalize durur; rapor onları
              analiz deposunda JOIN'leyecek.
          - title: Kaynak veritabanı hazırlanır
            text: >-
              Aurora'da gelişmiş mantıksal çoğaltma (enhanced logical replication) açılır; değişiklikler kayıt defterinden
              okunabilir hâle gelir. Kopyalanacak tablolarda birincil anahtar olmalıdır.
            code: |-
              rds.logical_replication = 1        (cluster parametre grubu)
              aurora.enhanced_logical_replication = 1
          - title: Entegrasyon bir kez kurulur
            text: >-
              Aurora ile Redshift arasında bir entegrasyon oluşturulur ve Redshift'te bu entegrasyondan bir veritabanı yaratılır. Önce
              bütün tablolar bir kez kopyalanır, sonra her değişiklik sürekli akar.
            code: |-
              aws rds create-integration --source-arn <aurora cluster> --target-arn <redshift namespace> …
              CREATE DATABASE aurora_live FROM INTEGRATION '<integration id>' DATABASE shop;
          - title: Raporlar kopyayı okur
            text: >-
              Rapor sorguları aurora_live veritabanındaki tablolara yazılır; Aurora'ya hiçbir rapor sorgusu gitmez. Kopya salt
              okunurdur.
          - title: Gecikme ve durum izlenir
            text: >-
              svv_integration görünümü entegrasyonun durumunu, kopyalanan ve hata veren tablo sayısını gösterir. Gecikme genelde
              saniyeler düzeyindedir ve izlenir (Adım 31).
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Kullanıcı yazmaz. Geçmiş satışlar toplu yükleme ile (ör. S3'ten COPY) gelir; canlı siparişler işlemsel veritabanından
          zero-ETL ile kendiliğinden kopyalanır.
        reads: Rapor ekranları, panolar ve analistlerin sorguları.
        kind: >-
          Motordan motora: Aurora'nın değişiklikleri zero-ETL entegrasyonuyla Redshift'e akar; arada uygulama ya da yazılmış bir
          veri hattı yoktur. Geçmiş veri ise toplu yüklemeyle gelir.
        with: >-
          Raporun her satırı başka bir veritabanında doğdu: sipariş Aurora'da yazıldı, Redshift onun kopyasını tutuyor. Aynı
          sipariş Keyspaces'te olay, ElastiCache'te sıralama puanı olarak da durur; rapor için doğru kaynak Redshift'teki kopyadır.
        best: >-
          Analiz sorguları işlemsel veritabanında değil, sütun bazlı bir analiz deposunda çalışır. İşlemsel veri ona zero-ETL ile
          kod yazmadan, saniyeler içinde akar; ağır raporlar siparişleri hiç yavaşlatmaz.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Adım 25'te bir sipariş verdin: Aurora onu tek transaction'da yazdı ve COMMIT etti.
            engines: [aurora]
          - text: >-
              Senin hiçbir şey yapmana gerek kalmadan zero-ETL bu değişikliği Aurora'nın kayıt defterinden okudu ve birkaç saniye
              içinde Redshift'teki aurora_live kopyasına uyguladı.
            engines: [aurora, redshift]
          - text: >-
              Şimdi "Live from Aurora" butonuna bastın. Tarayıcın raporu source=live ile istedi; uygulama Redshift'e aurora_live
              tablolarını JOIN'leyen bir sorgu gönderdi. Aurora'ya hiçbir sorgu gitmedi.
            engines: [redshift]
          - text: >-
              Grafik ve tablo canlı veriyle yeniden çizildi; senin siparişin de şehrinin toplamına eklenmiş durumda.
            engines: [redshift]
      sim:
        kind: replicate
        title: Aurora → zero-ETL → Redshift (aurora_live)
        caption: >-
          Siparişler tablosundan küçük bir kesit (satırlar örnek). Önce Adım 25'teki siparişinin Aurora'dan Redshift'e akışı, sonra
          senin tıklamanla giden rapor sorgusu oynuyor.
        cols: [order_id, city, total]
        src:
          label: Aurora (shop.orders)
          rows:
            - {order_id: W1793390012, city: Ankara, total: 1299.90}
            - {order_id: W1793380550, city: İstanbul, total: 951.92}
        dst: {label: Redshift (aurora_live.orders)}
        row: {order_id: W1793396741, city: İstanbul, total: 3373.84}
        lag_s: 10
        write_say: "Adım 25: Aurora siparişini COMMIT etti (W1793396741, İstanbul, 3373,84 ₺)."
        log_entry: "INSERT orders W1793396741 …"
        log_say: Değişiklik Aurora'nın kayıt defterine yazıldı; zero-ETL bu defteri sürekli okuyor.
        apply_say: zero-ETL değişikliği Redshift'teki kopyaya uyguladı; arada uygulama ya da yazılmış bir program yok.
        send: '"Live from Aurora"ya bastın. Uygulama Redshift''e aurora_live tablolarını JOIN''leyen rapor sorgusunu gönderiyor.'
        query_say: Redshift raporu kopyadan hesapladı; Aurora'ya hiçbir rapor sorgusu gitmedi.
        out: [[İstanbul, "+ 3373,84 ₺ senin siparişin"], [Ankara, "1299,90 ₺"]]
        back: Uygulama raporu tarayıcına gönderdi; grafik canlı veriyle çizilecek.
        summary: >-
          Sipariş Aurora'ya bir kez yazıldı; kopyalamayı zero-ETL yaptı, raporu Redshift hesapladı. Uygulama ne veri taşıdı ne de
          Aurora'ya rapor sorgusu gönderdi.
      wire:
        what: >-
          Uygulama her sorgu için Redshift Serverless'a yeni bir bağlantı açar (redshift_connector kütüphanesi), sorguyu gönderir,
          satırları alır ve bağlantıyı kapatır.
        dst: "dbws.179330777878.eu-central-1.redshift-serverless.amazonaws.com : 5439"
        dst_note: >-
          Redshift Serverless çalışma grubunun adresi (taban kapasite 8 RPU). İnternete kapalı veri alt ağında duruyor.
        rows:
          - [Şifreleme, "TLS (sslmode=verify-ca)", gerçek, Sunucunun sertifikası doğrulanarak bağlanılır.]
          - [Protokol, PostgreSQL wire protokolü, gerçek, "Redshift, PostgreSQL istemcilerinin dilini konuşur; sorgu bir SQL mesajı olarak gider."]
          - [Kimlik, "Kullanıcı adı + şifre, bağlantı açılırken", gerçek, "Şifre kodda yazmaz; uygulama onu AWS Secrets Manager'dan alır."]
        body_label: Gönderilen SQL (kopyalanan Aurora tablolarının üzerinde)
        body: |-
          SELECT c.city AS city, count(DISTINCT o.order_id) AS orders, sum(oi.qty) AS units, sum(oi.qty * oi.unit_price) AS revenue
          FROM aurora_live.public.orders o
          JOIN aurora_live.public.order_items oi ON oi.order_id = o.order_id
          JOIN aurora_live.public.products p ON p.product_id = oi.product_id
          JOIN aurora_live.public.customers c ON c.customer_id = o.customer_id
          WHERE o.status <> 'cancelled' GROUP BY 1 ORDER BY revenue DESC LIMIT 24;
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Uygulamada kopyalama
        kodu yok; sadece sorgunun hangi veritabanını okuyacağı değişiyor.
      app_code:
        - file: engines/redshift.py
          func: api_report
          title: Rapor isteği (canlı kaynak)
          sub: Adresteki source=live sorguyu aurora_live tablolarına yönlendirir.
          lines:
            - {match: '@bp.get("/api/report")', say: "Rapor isteği buraya gelir.", tag: Tarayıcı → Uygulama}
            - {match: 'source = request.args.get("source", "history")', say: "Kaynak: kurulumdaki geçmiş mi, Aurora'nın canlı kopyası mı?", tag: Uygulamanın içinde}
            - {match: 'if source == "live":', say: "Canlıysa sorgu aurora_live veritabanındaki tablolara yazılır.", tag: Uygulamanın içinde}
            - {match: 'FROM {LIVE_DB}.public.orders o', say: "Kopyalanan orders tablosu (Aurora'nın shop.orders tablosunun kopyası).", tag: Uygulamanın içinde, hl: dst}
            - {match: 'cols, rows = run("SELECT (report)", q, note)', say: "Sorgu Redshift'e gider; Aurora'ya hiçbir şey gitmez.", tag: [Uygulama → Redshift, Redshift → Uygulama]}
            - {match: 'return jsonify(trace.payload({"columns": cols, "rows":', say: Satırlar tarayıcıya gider., tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek sistemde ne oldu?
        intro: Senin tıklamanla Redshift'e giden canlı rapor sorgusu.
        runs:
          - label: Canlı rapor (senin tıklaman)
            trigger: true
            metrics: [[Dönen satır, items], [İlk satır, data.rows.0.0], [İlk satırın cirosu, data.rows.0.3], [Süre, ms]]
        reading: >-
          Canlı sorgu dört kopyalanmış tabloyu JOIN'lediği için geçmiş tablosuna göre daha uzun sürer (bir iki saniye). Sayılar
          geçmiş raporundakilere yakındır, çünkü kurulumdaki siparişler Aurora'da da var; fark, sonradan verilen siparişlerdir
          (seninki dahil). Süre her istekte değişir.
      query:
        title: Uygulama Redshift'e ne dedi?
        intro: >-
          Tek bir SQL, parça parça. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: sel
            say: Her şehir için sipariş, adet ve ciroyu hesapla;
            code: "SELECT c.city, count(DISTINCT o.order_id), sum(oi.qty), sum(oi.qty * oi.unit_price)"
            name: Ne hesaplansın?
            note: Ciroyu kalemlerin adet × birim fiyatından hesaplar; tablolar normalize olduğu için hazır bir tutar sütunu yok.
            hl: dst
          - id: frm
            say: Aurora'nın kopyalanan sipariş, kalem, ürün ve müşteri tablolarını birleştirerek;
            code: "FROM aurora_live.public.orders o JOIN …order_items … JOIN …products … JOIN …customers …"
            name: Nereden?
            note: aurora_live, zero-ETL'in Redshift'te yarattığı veritabanı. Şehir müşteriler tablosundan gelir.
            hl: dst
          - id: wh
            say: iptal edilenleri dışarıda bırak ve en yüksek ciroyu üste koy.
            code: "WHERE o.status <> 'cancelled' GROUP BY 1 ORDER BY revenue DESC LIMIT 24"
            name: Hangileri, nasıl?
            note: İptal siparişler ciroya girmez.
            hl: dst
        columns:
          - label: Canlı rapor
            sub: Senin "Live from Aurora" tıklamanla giden sorgu.
            via: Uygulama bu sorguyu redshift_connector kütüphanesiyle, Redshift'e yeni bir bağlantı açarak gönderir.
            parts: [sel, frm, wh]
        note: >-
          Dikkat: sorgu Aurora'ya değil, Redshift'e gidiyor; ama tablolar Aurora'nın tablolarıyla aynı. Kopyalama için uygulamada
          tek satır kod yok.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          Redshift'in işi raporu verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: Redshift → Uygulama
            text: "{items} satır geldi; canlı veriyle şehre (ya da seçili sütuna) göre toplamlar."
          - who: Uygulama → Tarayıcın
            text: Satırları ve isteğin kaydını gönderdi.
          - who: Tarayıcın
            text: Grafiği ve tabloyu canlı veriyle yeniden çizdi.
          - who: Sonra
            text: Bir sonraki adımda kopyanın ne kadar güncel olduğunu ölçeceksin.
      remember: >-
        İşlemsel veritabanı siparişi yazar, analiz deposu raporlar; aradaki kopyayı zero-ETL kod yazmadan ve saniyeler içinde
        taşır. Rapor sorguları hiçbir zaman siparişlerin yazıldığı veritabanına gitmez.
      why_db: >-
        Neden Redshift + zero-ETL? Raporun güncel olması ama siparişleri yavaşlatmaması gerekiyor. Zero-ETL kopyayı otomatik taşır,
        Redshift ağır sorguyu kendi kaynaklarıyla çalıştırır. Bedeli: kopya birkaç saniye geriden gelir ve salt okunurdur.

  - page: reports
    path: /admin/reports
    engines: [redshift, aurora]
    use_case: Zero-ETL
    title: Kopya ne kadar güncel?
    why: >-
      Canlı rapor çizildi. Sayfanın altındaki "Zero-ETL replication" kutusu kopyalamanın durumunu ve en yeni siparişin Redshift'e
      ne zaman ulaştığını gösteriyor. Bu adımda tıklama yok, sadece bakacaksın.
    do: Aydınlık "Zero-ETL replication" kutusuna bak. Sonra kartın altındaki butonla perde arkasını aç.
    target: "#repl"
    action: look
    wait: {method: GET, path: /redshift/api/replication}
    focus: "#repl"
    result: Compare the time of your order with the time in Redshift.
    panel:
      need: >-
        Rapora güvenmek için kopyanın sağlıklı ve güncel olduğunu bilmek gerekir: entegrasyon çalışıyor mu, kaç tablo kopyalanıyor,
        hata var mı, en yeni değişiklik ne zaman geldi?
      concept:
        term: Entegrasyon durumu ve gecikme (lag)
        text: >-
          Redshift entegrasyonun durumunu bir sistem görünümünde (svv_integration) tutar: durumu, kopyalanan ve hata veren tablo
          sayısı, son uygulanan değişikliğin işareti. Gecikme, kaynaktaki bir değişiklikle onun kopyada görünmesi arasındaki süredir;
          bir mektubun postaya verildiği an ile ulaştığı an arasındaki fark gibi.
        terms:
          - [svv_integration, "Redshift'te zero-ETL entegrasyonlarının durumunu gösteren sistem görünümü."]
          - [CdcRefreshState, "Entegrasyonun ilk kopyalamayı bitirip değişiklikleri sürekli uyguladığı durum."]
          - [Gecikme (replication lag), "Kaynaktaki değişiklik ile kopyadaki görünmesi arasındaki süre."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde kopyanın izlenmesi için hazırlık
        intro: >-
          Rapora güvenmeden önce kopyanın nasıl izleneceği belirlenir. Aşağıdaki dört adım bu hazırlığın sırasıdır.
        text:
          - title: Durum görünümü okunur
            text: >-
              svv_integration entegrasyonun durumunu ve tablo sayılarını verir. "total_tables_failed" sıfırdan büyükse bir tablo
              kopyalanamıyordur (ör. birincil anahtarı yok).
            code: |-
              SELECT integration_id, target_database, state, total_tables_replicated, total_tables_failed FROM svv_integration;
          - title: Gecikme ölçülür
            text: >-
              En basit ölçü: kopyadaki en yeni satırın zamanı ile şimdiki zaman arasındaki fark. CloudWatch'ta entegrasyonun gecikme
              metriği de izlenir ve bir eşiğe alarm kurulur.
            code: |-
              SELECT max(order_date), datediff(second, max(order_date)::timestamp, getdate()) FROM aurora_live.public.orders;
          - title: Rapor ekranına tazelik yazılır
            text: >-
              Kullanıcıya "veriler şu saate kadar günceldir" bilgisi gösterilir; gecikme büyürse ekran uyarır.
          - title: Kaynaktaki şema değişikliği planlanır
            text: >-
              Aurora'da bir tablo değiştirildiğinde (sütun eklemek gibi) entegrasyon bunu taşır; bazı değişiklikler tablonun yeniden
              kopyalanmasını gerektirir. Bu yüzden şema değişiklikleri sakin saatlerde yapılır ve durum izlenir.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Kullanıcı yazmaz. Geçmiş satışlar toplu yükleme ile (ör. S3'ten COPY) gelir; canlı siparişler işlemsel veritabanından
          zero-ETL ile kendiliğinden kopyalanır.
        reads: Rapor ekranları, panolar ve analistlerin sorguları.
        kind: >-
          Motordan motora: Aurora'nın değişiklikleri zero-ETL entegrasyonuyla Redshift'e akar; arada uygulama ya da yazılmış bir
          veri hattı yoktur. Geçmiş veri ise toplu yüklemeyle gelir.
        with: >-
          Raporun her satırı başka bir veritabanında doğdu: sipariş Aurora'da yazıldı, Redshift onun kopyasını tutuyor. Aynı
          sipariş Keyspaces'te olay, ElastiCache'te sıralama puanı olarak da durur; rapor için doğru kaynak Redshift'teki kopyadır.
        best: >-
          Analiz sorguları işlemsel veritabanında değil, sütun bazlı bir analiz deposunda çalışır. İşlemsel veri ona zero-ETL ile
          kod yazmadan, saniyeler içinde akar; ağır raporlar siparişleri hiç yavaşlatmaz.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Raporlar sayfasındasın; canlı rapor çizildi.
            engines: [redshift]
          - text: >-
              Sayfa açılırken tarayıcın uygulamaya "zero-ETL durumunu ver" de demişti; uygulama Redshift'e iki sorgu gönderdi:
              entegrasyonun durumu (svv_integration) ve kopyadaki en yeni ziyaretçi siparişinin zamanı. "Refresh the status"
              butonu aynı isteği yeniden gönderir.
            engines: [redshift]
          - text: >-
              Kutuda entegrasyonun durumu, kopyalanan tablo sayısı ve en yeni siparişin kaç saniye önce olduğu göründü.
            engines: [redshift]
      sim:
        kind: replicate
        title: Kopyanın tazeliği
        caption: >-
          Gecikmenin nasıl ölçüldüğü: Aurora'da COMMIT edilen sipariş, zero-ETL ile Redshift'e ulaşır; uygulama kopyadaki en yeni
          siparişin zamanını sorar (satırlar örnek).
        cols: [order_id, order_date, total]
        src:
          label: Aurora (shop.orders)
          rows:
            - {order_id: W1793380550, order_date: "10:12:04", total: 951.92}
        dst: {label: Redshift (aurora_live.orders)}
        row: {order_id: W1793396741, order_date: "10:25:41", total: 3373.84}
        lag_s: 10
        write_say: "Sipariş Aurora'da 10:25:41'de COMMIT edildi."
        log_entry: "INSERT orders W1793396741 (10:25:41)"
        log_say: Değişiklik Aurora'nın kayıt defterinde.
        apply_say: "Değişiklik Redshift'e birkaç saniye sonra uygulandı; kopyadaki en yeni sipariş artık 10:25:41."
        send: Sayfa açılırken uygulama Redshift'e svv_integration'ı ve kopyadaki en yeni siparişin zamanını soruyor.
        query_say: >-
          Redshift cevap verdi: durum CdcRefreshState, 4 tablo kopyalanıyor, 0 hata; en yeni sipariş 10:25:41. Şimdiki zamanla farkı
          "kaç saniye önce" olarak hesaplandı.
        out: [[durum, CdcRefreshState], [kopyalanan tablo, "4 · hata 0"], [en yeni sipariş, "10:25:41"]]
        back: Uygulama durumu tarayıcına gönderdi; kutu güncellenecek.
        summary: >-
          Kopya sağlıklıysa durum CdcRefreshState ve hata sayısı 0'dır. "Kaç saniye önce", en yeni siparişten bu yana geçen süredir;
          siparişini az önce verdiysen gecikmeye yakındır, uzun süre önce verdiysen o süreyi gösterir.
      wire:
        what: >-
          Uygulama her sorgu için Redshift Serverless'a yeni bir bağlantı açar (redshift_connector kütüphanesi), sorguyu gönderir,
          satırları alır ve bağlantıyı kapatır.
        dst: "dbws.179330777878.eu-central-1.redshift-serverless.amazonaws.com : 5439"
        dst_note: >-
          Redshift Serverless çalışma grubunun adresi (taban kapasite 8 RPU). İnternete kapalı veri alt ağında duruyor.
        rows:
          - [Şifreleme, "TLS (sslmode=verify-ca)", gerçek, Sunucunun sertifikası doğrulanarak bağlanılır.]
          - [Protokol, PostgreSQL wire protokolü, gerçek, "Redshift, PostgreSQL istemcilerinin dilini konuşur; sorgu bir SQL mesajı olarak gider."]
          - [Kimlik, "Kullanıcı adı + şifre, bağlantı açılırken", gerçek, "Şifre kodda yazmaz; uygulama onu AWS Secrets Manager'dan alır."]
        body_label: Gönderilen iki SQL
        body: |-
          SELECT integration_id, target_database, state, total_tables_replicated, total_tables_failed, last_replicated_checkpoint
          FROM svv_integration;

          SELECT max(order_date) AS newest, datediff(second, max(order_date)::timestamp, getdate()) AS seconds_ago
          FROM aurora_live.public.orders WHERE visitor_id IS NOT NULL;
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi.
      app_code:
        - file: engines/redshift.py
          func: api_replication
          title: Zero-ETL durum isteği
          sub: Sayfa açılırken (ve "Refresh the status" ile) gelen istek; iki sorgu gönderir.
          lines:
            - {match: '@bp.get("/api/replication")', say: "Durum isteği buraya gelir.", tag: Tarayıcı → Uygulama}
            - {match: 'cols, rows = run("SELECT (integration status)",', say: "Birinci sorgu: entegrasyonun durumu ve tablo sayıları.", tag: [Uygulama → Redshift, Redshift → Uygulama], hl: dst}
            - {match: '_, r2 = run("SELECT (newest live order)",', say: "İkinci sorgu: kopyadaki en yeni ziyaretçi siparişinin zamanı ve kaç saniye önce olduğu.", tag: [Uygulama → Redshift, Redshift → Uygulama], hl: dst}
            - {match: 'lag = {"newest": str(r2[0][0]), "seconds_ago": r2[0][1]}', say: Sonucu okunur hâle getirir., tag: Uygulamanın içinde}
            - {match: 'return jsonify(trace.payload({"integration": {k: str(v)', say: Durumu ve zamanı tarayıcıya gönderir., tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek entegrasyonda ne oldu?
        intro: Sayfa açılırken Redshift'e giden iki durum sorgusu.
        runs:
          - label: Durum (sayfa açılınca)
            trigger: true
            metrics: [[Durum, data.integration.state], [Kopyalanan tablo, data.integration.total_tables_replicated], [Hata veren tablo, data.integration.total_tables_failed], [En yeni sipariş (sn önce), data.newest_visitor_order.seconds_ago]]
        reading: >-
          Durum CdcRefreshState ise kopya değişiklikleri sürekli uyguluyor; 4 tablo (siparişler, kalemler, ürünler, müşteriler)
          kopyalanıyor. "Sn önce", kopyadaki en yeni ziyaretçi siparişinden bu yana geçen süre: siparişini birkaç dakika önce
          verdiysen o kadar dakikadır; gecikmeyi görmek için yeni bir sipariş verip hemen tekrar bak.
      query:
        title: Uygulama Redshift'e ne dedi?
        intro: >-
          İki sorgu. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: st
            say: Entegrasyonun durumunu ve kopyalanan tablo sayılarını getir,
            code: "SELECT integration_id, target_database, state, total_tables_replicated, total_tables_failed FROM svv_integration"
            name: Sağlıklı mı?
            note: Redshift'in sistem görünümü; her entegrasyon için bir satır.
            hl: dst
          - id: lg
            say: ve kopyadaki en yeni ziyaretçi siparişinin kaç saniye önce olduğunu hesapla.
            code: "SELECT max(order_date), datediff(second, max(order_date)::timestamp, getdate()) FROM aurora_live.public.orders WHERE visitor_id IS NOT NULL"
            name: Ne kadar güncel?
            note: Kurulumdaki siparişlerin ziyaretçi kimliği yok; sadece mağazada verilen siparişler sayılır.
            hl: dst
        columns:
          - label: Durum ve tazelik
            sub: Sayfa açılırken giden iki sorgu.
            via: Uygulama bu sorguları redshift_connector ile, her biri için yeni bir bağlantı açarak gönderir.
            parts: [st, lg]
        note: >-
          Dikkat: "kaç saniye önce" doğrudan gecikme değildir; kopyadaki en yeni siparişten bu yana geçen süredir. Gecikmeyi ölçmek
          için az önce verilmiş bir sipariş gerekir.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          Redshift'in işi iki cevabı verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: Redshift → Uygulama
            text: Entegrasyonun durum satırı ve en yeni siparişin zamanı geldi.
          - who: Uygulama → Tarayıcın
            text: Durumu ve zamanı tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: Kutuya durumu, tablo sayısını ve "kaç saniye önce" bilgisini yazdı.
          - who: Sonra
            text: >-
              Sipariş raporlarının işlemsel tarafına geçeceksin: Aurora'da bir sorgunun planını okuyacaksın (Adım 32).
      remember: >-
        Bir kopyaya güvenmeden önce durumunu ve tazeliğini ölç: entegrasyon sağlıklı mı, hata var mı, en yeni değişiklik ne zaman
        geldi?
      why_db: >-
        Neden Redshift? Kopyanın durumu ve tazeliği de bir sorgu kadar uzaktadır; Redshift entegrasyonu sistem görünümleriyle
        izlenebilir kılar. Bedeli: kopya her zaman birkaç saniye geriden gelir; anlık doğruluk gereken ekranlar işlemsel
        veritabanını okur.

  - page: order_report
    path: /admin/orders
    engines: [aurora]
    use_case: Sorgu planı
    title: Sorgu planını oku
    why: >-
      Sipariş raporu sayfasındasın: müşteri segmentlerine göre sipariş sayısı ve ciro. Şimdi veritabanından bu raporu nasıl
      hesapladığını adım adım anlatmasını isteyeceksin.
    do: Aydınlık "Show the query plan (EXPLAIN ANALYZE)" (sorgu planını göster) kutusunu işaretle.
    target: "#exp-explain"
    action: click
    wait: {method: GET, path: /aurora/api/report, query: {explain: "on"}}
    focus: "#plan-wrap"
    result: Each plan node shows rows and time.
    panel:
      need: >-
        Bir rapor yavaşladığında ya da işlemsel veritabanını zorladığında nedenini bilmek gerekir: hangi tabloyu baştan sona
        okudu, satırları nasıl birleştirdi, nerede sıraladı, hangi adım ne kadar sürdü? Bunu tahmin etmek yerine veritabanına
        sormak gerekir.
      concept:
        term: Sorgu planı (EXPLAIN ANALYZE)
        text: >-
          SQL "ne istediğini" söyler; "nasıl yapılacağına" PostgreSQL'in planlayıcısı karar verir. EXPLAIN ANALYZE sorguyu gerçekten
          çalıştırır ve her adımın kaç satır ürettiğini ve ne kadar sürdüğünü bir ağaç olarak döndürür. Ağaç aşağıdan yukarı okunur:
          yapraklar tabloları okur, üstteki düğümler onları birleştirir, gruplar ve sıralar. Bir yemek tarifinin adımlarını,
          her adımın süresiyle birlikte yazmak gibi.
        terms:
          - [Seq Scan, "Tabloyu baştan sona okumak. Küçük tablolarda ya da çoğu satır gerektiğinde en ucuz yol."]
          - [Hash Join, "Küçük tabloyu bellekte bir sözlüğe (hash) koyup büyük tablonun her satırını orada aramak."]
          - [GroupAggregate, "Sıralı satırları gruplayıp toplamları hesaplamak."]
          - [Index Scan, "Index'le sadece gereken satırlara gitmek; az satır gerektiğinde ucuz."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde rapor sorguları için hazırlık
        intro: >-
          Rapor sayfası hiç açılmadan, işlemsel veritabanında hangi raporların çalışacağı ve nasıl izleneceği belirlenir. Aşağıdaki
          beş adım bu hazırlığın sırasıdır.
        text:
          - title: Önce raporun sorusu ve büyüklüğü yazılır
            text: >-
              "Segmente göre sipariş ve ciro" bütün siparişleri okur. Birkaç bin sipariş için işlemsel veritabanında birkaç on
              milisaniye sürer; yıllar ve milyonlarca satır için analiz deposuna gider.
          - title: Planlayıcıya doğru istatistik verilir
            text: >-
              Planlayıcı tabloların büyüklüğünü ve değer dağılımını istatistiklerden bilir. ANALYZE (ve otomatik autovacuum) bu
              istatistikleri günceller; eski istatistik yanlış plan demektir.
            code: |-
              ANALYZE orders;  ANALYZE order_items;
          - title: Plan yayından önce okunur
            text: >-
              Yeni ya da değişen rapor sorgusu EXPLAIN ANALYZE ile çalıştırılır. Büyük tablolarda beklenmedik Seq Scan, tahmin
              edilen ile gerçek satır sayısının çok farklı olması ya da diske taşan sıralama (Sort Method: external) uyarı
              işaretidir.
            code: |-
              EXPLAIN (ANALYZE, BUFFERS) SELECT c.segment, … GROUP BY c.segment ORDER BY revenue DESC;
          - title: Yavaş sorgular sürekli izlenir
            text: >-
              pg_stat_statements eklentisi her sorgunun kaç kez çalıştığını ve toplam süresini tutar; Aurora'da Performance
              Insights hangi sorgunun veritabanını meşgul ettiğini gösterir.
            code: |-
              SELECT query, calls, mean_exec_time FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 10;
          - title: Ağır raporlar ayrılır
            text: >-
              Raporlar okuma ucuna (reader) gönderilir; büyüdüklerinde zero-ETL ile analiz deposuna taşınır. İşlemsel veritabanının
              yazma ucu siparişlere kalır.
      feed:
        title: Veri nereden geliyor?
        writes: Uygulama, ödeme adımında (sipariş ve kalemler); müşteri bilgisi kayıt sırasında.
        reads: Sipariş raporu ekranı (operasyon ekibi) ve siparişlerim sayfası.
        kind: >-
          Uygulama orkestrasyonu. Aurora siparişin asıl kaydıdır; değişikliklerini zero-ETL ile analiz deposuna (Redshift)
          kendisi aktarır.
        with: >-
          Aynı sorunun büyük veri üzerindeki hâli Redshift'te çalışır (Adım 29–31); bu rapor işlemsel veritabanındaki güncel veriyi
          anında okur.
        best: >-
          Küçük ve anlık operasyon raporları işlemsel veritabanının okuma ucunda, büyük ve tarihsel raporlar analiz deposunda
          çalışır. Her iki tarafta da plan okunur ve yavaş sorgular izlenir.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              "Order report" (sipariş raporu) sayfasını açtın. Sayfa raporu istedi; uygulama Aurora'ya segment raporunu ve
              workshop siparişlerinin saatlik özetini sordu. Tablolar çizildi.
            engines: [aurora]
          - text: >-
              "Show the query plan" kutusunu işaretledin. Tarayıcın raporu explain=on ile yeniden istedi; uygulama aynı sorguyu bir
              kez de EXPLAIN ANALYZE ile çalıştırdı. Simülasyon o planı oynatıyor.
            engines: [aurora]
          - text: >-
              Planın metni sayfadaki kutuya yazıldı: her satır bir adım, yanında satır sayısı ve süre.
            engines: [aurora]
      sim:
        kind: plan-tree
        title: "Gerçek plan: segment raporu"
        caption: >-
          Aurora'nın bu rapor için seçtiği gerçek plan, aşağıdan yukarı çalışma sırasıyla. Satır sayıları ve süreler gerçek bir
          çalıştırmadan; senin çalıştırmanda biraz farklı olabilir. Her düğümdeki ms, o düğümün bittiği andır ve altındaki
          düğümlerin süresini de içerir.
        tree: [sort2, agg, sort1, hj2, hj1, seq_items, hash_orders, seq_orders, hash_cust, seq_cust]
        nodes:
          - {id: seq_items, depth: 5, label: Seq Scan order_items, detail: bütün kalemler, rows: 12521, ms: 1.1, say: "order_items baştan sona okundu: 12.521 kalem. Raporun bütün kalemlere ihtiyacı olduğu için index'e gerek yok."}
          - {id: seq_orders, depth: 6, label: Seq Scan orders, detail: "Filter: status <> 'cancelled'", rows: 4742, ms: 0.6, say: "orders okundu; iptal edilen 267 sipariş elendi, 4.742 sipariş kaldı."}
          - {id: hash_orders, depth: 5, label: Hash, detail: siparişler bellekte, rows: 4742, ms: 1.0, say: "Siparişler bellekte order_id'ye göre bir sözlüğe (hash) kondu (320 kB)."}
          - {id: hj1, depth: 4, label: Hash Join, detail: "oi.order_id = o.order_id", rows: 11887, ms: 4.2, say: "Her kalem sözlükte siparişiyle eşleştirildi: 11.887 satır (iptal siparişlerin kalemleri düştü)."}
          - {id: seq_cust, depth: 6, label: Seq Scan customers, detail: bütün müşteriler, rows: 1000, ms: 0.1, say: "customers okundu: 1.000 müşteri."}
          - {id: hash_cust, depth: 5, label: Hash, detail: müşteriler bellekte, rows: 1000, ms: 0.2, say: "Müşteriler bellekte customer_id'ye göre bir sözlüğe kondu."}
          - {id: hj2, depth: 3, label: Hash Join, detail: "o.customer_id = c.customer_id", rows: 11887, ms: 6.4, say: "Her satıra müşterinin segmenti eklendi."}
          - {id: sort1, depth: 2, label: Sort, detail: "segment, order_id (bellekte, 1 MB)", rows: 11887, ms: 20.3, say: "11.887 satır segmente ve siparişe göre sıralandı; en uzun adım bu (yaklaşık 14 ms)."}
          - {id: agg, depth: 1, label: GroupAggregate, detail: "Group Key: c.segment", rows: 3, ms: 23.2, say: "Sıralı satırlar segmente göre gruplandı; her segment için sipariş sayısı, ciro ve ortalama hesaplandı: 3 satır."}
          - {id: sort2, depth: 0, label: Sort, detail: revenue DESC, rows: 3, ms: 23.2, say: "3 satır ciroya göre sıralandı. Toplam yaklaşık 23 ms."}
        send: >-
          "Show the query plan" kutusunu işaretledin. Uygulama raporu çalıştırdıktan sonra aynı sorguyu EXPLAIN ANALYZE ile gönderiyor.
        back: >-
          Uygulama planın metnini tarayıcına gönderdi; sayfadaki kutuya yazılacak.
        end_say: >-
          Plan bitti: üç tablo baştan sona okundu, bellekte birleştirildi, sıralandı ve gruplandı. Bu küçük veride 23 ms; yıllarca
          birikmiş veride aynı plan saniyeler sürer ve siparişlerle yarışır. O yüzden büyük raporlar Redshift'te.
        summary: >-
          Plan aşağıdan yukarı okunur: yapraklar tabloları okur, Hash Join'ler birleştirir, Sort ve GroupAggregate toplar. En pahalı
          adım sıralamaydı. Her düğümde "kaç satır, kaç ms" yazdığı için darboğaz tahmin edilmez, görülür.
      wire:
        what: >-
          Uygulama bu istek için Aurora'ya yeni bir bağlantı açar (psycopg kütüphanesi) ve üç SQL'i sırayla gönderir.
        dst: "dbws-aurora.cluster-ccgs3qxfidad.eu-central-1.rds.amazonaws.com : 5432"
        dst_note: >-
          Aurora cluster'ının yazma adresi. Rapor sorguları okuma ucuna (cluster-ro) da gönderilebilirdi. Cluster internete kapalı.
        rows:
          - [Şifreleme, "TLS (sslmode=require)", gerçek, Bağlantı şifrelenmeden kurulmaz.]
          - [Protokol, PostgreSQL wire protokolü, gerçek, "EXPLAIN ANALYZE'ın cevabı da satırlar hâlinde metin olarak döner."]
          - [Kimlik, "Kullanıcı adı + şifre, bağlantı açılırken", gerçek, "Şifre kodda yazmaz; uygulama onu AWS Secrets Manager'dan alır."]
        body_label: Gönderilen SQL'ler (sırasıyla)
        body: |-
          SELECT c.segment, count(DISTINCT o.order_id) AS orders, sum(oi.qty * oi.unit_price) AS revenue, round(avg(o.total), 2) AS avg_order
          FROM orders o JOIN customers c USING (customer_id) JOIN order_items oi USING (order_id)
          WHERE o.status <> 'cancelled' GROUP BY c.segment ORDER BY revenue DESC;
          EXPLAIN ANALYZE <aynı sorgu>;
          SELECT date_trunc('hour', order_date) AS hour, count(*), sum(total) FROM orders WHERE visitor_id IS NOT NULL GROUP BY 1 ORDER BY 1;
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi.
      app_code:
        - file: engines/aurora.py
          func: api_report
          title: Sipariş raporu isteği
          sub: Adresteki explain=on planı da ister.
          lines:
            - {match: '@bp.get("/api/report")', say: "Rapor isteği buraya gelir.", tag: Tarayıcı → Uygulama}
            - {match: 'explain = request.args.get("explain") == "on"', say: "Plan istendi mi, ona bakar.", tag: Uygulamanın içinde}
            - {match: 'sql(cur, "SELECT (report)", q,', say: "Segment raporunu Aurora'ya gönderir.", tag: [Uygulama → Aurora, Aurora → Uygulama]}
            - {match: 'sql(cur, "EXPLAIN ANALYZE", "EXPLAIN ANALYZE " + q)', say: "Plan istendiyse aynı sorguyu EXPLAIN ANALYZE ile bir kez daha çalıştırır.", tag: [Uygulama → Aurora, Aurora → Uygulama]}
            - {match: 'plan = "\n".join(r[0] for r in cur.fetchall())', say: Planın satırlarını tek bir metinde birleştirir., tag: Uygulamanın içinde}
            - {match: 'sql(cur, "SELECT (workshop orders)", today)', say: "Üçüncü sorgu: mağazada verilen siparişlerin saatlik özeti.", tag: [Uygulama → Aurora, Aurora → Uygulama]}
            - {match: 'return jsonify(trace.payload({"segments": seg, "workshop": hours, "plan": plan}))', say: Rapor, özet ve plan tarayıcıya gider., tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek veritabanında ne oldu?
        intro: Senin işaretlemenle Aurora'ya giden üç gerçek sorgu.
        runs:
          - label: Rapor + plan (senin işaretlemen)
            trigger: true
            metrics: [[Segment raporu, ms], [EXPLAIN ANALYZE, e1.ms], [Saatlik özet, e2.ms], [Segment sayısı, items]]
        reading: >-
          Segment raporu birkaç on milisaniye sürdü; EXPLAIN ANALYZE aynı sorguyu bir kez daha çalıştırdığı için onun da süresi
          benzer. Bu küçük veride rapor işlemsel veritabanında rahat çalışıyor. Süre her istekte değişir.
      query:
        title: Uygulama Aurora'ya ne dedi?
        intro: >-
          Raporun SQL'i ve planı isteyen ek parça. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: ex
            say: Şu sorguyu gerçekten çalıştır ve her adımı ölçerek anlat;
            code: "EXPLAIN ANALYZE"
            name: Ne istensin?
            note: ANALYZE olmadan sadece tahmini plan gelir; ANALYZE ile sorgu çalışır ve gerçek satır sayıları ile süreler gelir.
            hl: app
          - id: sel
            say: her segment için sipariş sayısını, ciroyu ve ortalama sipariş tutarını,
            code: "SELECT c.segment, count(DISTINCT o.order_id), sum(oi.qty * oi.unit_price), round(avg(o.total), 2)"
            name: Ne hesaplansın?
            note: Üç toplam; GroupAggregate düğümü bunları hesaplar.
            hl: app
          - id: frm
            say: siparişleri müşteriler ve kalemlerle birleştirerek,
            code: "FROM orders o JOIN customers c USING (customer_id) JOIN order_items oi USING (order_id)"
            name: Nereden?
            note: İki JOIN; planda iki Hash Join düğümü.
            hl: app
          - id: wh
            say: iptal edilenleri dışarıda bırakıp en yüksek ciro üstte olacak şekilde.
            code: "WHERE o.status <> 'cancelled' GROUP BY c.segment ORDER BY revenue DESC"
            name: Hangileri, nasıl?
            note: Filtre, Seq Scan orders düğümünde uygulanır; sıralama en üstteki Sort düğümü.
            hl: app
        columns:
          - label: Rapor + plan
            sub: Senin işaretlemenle giden sorgu.
            via: Uygulama bu sorguyu psycopg kütüphanesinin cursor.execute() metoduyla, başına EXPLAIN ANALYZE ekleyerek gönderir.
            parts: [ex, sel, frm, wh]
        note: >-
          Dikkat: sorguda "hash join kullan" ya da "önce şunu oku" yazmıyor. Planı PostgreSQL seçti; tablolar büyüyünce ya da
          index eklenince aynı sorgu için başka bir plan seçebilir.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          Aurora'nın işi rapor ve planı verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: Aurora → Uygulama
            text: Segment satırları, planın satırları ve saatlik özet geldi.
          - who: Uygulama
            text: Planın satırlarını tek bir metne birleştirdi.
          - who: Uygulama → Tarayıcın
            text: Raporu, özeti ve planı tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: Planı sayfadaki kutuya olduğu gibi yazdı.
          - who: Sonra
            text: Canlı ekrana geçeceksin; orada sıralama her yazmada bellekte hazır tutuluyor (Adım 33).
      remember: >-
        SQL ne istediğini söyler, planı veritabanı seçer. EXPLAIN ANALYZE o planı gerçek satır sayıları ve sürelerle gösterir;
        yavaşlığın nedeni tahmin edilmez, okunur.
      why_db: >-
        Neden Aurora PostgreSQL? Operasyon raporları güncel siparişleri JOIN'lerle hemen okumak ister; PostgreSQL'in planlayıcısı ve
        EXPLAIN ANALYZE bunu ölçülebilir kılar. Bedeli: veri büyüdükçe bu raporlar siparişlerle yarışır; büyük raporlar analiz
        deposuna taşınır.

  # ---------------------------------------------------------------- Live: ElastiCache sorted set
  - page: live
    path: /admin/live
    engines: [elasticache]
    use_case: Liderlik tablosu
    title: Sıralı küme her yazmada sırayı korur
    why: >-
      Canlı ekrandasın: en çok alışveriş yapan 10 müşteri, bugünkü sipariş sayısı ve şu an aktif ziyaretçiler. Sayfa her 5
      saniyede kendini yeniliyor. Bu adımda tıklama yok, sadece bakacaksın.
    do: Aydınlık liderlik tablosuna bak. Sonra kartın altındaki butonla perde arkasını aç.
    target: "#board"
    action: look
    wait: {method: GET, path: /elasticache/api/leaderboard}
    result: ZREVRANGE lm:leaderboard 0 9 WITHSCORES returned the top 10.
    panel:
      need: >-
        Canlı ekran en çok alışveriş yapan 10 müşteriyi her 5 saniyede gösteriyor; her siparişte sıralama değişebilir. Her
        yenilemede bütün müşterilerin cirosunu toplayıp sıralamak (binlerce satır, her 5 saniyede) hem yavaş hem israf olur.
        Sıralamanın her an hazır durması gerekiyor.
      concept:
        term: Sıralı küme (sorted set)
        text: >-
          Sorted set, her üyesinin bir puanı olan ve üyeleri puana göre sıralı tutan bir yapıdır. Bir yazma (ZINCRBY) bir üyenin
          puanını artırınca üye hemen yeni yerine geçer. Okurken (ZREVRANGE) sıralama yapılmaz; ilk 10 zaten baştadır. Bir koşu
          yarışında sıralamanın her an tabelada güncel durması gibi: sonuç tablosu yarış bitince hesaplanmaz.
        terms:
          - [Sorted set, "Üyeleri puana göre sıralı tutan küme. Burada üye müşteri numarası, puan toplam ciro."]
          - [ZINCRBY, "Bir üyenin puanını artırır; üye sıradaki yerine kendiliğinden geçer."]
          - [ZREVRANGE, "Puanı en yüksekten başlayarak istenen kadar üyeyi getirir."]
          - [ZCOUNT, "Puanı bir aralıkta olan üyeleri sayar (burada son 5 dakikada görülen ziyaretçiler)."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde canlı sıralama için hazırlık
        intro: >-
          Canlı ekran hiç açılmadan, sıralama ve sayaçlar bellekte kurulur. Aşağıdaki beş adım bu hazırlığın sırasıdır.
        text:
          - title: Önce ekranın soruları yazılır
            text: >-
              "En çok ciro yapan 10 müşteri", "bugünkü sipariş sayısı", "son 5 dakikada aktif ziyaretçi". Üçü de her birkaç saniyede
              sorulur ve tek komutla cevaplanmalıdır.
            code: |-
              ZREVRANGE lm:leaderboard 0 9 WITHSCORES
              GET       lm:orders:today
              ZCOUNT    lm:active <şimdi − 300> +inf
          - title: Sıralama yazarken güncellenir
            text: >-
              Her sipariş verildiğinde müşterinin puanı tutar kadar artırılır; sayaç bir artırılır. Okuma tarafında hesap yapılmaz.
            code: |-
              ZINCRBY lm:leaderboard 3373.84 C00001
              INCR    lm:orders:today
          - title: Başlangıç değeri asıl kayıttan kurulur
            text: >-
              Liderlik tablosu ilk kez kurulurken müşterilerin geçmiş cirosu sipariş veritabanından hesaplanır ve tek seferde
              yazılır (ZADD). Bellek kaybolursa aynı yolla yeniden kurulur.
          - title: Gösterim bilgisi tek komutla alınır
            text: >-
              İlk 10'un adları için 10 ayrı GET yerine tek bir MGET ya da bir hash (HMGET lm:names …) kullanılır, ya da komutlar bir
              pipeline'da tek gidiş-dönüşte gönderilir. Her ayrı komut bir ağ gidiş-dönüşüdür.
            code: |-
              MGET lm:name:C00487 lm:name:C00717 lm:name:C00163 …
          - title: Günlük sayaçlar kendiliğinden sıfırlanır
            text: >-
              "Bugünkü siparişler" gibi sayaçların anahtarına tarih konur (lm:orders:2026-10-31) ve bir süre verilir; ertesi gün yeni
              anahtar başlar, eskisi kendiliğinden silinir.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Sipariş verildiğinde (ZINCRBY ve INCR) ve her sayfa açılışında aktif ziyaretçiler kümesine (ZADD). Başlangıç sıralaması
          sipariş veritabanından bir kez yüklenir.
        reads: Canlı ekran, her 5 saniyede.
        kind: >-
          Uygulama orkestrasyonu. ElastiCache sipariş veritabanından kendiliğinden veri çekmez; her siparişte ona haber verilir.
        with: >-
          Puanların kaynağı siparişlerdir: asıl kayıt Aurora'da, sıralama ElastiCache'te bir kopya. Müşteri adları da bellekte
          kopya olarak tutulur (lm:name:<id>); asıl müşteri kaydı Aurora'dadır.
        best: >-
          Sıralama ve sayaçlar bellekte, yazarken güncellenir; ekranlar sadece okur. Puanlar asıl kayıttan yeniden kurulabilir ve
          sipariş olayları kuyruktan okunarak, idempotent biçimde eklenir.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Adım 25'te sipariş verdiğinde, sayfa ElastiCache'e senin persona'nın puanına sipariş tutarını ekletmişti (ZINCRBY) ve
              bugünkü sipariş sayacını bir artırmıştı (INCR).
            engines: [elasticache]
          - text: >-
              Şimdi canlı ekranı açtın. Sayfa liderlik tablosunu istedi; uygulama ElastiCache'e üç komut gönderdi: ZREVRANGE (ilk 10),
              GET (bugünkü sipariş sayısı), ZCOUNT (aktif ziyaretçiler). Ardından persona olmayan üyelerin adlarını tek tek sordu.
            engines: [elasticache]
          - text: >-
              Tablo çizildi; sayfa her 5 saniyede aynı isteği tekrar gönderiyor. Biri sipariş verirse sıralama bir sonraki yenilemede
              değişir.
            engines: [elasticache]
      sim:
        kind: zset
        title: "lm:leaderboard (sorted set) - canlı değerler"
        caption: >-
          Liderlik tablosunun gerçek ilk 10'u. Önce Adım 25'teki gibi bir siparişin ZINCRBY'si (Ayşe'nin puanı 3.373,84 arttı),
