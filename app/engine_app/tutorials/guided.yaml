              Arama sayfası "siyah" aramasıyla açıldı. Açılırken oturumun güncellendi.
            engines: [elasticache]
          - text: >-
              Tarayıcın aramayı gönderdi; uygulama OpenSearch'e tek bir istekte hem ürünleri hem kategori ve fiyat sayılarını
              sordu. Simülasyonun sol şeridi bu istek.
            engines: [opensearch]
          - text: >-
              40 ürün listelendi (açıklamasında "siyah" geçen ürünler). Soldaki liste "Kitap (11), Elektronik (9)…" diye doldu;
              bu sayılar aynı cevaptan geldi. Kart görselleri S3'ten.
            engines: [opensearch, s3]
          - text: >-
              Sonra soldaki listede "Elektronik"e tıkladın. Tarayıcın aynı aramayı category=Elektronik ile istedi; uygulama
              sorguya bir filtre ekledi. Simülasyonun sağ şeridi bu istek.
