      wire:
        what: >-
          Uygulama sorguyu HTTPS ile Neptune'a gönderir (Python'un requests kütüphanesi). Her istek, uygulamanın IAM
          kimliğiyle ayrı ayrı imzalanır.
        dst: "dbws-neptune.cluster-ccgs3qxfidad.eu-central-1.neptune.amazonaws.com : 8182"
        dst_note: >-
          Neptune cluster'ının adresi. Cluster internete kapalı veri alt ağında; güvenlik grubu sadece bu uygulama
          sunucusundan gelen bağlantıya izin veriyor.
        rows:
          - [Şifreleme, TLS (HTTPS), gerçek, Neptune sadece şifreli bağlantı kabul eder.]
          - [Protokol, "HTTP, POST /openCypher", gerçek, "Neptune'un openCypher kapısı sıradan bir web adresi gibidir; sorgu bir form alanı olarak gider."]
          - [Kimlik, "IAM, SigV4 imzası (servis: neptune-db)", gerçek, "Şifre yok. İsteğin başlıklarına, geçici AWS kimliğiyle hesaplanmış bir imza eklenir; Neptune imzayı kontrol eder."]
        body_label: İsteğin içeriği (okunur hâle getirilmiş, imza değerleri kısaltıldı)
        body: |-
          POST /openCypher HTTP/1.1
          Host: dbws-neptune.cluster-ccgs3qxfidad.eu-central-1.neptune.amazonaws.com:8182
          Content-Type: application/x-www-form-urlencoded
          X-Amz-Date: 20261030T…Z
          X-Amz-Security-Token: …
          Authorization: AWS4-HMAC-SHA256 Credential=…/eu-central-1/neptune-db/aws4_request, SignedHeaders=…, Signature=…

          query=MATCH (me:Customer {`~id`: $cid})-[:BOUGHT]->(:Product)<-[:BOUGHT]-(o:Customer)-[:BOUGHT]->(rec:Product) …
          &parameters={"cid": "C00001"}
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Her satırın
        etiketi işin nerede olduğunu söyler: mor etiketli satırda bir şey bir yerden bir yere gider (tarayıcıdan uygulamaya,
        uygulamadan Neptune'a ya da geri). Gri "Uygulamanın içinde" etiketli satırda iş uygulamanın kendi içinde yapılır,
        hiçbir yere bir şey gitmez. İki istek de aynı kodu çalıştırır; hangi sorgunun seçileceğini adresteki mode belirler.
      app_code:
        - file: engines/neptune.py
          func: api_recs
          title: "1. Öneri isteği (iki istekte de aynı kod)"
          sub: Adresteki mode=product ya da mode=persona hangi sorgunun gideceğini seçer.
          lines:
            - {match: '@bp.get("/api/recs")', say: Öneri isteği buraya gelir., tag: Tarayıcı → Uygulama}
            - {match: 'mode = request.args.get("mode", "product")', say: "Hangi öneri isteniyor: bu ürüne göre mi, sana göre mi?", tag: Uygulamanın içinde}
            - {match: 'params, query = {"cid": persona_id()}, BY_PERSONA', say: "Sana göre ise 3 hop'luk sorguyu seçer; başlangıç, seçtiğin müşteri.", tag: Uygulamanın içinde, hl: hop3}
            - {match: 'params, query = {"pid": request.args.get("product", "P0001")}, BY_PRODUCT', say: "Değilse 2 hop'luk sorguyu seçer; başlangıç, bu sayfadaki ürün.", tag: Uygulamanın içinde, hl: start}
            - {match: 'rows = _q(query, params)', say: "Sorgu Neptune'a gider, en fazla 6 öneri geri gelir (gönderme işi 2. kartta).", tag: [Uygulama → Neptune, Neptune → Uygulama], hl: result}
            - {match: 'return jsonify(trace.payload(rows))', say: "Öneriler olduğu gibi tarayıcıya gider. Uygulama sayma, eleme ya da sıralama yapmaz; hepsi sorgunun içinde.", tag: Uygulama → Tarayıcı}
        - file: engines/neptune.py
          func: _q
          title: "2. Sorguyu Neptune'a gönderme"
          sub: Bütün Neptune sorgularının geçtiği küçük yardımcı.
          lines:
            - {match: 'url = f"https://', say: "Neptune'un adresi: HTTPS, 8182 numaralı kapı, /openCypher yolu.", tag: Uygulamanın içinde}
            - {match: 'body = {"query": query}', say: Sorgu metni isteğin gövdesine konur., tag: Uygulamanın içinde}
            - {match: 'SigV4Auth(', say: "İstek, uygulamanın geçici AWS kimliğiyle imzalanır. Şifre yok.", tag: Uygulamanın içinde}
            - {match: 'resp = requests.post(', say: requests kütüphanesi isteği Neptune'a gönderir ve cevabı bekler., tag: [Uygulama → Neptune, Neptune → Uygulama]}
            - {match: 'return resp.json()["results"]', say: Cevaptaki satırlar alınır., tag: Uygulamanın içinde}
      live:
        title: Gerçek grafta ne oldu?
        intro: >-
          İki gerçek sorgu: sayfa açılırken giden "bu ürüne göre" sorgusu ve senin tıklamanla giden "sana göre" sorgusu.
          Gerçek grafta 1000 müşteri ve 200 ürün var.
        runs:
          - label: Bu ürüne göre (2 hop)
            page_call: {path: /neptune/api/recs, query: {mode: product}}
            metrics: [[Önerilen ürün, items], [Süre, ms]]
          - label: Sana göre (3 hop)
            trigger: true
            metrics: [[Önerilen ürün, items], [Süre, ms]]
        reading: >-
          İki sorgu da en fazla 6 öneri döndürdü. Sağdaki bir hop daha uzun: daha çok kenar takip eder, bu yüzden genelde
          daha uzun sürer. Bu kurulumda Neptune Serverless çalışıyor (en az 1 NCU) ve yük artınca kapasitesini kendisi
          büyütüyor. Bir süre sorulmayan bir sorgunun ilk çalışması birkaç saniye sürebilir, çünkü veri henüz bellekte değildir;
          sonraki çalıştırmalar hızlanır. Ekrandaki puanlar (örn. "71 shared customers") ortak müşteri sayısıdır:
          simülasyondaki küçük sayıların gerçek grafta büyümüş hâli.
      query:
        title: Sayfa Neptune'a ne dedi?
        intro: >-
          İki sütun, simülasyondaki iki yürüyüşün gerçek openCypher sorguları. Yolu bir resim gibi okuyabilirsin: parantez
          bir düğüm, köşeli parantez bir kenar, ok da kenarın yönü.
        cards_title: Parça parça
        parts:
          - id: pstart
            say: Bu ürünün düğümünden başla,
            code: "MATCH (p:Product {`~id`: $pid})"
            name: Nereden?
            note: Başlangıç düğümü bu sayfanın ürünü. $pid yerine ürün no (P0001) gelir.
            hl: start
          - id: pback
            say: onu alan müşterilere git,
            code: "<-[:BOUGHT]-(c:Customer)"
            name: 1. hop
            note: Ürüne gelen BOUGHT kenarlarını geriye doğru takip et. Ok ürünü gösteriyor, çünkü kenar müşteriden ürüne gider.
            hl: hop1
            indent: 2
          - id: pfwd
            say: onların aldığı ürünlere git,
            code: "-[:BOUGHT]->(rec:Product)"
            name: 2. hop
            note: Bu müşterilerin BOUGHT kenarlarını ileri doğru takip et; vardığın ürünler öneri adayları.
            hl: hop2
            indent: 2
          - id: pwhere
            say: bu ürünün kendisini çıkar,
            code: "WHERE rec <> p"
            name: Ne elensin?
            note: Ürünün kendisini kendine önerme. Başka hiçbir şey elenmiyor; senin zaten aldıkların da listede kalabilir.
            hl: exclude
          - id: pret
            say: her ürünü kaç farklı müşteri almış say ve en çok paylaşılan 6 ürünü getir.
            code: "RETURN rec, count(DISTINCT c) AS score ORDER BY score DESC LIMIT 6"
            name: Nasıl sıralansın?
            note: >-
              Her öneri adayına kaç ayrı müşteriden ulaşıldığını say (score), en yüksek 6'yı döndür. Gerçek sorguda
              RETURN ürün no, ad ve kategoriyi de getirir.
            hl: result
          - id: mstart
            say: Senin düğümünden başla, aldığın ürünlere git,
            code: "MATCH (me:Customer {`~id`: $cid})-[:BOUGHT]->(:Product)"
            name: Nereden? + 1. hop
            note: Başlangıç senin seçtiğin müşteri ($cid = C00001). İlk kenar seni aldığın ürünlere götürür.
            hl: hop1
          - id: mback
            say: aynı ürünleri alan diğer müşterilere git,
            code: "<-[:BOUGHT]-(o:Customer)"
            name: 2. hop
            note: O ürünlere gelen kenarlarla, aynı ürünü almış diğer müşterilere (o) ulaş.
            hl: hop2
            indent: 2
          - id: mfwd
            say: onların aldıklarına git,
            code: "-[:BOUGHT]->(rec:Product)"
            name: 3. hop
            note: Bu müşterilerin aldıkları ürünler öneri adayları.
            hl: hop3
            indent: 2
          - id: mwhere
            say: kendini ve zaten aldıklarını çıkar,
            code: "WHERE o <> me AND NOT (me)-[:BOUGHT]->(rec)"
            name: Ne elensin?
            note: >-
              İki eleme: yolu senin üzerinden geri dönen kendini sayma, ve senden rec'e zaten bir BOUGHT kenarı varsa o
              ürünü önerme. Simülasyonda üstü çizilen ürünler bu satır yüzünden elendi.
            hl: exclude
            tag: sadece sağdaki sorguda var
          - id: mret
            say: her ürünü kaç farklı müşteri almış say ve en çok paylaşılan 6 ürünü getir.
            code: "RETURN rec, count(DISTINCT o) AS score ORDER BY score DESC LIMIT 6"
            name: Nasıl sıralansın?
            note: "Soldakiyle aynı sayma: her adaya kaç ayrı müşteriden (o) ulaşıldı."
            hl: result
        columns:
          - label: Bu ürüne göre (2 hop)
            sub: Sayfa ilk açıldığında giden sorgu.
            via: >-
              Uygulama bu sorguyu requests kütüphanesinin post() metoduyla, SigV4 imzalı bir HTTPS isteği olarak gönderir.
            parts: [pstart, pback, pfwd, pwhere, pret]
          - label: Sana göre (3 hop)
            sub: Senin "For my persona" tıklamanla giden sorgu.
            via: >-
              Aynı yoldan gider. Bu sorgunun eleme ve sayma işleri de Neptune'da yapılır; uygulama sonuca dokunmaz.
            parts: [mstart, mback, mfwd, mwhere, mret]
            mark: [mwhere]
        note: >-
          Dikkat: iki sorguda da "tabloyu tara" diyen bir şey yok. Sorgu bir yol çiziyor ve Neptune o yolu başlangıç
          düğümünden takip ediyor. Sağdaki sorgunun farkı başlangıç noktası (ürün yerine sen), bir hop fazlası ve senin
          aldıklarını eleyen NOT (me)-[:BOUGHT]->(rec) parçası.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          Neptune'un işi önerileri verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: Neptune → Uygulama
            text: >-
              {items} öneri geldi: ürün no, ad, kategori ve skor (ortak müşteri sayısı). Eleme, sayma ve sıralama Neptune'da,
              sorgunun içinde yapıldı.
          - who: Uygulama
            text: Satırlara dokunmadı. Sadece isteğin kaydını (trace) cevaba ekledi.
          - who: Uygulama → Tarayıcın
            text: Önerileri ve isteğin kaydını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: >-
              Önerileri "Recommended for …" (sana önerilenler) başlığıyla çizdi. Her kartın altındaki "shared customers"
              (ortak müşteri) sayısı skordur.
          - who: Sonra
            text: >-
              Yeni bir sipariş grafa BOUGHT kenarı olarak eklendiği anda bir sonraki öneri değişir; grafı baştan hesaplamaya
              gerek yoktur.
      remember: >-
        İlişkiler üzerinden giden sorularda ("benim gibi alanlar ne aldı?") graf veritabanı yolu doğrudan takip eder.
        Bir hop eklemek sorguya bir parça eklemek kadar kolaydır.
      why_db: >-
        Neden Neptune? Aynı soruyu ilişkisel bir veritabanında sorsaydık her hop, büyük bir alımlar tablosuna bir JOIN
        daha demek olurdu; 3 hop, aynı tabloya 3 kez JOIN. Neptune kenarları düğümlerin yanında tutar ve sadece
        başlangıç noktasının çevresini okur. Bedeli: toplamlar, raporlar ve sıradan tablo işleri için uygun değildir;
        satış raporu gibi işler başka bir veritabanında yapılır.

  - page: product
    path: /p/P0001
    engines: [dynamodb]
    use_case: Alışveriş sepeti
    title: Ürünü sepete ekle
    why: >-
      Sepet DynamoDB adlı veritabanında duruyor. Senin sepetin, içinde ürün kartları olan bir çekmece gibi: çekmecenin
      etiketi senin tarayıcının kimliği (pk = CART#…), her kart da sepetteki bir ürün (sk = ITEM#P0001). DynamoDB bir
      ürünü bulmak için bu iki etikete bakar, başka hiçbir şeyi taramaz.
    do: Aydınlık "Add to cart" (sepete ekle) butonuna tıkla. Adet 1 kalsın.
    target: "#add"
    action: click
    wait: {method: POST, path: /dynamodb/api/cart/items}
    focus: "#add-msg"
    result: >-
      DynamoDB sepetine 1 adet yazdı. Yazma tek komutla yapıldı (UpdateItem, ADD qty): ürün sepette yoksa oluşturuldu,
      varsa adedi 1 arttı. Aşağıdaki satır bu yazmanın süresini ve harcadığı yazma birimini (WRU) gösteriyor. Bu 1 adet,
      sonraki iki adımda kuralı denemek için gerekli.

  - page: product
    path: /p/P0001
    engines: [dynamodb]
    use_case: Koşullu yazma
    title: Kuralı bozacak bir yazma hazırla
    why: >-
      Sepet kuralı: bir üründen en fazla 5 adet. Az önceki adımda sepete 1 adet ekledin. Şimdi 5 adet daha eklemeyi
      deneyeceğiz; bu, toplamı 6 yapar ve kuralı bozar.
    do: Aydınlık adet (quantity) kutusuna 5 yaz.
    target: "#qty"
    action: type
    wait: {value: "5"}

  - page: product
    path: /p/P0001
    engines: [dynamodb]
    use_case: Koşullu yazma
    title: Bir koşul kötü bir yazmayı durdurur
    why: >-
      Sepet DynamoDB adlı veritabanında duruyor. Sayfa "5 adet ekle" derken yanına bir koşul da koyuyor: "sadece toplam 5'i
      geçmeyecekse yaz". Bu, bir kapı görevlisine benzer: kontrol eder ve uygun değilse içeri almaz. Kontrol ve yazma tek
      hamlede yapılır.
    do: Aydınlık "Add to cart" (sepete ekle) butonuna tıkla. Üstteki "Limit 5 per product" kutusu işaretli kalsın.
    target: "#add"
    action: click
    wait: {method: POST, path: /dynamodb/api/cart/items, body: {qty: "5"}}
    focus: "#add-msg"
    panel:
      need: >-
        Sepete "5 adet daha" yazılmadan önce mevcut adedin kontrol edilmesi gerekiyor. Bunu uygulama yapsaydı, önce
        okuyup sonra yazması gerekirdi; aynı anda iki sekmeden ekleme yapılırsa ikisi de eski değeri görüp kuralı
        aşabilirdi. Kontrolün veritabanının içinde, yazmayla aynı anda yapılması gerekiyor.
      concept:
        term: Koşullu yazma (ConditionExpression)
        text: >-
          DynamoDB'ye bir yazma gönderirken yanına bir koşul ekleyebilirsin. DynamoDB önce koşulu, item'ın o anki
          değerine bakarak kontrol eder. Koşul doğruysa yazar, yanlışsa hiçbir şey yazmaz ve "koşul tutmadı" der. Kontrol
          ile yazma tek bir adımdır, arada başka bir yazma araya giremez. Item, DynamoDB'de bir kayıt (bir satır) demek.
        terms:
          - [Item, "DynamoDB'deki tek bir kayıt. Burada sepetindeki bir ürün."]
          - ["pk + sk (anahtar)", "Item'ı bulmanın adresi. pk sepetin (CART#…), sk sepetteki ürün (ITEM#P0001)."]
          - [WRU, "Write request unit: DynamoDB'de yazma başına ödenen birim. Reddedilen koşullu yazma da 1 WRU harcar."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde sepet tablosu nasıl kurulur?
        intro: >-
          Butona basılmadan önce hazır olması gerekenler: tablonun anahtarları ve sepet kuralları.
        text:
          - >-
            Anahtar, sorulacak soruya göre seçilir. "Bu ziyaretçinin sepetini getir" sorusu için pk = CART#<ziyaretçi>,
            sk = ITEM#<ürün> olur. Bir sepetin bütün item'ları aynı pk altında durur ve tek bir Query ile gelir; tek bir
            ürüne de pk + sk ile doğrudan gidilir.
          - >-
            İş kuralı yazmanın içine konur. "Bir üründen en fazla 5 adet" gibi bir kural için önce okuyup sonra yazılmaz;
            kural yazmaya ConditionExpression olarak eklenir. Birden fazla item birlikte değişecekse (ör. iki ürün aynı anda)
            TransactWriteItems ile hepsi ya birlikte yazılır ya hiç yazılmaz.
          - >-
            Adet gibi sayılar ADD ile artırılır. ADD atomiktir: iki sekme aynı anda ekleme yapsa da eklemelerden biri
            kaybolmaz.
          - >-
            Terk edilen sepetler TTL ile silinir. Her item'a bir silinme zamanı (expires_at) yazılır; DynamoDB süresi geçen
            item'ları kendisi, ek yazma ücreti almadan siler. Silme birkaç gün gecikebileceği için uygulama okurken
            expires_at'i ayrıca kontrol eder.
      feed:
        title: Veri nereden geliyor?
        writes: Uygulama. Ürün sayfasındaki "sepete ekle", sepet sayfasındaki silme ve adet değiştirme.
        reads: Uygulama. Sepet sayfası, başlıktaki sepet sayacı ve ödeme adımı.
        kind: >-
          Uygulama orkestrasyonu. DynamoDB başka bir veritabanından kendiliğinden veri çekmez. Ama kendi değişikliklerini
          dışarı verebilir: DynamoDB Streams açıksa her yazma, 24 saat boyunca okunabilen bir değişiklik kaydı olur.
        best: >-
          Sipariş verilince sepet, siparişin asıl kaydına (ilişkisel veritabanı) dönüşür ve sepet boşaltılır. "Sepetini
          unuttun" hatırlatması ya da analiz gibi işler için DynamoDB Streams'i bir AWS Lambda fonksiyonu okur; uygulama
          bu işleri sayfanın isteğine eklemez, böylece sayfa yavaşlamaz.
      sim:
        kind: condition-write
        caption: >-
          Sepet tablosundan örnek bir kesit: üç ziyaretçinin sepetindeki altı item. Senin sepetinde Kablosuz Kulaklık'tan
          1 adet var. Solda senin gerçek isteğin (koşullu), sağda aynı istek koşulsuz gitseydi ne olurdu; sağdaki gerçekte
          gönderilmedi. Üstteki etiketler o anda işi kimin yaptığını gösterir: uygulama mı, DynamoDB mi.
        add: 5
        max: 5
        labels: {cond: Koşulla (senin isteğin), free: Koşulsuz ("Limit" kutusu kapalı olsaydı)}
        rows:
          - {pk: "CART#7f3a…", sk: ITEM#P0001, name: Kablosuz Kulaklık, qty: 1, target: true}
          - {pk: "CART#7f3a…", sk: ITEM#P0131, name: Mekanik Klavye, qty: 2}
          - {pk: "CART#c41e…", sk: ITEM#P0021, name: Akıllı Saat, qty: 1}
          - {pk: "CART#c41e…", sk: ITEM#P0066, name: Powerbank, qty: 3}
          - {pk: "CART#09bd…", sk: ITEM#P0105, name: Deri Ceket, qty: 1}
          - {pk: "CART#09bd…", sk: ITEM#P0176, name: Bluetooth Hoparlör, qty: 4}
        summary: >-
          İki istek de aynı item'ı aynı anahtarla, tek okumada buldu. Fark tek bir şey: koşul. Koşul olunca DynamoDB
          kuralı kendisi korudu; koşul olmasa sepete 6 adet yazılırdı.
      wire:
        what: >-
          Uygulama komutu HTTPS ile DynamoDB'ye gönderir (AWS'nin Python kütüphanesi boto3). Her istek, uygulamanın IAM
          kimliğiyle imzalanır.
        dst: "dynamodb.eu-central-1.amazonaws.com : 443"
        dst_note: >-
          DynamoDB'nin bölge adresi. VPC'deki gateway endpoint sayesinde istek internete çıkmadan AWS'nin iç ağından gider.
        rows:
          - [Şifreleme, TLS (HTTPS), gerçek, DynamoDB sadece şifreli bağlantı kabul eder.]
          - [Protokol, "HTTP, POST /  (JSON gövde)", gerçek, "Her komut bir web isteğidir. Hangi komut olduğunu X-Amz-Target başlığı söyler: UpdateItem."]
          - [Kimlik, "IAM, SigV4 imzası (servis: dynamodb)", gerçek, "Şifre yok. İsteğe, geçici AWS kimliğiyle hesaplanmış bir imza eklenir."]
        body_label: İsteğin içeriği (okunur hâle getirilmiş, bazı değerler kısaltıldı)
        body: |-
          POST / HTTP/1.1
          Host: dynamodb.eu-central-1.amazonaws.com
          X-Amz-Target: DynamoDB_20120810.UpdateItem
          Content-Type: application/x-amz-json-1.0
          Authorization: AWS4-HMAC-SHA256 Credential=…/eu-central-1/dynamodb/aws4_request, SignedHeaders=…, Signature=…

          { "TableName": "dbws-cart",
            "Key": { "pk": {"S": "CART#7f3a…"}, "sk": {"S": "ITEM#P0001"} },
            "UpdateExpression": "ADD qty :q SET #n = :n, unit_price = :p, expires_at = :e",
            "ConditionExpression": "attribute_not_exists(qty) OR qty <= :max",
            "ExpressionAttributeValues": { ":q": {"N": "5"}, ":max": {"N": "0"}, … },
            "ReturnValues": "ALL_NEW", "ReturnConsumedCapacity": "TOTAL" }

          Koşul tutmazsa cevap: HTTP 400, "__type": "…#ConditionalCheckFailedException"
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Her satırın
        etiketi işin nerede olduğunu söyler: mor etiketli satırda bir şey bir yerden bir yere gider (tarayıcıdan uygulamaya,
        uygulamadan DynamoDB'ye ya da geri). Gri "Uygulamanın içinde" etiketli satırda iş uygulamanın kendi içinde yapılır,
        hiçbir yere bir şey gitmez.
      app_code:
        - file: engines/dynamodb.py
          func: api_add
          title: '"Sepete ekle" isteği'
          sub: Senin tıklamanla gelen istek.
          lines:
            - {match: '@bp.post("/api/cart/items")', say: "\"Sepete ekle\" isteği buraya gelir: ürün, adet (5) ve \"Limit\" kutusunun durumu.", tag: Tarayıcı → Uygulama}
            - {match: 'UpdateExpression="ADD qty :q SET', say: "Ne yazılacağını hazırlar: adede 5 ekle; ad, fiyat ve silinme zamanını yaz.", tag: Uygulamanın içinde, hl: add}
            - {match: 'kwargs["ConditionExpression"] = "attribute_not_exists(qty) OR qty <= :max"', say: "\"Limit\" kutusu işaretliyse komuta koşulu ekler.", tag: Uygulamanın içinde, hl: cond}
            - {match: 'kwargs["ExpressionAttributeValues"][":max"] = MAX_QTY - qty', say: "Kuralı sayıya çevirir: :max = 5 − 5 = 0. Bu hesabı uygulama yapar, DynamoDB değil.", tag: Uygulamanın içinde, hl: cond}
            - {match: 'resp = table().update_item(**kwargs)', say: "boto3 komutu gönderir. Koşul tutarsa DynamoDB yazar ve item'ın yeni hâlini döner.", tag: [Uygulama → DynamoDB, DynamoDB → Uygulama], hl: key}
            - {match: 'except table().meta.client.exceptions.ConditionalCheckFailedException:', say: "Koşul tutmazsa DynamoDB bir hata döner; uygulama onu yakalar ve \"en fazla 5 adet\" mesajını hazırlar.", tag: Uygulamanın içinde, hl: cond}
            - {match: 'items = get_cart(True)', say: "Sepetin güncel hâlini almak için DynamoDB'ye ikinci bir komut (Query) gider.", tag: [Uygulama → DynamoDB, DynamoDB → Uygulama]}
            - {match: 'return jsonify(trace.payload({"items": items, "refused": refused}))', say: Sepet ve varsa ret mesajı tarayıcıya gider., tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek tabloda ne oldu?
        intro: Senin tıklamanla DynamoDB'ye giden gerçek istek ve cevabı.
        runs:
          - label: Senin isteğin (koşullu)
            trigger: true
            metrics: [[Sonuç, data.refused, {set: "Reddedildi ✗", empty: "Yazıldı ✓"}], [Kapasite, capacity], [Süre, ms]]
        reading: >-
          DynamoDB koşulu kontrol etti ve yazmayı reddetti; sepetinde hâlâ 1 adet var. Ekrandaki kırmızı mesaj bu
          reddin sonucu. Reddedilen yazma da 1 WRU harcadı: DynamoDB kontrol için item'ı okumak zorundaydı. Sonuç
          "Yazıldı" görünüyorsa sepetinde bu üründen hiç yoktu: önceki adımı (sepete 1 adet ekleme) atlamış olabilirsin.
      query:
        title: Sayfa DynamoDB'ye ne dedi?
        intro: >-
          İki sütun, simülasyondaki iki tarafın komutu. Solda senin gönderdiğin koşullu komut, sağda "Limit" kutusu
          kapalıyken gidecek komut. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: key
            say: Bu sepetteki bu ürünün item'ını bul,
            code: "table.update_item(Key={'pk': 'CART#7f3a…', 'sk': 'ITEM#P0001'},"
            name: Hangi item?
            note: >-
              Anahtar: pk senin sepetin, sk sepetteki ürün. DynamoDB anahtarla item'a doğrudan gider; tabloyu taramaz.
            hl: key
          - id: upd
            say: adedine 5 ekle, adını, fiyatını ve silinme zamanını yaz,
            code: "UpdateExpression='ADD qty :q SET #n = :n, unit_price = :p, expires_at = :e',"
            name: Ne yazılsın?
            note: >-
              ADD qty :q adedi :q (5) kadar artırır; item yoksa 5 ile oluşturur. SET diğer alanları yazar. expires_at,
              sepetin 24 saat sonra kendiliğinden silinme zamanıdır (TTL).
            hl: add
            indent: 2
          - id: cond
            say: "ama sadece item yoksa ya da adedi 0'dan fazla değilse,"
            code: "ConditionExpression='attribute_not_exists(qty) OR qty <= :max',"
            name: Hangi koşulla?
            note: >-
              Koşul. attribute_not_exists(qty): sepette bu ürün hiç yoksa yaz. qty <= :max: varsa, adedi :max'ı
              geçmiyorsa yaz. Uygulama :max'ı 5 − 5 = 0 olarak gönderdi; senin adedin 1, yani koşul tutmadı.
            hl: cond
            indent: 2
            tag: sadece soldaki komutta var
          - id: cap
            say: ve ne kadar kapasite harcandığını da söyle.
            code: "ReturnConsumedCapacity='TOTAL')"
            name: Ek bilgi
            note: DynamoDB'den bu isteğin kaç birim harcadığını cevapta geri istemek. Paneldeki "Kapasite" sayısı buradan geliyor.
            hl: result
            indent: 2
        columns:
          - label: Koşulla (senin isteğin)
            sub: Senin "Add to cart" tıklamanla giden komut ("Limit 5 per product" işaretli).
            via: >-
              Uygulama bu komutu boto3 kütüphanesinin update_item() metoduyla gönderir. :max değerini (5 − 5 = 0) hesaplayıp
              koyan da uygulamadır.
            parts: [key, upd, cond, cap]
            mark: [cond]
          - label: Koşulsuz
            sub: '"Limit 5 per product" kutusu kapalıyken gidecek komut.'
            via: Aynı update_item() çağrısı, ConditionExpression olmadan.
            parts: [key, upd, cap]
        note: >-
          Dikkat: kural "en fazla 5" ama komutta 5 yazmıyor, 0 yazıyor. Uygulama koşulu "şimdiki adet + eklenecek ≤ 5"
          yerine "şimdiki adet ≤ 5 − eklenecek" olarak gönderiyor, çünkü DynamoDB koşulda item'ın şimdiki değerine bakar.
          Sağdaki komutun tek farkı ConditionExpression parçasının olmaması: DynamoDB bu durumda hiçbir şeyi kontrol etmez.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          DynamoDB'nin işi cevabı verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: DynamoDB → Uygulama
            text: >-
              Koşul tutmadı: DynamoDB ConditionalCheckFailedException döndü ve hiçbir şey yazmadı. Bu kontrol de 1 WRU
              harcadı. (Sepetinde bu üründen hiç yoksa koşul tutar ve 5 adet yazılır.)
          - who: Uygulama
            text: >-
              Hatayı yakaladı ve "en fazla 5 adet" mesajını hazırladı. Sonra sepetin güncel hâlini okumak için DynamoDB'ye
              ikinci bir komut (Query) gönderdi.
          - who: Uygulama → Tarayıcın
            text: Sepeti ve ret mesajını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: Butonun altına kırmızı mesajı yazdı. Sepetteki adet değişmedi.
          - who: Sonra
            text: >-
              Sepet item'ları 24 saat sonra TTL ile kendiliğinden silinir. Sipariş verilirse sepet boşaltılır.
      remember: >-
        Bir kuralı korumak için önce okuyup sonra yazma; kuralı yazmanın içine koşul olarak koy. Kontrol ve yazma tek
        adımda olunca, aynı anda gelen iki istek kuralı birlikte aşamaz.
      why_db: >-
        Neden DynamoDB? Sepet, ziyaretçi başına küçük ve çok sık değişen bir veri. DynamoDB bunu anahtarla, her ölçekte
        birkaç milisaniyede okur ve yazar; koşullu yazma ve TTL'yi kendisi sunar. Bedeli: anahtarı bilmeden esnek
        sorgu yapamazsın ve tablo, hangi sorular sorulacağına göre önceden tasarlanır.

  # ---------------------------------------------------------------- Cart: DynamoDB
  - page: cart
    path: /cart
    engines: [dynamodb]
    use_case: Read consistency
    title: Read the cart for half the cost
    why: >-
      A strongly consistent read returns the last write. An eventually consistent read can be a moment behind, and it costs half the read capacity.
    do: Click the lit button "Eventually consistent".
    target: "#exp-consistent [data-value=false]"
    action: click
    wait: {method: GET, path: /dynamodb/api/cart, query: {consistent: "false"}}
    focus: "#cart"
    result: The Query used half the read request units (RRU). Checkout still reads the cart strongly consistent, because the order must have the last quantity.

  - page: cart
    path: /cart
    engines: [dynamodb]
    use_case: Burst traffic
    title: A burst of shoppers
    why: >-
      On-demand mode needs no capacity plan. The simulation writes from 200 synthetic shoppers in parallel.
    do: Click the lit button "Start the simulation".
    target: "#sim-run"
    action: click
    wait: {method: POST, path: /dynamodb/api/simulate, any: true}
    focus: "#sim-out"
    result: Look at the writes per second and the latency percentiles. If the simulation limit refused the run, the note names the limit.

  # ---------------------------------------------------------------- Deals: ElastiCache
  - page: deals
    path: /deals
    engines: [elasticache]
    use_case: Atomic counter
    title: Buy one piece with DECR
    why: >-
      The stock is one integer key. DECR lowers it by one and returns the new value in one atomic command.
    do: Click the lit button "Buy one now".
    target: "#buy"
    action: click
    wait: {method: POST, path: /elasticache/api/deal/buy}
    focus: "#deal"
    result: DECR returned the new stock. No other command can run between the read and the write, because they are one command.

  - page: deals
    path: /deals
    engines: [elasticache]
    use_case: Yarış durumu
    title: Güvensiz yolu seç
    why: >-
      Fırsat ürününün stoğu ElastiCache'te bellekte duran bir sayaç. "Önce oku, sonra yaz" yolunda her alıcı önce stoğu
      okur, sonra bir eksiğini yazar. Aynı anda iki alıcı aynı değeri okuyabilir.
    do: Aydınlık "Read, then write" (önce oku, sonra yaz) butonuna tıkla.
    target: "#exp-mode [data-value=naive]"
    action: click
    wait: {click: true}

  - page: deals
    path: /deals
    engines: [elasticache]
    use_case: Yarış durumu
    title: İzdihamı başlat
    why: >-
      Şimdi 300 alıcı aynı anda 10 parçalık stoğu almaya çalışacak. Bu bir yarış: herkes aynı sayaca aynı anda
      koşuyor. Kazananı belirleyen şey, sayacın nasıl azaltıldığı.
    do: Aydınlık "Start the rush" (izdihamı başlat) butonuna tıkla.
    target: "#sim-run"
    action: click
    wait: {method: POST, path: /elasticache/api/deal/simulate, body: {mode: naive}, any: true}
    focus: "#sim-out"
    panel:
      need: >-
        Fırsat ürününün stoğu sınırlı ve çok kişi aynı anda almak istiyor. Stoktan fazla satılmaması gerekiyor: 10 parça
        varsa tam 10 kişi almalı. Sorun şu: "stoğu oku, 0'dan büyükse bir eksiğini yaz" iki ayrı adım ve iki adımın
        arasında başka alıcılar da okuyabiliyor.
      concept:
        term: Yarış durumu (race condition) ve atomik işlem
        text: >-
          Bir dükkânda tek bir ürün kalmış ve iki satıcı aynı anda rafa bakıp "bir tane var" diyor. İkisi de ürünü
          satıyor ama rafta sadece bir tane var. Buna yarış durumu denir. Çözüm, bakmak ve almak işini tek hamlede yapmak:
          buna atomik işlem denir. ElastiCache'in (Valkey) DECR komutu sayacı tek hamlede azaltır ve yeni değeri söyler.
          Valkey komutları tek tek sırayla çalıştırdığı için iki DECR asla aynı değeri göremez.
        terms:
          - [GET / SET, "GET sayacı okur, SET sayaca bir değer yazar. İki ayrı komut."]
          - [DECR, "Sayacı 1 azaltır ve yeni değeri döndürür. Okuma ve yazma tek komut."]
          - [ElastiCache (Valkey), "Veriyi bellekte tutan, mikrosaniyeler içinde cevap veren anahtar-değer veritabanı."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde fırsat stoğu nasıl tutulur?
        intro: >-
          İzdiham başlamadan önce hazır olması gerekenler: bellekteki sayaç ve onu değiştirme kuralı.
        text:
          - >-
            Stok sayacı bellekte tek bir anahtardır. Fırsat ürününün kalan adedi ElastiCache'te bir tamsayı olarak tutulur ve
            satış başlamadan önce asıl stok kaydından (veritabanından) kurulur. Bellekte durduğu için binlerce alıcıya
            aynı anda mikrosaniyeler içinde cevap verir.
          - >-
            Paylaşılan değer tek bir atomik komutla değişir: DECR, INCR. Birden fazla şey birlikte kontrol edilecekse (ör.
            hem stok hem "kişi başı en fazla 1") bunlar Valkey'de tek bir Lua betiği ya da fonksiyon olarak, yine tek
            hamlede çalıştırılır. "Önce oku, sonra yaz" yapılmaz.
          - >-
            Sayaç kapıdaki ilk elemedir, asıl kayıt değildir. Satışın asıl kaydı (sipariş, ödeme) ilişkisel bir veritabanına
            transaction ile yazılır. Ödeme başarısız olursa sayaç INCR ile geri artırılır.
          - >-
            Tek bir anahtar tek bir yerde durur. ElastiCache yüke göre büyür ve anahtarları parçalara (shard) dağıtır, ama
            tek bir sayaç her zaman tek bir parçadadır. Çok büyük kampanyalarda stok birkaç anahtara bölünür.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Satış başlarken sayacı asıl stok kaydından kuran bir iş; satış sırasında her alıcının isteğiyle uygulama (DECR).
        reads: Uygulama, fırsat sayfasındaki "kalan adet" için.
        kind: >-
          Uygulama orkestrasyonu. ElastiCache başka bir veritabanından kendiliğinden veri çekmez; içine ne yazılırsa onu
          tutar.
        best: >-
          Asıl gerçek her zaman veritabanındadır. Satış bitince satılan adetler veritabanındaki siparişlerle karşılaştırılır.
          Sayaç kaybolursa (ör. bir bakım sırasında) asıl kayıttan yeniden kurulur.
      sim:
        kind: race
        caption: >-
          Küçük bir örnek: 3 parçalık stok ve 6 alıcı. Gerçek denemede 300 alıcı ve 10 parça var; burada her adımı
          görebilmen için sayılar küçük. Alıcılar ikişer ikişer neredeyse aynı anda geliyor. İki şerit, senin tek bir
          gerçek isteğinin içindeki iki tur: önce senin seçtiğin "önce oku, sonra yaz" yolu, hemen ardından aynı alıcı ve
          stokla atomik DECR. Üstteki etiketler o anda işi kimin yaptığını gösterir: uygulama mı, ElastiCache mi.
        key: lm:sim
        stock: 3
        buyers: [Ayşe, Mert, Elif, Lukas, Zeynep, Can]
        tick_ms: 1100
        labels: {naive: 't0 · 1. tur · Senin seçtiğin · "Önce oku, sonra yaz"', atomic: "t0 · 2. tur · Aynı istekte · Atomik DECR"}
      wire:
        what: >-
          Uygulama, ElastiCache'e açık tuttuğu bağlantılar üzerinden komutları gönderir (redis-py kütüphanesi, cluster
          istemcisi). 300 alıcı 48 iş parçacığına bölünür; komutlar aynı anda yola çıkar.
        dst: "dbws-cache-qtkvec.serverless.euc1.cache.amazonaws.com : 6379"
        dst_note: >-
          ElastiCache Serverless'ın adresi. Bu ad, VPC'nin içindeki uç noktaya çözülür; cache internete kapalıdır.
        rows:
          - [Şifreleme, TLS, gerçek, ElastiCache Serverless sadece şifreli bağlantı kabul eder.]
          - [Protokol, RESP (Redis/Valkey protokolü), gerçek, "Her komut kısa bir metin çerçevesidir: komut adı ve parametreleri. HTTP değil."]
          - [Kimlik, "ACL kullanıcısı + şifre, bağlantı açılırken", gerçek, "Şifre kodda yazmaz; uygulama onu çalışırken AWS Secrets Manager'dan alır."]
        body_label: Bir alıcının komutları (okunur hâle getirilmiş; sağda cevap)
        body: |-
          "Önce oku, sonra yaz":
            GET lm:sim:7f3a…               → "10"
            (uygulama işi 1–4 ms)
            SET lm:sim:7f3a… 9 EX 600      → OK

          Atomik:
            DECR lm:sim:7f3a…              → 9

          Ağdaki ham hâli (RESP): *2\r\n$4\r\nDECR\r\n$43\r\nlm:sim:7f3a…\r\n
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Her satırın
        etiketi işin nerede olduğunu söyler: mor etiketli satırda bir şey bir yerden bir yere gider (tarayıcıdan uygulamaya,
        uygulamadan ElastiCache'e ya da geri). Gri "Uygulamanın içinde" etiketli satırda iş uygulamanın kendi içinde
        yapılır, hiçbir yere bir şey gitmez. Yarışın olduğu yer, iki mor satırın arasındaki gri satırlar.
      app_code:
        - file: engines/elasticache.py
          func: api_simulate
          title: '"İzdihamı başlat" isteği'
          sub: Senin tıklamanla gelen istek; iki tur da bu kodda.
          lines:
            - {match: '@bp.post("/api/deal/simulate")', say: "\"İzdihamı başlat\" isteği buraya gelir: seçtiğin yol, alıcı sayısı ve stok.", tag: Tarayıcı → Uygulama}
            - {match: 'r().set(key, stock, ex=600)', say: "Bu deneme için geçici bir sayaç kurulur: stok 10; 10 dakika sonra kendiliğinden silinir.", tag: [Uygulama → ElastiCache, ElastiCache → Uygulama], hl: counter}
            - {match: 'won = r().decr(key) >= 0', say: "Atomik yol: tek komut. ElastiCache azaltır ve yeni değeri döner; 0 veya üstüyse satın aldı.", tag: [Uygulama → ElastiCache, ElastiCache → Uygulama], hl: decr}
            - {match: 'current = int(r().get(key))', say: "\"Önce oku\": sayacın değeri istenir.", tag: [Uygulama → ElastiCache, ElastiCache → Uygulama], hl: get}
            - {match: 'time.sleep(random.uniform(0.001, 0.004))', say: "Uygulama işi (ödeme kontrolü gibi) 1–4 ms sürer. Yarış tam bu aralıkta olur.", tag: Uygulamanın içinde, hl: naive}
            - {match: 'won = current > 0', say: "Karar uygulamada verilir: okunan değer 0'dan büyükse \"satın aldı\".", tag: Uygulamanın içinde, hl: naive}
            - {match: 'r().set(key, current - 1, ex=600)', say: "\"Sonra yaz\": okunan değerin bir eksiği yazılır. Arada başkası yazdıysa onunki ezilir.", tag: [Uygulama → ElastiCache, ElastiCache → Uygulama], hl: set}
            - {match: 'return jsonify(trace.payload({"mode": mode', say: "İki turun sonuçları tek bir cevapta tarayıcıya gider.", tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek izdihamda ne oldu?
        intro: >-
          Senin başlattığın gerçek deneme iki tur çalıştı: önce "önce oku, sonra yaz" yoluyla, hemen ardından aynı alıcı
          ve stok sayısıyla atomik DECR ile. İki tur da ElastiCache'te geçici bir sayaçla çalışır, gerçek stoğa dokunmaz.
        runs:
          - label: '"Önce oku, sonra yaz" (senin denemen)'
            trigger: true
            metrics: [[Alıcı, data.buyers], [Stok, data.stock], [Satılan, data.winners], [Fazla satış, data.oversold], ["Süre (p50, ms)", data.p50_ms]]
          - label: Atomik DECR (aynı denemede)
            trigger: true
            metrics: [[Alıcı, data.buyers], [Stok, data.stock], [Satılan, data.atomic.winners], [Fazla satış, data.atomic.oversold], ["Süre (p50, ms)", data.atomic.p50_ms]]
        reading: >-
          Atomik DECR tam stok kadar sattı ve fazla satış 0. "Önce oku, sonra yaz" yolunda alıcılar okuma ile yazma
          arasında birbirinin değerini ezdi ve stoktan fazla satıldı; fazla satış sayısı her denemede değişir, çünkü kimin
          ne zaman araya girdiği şansa bağlı. Süre (p50), alıcıların yarısının bu süreden kısa sürede cevap aldığı süredir
          (milisaniye). Güvensiz yol okuma ile yazma arasında uygulama işi yaptığı için daha yavaştır.
      query:
        title: Uygulama ElastiCache'e ne dedi?
        intro: >-
          Simülasyondaki iki tarafın komutları. Solda her alıcının gönderdiği iki ayrı komut, sağda tek komut. Bir
          parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: get
            say: Sayacı oku,
            code: v = GET lm:sim
            name: 1. komut
            note: Sayacın o anki değerini oku. Bu cevap yola çıktığı an eskimeye başlar; başka alıcılar sayacı değiştirebilir.
            hl: get
          - id: work
            say: biraz iş yap,
            code: "# ... uygulama işi (1–4 ms)"
            name: Arada
            note: >-
              Gerçek bir uygulama okuma ile yazma arasında iş yapar (ödeme kontrolü gibi). Denemede bu 1–4 ms'lik bir
              bekleme. Yarış tam bu aralıkta olur.
            hl: naive
          - id: set
            say: 0'dan büyükse bir eksiğini yaz.
            code: "if v > 0: SET lm:sim v-1"
            name: 2. komut
            note: >-
              Okunan değerin bir eksiğini yaz. Bu arada başka bir alıcı da aynı v'yi okuduysa, ikisi de aynı değeri yazar:
              iki satış olur, sayaç bir azalır.
            hl: set
          - id: decr
            say: Sayacı tek hamlede bir azalt ve yeni değeri söyle; sonuç 0 veya üstüyse satın aldın.
            code: "DECR lm:sim   → sonuç >= 0 ise kazandın"
            name: Tek komut
            note: >-
              DECR okuma ve yazmayı tek komutta yapar. Valkey komutları sırayla çalıştırır, bu yüzden her alıcı farklı bir
              sonuç görür: 2, 1, 0, sonra −1, −2... Eksi sonuç "parça kalmadı" demek.
            hl: decr
        columns:
          - label: '"Önce oku, sonra yaz"'
            sub: Senin "Read, then write" seçip "Start the rush" tıklamanla giden komutlar (her alıcı için).
            via: >-
              Uygulama bu komutları redis-py kütüphanesinin get() ve set() metotlarıyla gönderir. "0'dan büyükse" kararı
              iki komutun arasında, uygulamada verilir.
            parts: [get, work, set]
          - label: Atomik DECR
            sub: '"Atomic DECR" seçiliyken giden komut (her alıcı için).'
            via: Uygulama bu komutu redis-py'nin decr() metoduyla gönderir; karar için ElastiCache'in döndüğü sayıya bakar.
            parts: [decr]
        note: >-
          Dikkat: soldaki iki komut tek tek doğru çalışıyor; hata komutlarda değil, aralarındaki boşlukta. ElastiCache
          her komutu doğru yaptı, ama iki komutun arasında başka alıcıların komutları da çalıştı. Sağdaki tek komutta
          böyle bir boşluk yok.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          ElastiCache her komuta ayrı ayrı cevap verdi. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: ElastiCache → Uygulama
            text: >-
              Her alıcının komutuna tek tek cevap geldi: GET sayacın değerini, SET "OK", DECR sayacın yeni değerini döndü.
          - who: Uygulama
            text: >-
              Kazananları saydı, fazla satışı (satılan − stok) ve süreleri (p50, p95) hesapladı. Aynı istekte atomik turu da
              çalıştırdı ve sonunda geçici sayacı sildi.
          - who: Uygulama → Tarayıcın
            text: İki turun sonuçlarını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: Sonuç kutusunu çizdi; Perde arkası iki turu yan yana gösteriyor.
          - who: Sonra
            text: >-
              Gerçek fırsat stoğu bu denemeden etkilenmedi; deneme ayrı, geçici bir sayaçla çalıştı.
      remember: >-
        Bir değeri okuyup ona göre yazıyorsan, araya başkası girebilir. Sayaç gibi paylaşılan bir değeri tek bir atomik
        komutla (DECR, INCR) değiştir; okuma ile yazma arasında boşluk bırakma.
      why_db: >-
        Neden ElastiCache? Fırsat stoğu çok sayıda kişinin aynı anda okuduğu ve değiştirdiği küçük bir değer. ElastiCache
        bunu bellekte tutar, mikrosaniyeler içinde cevap verir ve DECR gibi atomik komutları hazır sunar. Bedeli: veri
        bellekte durur; kalıcı kayıt (siparişin kendisi) Aurora gibi bir veritabanına yazılır.

  - page: deals
    path: /deals
    engines: [elasticache]
    use_case: Session with TTL
    title: Make the session short-lived
    why: Your session is a hash with a time to live (TTL). Valkey deletes the key when the TTL gets to zero.
    do: Select a TTL in the lit list.
    target: "#ttl"
    action: change
    wait: {change: true}

  - page: deals
    path: /deals
    engines: [elasticache]
    use_case: Session with TTL
    title: Write the session with its TTL
    why: The button writes the session hash and sets its expiry.
    do: Click the lit button that refreshes the session.
    target: "#ttl-set"
    action: click
    wait: {method: POST, path: /elasticache/api/session, body: {ttl: "*"}}
    focus: "#session"
    result: HSET wrote the fields, and EXPIRE set the TTL. Each read shows a smaller TTL. The app needs no cleanup job.

  # ---------------------------------------------------------------- Checkout: Aurora and the fan-out
  - page: checkout
    path: /checkout
    engines: [aurora]
    use_case: Transaction rollback
    title: Make the payment fail
    why: >-
      Aurora PostgreSQL writes the order in one transaction. If one step fails, ROLLBACK cancels all the steps.
    do: Tick the lit check box "Make the payment fail".
    target: "#exp-fail"
    action: click
    wait: {click: true}

  - page: checkout
    path: /checkout
    engines: [aurora]
    use_case: Transaction rollback
    title: Place the order and watch the rollback
    why: The stock UPDATE runs first. Then the payment step fails.
    do: Click the lit button "Place the order".
    target: "#place"
    action: click
    wait: {method: POST, path: /aurora/api/orders, body: {fail_after_stock: "true"}}
    focus: "#flow"
    result: The calls show BEGIN, the UPDATE of the stock, then ROLLBACK. No order row exists, the stock is back, and your cart did not change.

  - page: checkout
    path: /checkout
    engines: [aurora]
    use_case: One order, six Engines
    title: Let the payment succeed
    why: Now place a real order.
    do: Clear the lit check box.
    target: "#exp-fail"
    action: click
    wait: {click: true}

  - page: checkout
    path: /checkout
    engines: [aurora, dynamodb, elasticache, keyspaces, influxdb, neptune]
    use_case: One order, six Engines
    title: Place the order
    why: >-
      Aurora commits the order. Then five more Engines get an update: DynamoDB empties the cart, ElastiCache updates the leaderboard,
      Keyspaces records a purchase event, InfluxDB counts the order, and Neptune adds BOUGHT edges.
    do: Click the lit button "Place the order".
    target: "#place"
    action: click
    wait: {method: POST, path: /neptune/api/purchase}
    focus: "#flow"
    result: Six Engines stored the part of the order that each one is good at. Aurora holds the official order. The others hold copies or counters for their own job.

  - page: orders
    path: /orders
    engines: [aurora]
    use_case: JOIN on related tables
    title: Your orders come from three tables
    why: orders, order_items and products are separate tables. One SELECT with JOINs builds the list.
    do: Look at the lit list of your orders.
    target: "#orders"
    action: look
    wait: {method: GET, path: /aurora/api/orders}
    result: The query joins on order_id and product_id. Each join is a lookup by a primary key index.

  # ---------------------------------------------------------------- Activity: Keyspaces
  - page: activity
    path: /account/activity
    engines: [keyspaces]
    use_case: Event history
    title: Read the history of your persona
    why: Your persona has seeded history. Its events are in one partition, sorted by time.
    do: Click the lit button "My persona".
    target: "#exp-who [data-value=persona]"
    action: click
    wait: {method: GET, path: /keyspaces/api/activity, query: {who: persona}}
    focus: "#feed"
    result: Keyspaces read one partition, newest first, and stopped after the limit.

  - page: activity
    path: /account/activity
    engines: [keyspaces]
    use_case: Tunable consistency
    title: Read one replica for half the cost
    why: >-
      Keyspaces stores three replicas of each row. LOCAL_QUORUM reads two of them. LOCAL_ONE reads one replica, at half the read cost, and it can miss a very new write.
    do: Click the lit button "LOCAL_ONE".
    target: "#exp-cl [data-value=LOCAL_ONE]"
    action: click
    wait: {method: GET, path: /keyspaces/api/activity, query: {consistency: LOCAL_ONE}}
    focus: "#feed"
    result: The result is the same here, because nobody wrote to this partition in the last moment. The read cost is half.

  # ---------------------------------------------------------------- Reports: Redshift
  - page: reports
    path: /admin/reports
    engines: [redshift]
    use_case: Analytics on history
    title: Group the history by city
    why: >-
      Redshift stores each column in separate blocks. A report that groups revenue by city reads two columns, not the full rows.
    do: Click the lit button "City".
    target: "#exp-dim [data-value=city]"
    action: click
    wait: {method: GET, path: /redshift/api/report, query: {dim: city}}
    focus: "#chart-wrap"
    result: The SQL has GROUP BY city. Redshift scanned many rows but only the columns that the query needs.

  - page: reports
    path: /admin/reports
    engines: [redshift, aurora]
    use_case: Zero-ETL
    title: Read the live copy of Aurora
    why: The zero-ETL integration copies changes from Aurora to Redshift in near real time. You write no pipeline code.
    do: Click the lit button "Live from Aurora".
    target: "#exp-src [data-value=live]"
    action: click
    wait: {method: GET, path: /redshift/api/report, query: {source: live}}
    focus: "#chart-wrap"
    result: This query reads the Aurora tables that zero-ETL copied into Redshift. Your order from checkout is in it.

  - page: reports
    path: /admin/reports
    engines: [redshift, aurora]
    use_case: Zero-ETL
    title: How fresh is the copy?
    why: The status shows how long ago Redshift received the newest order.
    do: Click the lit button that refreshes the status.
    target: "#repl-refresh"
    action: click
    wait: {method: GET, path: /redshift/api/replication}
    focus: "#repl"
    result: Compare the time of your order with the time in Redshift. The difference is the replication lag.

  - page: order_report
    path: /admin/orders
    engines: [aurora]
    use_case: Query plan
    title: Read the query plan
    why: "EXPLAIN ANALYZE shows how PostgreSQL ran the report: the join order, the scans and the time of each step."
    do: Tick the lit check box that shows the plan.
    target: "#exp-explain"
    action: click
    wait: {method: GET, path: /aurora/api/report, query: {explain: "on"}}
    focus: "#plan-wrap"
    result: Each plan node shows rows and time. Large reports on the checkout database compete with checkout traffic. This is why the big reports run in Redshift.

  # ---------------------------------------------------------------- Live: ElastiCache sorted set
  - page: live
    path: /admin/live
    engines: [elasticache]
    use_case: Leaderboard
    title: A sorted set keeps the order at each write
    why: >-
      The leaderboard is a sorted set. Your checkout added the order total to your persona with ZINCRBY. ZREVRANGE returns the top members with no sort at read time.
    do: Look at the lit leaderboard.
    target: "#board"
    action: look
    wait: {method: GET, path: /elasticache/api/leaderboard}
    result: ZREVRANGE lm:leaderboard 0 9 WITHSCORES returned the top 10. ZCOUNT counted the Visitors active in the last 5 minutes.

  # ---------------------------------------------------------------- Ops: InfluxDB
  - page: ops
    path: /admin/ops
    engines: [influxdb]
    use_case: Time-series metrics
    title: One value per time window
    why: >-
      Each sensor reading is one point: a time, tags and a value. aggregateWindow calculates one mean per window. A larger window returns fewer points.
    do: Click the lit button "1 h".
    target: "#exp-win [data-value='1h']"
    action: click
    wait: {method: GET, path: /influxdb/api/series, query: {window: 1h}}
    focus: "#temp-wrap"
    result: The Flux query has range, filter and aggregateWindow. Fewer, smoother points came back. The raw points stay in the bucket.

  # ---------------------------------------------------------------- Graph: Neptune
  - page: graph
    path: /admin/graph
    engines: [neptune]
    use_case: Relationship analysis
    title: The neighbourhood of a customer
    why: Lukas Weber buys books only. Other customers bought the same books. A graph query follows edges. It does not join tables.
    do: Select "Lukas Weber" in the lit list.
    target: "#who"
    action: change
    wait: {method: GET, path: /neptune/api/graph, query: {persona: C00004}}
    focus: "#graph"
    result: The graph shows Lukas, his books, and other buyers of the same books.

  # ---------------------------------------------------------------- Seller: S3
  - page: seller
    path: /seller
    engines: [s3]
    use_case: Private files, direct download
    title: A presigned URL
    why: >-
      The bucket is private. The Engine App signs a URL with its IAM role. The browser then downloads the object from S3 itself, and the bytes do not go through EC2.
    do: Click the lit button "Presigned URL, straight from S3".
    target: "#via-presign"
    action: click
    wait: {method: GET, path: /s3/api/presign/*}
    focus: "#direct"
    result: The URL host is the S3 endpoint. The query string has X-Amz-Signature and X-Amz-Expires.

  - page: seller
    path: /seller
    engines: [s3]
    use_case: Object storage
    title: Upload an image as an object
    why: S3 stores each file as an object with a key, the bytes and metadata. Versioning keeps the old version when you upload to the same key again.
    do: In the lit form, select a small JPEG or PNG file, then click "Upload".
    target: "#upload"
    action: click
    wait: {method: POST, path: /s3/api/upload}
    focus: "#gallery-wrap"
    result: PutObject stored your file with its metadata and returned a new version ID. The uploads/ list shows the object.
