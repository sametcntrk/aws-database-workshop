        send: Canlı ekranı açtın. Uygulama ZREVRANGE lm:leaderboard 0 9 WITHSCORES gönderiyor.
        read_say: ElastiCache kümenin başından 10 üyeyi puanlarıyla verdi; sıralama zaten hazırdı.
        names_say: >-
          Uygulama persona olmayan 7 üyenin adını tek tek GET lm:name:<id> ile sordu: 7 ayrı komut, 7 ağ gidiş-dönüşü. Tek bir MGET
          ile bir kerede alınabilirdi.
        back: Uygulama ilk 10'u, sipariş sayısını ve aktif ziyaretçi sayısını tarayıcına gönderdi.
        summary: >-
          Sıralama okurken değil, yazarken yapıldı: ZINCRBY üyeyi yerine koydu, ZREVRANGE sadece baştan okudu. Ek iş uygulamadaydı:
          adlar için ayrı ayrı GET'ler.
      wire:
        what: >-
          Uygulama, ElastiCache'e açık tuttuğu bağlantılar üzerinden komutları sırayla gönderir (redis-py kütüphanesi, cluster
