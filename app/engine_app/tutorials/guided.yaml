# Mission of the Guided e-commerce app (static/js/mission.js, coach marks and the "Perde arkası" panel). Turkish, 101 level.
# Each step: page (page id), path (shop path; the app base goes in front), engines, use_case, title,
#   why (the idea before the action), do (one instruction), target (CSS selector of the ONE control that is lit),
#   action: click | look | type | change,
#   wait: the Engine call that completes the action {method, path ("*" at the end = prefix), query, body ("*" = any value), any}
#         or {click: true} / {change: true} / {value: "5"} for a control with no Engine call,
#   focus (selector that is lit after the action: the result), result (the "Behind the scenes" text),
#   panel: the "Perde arkası" panel (see static/js/mission.js). Steps with no panel show `result` in the small card.
finish_url: /e2etutorial
steps:
  # ---------------------------------------------------------------- Home: DocumentDB, ElastiCache
  - page: home
    path: /
    engines: [docdb]
    use_case: Product catalog
    title: The category tiles are one aggregation
    why: >-
      Each product is one JSON document in DocumentDB. The page asked DocumentDB to group the 200 products by category
      and count them. DocumentDB did the counting on the server and returned only five small results.
    do: Look at the lit category tiles. Read the Behind-the-scenes note, then answer the checkpoint.
    target: "#cats"
    action: look
    wait: {method: GET, path: /docdb/api/home}
    result: The pipeline has a $group stage. DocumentDB counted the documents of each category and sent only the counts and the lowest prices to the Engine App.

  - page: home
    path: /
    engines: [elasticache]
    use_case: Hot data in memory
    title: The flash deal comes from memory
    why: >-
      Every Visitor reads the flash deal, and its stock changes many times each minute.
      ElastiCache (Valkey) keeps it in memory as a hash and a counter. A read takes less than one millisecond inside the VPC.
    do: Look at the lit flash deal box.
    target: "#hero-deal"
    action: look
    wait: {method: GET, path: /elasticache/api/deal}
    result: HGETALL lm:deal returned the fields of the deal hash. GET lm:deal:stock returned the counter. Look at the time of each command.

  # ---------------------------------------------------------------- Category: DocumentDB indexes
  - page: category
    path: /c/Elektronik
    engines: [docdb]
    use_case: Index ile filtreleme
    title: Index'i kapat
    why: >-
      Bu sayfadaki ürünler DocumentDB adlı veritabanından geliyor. Sayfa sadece Elektronik ürünlerini istiyor ve puanı en
      yüksek olanı en üste koyuyor. Bunu hızlı yapmak için veritabanı bir index kullanıyor. Index, kitabın sonundaki dizin
      gibidir: aradığın kelimenin hangi sayfalarda olduğunu söyler, kitabı baştan sona okuman gerekmez. Şimdi aynı listeyi
      index olmadan isteyeceğiz ve veritabanının ne kadar fazla iş yaptığını göreceğiz.
    do: Aydınlık "Collection scan" butonuna tıkla. "Collection scan", index'i kullanmadan bütün ürünleri tek tek okumak demek.
    target: "#exp-index [data-value=off]"
    action: click
    wait: {method: GET, path: /docdb/api/products, query: {index: "off"}}
    focus: "#products"
    # Perde arkası paneli (mission.js + guided-sim.js). Sıra: need, concept, sim, live, query, remember, why_db.
    panel:
      need: >-
        Sayfa, 200 ürünlük katalogdan sadece "Elektronik" kategorisindekileri istiyor ve onları puana göre büyükten küçüğe
        sıralı istiyor. Az önce aynı listeyi iki farklı yolla aldın: önce index ile (sayfa açılırken), şimdi index olmadan.
        Ekrandaki ürünler iki seferde de aynı. Farkı görmek için perde arkasına bakmak gerekiyor.
      concept:
        term: Index (dizin)
        text: >-
          Index, kitabın sonundaki dizine benzer. "Elektronik" kelimesini dizinde bulursun, dizin sana hangi sayfalara
          bakacağını söyler ve sadece o sayfaları açarsın. Dizin yoksa kitabı ilk sayfadan son sayfaya kadar okuman gerekir.
          Bu katalogdaki index iki alanı birlikte tutuyor: önce kategori, sonra puan. Bu yüzden index'te Elektronik ürünleri
          yan yana ve zaten puan sırasında duruyor.
        terms:
          - [Doküman, "Bir ürünün bütün bilgisi. DocumentDB her ürünü bir JSON dokümanı olarak saklar. Tablodaki her satır bir doküman."]
          - [Koleksiyon, "Aynı türden dokümanların bulunduğu yer. Burada adı products."]
          - [Collection scan, "Index kullanmadan koleksiyondaki dokümanları baştan sona tek tek okumak."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde index'ler nasıl kurulur?
        intro: >-
          Sayfa açılmadan önce hazır olması gerekenler. Index'ler ürünler gelmeden, sorgular belli olunca kurulur.
        text:
          - >-
            Index sorguya göre kurulur. Önce "sayfalar veritabanına hangi soruları soracak?" diye bakılır. Kategori sayfası
            "bu kategorideki ürünler, puanı yüksek olan önce" diye soruyor; bunun için iki alanı birlikte tutan bir bileşik
            index kurulur: { category: 1, rating: -1 }.
          - >-
            Alanların sırası önemlidir. Kural: önce eşitlikle aranan alan (category = "Elektronik"), sonra sıralama alanı
            (rating), en sonda aralıkla aranan alan (ör. fiyat 100 ile 500 arası). Bu sırayla index hem filtreyi hem
            sıralamayı karşılar; veritabanı sonucu bellekte ayrıca sıralamak zorunda kalmaz.
          - >-
            Her index'in bir bedeli vardır. Her yeni ürün ya da fiyat değişikliğinde index'ler de güncellenir; index'ler
            disk ve bellek kaplar. Bu yüzden sadece sık sorulan sorular için index kurulur ve hiç kullanılmayan index'ler
            düzenli aralıklarla bulunup silinir.
          - >-
            Katalog çok okunur, az yazılır. Okumalar kopyalara (replica) dağıtılır, ana kopya (primary) yazmalara kalır.
            Böylece kampanya günü binlerce kişi aynı anda kategori sayfasını açsa da yazmalar yavaşlamaz.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Katalog yönetimi: ürün ekleyen, fiyat ve stok güncelleyen arka ofis ekranları ya da tedarikçiden gelen ürün
          dosyalarını aktaran bir iş. Hepsi uygulama üzerinden yazar.
        reads: Uygulama, mağaza sayfaları için (kategori, ürün sayfası, ana sayfa vitrini).
        kind: >-
          Uygulama orkestrasyonu. DocumentDB başka bir veritabanından kendiliğinden veri çekmez. Ama kendi değişikliklerini
          dışarı verebilir: change streams açıksa her ekleme ve güncelleme sırayla okunabilen bir kayıt olarak çıkar.
        best: >-
          Katalog tek yerde (burada DocumentDB) tutulur, diğer sistemler oradan beslenir. Metin araması için ürünler
          OpenSearch'e aktarılır: DocumentDB'nin OpenSearch ile zero-ETL entegrasyonu ya da change streams'i okuyan küçük
          bir program bu işi yapar. Uygulama aynı ürünü iki yere ayrı ayrı yazmaz, çünkü biri unutulunca iki kopya birbirini
          tutmaz.
      sim:
        kind: index-vs-scan
        caption: >-
          Gerçek katalogdan alınmış 8 ürünlük bir kesit. İki şerit iki ayrı gerçek istek: soldaki sayfa açılırken giden,
          sağdaki senin tıklamanla giden. Sorgu aynı; tek fark, sağdakinde DocumentDB'ye index'i kullanmaması söyleniyor.
          İki taraf aynı hızda adım atıyor: her adımda en fazla bir doküman okunuyor. Üstteki etiketler o anda işi kimin
          yaptığını gösterir: uygulama mı, DocumentDB mi.
        labels:
          index: "t-1 · İstek 1 · Sayfa açılınca · Index ile"
          scan: "t0 · İstek 2 · Senin tıklaman · Index olmadan (collection scan)"
        columns: [[id, Ürün no], [name, Ürün], [category, Kategori], [rating, Puan]]
        filter: [category, Elektronik]
        sort: [rating, desc]
        index_name: "{ category: 1, rating: -1 }"
        rows:
          - {id: P0014, name: Python ile Veri, category: Kitap, rating: 4.7}
          - {id: P0021, name: Akıllı Saat, category: Elektronik, rating: 4.8}
          - {id: P0052, name: Kahve Makinesi, category: Ev & Yaşam, rating: 4.9}
          - {id: P0061, name: Powerbank, category: Elektronik, rating: 4.5}
          - {id: P0083, name: Spor Çantası, category: Spor, rating: 4.7}
          - {id: P0105, name: Deri Ceket, category: Moda, rating: 4.8}
          - {id: P0131, name: Mekanik Klavye, category: Elektronik, rating: 4.8}
          - {id: P0176, name: Bluetooth Hoparlör, category: Elektronik, rating: 4.7}
      wire:
        what: >-
          Uygulama, DocumentDB'ye açık tuttuğu bağlantılar üzerinden komutu gönderir (pymongo kütüphanesi). Bağlantılar her
          istekte yeniden kurulmaz.
        dst: "dbws-docdb.cluster-ccgs3qxfidad.eu-central-1.docdb.amazonaws.com : 27017"
        dst_note: >-
          DocumentDB cluster'ının adresi. Okuma tercihi "secondaryPreferred" olduğu için bu okuma, ana kopyaya değil
          replica'ya (dbws-docdb-2) gider. Cluster internete kapalı veri alt ağında duruyor.
        rows:
          - [Şifreleme, TLS, gerçek, DocumentDB'nin sertifikası AWS'nin sertifika dosyasıyla kontrol edilir.]
          - [Protokol, MongoDB wire protokolü (OP_MSG), gerçek, "MongoDB sürücülerinin konuştuğu ikili dil. DocumentDB bu dili anlar; bu yüzden MongoDB kütüphaneleri onunla çalışır."]
          - [Kimlik, "Kullanıcı adı + şifre, bağlantı açılırken", gerçek, "Şifre kodda yazmaz; uygulama onu çalışırken AWS Secrets Manager'dan alır."]
        body_label: Çerçevenin içeriği (okunur hâle getirilmiş)
        body: |-
          OP_MSG   veritabanı: shop
          { find: "products",
            filter: { category: "Elektronik" },
            projection: { name: 1, price: 1, rating: 1, category: 1, brand: 1, tags: 1, stock: 1 },
            sort: { rating: -1 },
            limit: 48,
            hint: { $natural: 1 },          ← sadece "Collection scan" seçiliyken
            $readPreference: { mode: "secondaryPreferred" } }
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Her satırın
        etiketi işin nerede olduğunu söyler: mor etiketli satırda bir şey bir yerden bir yere gider (tarayıcıdan uygulamaya,
        uygulamadan DocumentDB'ye ya da geri). Gri "Uygulamanın içinde" etiketli satırda iş uygulamanın kendi içinde
        yapılır, hiçbir yere bir şey gitmez. İki istek de aynı kodu çalıştırır; fark tek bir satırda.
      app_code:
        - file: engines/docdb.py
          func: api_products
          title: Kategori listesi (iki istekte de aynı kod)
          sub: Adresteki index=on ya da index=off seçimi tek farkı belirler.
          lines:
            - {match: '@bp.get("/api/products")', say: Kategori sayfasının ürün listesi isteği buraya gelir., tag: Tarayıcı → Uygulama}
            - {match: 'use_index = request.args.get("index", "on") == "on"', say: "Adresteki seçime bakar: index kullanılsın mı?", tag: Uygulamanın içinde}
            - {match: 'cur = db().products.find(flt, CARD).sort(order).limit(48)', say: "Komutu kurar: kategori filtresi, kart alanları, puana göre sıra, en fazla 48. Henüz bir şey gönderilmedi.", tag: Uygulamanın içinde, hl: table}
            - {match: 'cur = cur.hint([("$natural", 1)])', say: "\"Collection scan\" seçildiyse komuta hint eklenir: index'i kullanma.", tag: Uygulamanın içinde, hl: scan}
            - {match: 'items = [_doc(d) for d in cur]', say: "Komut şimdi gönderilir, dokümanlar gelir. Uygulama her dokümanın _id alanının adını product_id yapar.", tag: [Uygulama → DocumentDB, DocumentDB → Uygulama], hl: result}
            - {match: 'plan = db().command("explain", find, verbosity="executionStats")', say: "Aynı sorgu bir kez daha, explain ile gider: DocumentDB kaç doküman okuduğunu ve hangi yolu seçtiğini söyler. Ölçümler buradan.", tag: [Uygulama → DocumentDB, DocumentDB → Uygulama]}
            - {match: 'colors = db().products.distinct(', say: "Üçüncü bir komut: bu kategorideki renkleri ister (sayfadaki renk filtresi için).", tag: [Uygulama → DocumentDB, DocumentDB → Uygulama]}
            - {match: 'return jsonify(trace.payload({"items": items, "colors": sorted(colors)}))', say: Ürünler ve renkler tek bir cevapta tarayıcıya gider., tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek katalogda ne oldu?
        intro: >-
          Simülasyonda 8 ürün vardı. Gerçek katalogda 200 ürün var. Aşağıdaki sayılar, senin tıklamanla DocumentDB'ye giden
          gerçek isteklerden geliyor. Sayfa bunları DocumentDB'nin explain komutuyla ölçüyor: explain, veritabanına
          "bu sorguyu nasıl çalıştırdın, kaç doküman okudun?" diye sorar.
        runs:
          - {label: Index ile, fetch: "/docdb/api/products?category=Elektronik&index=on&sort=rating"}
          - {label: Index olmadan, trigger: true}
        metrics: [[Okunan doküman, examined], [Dönen doküman, returned], [Süre, ms]]
        bar: examined
        stages_cap: "DocumentDB'nin yaptığı işler, sırasıyla:"
        reading: >-
          İki çalıştırmada da 40 ürün döndü, ekrandaki liste aynı. Fark okunan doküman sayısında: index ile DocumentDB sadece
          eşleşen 40 dokümanı okudu. Index olmadan 200 dokümanın hepsini okudu, 160'ını "Elektronik değil" diye attı, sonra
          kalan 40'ı bellekte puana göre sıraladı. Süre (ms) her denemede biraz değişir ve 200 ürünlük küçük bir katalogda fark
          küçüktür. Asıl önemli ölçü okunan doküman sayısıdır: katalog 100 kat büyürse index olmadan okunan doküman sayısı da
          100 kat artar. Index ile sadece eşleşen dokümanlar okunur.
        stages:
          IXSCAN: "Index'te arama: dizinde doğru bölüme gider, sadece eşleşen dokümanları okur."
          COLLSCAN: "Koleksiyon taraması: dokümanları baştan sona tek tek okur ve filtreyi her birinde dener."
          SORT: "Bellekte sıralama: eşleşen dokümanları okuduktan sonra puana göre ayrıca dizer."
          LIMIT_SKIP: "Sınır: sonuçtan en fazla 48 dokümanı alır."
      query:
        title: Sayfa DocumentDB'ye ne dedi?
        intro: >-
          Simülasyondaki iki taraf, DocumentDB'ye giden iki gerçek komuttan geliyor. Burada da aynı düzen var: solda index
          ile çalışan komut, sağda index olmadan çalışan komut. Önce komutun Türkçesini oku, sonra aynı renkteki kod parçasını
          bul. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        # parts: one piece of a command each (fields: ~/.claude/skills/guided-step/references/panel-schema.md).
        parts:
          - id: coll
            say: products koleksiyonundaki
            code: db.products.find(
            name: Nereden?
            note: "products, ürünlerin durduğu koleksiyon. find, \"bul ve getir\" demek."
            hl: table
          - id: filter
            say: kategorisi Elektronik olan ürünleri
            code: '{ category: "Elektronik" },'
            indent: 2
            name: Hangileri?
            note: Filtre. Sadece category alanı "Elektronik" olan dokümanlar sonuca girer, diğerleri girmez.
            hl: filter
          - id: proj
            say: sadece kartta gereken bilgileriyle
            code: "{ name: 1, price: 1, rating: 1, category: 1, brand: 1, tags: 1, stock: 1 } )"
            indent: 2
            name: Hangi bilgiler?
            note: >-
              Projection. 1 "bu alanı getir" demek. Ürün kartı ad, fiyat, puan, kategori, marka, etiket ve stok gösteriyor;
              dokümandaki diğer alanlar (açıklama, renk, ürün özellikleri) gelmiyor. Böylece ağdan daha az veri taşınır.
            hl: columns
          - id: sort
            say: puanı en yüksek olan en üstte olacak şekilde sıralayıp
            code: ".sort({ rating: -1 })"
            name: Hangi sırayla?
            note: Sıralama. rating alanına göre sıralar. -1 "büyükten küçüğe", 1 olsaydı "küçükten büyüğe" demek olurdu.
            hl: sort
          - id: limit
            say: en fazla 48 tane getir
            code: ".limit(48)"
            name: Kaç tane?
            note: Sınır. Sayfa en fazla 48 ürün gösteriyor. Elektronik'te 40 ürün olduğu için 40'ın hepsi geliyor.
            hl: result
          - id: hint
            say: ve bunu yaparken index'i kullanma.
            code: ".hint({ $natural: 1 })"
            name: Nasıl?
            note: >-
              Hint, veritabanına "bu sorguyu şu yolla çalıştır" diye yol göstermek. $natural, "dokümanları diskte durdukları
              sırayla, baştan sona oku" demek. Yani index'i bırak, collection scan yap. Bu parça sadece "Collection scan"
              seçiliyken eklenir.
            hl: scan
            tag: sadece sağdaki komutta var
        columns:
          - label: Index ile
            sub: Sayfa ilk açıldığında giden komut ("Use the index" seçili).
            via: >-
              Uygulama bu komutu pymongo kütüphanesinin find() metoduyla gönderir; sonra aynı sorguyu explain komutuyla
              bir kez daha gönderip ölçer.
            parts: [coll, filter, proj, sort, limit]
          - label: Index olmadan (collection scan)
            sub: Senin "Collection scan" tıklamanla giden komut.
            via: >-
              Aynı find() çağrısı, sonuna pymongo'nun hint() metoduyla eklenen tek parçayla. Gerisi soldakinin aynısı.
            parts: [coll, filter, proj, sort, limit, hint]
            mark: [hint]
        note: >-
          Dikkat: soldaki komutta "index" kelimesi hiç geçmiyor. Index'i komutta yazmazsın. DocumentDB komuttaki filtreye
          (category) ve sıralamaya (rating) bakar, bunlara uyan bir index varsa onu kendisi seçer. Kategori filtresi iki
          komutta da aynı, yani filtre index kullanıldığını göstermez. Sağdaki komutun tek farkı 6. parça: .hint ile
          DocumentDB'ye "index'i bırak, baştan sona oku" diyoruz. Bu tek parça, okunan doküman sayısını 40'tan 200'e çıkardı.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          DocumentDB'nin işi dokümanları verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: DocumentDB → Uygulama
            text: >-
              {items} doküman geldi (Elektronik'te 40 ürün var, sınır 48). Ardından explain'in cevabı (kaç doküman okundu,
              hangi yol seçildi) ve renk listesi geldi.
          - who: Uygulama
            text: >-
              Her dokümanın _id alanının adını product_id yaptı, renkleri alfabetik sıraladı ve explain'den okunan ve dönen
              doküman sayılarını isteğin kaydına (trace) yazdı.
          - who: Uygulama → Tarayıcın
            text: Ürünleri, renk listesini ve isteğin kaydını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: >-
              Ürün kartlarını yeniden çizdi. Liste index ile gelen listeyle aynı: sonuç değişmedi, sadece DocumentDB'nin yaptığı
              iş değişti.
          - who: Sonra
            text: >-
              "Use the index" butonuna basarsan sayfa index'li komutu yeniden gönderir. Hint'i burada sadece deney için
              kullandık; gerçek bir sistemde DocumentDB doğru index'i kendisi seçer ve hint'e nadiren gerek kalır.
      remember: >-
        Sonuç aynı, yapılan iş farklı. Index olmadan veritabanı her dokümanı okumak zorunda kalır. Index, sık kullanılan bir
        filtre ve sıralama için doğru bölüme doğrudan gitmeyi sağlar.
      why_db: >-
        Neden DocumentDB? Ürünler farklı yapılarda bilgi taşıyor: kulaklığın pil süresi, ceketin bedeni ve rengi var. DocumentDB
        her ürünü kendi alanlarıyla tek bir doküman olarak saklar ve bu alanlar üzerinde index kurmana izin verir. Index'in de
        bir bedeli var: her yeni ürün yazıldığında index de güncellenir. Bu yüzden sadece sık kullanılan filtreler için index
        kurulur.

  - page: category
    path: /c/Elektronik
    engines: [docdb]
    use_case: Query a nested field
    title: Filter on a field inside the document
    why: >-
      The colour is inside a nested object, attributes.renk. DocumentDB can filter on it with dot notation, and an index on attributes.renk keeps the filter fast.
    do: Select a colour in the lit list.
    target: "#color"
    action: change
    wait: {method: GET, path: /docdb/api/products, query: {color: "*"}}
    focus: "#products"
    result: The filter is now {category, "attributes.renk"}. In a relational model, optional attributes like this often need a separate table.

  # ---------------------------------------------------------------- Search: OpenSearch
  - page: search
    path: /search?q=kablosuz%20kulaklik
    engines: [opensearch]
    use_case: Full-text search
    title: The analyzer decides which words match
    why: >-
      OpenSearch keeps an inverted index: for each word, the list of products that contain it. The tr_folded analyzer changes "ı" to "i"
      at index time and at query time. So the query word "kulaklik" matches the name "Kulaklık".
    do: Click the lit button "standard".
    target: "#exp-analyzer [data-value=standard]"
    action: click
    wait: {method: GET, path: /opensearch/api/search, query: {analyzer: standard}}
    focus: "#hits"
    result: The same products came back, but the score of each one is about half. With the standard analyzer, only "kablosuz" matches the name now.

  - page: search
    path: /search?q=kulaklk
    engines: [opensearch]
    use_case: Typo tolerance
    title: Fuzziness accepts a typo
    why: >-
      "kulaklk" has a missing letter. With fuzziness AUTO, OpenSearch also matches words that are one or two edits away.
      An edit is one added, removed or changed letter.
    do: Click the lit button "Exact words".
    target: "#exp-fuzzy [data-value=off]"
    action: click
    wait: {method: GET, path: /opensearch/api/search, query: {fuzzy: "off", q: kulaklk}}
    focus: "#hits"
    result: The match query has no "fuzziness" now, so the typo finds no product. Fuzziness costs more work, but it saves the search of a shopper who types fast.

  - page: search
    path: /search?q=kablosuz%20kulaklik
    engines: [opensearch]
    use_case: Facets
    title: The facet counts come from the same request
    why: >-
      The category and price counts at the left are aggregations. OpenSearch calculates them in the same request as the hits.
    do: Click the lit category name in the facet list.
    target: "#facet-cat [data-cat]:not([data-cat=''])"
    action: click
    wait: {method: GET, path: /opensearch/api/search, query: {category: "*"}}
    focus: "#hits"
    result: The query now has a filter on the keyword field "category". A filter does not change the relevance score, and OpenSearch can cache it.

  # ---------------------------------------------------------------- Stores: OpenSearch geo
  - page: stores
    path: /stores
    engines: [opensearch]
    use_case: Geospatial search
    title: Find the stores near a point
    why: >-
      Each store document has a location field of type geo_point. A geo_distance filter keeps the stores inside a circle, and a sort puts the nearest first.
    do: Click the lit button "100 km".
    target: "#exp-km [data-value='100']"
    action: click
    wait: {method: GET, path: /opensearch/api/stores, query: {km: "100"}}
    focus: "#map"
    result: The geo_distance query now has distance 100km. More stores are inside the circle, and the list is sorted by distance.

  # ---------------------------------------------------------------- Product: DocumentDB, Keyspaces, Neptune, DynamoDB
  - page: product
    path: /p/P0001
    engines: [docdb]
    use_case: One read for one product
    title: Read fewer fields
    why: >-
      The product, its attributes and its tags are in one document. One read by _id returns all of it. A projection returns only the fields that you ask for.
    do: Click the lit button "Card fields only".
    target: "#exp-proj [data-value=card]"
    action: click
    wait: {method: GET, path: /docdb/api/product/*, query: {projection: card}}
    focus: "#pdp"
    result: The document size in the note is smaller now. The card projection has no description and no attributes, so less data goes over the network.

  - page: product
    path: /p/P0001
    engines: [keyspaces]
    use_case: Kullanıcı başına olay geçmişi
    title: Sayfa, baktığın ürünü Keyspaces'e yazdı
    why: >-
      Bir önceki adımda bu ürünün sayfasını açtın. Sayfa açılırken mağaza arka planda iki iş yaptı: "bu ürüne baktın"
      bilgisini bir veritabanına (Keyspaces) kaydetti, hemen ardından baktığın ürünlerin listesini aynı yerden geri okudu.
      Sayfadaki "Recently viewed" (son baktıkların) şeridi bu listedir. Bu adımda tıklama yok, sadece bakacaksın.
    after: >-
      Şeritteki her ürün, Keyspaces'te sana ait partition'a (kişiye ait deftere) yazılmış bir "view" satırından geliyor.
      Keyspaces sadece senin defterini açtı ve en yeni satırları verdi. "view" olmayan satırları ve aynı ürünün tekrarlarını
      Uygulama ayıkladı, en fazla 8 ürünü şeride koydu. Başka bir ürüne bakıp geri dönersen o ürün şeridin en başına geçer.
    do: Aydınlık "Recently viewed" (son baktıkların) şeridine bak. Sonra kartın altındaki butonla perde arkasını aç.
    target: "#recent-wrap"
    action: look
    wait: {method: GET, path: /keyspaces/api/recent}
    panel:
      need: >-
        Mağaza her ziyaretçinin ne yaptığını (baktığı, sepete eklediği, aradığı ürünleri) kaydediyor. Bu kayıtlar çok
        sık yazılıyor ve hep aynı soruyla okunuyor: "bu kişinin son yaptıkları ne?". Binlerce ziyaretçinin milyonlarca
        satırı arasından sadece senin satırlarını, en yenisi en üstte, hızlıca bulmak gerekiyor.
      concept:
        term: Partition (kişiye ait defter)
        text: >-
          Keyspaces tabloyu partition'lara böler. Her ziyaretçinin satırları kendi partition'ında, yani kendi defterinde
          durur. Defterin hangisi olduğunu user_id söyler. Defterin içindeki satırlar da zamana göre sıralıdır: en yeni
          sayfa en üstte. Yeni bir olay yazılınca deftere en üste eklenir; okurken sadece o defter açılır ve baştan okunur.
          Başka kimsenin defterine bakılmaz.
        terms:
          - [Partition key, "Satırın hangi partition'a gideceğini belirleyen alan. Bu tabloda user_id."]
          - [Clustering key, "Partition içindeki sırayı belirleyen alan. Bu tabloda event_time, yeniden eskiye."]
          - [Keyspaces, "Amazon'un Apache Cassandra uyumlu, sunucusuz geniş sütunlu (wide column) veritabanı."]
          - [Uygulama, "Mağazanın arka uç programı. Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde bu tablo nasıl kurulur?
        intro: >-
          Sayfa açılmadan önce hazır olması gerekenler. Gerçek bir sistemde bu kararlar tablo kurulurken, en baştan verilir.
        text:
          - >-
            Önce soru belirlenir, tablo sonra. Keyspaces'te (ve Cassandra'da) en iyi uygulama sorgu odaklı tasarımdır:
            "bu kişinin son hareketleri, en yeni önce" sorusu için partition key user_id seçilir (bir kişinin bütün satırları
            bir arada), clustering key de event_time, yeniden eskiye. Başka bir soru için ("bu ürüne kimler baktı?") aynı
            olaylarla ikinci bir tablo kurulur. Aynı verinin iki tabloda durması burada hata değil, normaldir.
          - >-
            Partition key yükü dağıtmalı. Keyspaces tek bir partition'a saniyede en fazla 1.000 yazma birimi (WCU) ve 3.000
            okuma birimi (RCU) verir. user_id iyi bir seçimdir, çünkü yük binlerce kişiye dağılır. "Bugünün tarihi" gibi
            herkesin aynı değeri yazdığı bir partition key ise bütün yükü tek partition'a yığar.
          - >-
            Partition'lar sınırsız büyümemeli. Olaylar yıllarca birikirse bir kişinin defteri çok büyür ve okuması yavaşlar.
            Bunu önlemek için satırlara son kullanma süresi (TTL) verilir; geçmişin tamamı gerekiyorsa partition key'e bir
            zaman parçası eklenir (ör. user_id + ay) ve her ay yeni bir defter açılır.
          - >-
            Satırlar hiç güncellenmez, sadece yeni satır eklenir (append-only). Her yazma tek bir partition'a gider. Bu,
            Keyspaces'in en hızlı ve en ucuz çalıştığı yazma biçimidir.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Uygulama. Kullanıcı bir ürüne bakınca, sepete ekleyince ya da sipariş verince uygulama bir olay satırı yazar.
        reads: Yine uygulama, kişiye özel ekranlar için ("son baktıkların", "hareketlerim").
        kind: >-
          Uygulama orkestrasyonu. Keyspaces başka bir veritabanından kendiliğinden veri çekmez, başka bir veritabanına da
          kendiliğinden veri göndermez; yazan da okuyan da uygulamadır.
        best: >-
          Trafik büyüyünce uygulama olayı tabloya doğrudan değil, önce bir olay akışına bırakır (Amazon Kinesis Data Streams
          ya da Amazon MSK). Küçük bir tüketici program akıştan okuyup tabloya yazar. Böylece sayfa yazmanın bitmesini
          beklemez, ani yükler akışta tamponlanır ve aynı olaylar analiz gibi başka hedeflere de dağıtılabilir.
      now_intro: >-
        Sayfanın açıldığı an. Önce resmin tamamı (simülasyon), sonra aynı anın ayrıntıları: isteğin yolu, uygulamanın
        kodu, Keyspaces'e giden komutlar ve gerçek ölçümler.
      sim:
        kind: partition
        title: "Keyspaces tablosu: dbws.activity_by_user"
        caption: >-
          Tablodan küçük bir kesit: üç ziyaretçinin partition'ı. Ayşe ve Mert'in satırları canlı tablodan; senin
          partition'ındaki eski satırlar örnek. Önce sayfanın INSERT'i, sonra SELECT'i, en sonda uygulamanın gelen satırları
          süzmesi oynuyor. Üstteki iki etiket o anda işi kimin yaptığını gösterir: uygulama mı, Keyspaces mi.
        result_title: Son baktıkların şeridi
        partitions:
          - label: C00002 · Mert
            rows:
              - {time: "26 Eki 09:12", type: view, product: P0090 Kahve Makinesi}
              - {time: "25 Eki 18:40", type: purchase, product: P0044 Bulut Mimarisi}
          - label: "7f3a… (bu tarayıcı)"
            me: true
            rows:
              - {time: "2 dk önce", type: purchase, product: P0021 Akıllı Saat}
              - {time: "3 dk önce", type: view, product: P0021 Akıllı Saat}
              - {time: "5 dk önce", type: view, product: P0131 Mekanik Klavye}
              - {time: "6 dk önce", type: view, product: P0021 Akıllı Saat}
          - label: C00001 · Ayşe
            rows:
              - {time: "26 Eki 10:39", type: search, product: P0084 Algoritmalar}
              - {time: "26 Eki 02:00", type: purchase, product: P0147 Kahve Makinesi}
              - {time: "25 Eki 20:13", type: search, product: P0173 Dambıl Seti}
        insert: {time: "şimdi", type: view, product: P0001 Kablosuz Kulaklık}
        summary: >-
          Yazma da okuma da tek bir partition'a gitti. Tablo ne kadar büyürse büyüsün, senin geçmişini okumak için sadece
          senin defterin açılır. Keyspaces satırları olduğu gibi verdi; "sadece view, tekrar yok, en fazla 8" kuralları
          uygulamanın kodunda.
      wire:
        what: >-
          Uygulama, Keyspaces'e açık tuttuğu bir bağlantının üzerinden komutu gönderir. Bağlantı her istekte yeniden
          kurulmaz; uygulama çalıştığı sürece açık kalır.
        dst: "cassandra.eu-central-1.amazonaws.com : 9142"
        dst_note: >-
          Keyspaces'in bölge adresi. Bu ad, VPC'nin içindeki interface endpoint'in özel IP'sine çözülür; trafik internete çıkmaz.
        rows:
          - [Şifreleme, TLS, gerçek, Keyspaces sadece şifreli bağlantı kabul eder.]
          - [Protokol, "CQL ikili protokolü, sürüm 4", gerçek, "Cassandra'nın kendi dili, HTTP değil. Komut ve değerler küçük ikili çerçeveler hâlinde gider."]
          - [Kimlik, "SigV4, bağlantı açılırken", gerçek, "Bağlantı ilk açıldığında uygulama, IAM rolünün geçici kimliğiyle imzalı bir doğrulama gönderdi. Şifre yok."]
        body_label: Çerçevenin içeriği (okunur hâle getirilmiş, değer örnek)
        body: |-
          QUERY
            SELECT product_id, detail, event_type FROM dbws.activity_by_user WHERE user_id = ? LIMIT 40
            değer      : '7f3a…'   (bu tarayıcının kimliği)
            tutarlılık : LOCAL_QUORUM   (3 kopyanın 2'sinden oku)
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Her satırın
        etiketi işin nerede olduğunu söyler: mor etiketli satırda bir şey bir yerden bir yere gider (tarayıcıdan uygulamaya,
        uygulamadan Keyspaces'e ya da geri). Gri "Uygulamanın içinde" etiketli satırda iş uygulamanın kendi içinde yapılır,
        hiçbir yere bir şey gitmez.
      app_code:
        - file: engines/keyspaces.py
          func: api_event
          title: "1. Yazma: \"bu ürüne baktın\""
          sub: Sayfa açılır açılmaz gelen istek.
          lines:
            - {match: '@bp.post("/api/events")', say: "Tarayıcıdan gelen \"bu ürüne baktım\" isteği buraya gelir.", tag: [Tarayıcı → Uygulama]}
            - {match: 'cql = f"INSERT INTO', say: Keyspaces'e gidecek INSERT komutu hazırlanır., tag: [Uygulamanın içinde]}
            - {match: 's().execute(s().prepare(cql)', say: "Komut Keyspaces'e gider; soru işaretlerinin yerine senin kimliğin, şu anki zaman ve ürün konur. Keyspaces \"yazıldı\" diye cevap verir.", tag: [Uygulama → Keyspaces, Keyspaces → Uygulama], hl: insert}
            - {match: 'return jsonify(trace.payload({"stored": True}))', say: "Tarayıcıya \"kaydedildi\" cevabı döner.", tag: [Uygulama → Tarayıcı]}
        - file: engines/keyspaces.py
          func: api_recent
          title: "2. Okuma: \"Son baktıkların\""
          sub: Hemen ardından gelen istek.
          lines:
            - {match: '@bp.get("/api/recent")', say: "\"Son baktıkların\" şeridi için gelen istek buraya gelir.", tag: [Tarayıcı → Uygulama]}
            - {match: 'rows = list(s().execute(cql', say: "SELECT komutu gönderilir. Keyspaces senin partition'ından en fazla 40 satırı olduğu gibi geri verir.", tag: [Uygulama → Keyspaces, Keyspaces → Uygulama], hl: where}
            - {match: 'for r in rows:', say: Gelen satırlar tek tek ele alınır., tag: [Uygulamanın içinde], hl: app}
            - {match: 'if r.event_type == "view" and r.product_id not in seen:', say: "Sadece \"view\" satırları ve listede henüz olmayan ürünler geçer. add_to_cart, purchase ve tekrarlar burada elenir.", tag: [Uygulamanın içinde], hl: type}
            - {match: 'recent.append(', say: Geçen ürün listeye eklenir., tag: [Uygulamanın içinde], hl: app}
            - {match: 'return jsonify(trace.payload(recent[:8]))', say: "Listenin ilk 8 ürünü tarayıcıya gönderilir. Şeritte en fazla 8 ürün olmasının sebebi bu.", tag: [Uygulama → Tarayıcı], hl: app}
      live:
        title: Gerçek tabloda ne oldu?
        intro: >-
          Bu sayfa açılırken Keyspaces'e iki gerçek istek gitti. Sayılar o isteklerin kayıtlarından geliyor.
        runs:
          - label: "1. Yazma: INSERT"
            page_call: {path: /keyspaces/api/events}
            metrics: [[Yazılan satır, items], [Kapasite, capacity], [Süre, ms]]
          - label: "2. Okuma: SELECT"
            trigger: true
            metrics: [[Şeritteki ürün, items], [Süre, ms]]
        reading: >-
          INSERT tek bir satır yazdı ve 1 WRU (write request unit, yazma birimi) harcadı. Keyspaces sunucusuz çalışır:
          sunucu kiralamazsın, her okuma ve yazma birimi için ödersin. SELECT senin partition'ından en fazla 40 satır
          okudu; uygulama bunların içinden "view" olanları ve tekrar etmeyenleri ayıklayıp en fazla 8 ürünü şeride koydu.
          Sen bu tarayıcıyla ilk kez geziyorsan şeritte sadece bu ürün vardır. Süre her istekte biraz değişir.
      query:
        title: Sayfa Keyspaces'e ne dedi?
        intro: >-
          Simülasyondaki iki adım, iki gerçek CQL komutundan geliyor (CQL, Cassandra'nın SQL'e benzeyen sorgu dili).
          Solda önce giden yazma, sağda sonra giden okuma var. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada
          aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: ins
            say: activity_by_user tablosuna
            code: INSERT INTO dbws.activity_by_user
            name: Nereye?
            note: Olaylar tablosuna yeni bir satır yaz. dbws, tabloyu içeren keyspace (veritabanı gibi bir klasör).
            hl: table
          - id: cols
            say: kim, ne zaman, ne yaptı ve hangi ürün bilgilerini içeren
            code: (user_id, event_time, event_id, event_type, product_id, detail)
            name: Hangi alanlar?
            note: >-
              Satırın alanları. user_id partition key: satırın hangi deftere gideceğini o belirler. event_time clustering
              key: defterin içindeki sırayı belirler. event_id aynı anda iki olay olursa karışmasınlar diye.
            hl: pk
            indent: 2
          - id: vals
            say: yeni bir satır ekle.
            code: VALUES (?, ?, ?, ?, ?, ?)
            name: Hangi değerler?
            note: >-
              Her ? yerine uygulama gerçek değeri koyar: senin kimliğin, şu anki zaman, yeni bir kimlik, "view", ürün no
              ve ürünün adı. Satır 7 gün sonra kendiliğinden silinir (tablonun TTL ayarı).
            hl: insert
            indent: 2
          - id: sel
            say: activity_by_user tablosundan ürün, açıklama ve olay türünü
            code: SELECT product_id, detail, event_type FROM dbws.activity_by_user
            name: Ne okunuyor?
            note: Sadece şerit için gereken üç alanı oku.
            hl: type
          - id: where
            say: sadece bu tarayıcının partition'ından
            code: WHERE user_id = '7f3a…'
            name: Hangi defter?
            note: >-
              Partition key ile filtre. Keyspaces bu değerden doğru partition'ı bulur ve sadece onu okur. Partition key
              vermeden bu tabloda arama yapamazsın: Keyspaces hangi defteri açacağını bilemez.
            hl: where
            indent: 2
          - id: limit
            say: en fazla 40 satır oku.
            code: LIMIT 40
            name: Kaç tane?
            note: >-
              En yeni 40 satırda dur. Satırlar zaten yeniden eskiye sıralı durduğu için ORDER BY yazmaya gerek yok; ilk 40
              satır en yeni 40 olaydır.
            hl: ck
            indent: 2
        columns:
          - label: "1. Yazma"
            sub: Sayfa açılır açılmaz arka planda giden komut.
            via: >-
              Uygulama bu komutu cassandra-driver kütüphanesiyle gönderir: önce prepare() ile komutu bir kez hazırlatır,
              sonra execute() ile değerleri yollar.
            parts: [ins, cols, vals]
          - label: "2. Okuma"
            sub: Hemen ardından "Son baktıkların" şeridi için giden komut.
            via: >-
              Uygulama bu komutu yine cassandra-driver'ın execute() metoduyla gönderir. Satırları süzme işi bu komutta değil,
              uygulamanın kodunda (bir önceki bölümdeki kesit).
            parts: [sel, where, limit]
        note: >-
          Dikkat: iki komutta da sıralama için bir şey yazmıyoruz. Sıra, tablo kurulurken bir kez belirlendi
          (CLUSTERING ORDER BY event_time DESC). Keyspaces satırları yazarken o sıraya koyuyor, okurken sadece baştan okuyor.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          Keyspaces'in işi satırları verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: Keyspaces → Uygulama
            text: Senin partition'ından {read} satır döndü (en fazla 40). Satırlar en yeniden eskiye sıralı geldi.
          - who: Uygulama
            text: >-
              Satırları tek tek dolaştı: "view" olmayanları (ör. purchase) ve aynı ürünün tekrarlarını attı, kalanların ilk 8'ini tuttu.
          - who: Uygulama → Tarayıcın
            text: "{items} ürünlük listeyi JSON olarak, isteğin kaydıyla (trace) birlikte geri gönderdi."
          - who: Tarayıcın
            text: Listeyi "Recently viewed" şeridine çizdi. Mağaza sekmesinde gördüğün şerit bu cevap.
          - who: Sonra
            text: >-
              Bu satırlar 7 gün sonra TTL ile kendiliğinden silinir. Başka bir ürüne bakarsan yeni bir view satırı partition'ın
              en üstüne girer ve o ürün şeridin başına geçer.
      remember: >-
        Keyspaces'te soruyu tablo tasarlanırken seçersin. "Bu kişinin son olayları" sorusu için satırlar kişiye göre
        partition'lara ayrılır ve zamana göre sıralı tutulur. Bu soru her ölçekte hızlıdır; tasarıma uymayan bir soru
        (ör. "bu ürüne kimler baktı?") için ayrı bir tablo gerekir.
      why_db: >-
        Neden Keyspaces? Olay kayıtları çok sık yazılır, hiç güncellenmez ve hep kişiye göre okunur. Keyspaces bu tür
        yoğun yazmayı sunucu yönetmeden karşılar ve eski satırları TTL ile kendisi siler. Bedeli: JOIN yok, esnek arama
        yok; her yeni soru için tabloyu o soruya göre tasarlaman gerekir.

  - page: product
    path: /p/P0001
    engines: [neptune]
    use_case: Öneriler
    title: Öneriler bir graf üzerinde yürüyüştür
    why: >-
      "Bunu alanlar şunları da aldı" önerileri Neptune adlı bir graf veritabanından geliyor. Graf, bir arkadaşlık ağı
      haritası gibidir: kişiler ve ürünler noktalar, "satın aldı" bilgisi de aralarındaki çizgilerdir. Şimdi önerileri
      bu ürüne göre değil, senin seçtiğin müşteriye göre isteyeceğiz.
    do: Aydınlık "For my persona" (benim için) butonuna tıkla.
    target: "#exp-recs [data-value=persona]"
    action: click
    wait: {method: GET, path: /neptune/api/recs, query: {mode: persona}}
    focus: "#recs-wrap"
    panel:
      need: >-
        İyi bir öneri için şu soru sorulur: "Benim gibi alışveriş yapanlar başka ne aldı?" Bunun cevabı tek bir kayıtta
        yazmaz. Müşteriden aldığı ürünlere, oradan o ürünleri alan diğer müşterilere, oradan da onların aldıklarına
        gitmek gerekir. Sayfa açılırken öneriler "bu ürüne göre" (2 adım) geldi; tıklamanla "sana göre" (3 adım) geldi.
      concept:
        term: Graf ve hop
        text: >-
          Bir graf, noktalar ve onları bağlayan çizgilerden oluşur. Noktalara düğüm (vertex), çizgilere kenar (edge)
          denir. Burada her müşteri ve her ürün bir düğüm, her satın alma da müşteriden ürüne giden bir BOUGHT kenarı.
          Bir kenar boyunca bir adım gitmeye hop denir. Neptune bir düğümden başlar ve kenarları takip eder, tıpkı bir
          haritada yol takip etmek gibi. Hiçbir tabloyu baştan sona taramaz.
        terms:
          - [Düğüm (vertex), "Bir şey: bir müşteri ya da bir ürün."]
          - [Kenar (edge), "İki düğüm arasındaki ilişki. Burada BOUGHT: bu müşteri bu ürünü aldı."]
          - [openCypher, "Graf sorgulama dili. Yolu çizer gibi yazarsın: (müşteri)-[:BOUGHT]->(ürün)."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde öneri grafı nasıl kurulur ve beslenir?
        intro: >-
          Sayfa açılmadan önce hazır olması gerekenler: grafın şekli ve içindeki satın almalar.
        text:
          - >-
            Graf, sorulacak ilişkiye göre modellenir. Soru "kim neyi aldı?" olduğu için müşteri ve ürün birer düğüm
            (vertex), her satın alma da müşteriden ürüne giden bir BOUGHT kenarı (edge) olur. Sipariş no ve adet gibi
            bilgiler kenarın üzerine özellik (property) olarak yazılır.
          - >-
            Graf, asıl kaydın kopyasıdır. Siparişin kendisi (fiyat, ödeme, stok düşme) ilişkisel bir veritabanında, tek bir
            transaction içinde tutulur. Graf sadece öneri için gereken ilişkileri tutar; kaybolursa asıl kayıttan yeniden
            kurulabilir.
          - >-
            İlk yükleme toplu yapılır: geçmiş siparişler CSV dosyaları olarak Amazon S3'e konur ve Neptune bulk loader ile
            tek seferde yüklenir. Sonrasında her yeni sipariş grafa tek tek, birkaç saniye içinde eklenir.
          - >-
            Yürüyüşler kısa tutulur. Çok satan bir ürün binlerce müşteriye bağlıdır (süper düğüm); her hop sonucu katlar.
            Bu yüzden öneri sorguları 2–3 hop ile sınırlanır ve sonuç LIMIT ile kesilir.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Asıl sipariş kaydı ilişkisel veritabanına yazılır. Grafa her yeni siparişin BOUGHT kenarlarını bir besleme süreci
          ekler.
        reads: Uygulama, öneri şeritleri için ("bunu alanlar şunları da aldı", "sana özel").
        kind: >-
          Neptune başka bir veritabanından kendiliğinden veri çekmez; graf dışarıdan beslenir. Besleyen ya uygulama ya da
          sipariş veritabanının değişikliklerini dinleyen bir süreçtir.
        best: >-
          Sipariş veritabanının değişiklik akışı (CDC) dinlenir: AWS DMS, Neptune'u hedef olarak alabilir; ya da siparişle
          aynı transaction'da bir "outbox" tablosuna yazılan olayı küçük bir program okuyup grafa ekler. Uygulamanın siparişi
          iki veritabanına ayrı ayrı yazması (dual write) önerilmez: ikinci yazma başarısız olursa iki kayıt birbirini tutmaz.
      sim:
        kind: graph-walk
        caption: >-
          Gerçek graftan küçük bir kesit: canlı Neptune'dan okunan müşteriler ve alımları. Gerçek grafta her ürünü
          onlarca müşteri almış; burada her yolu görebilmen için sadece birkaçı var. Bunlar iki farklı algoritma değil,
          aynı sayfanın gönderdiği iki ayrı gerçek istek: soldaki sayfa açılırken giden "bu ürüne göre" sorgusu, sağdaki
          senin tıklamanla giden "sana göre" sorgusu. Uygulama iki öneri modu sunuyor; iki yürüyüş yan yana, aynı hızda.
          Üstteki etiketler o anda işi kimin yaptığını gösterir: uygulama mı, Neptune mu.
        tick_ms: 1600
        summary: >-
          Soldaki yürüyüş herkese aynı önerileri verir ve senin zaten aldıklarını da önerebilir. Sağdaki yürüyüş bir adım
          daha uzun ama sana özel: aldıklarını eler, sana en çok benzeyenlerin seçtiklerini öne çıkarır.
        lanes:
          - id: product
            title: "t-1 · İstek 1 · Sayfa açılınca · Bu ürüne göre (2 hop)"
            start: {id: P0001, label: Kablosuz Kulaklık, type: product}
            start_title: Bu ürün
