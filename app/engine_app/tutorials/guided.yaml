  - page: search
    path: /search?q=siyah
    engines: [opensearch]
    use_case: Facet'ler
    title: Facet sayıları aynı istekten gelir
    why: >-
      Arama sayfasında "siyah" aradın; 40 ürün beş farklı kategoriden geldi. Soldaki listede her kategorinin yanında kaç ürün
      olduğu yazıyor. Şimdi bir kategoriye tıklayıp listeyi daraltacaksın.
    do: Soldaki listede aydınlık "Elektronik" satırına tıkla.
    target: "#facet-cat [data-cat='Elektronik']"
    action: click
    wait: {method: GET, path: /opensearch/api/search, query: {category: "*"}}
    focus: "#hits"
    result: The query now has a filter on the keyword field "category". A filter does not change the relevance score.
    panel:
      need: >-
        Arama sonuçlarının yanında "Kitap (11), Elektronik (9)…" gibi sayılar ve fiyat aralıkları gösteriliyor. Bu sayılar
        sonuçlarla birlikte, aynı anda hazır olmalı; her kategori için ayrı bir sayım sorgusu göndermek sayfayı yavaşlatırdı.
        Bir kategori seçilince de liste daralmalı ama ürünlerin sıralaması (skor) bozulmamalı.
      concept:
        term: Facet (aggregation) ve filtre
        text: >-
          Facet, arama sonuçlarının bir alana göre sayılmış hâlidir: "bu aramada Elektronik'ten 9, Kitap'tan 11 ürün var".
          OpenSearch eşleşen ürünleri bulurken onları aynı geçişte kovalara (bucket) ayırıp sayar; bir kasiyerin ürünleri
          okutup aynı anda reyonlara göre sayması gibi. Filtre ise "sadece Elektronik" gibi evet/hayır bir koşuldur: ürünü
          eler ama skorunu değiştirmez.
        terms:
          - [Aggregation (aggs), "Sonuçlar üzerinde sayma ve gruplama. Kategori sayıları terms, fiyat aralıkları range aggregation."]
          - [Bucket (kova), "Bir aggregation'ın her grubu: Elektronik kovası, 500–2000 ₺ kovası…"]
          - [Filtre (filter context), "Ürünü eleyen ama skora katkı yapmayan koşul. Sonucu önbelleğe alınabilir."]
          - [keyword, "Analyzer'dan geçmeyen, olduğu gibi saklanan alan türü. Sayma ve birebir filtre için kullanılır."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde facet'li arama için hazırlık
        intro: >-
          Facet listesi hiç kullanılmadan, sayılacak alanlar index'te doğru türle tanımlanır. Aşağıdaki beş adım bu hazırlığın
          sırasıdır.
        text:
          - title: Önce sayfanın soruları yazılır
            text: >-
              Arama sayfası tek istekte üç şey ister: eşleşen ürünler (skor sırasında), kategori sayıları ve fiyat aralığı
              sayıları. Kullanıcı bir facet seçince aynı istek bir filtreyle tekrarlanır.
            code: |-
              { "query": { … }, "size": 24,
                "aggs": { "categories": { "terms": { "field": "category" } },
                          "price": { "range": { "field": "price", "ranges": [ {"to": 500}, {"from": 500, "to": 2000}, {"from": 2000} ] } } } }
          - title: Sayılacak alanlar keyword olarak tanımlanır
            text: >-
              Kategori gibi alanlar analyzer'dan geçirilmez (keyword); "Ev & Yaşam" tek bir değer olarak kalır ve sayılabilir.
              Hem aranacak hem sayılacak bir alan, text ve keyword olarak iki kez tanımlanır.
            code: |-
              "category": { "type": "keyword" },
              "brand":    { "type": "text", "fields": { "raw": { "type": "keyword" } } }
          - title: Seçim filtre olarak eklenir, sorguya değil
            text: >-
              Kullanıcının seçtiği kategori bool sorgusunun filter bölümüne konur. Filtre skoru değiştirmez ve sonucu
              önbelleğe alınabilir; aynı filtre sık kullanıldıkça daha ucuzlar.
            code: |-
              "bool": { "must": [ { "multi_match": { … } } ], "filter": [ { "term": { "category": "Elektronik" } } ] }
          - title: Seçili facet'in diğer seçenekleri ayrıca düşünülür
            text: >-
              Filtre aggregation'ları da daraltır: Elektronik seçilince kategori listesinde sadece Elektronik kalır. Kullanıcı
              diğer kategorileri de görmeye devam etsin isteniyorsa filtre post_filter'a konur; o zaman sonuçlar daralır ama
              sayılar bütün aramadan hesaplanır.
          - title: Kova sayısı sınırlanır
            text: >-
              terms aggregation varsayılan olarak en çok ürünü olan 10 kovayı döndürür. Çok değerli alanlarda (ör. marka)
              size açıkça verilir ve en çok kullanılanlar gösterilir; hepsini döndürmek pahalıdır.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Arama index'ine kullanıcı yazmaz. Ürünlerin asıl kaydı katalog veritabanındadır; arama motoru ondan beslenir.
        reads: Uygulama, arama sayfası ve facet listesi için.
        kind: >-
          OpenSearch başka bir veritabanından kendiliğinden veri çekmez; birinin onu beslemesi gerekir (Amazon OpenSearch
          Ingestion ya da kataloğun değişikliklerini okuyan bir program).
        with: >-
          Sonuç kartlarının görselleri nesne deposundan (S3) gelir; ürünün asıl kaydı ve stok katalogdadır (DocumentDB).
          Facet sayıları index'teki kopyadan hesaplanır; katalogda yeni bir ürün eklendiğinde sayı, index güncellenince değişir.
        best: >-
          Katalog tek yerde tutulur ve arama index'i ondan otomatik beslenir (DocumentDB'nin OpenSearch ile zero-ETL
          entegrasyonu). Facet olarak gösterilecek alanlar katalog tasarlanırken belirlenir ve index'te keyword olarak tanımlanır.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
