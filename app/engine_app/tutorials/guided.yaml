        rows:
          - [Şifreleme, TLS (HTTPS), gerçek, OpenSearch domain'i sadece şifreli bağlantı kabul eder.]
          - [Protokol, "HTTP, POST /stores/_search (JSON)", gerçek, "Konum araması da bir web isteğidir; nokta ve uzaklık JSON gövdede gider."]
          - [Kimlik, "IAM, SigV4 imzası (servis: es)", gerçek, "Şifre yok. İsteğe, geçici AWS kimliğiyle hesaplanmış bir imza eklenir."]
