            send: >-
              Mağazalar sayfasını açtın. Tarayıcın "İstanbul merkeze 25 km içindeki mağazalar" dedi; uygulama OpenSearch'e
              geo_distance sorgusunu gönderiyor.
            back: Uygulama 3 mağazayı uzaklıklarıyla tarayıcına gönderdi; harita işaretleri çizilecek.
