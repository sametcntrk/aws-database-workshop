  - page: search
    path: /search?q=kulaklk
    engines: [opensearch]
    use_case: Yazım hatası toleransı
    title: Fuzziness bir yazım hatasını kabul eder
    why: >-
      Arama kutusunda "kulaklk" yazıyor: bir harf eksik, hızlı yazan birinin yapacağı türden. Yine de kulaklıklar listelendi.
      Şimdi bu toleransı kapatıp ne değiştiğine bakacaksın.
    do: Aydınlık "Exact words" (sadece birebir kelimeler) butonuna tıkla.
    target: "#exp-fuzzy [data-value=off]"
    action: click
    wait: {method: GET, path: /opensearch/api/search, query: {fuzzy: "off", q: kulaklk}}
    focus: "#hits"
    result: The match query has no "fuzziness" now, so the typo finds no product.
    panel:
      need: >-
        Ziyaretçiler hızlı yazar ve harf atlar: "kulaklk", "kablosz". Arama bunlara "sonuç yok" derse ziyaretçi alışverişi
        bırakabilir. Aramanın bir iki harf farkı tolere etmesi, ama ilgisiz kelimeleri de getirmemesi gerekiyor.
      concept:
        term: Fuzziness ve düzenleme mesafesi (edit distance)
        text: >-
          İki kelime arasındaki düzenleme mesafesi, birini diğerine çevirmek için gereken en az harf ekleme, silme ya da
          değiştirme sayısıdır. "kulaklk" ile "kulaklik" arasında mesafe 1: bir "i" eklemek yeter. Fuzziness açıkken arama motoru
          index'teki terimlerden mesafesi küçük olanları da eşleşme sayar; bir öğretmenin küçük yazım hatasını görüp anlamı
          kabul etmesi gibi. Bulanık eşleşme, birebir eşleşmeden daha düşük puan alır.
        terms:
          - [Düzenleme mesafesi, "Bir kelimeyi diğerine çeviren en az harf ekleme, silme ya da değiştirme sayısı."]
          - [fuzziness AUTO, "1–2 harfli kelimede 0, 3–5 harflide 1, daha uzunda 2 harf farkı kabul eder."]
          - [Token, "Analyzer'ın ürettiği tek kelime. \"kulaklk\" tek bir token."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde yazım hatası toleransı için hazırlık
        intro: >-
          Arama kutusu hiç kullanılmadan, aramanın hatalara ne kadar esnek olacağı ve bunun bedeli belirlenir. Aşağıdaki beş adım
          bu hazırlığın sırasıdır.
        text:
          - title: Önce ziyaretçinin nasıl yazdığı belirlenir
            text: >-
              Gerçek arama kayıtları incelenir: harf atlama, harf yer değiştirme, Türkçe harf yazmama. Türkçe harf sorunu
              analyzer'la (Adım 5), harf atlama ve yer değiştirme fuzziness ile çözülür.
          - title: Tolerans ölçülü açılır
            text: >-
              fuzziness AUTO kelime uzunluğuna göre 0–2 harf farkı kabul eder. prefix_length ilk harflerin birebir tutmasını
              ister; hem yanlış eşleşmeyi hem işi azaltır. max_expansions denenecek benzer terim sayısını sınırlar.
            code: |-
              "multi_match": { "query": "kulaklk", "fields": ["name^3", "description"],
                               "fuzziness": "AUTO", "prefix_length": 1, "max_expansions": 50 }
          - title: Bedeli ölçülür
            text: >-
              Bulanık arama, index'te benzer terimleri tek tek dener; büyük bir index'te birebir aramadan belirgin şekilde
              pahalıdır. Arama süresi (took) ve yük izlenir; gerekirse fuzziness sadece birebir arama sonuç vermediğinde
              ikinci bir denemede açılır.
          - title: Sık hatalar için eş anlamlı listesi tutulur
            text: >-
              Hep aynı şekilde yanlış yazılan ya da farklı adlandırılan kelimeler (ör. "kulaklık" ↔ "headset") bir synonym
              filtresine yazılır; bunlar fuzziness'e bırakılmaz.
            code: |-
              "filter": { "tr_syn": { "type": "synonym", "synonyms": ["kulaklik, headset", "powerbank, tasinabilir sarj"] } }
          - title: Sonuçsuz aramalar izlenir
            text: >-
              "Sonuç yok" dönen aramalar kaydedilir ve düzenli okunur. Sık görülenler synonym listesine eklenir ya da "Bunu mu
              demek istediniz?" önerisi (suggester) gösterilir.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Arama index'ine kullanıcı yazmaz. Ürünlerin asıl kaydı katalog veritabanındadır; arama motoru ondan beslenir.
        reads: Uygulama, arama sayfası ve arama kutusunun öneri listesi için.
        kind: >-
          OpenSearch başka bir veritabanından kendiliğinden veri çekmez; birinin onu beslemesi gerekir (Amazon OpenSearch
          Ingestion ya da kataloğun değişikliklerini okuyan bir program).
        with: >-
          Sonuç kartlarının görselleri nesne deposundan (S3) gelir; ürünün asıl kaydı katalogdadır (DocumentDB). Sonuçsuz
          aramaların kaydı çoğu zaman bir olay akışına ya da analiz deposuna yazılır.
        best: >-
          Katalog tek yerde tutulur ve arama index'i ondan otomatik beslenir (DocumentDB'nin OpenSearch ile zero-ETL
          entegrasyonu). Synonym listesi de kod gibi sürümlenir; değişince index ayarları güncellenir.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Arama sayfası "kulaklk" aramasıyla açıldı: bir harfi eksik bir arama. Açılırken oturumun güncellendi.
            engines: [elasticache]
          - text: >-
              Sayfa açılırken tarayıcın aramayı gönderdi; uygulama OpenSearch'e fuzziness AUTO ile sordu ("Fuzziness AUTO"
              seçiliydi). Simülasyonun sol şeridi bu istek.
            engines: [opensearch]
          - text: >-
              5 kulaklık listelendi; kart görselleri S3'ten geldi. Skorlar düşüktü, çünkü eşleşme birebir değil bulanıktı.
            engines: [opensearch, s3]
          - text: >-
              Sonra "Exact words" butonuna bastın. Tarayıcın aynı aramayı fuzzy=off ile istedi; uygulama sorgudan fuzziness'i
              çıkardı. Simülasyonun sağ şeridi bu istek. Hiç ürün gelmedi.
