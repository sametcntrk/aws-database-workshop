          - id: persona
            title: "t0 · İstek 2 · Senin tıklaman · Sana göre (3 hop)"
            start: {id: C00001, label: Ayşe Yılmaz, type: me}
            start_title: Sen
            start_say: Yürüyüş senin seçtiğin müşterinin, Ayşe Yılmaz'ın düğümünden başlıyor.
            send_say: >-
              "For my persona" butonuna tıkladın. Tarayıcın aynı adrese mode=persona ile sordu; uygulama müşteri numaranı
