            - {match: 'return jsonify(trace.payload({"hits": hits, "aggs": aggs, "total":', say: "Ürünler, sayılar ve toplam tarayıcıya gider.", tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek index'te ne oldu?
        intro: >-
          Sayfa açılırken giden arama ve senin tıklamanla giden filtreli arama.
        runs:
          - label: Sadece arama (sayfa açılınca)
            page_call: {path: /opensearch/api/search, query: {q: siyah}}
            metrics: [[Bulunan ürün, data.total], [Kategori sayısı, data.aggs.categories.length], [İlk ürünün skoru, data.hits.0.score], [Süre, ms]]
          - label: Arama + Elektronik (senin tıklaman)
            trigger: true
            metrics: [[Bulunan ürün, data.total], [Kategori sayısı, data.aggs.categories.length], [İlk ürünün skoru, data.hits.0.score], [Süre, ms]]
        reading: >-
          Filtre 40 ürünü 9'a indirdi; ilk ürünün skoru iki aramada da aynı, çünkü filtre skora dokunmaz. Kategori sayısı 5'ten
          1'e indi: aggregation'lar da filtreden geçen ürünlerden hesaplandı. Süre her istekte biraz değişir.
      query:
        title: Sayfa OpenSearch'e ne dedi?
        intro: >-
          İki sütun, simülasyondaki iki isteğin sorgusu. Tek fark filtre parçası. Bir parçanın üzerine gelince cümlede, kodda ve
          açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: mm
            say: '"siyah" kelimesini adda ve açıklamada arayıp skorla,'
            code: '{ "bool": { "must": [ { "multi_match": { "query": "siyah", … } } ],'
            name: Ne aranıyor?
            note: must bölümü skorlanır; eşleşmesi daha güçlü olan ürün daha üstte.
            hl: score
          - id: flt
            say: sadece kategorisi Elektronik olanları bırak,
            code: '              "filter": [ { "term": { "category": "Elektronik" } } ] },'
            name: Hangileri kalsın?
            note: term, keyword alanında birebir eşleşme. filter bölümü skora katkı yapmaz; sadece eler.
            hl: filter
            tag: sadece sağdaki sorguda var
          - id: cats
            say: kalanları kategoriye göre say,
            code: '  "aggs": { "categories": { "terms": { "field": "category" } },'
            name: Ne sayılsın?
            note: Her farklı kategori bir kova; içindeki ürün sayısı doc_count.
            hl: aggs
          - id: prc
            say: ve fiyat aralıklarına göre say.
            code: '           "price": { "range": { "field": "price", "ranges": [ … ] } } } }'
            name: Ne sayılsın?
            note: 0–500, 500–2000 ve 2000 üstü olmak üzere üç kova.
            hl: aggs
        columns:
          - label: Sadece arama
            sub: Sayfa açılırken giden sorgu.
            via: Uygulama bu sorguyu opensearch-py kütüphanesinin search() metoduyla gönderir; sayılar aynı istekte.
            parts: [mm, cats, prc]
          - label: Arama + Elektronik
            sub: Senin "Elektronik" tıklamanla giden sorgu.
            via: Aynı search() çağrısı; uygulama filter bölümüne kategori satırını ekledi.
            parts: [mm, flt, cats, prc]
            mark: [flt]
        note: >-
          Dikkat: kategori sayıları için ayrı bir sorgu yok; "aggs" aynı isteğin bir parçası. Ve kategori seçimi "must"a değil
          "filter"a eklendi: bu yüzden ürünlerin skoru ve sırası değişmedi.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          OpenSearch'ün işi cevabı verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: OpenSearch → Uygulama
            text: Tek cevapta Elektronik'ten 9 ürün, tek kovalık kategori sayısı ve üç fiyat aralığı sayısı geldi.
          - who: Uygulama
            text: Kovaları ad ve sayı listesine çevirdi; ürünleri sayfanın beklediği şekle getirdi.
          - who: Uygulama → Tarayıcın
            text: Ürünleri, sayıları ve isteğin kaydını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: Sonuçları çizdi; soldaki listede Elektronik kalın yazıldı ve fiyat sayıları güncellendi.
          - who: Tarayıcın → S3
            text: >-
              Kart görsellerini ürün numarasından kurduğu adreslerle istedi; çoğu az önce görüldüğü için önbellekten geldi.
          - who: Sonra
            text: >-
              "All categories" (bütün kategoriler) seçersen filtre çıkar ve 40 ürün, beş kategori sayısıyla geri gelir.
      remember: >-
        Sonuçlar ve facet sayıları aynı istekte, aynı geçişte hesaplanır. Kullanıcının seçimi filtre olarak eklenir: ürünleri
        eler ama skorlarına dokunmaz.
      why_db: >-
        Neden OpenSearch? Arama sonucunun yanında anlık sayılar ve skor bozulmadan filtreleme, arama motorunun temel işidir;
        OpenSearch bunları tek istekte, ters index ve keyword alanları üzerinde yapar. Bedeli: sayılar index'teki kopyadan gelir
        ve katalog ile index arasındaki birkaç saniyelik gecikmeyi taşır.

  # ---------------------------------------------------------------- Stores: OpenSearch geo
  - page: stores
    path: /stores
    engines: [opensearch]
    use_case: Konum araması
    title: Bir noktanın yakınındaki mağazaları bul
    why: >-
      Mağazalar sayfasındasın. Harita İstanbul'un ortasına odaklı ve çevresinde 25 km'lik bir daire var; dairenin içindeki
      mağazalar listelendi. Şimdi daireyi büyütüp aramanın nasıl değiştiğine bakacaksın.
    do: Aydınlık "100 km" butonuna tıkla.
    target: "#exp-km [data-value='100']"
    action: click
    wait: {method: GET, path: /opensearch/api/stores, query: {km: "100"}}
    focus: "#map"
    result: The geo_distance query now has distance 100km. More stores are inside the circle, sorted by distance.
    panel:
      need: >-
        Ziyaretçi "bana en yakın mağaza hangisi?" diye soruyor. Bunun için her mağazanın konumunun saklanması, bir noktaya belli
        bir uzaklıktaki mağazaların hızlıca bulunması ve en yakından uzağa sıralanması gerekiyor. Her mağazanın uzaklığını
        tek tek hesaplamak, mağaza sayısı binlere çıkınca yavaşlar.
      concept:
        term: geo_point ve uzaklık araması (geo_distance)
        text: >-
          Her mağazanın konumu enlem ve boylam olarak, geo_point türünde bir alanda saklanır. Arama motoru bu noktaları haritayı
          karelere bölen bir yapıda (BKD ağacı) tutar. Bir mahalle haritasında "bana 1 km içindeki dükkânlar" diye bakarken
          önce uzak mahalleleri hiç açmaman gibi: daireye hiç değmeyen kareler atlanır, sadece daireye değen karelerdeki
          noktaların uzaklığı hesaplanır.
        terms:
          - [geo_point, "Enlem ve boylamdan oluşan konum alanı türü. Örn. { lat: 41.07, lon: 28.90 }."]
          - [geo_distance, "Bir noktaya belli bir uzaklık içindekileri bırakan filtre: \"merkeze 100 km içinde\"."]
          - [_geo_distance sırası, "Sonuçları merkeze uzaklığa göre sıralama; cevapta her mağazanın uzaklığı da gelir."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde mağaza konumları için hazırlık
        intro: >-
          Harita hiç açılmadan, konum alanı doğru türle tanımlanır ve mağazalar index'e yazılır. Aşağıdaki beş adım bu
          hazırlığın sırasıdır.
        text:
          - title: Önce sayfanın sorusu yazılır
            text: >-
              "Bu noktaya X km içindeki mağazalar, en yakın önce". Nokta, ziyaretçinin seçtiği şehir ya da haritada tıkladığı
              yerdir.
            code: |-
              { "query": { "geo_distance": { "distance": "100km", "location": { "lat": 41.0082, "lon": 28.9784 } } },
                "sort": [ { "_geo_distance": { "location": { "lat": 41.0082, "lon": 28.9784 }, "order": "asc", "unit": "km" } } ] }
          - title: Konum alanı geo_point olarak tanımlanır
            text: >-
              Alan türü index kurulurken seçilir ve sonradan değiştirilemez. geo_point olmayan bir alanda (ör. iki ayrı sayı)
              uzaklık araması yapılamaz.
            code: |-
              PUT stores { "mappings": { "properties": {
                "name": { "type": "text" }, "city": { "type": "keyword" }, "location": { "type": "geo_point" } } } }
          - title: Konum tek bir kaynaktan yazılır
            text: >-
              Mağaza adresleri asıl kayıtta (ör. mağaza yönetim sistemi) tutulur; adres koordinata bir kez çevrilir (geocoding)
              ve index'e enlem/boylam olarak yazılır. Her aramada adresten koordinat hesaplanmaz.
            code: |-
              POST stores/_doc/S010 { "name": "İstanbul Mağaza 2", "city": "İstanbul", "location": { "lat": 41.07989, "lon": 28.90559 } }
          - title: Uzaklık filtresi sıralamadan ayrı düşünülür
            text: >-
              geo_distance sadece eler; sırayı _geo_distance sort verir. Uzaklık skora da karıştırılmak istenirse (yakın ve
              ilgili olanı öne al) function_score ile bir uzaklık eğrisi eklenir.
          - title: Harita ve adres servisi ayrıca seçilir
            text: >-
              Harita görüntüsü ve adres→koordinat çevirisi arama motorunun işi değildir. Bunun için bir harita servisi kullanılır
              (AWS'de Amazon Location Service); arama motoru sadece noktaları ve uzaklığı bilir.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Mağaza yönetimi: yeni mağaza açılınca ya da adresi değişince kayıt güncellenir ve index'e yazılır. Değişiklik seyrektir.
        reads: Uygulama, mağaza bulucu sayfası için.
        kind: >-
          OpenSearch başka bir veritabanından kendiliğinden veri çekmez; mağaza kayıtları ona bir program ya da Amazon
          OpenSearch Ingestion ile yazılır.
        with: >-
          Bu sayfada harita karoları (zemindeki harita görüntüsü) bir veritabanından değil, dış bir harita servisinden
          (OpenStreetMap) gelir; tarayıcı onları doğrudan ister. Mağazaların noktaları ve uzaklıkları ise OpenSearch'ten gelir.
          İkisini aynı ekranda birleştiren tarayıcıdır.
        best: >-
          Mağazaların asıl kaydı tek yerde tutulur ve arama index'i ondan beslenir. Harita ve adres çevirisi için yönetilen bir
          servis (Amazon Location Service) kullanılır; dış harita karolarının kullanım koşulları ve kotası ayrıca kontrol edilir.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Mağazalar sayfasını açtın. Açılırken oturumun güncellendi.
            engines: [elasticache]
          - text: >-
              Tarayıcın haritayı İstanbul'un ortasına odakladı; zemindeki harita karolarını doğrudan OpenStreetMap'ten (AWS dışı
              bir servis) indirdi. Bu karolar bir veritabanından gelmiyor.
          - text: >-
              Aynı anda tarayıcın uygulamaya "bu noktaya 25 km içindeki mağazalar" dedi; uygulama OpenSearch'e geo_distance
              sorgusunu gönderdi. Simülasyonun sol şeridi bu istek. 3 İstanbul mağazası haritada işaretlendi.
            engines: [opensearch]
          - text: >-
              Sonra "100 km" butonuna bastın. Tarayıcın aynı noktayla km=100 istedi; uygulama aynı sorguyu daha büyük bir
              daireyle gönderdi. Simülasyonun sağ şeridi bu istek. Bursa'daki 3 mağaza da listeye girdi.
            engines: [opensearch]
      sim:
        kind: geo
        caption: >-
          Gerçek mağazalardan 8'i, İstanbul merkezine göre bir düzlemde. Haritayı 4×4 kareye bölüyoruz (gerçek index çok daha
          ince bölünür). İki şerit iki ayrı gerçek istek: soldaki sayfa açılırken (25 km), sağdaki senin tıklamanla (100 km).
          Uzaklıklar gerçek koordinatlardan hesaplandı.
        center: {lat: 41.0082, lon: 28.9784, label: İstanbul merkez}
        stores:
          - {id: S010, name: İstanbul Mağaza 2, city: İstanbul, lat: 41.07989, lon: 28.90559}
          - {id: S001, name: İstanbul Mağaza 1, city: İstanbul, lat: 41.07272, lon: 29.07395}
          - {id: S019, name: İstanbul Mağaza 3, city: İstanbul, lat: 40.89754, lon: 28.94886}
          - {id: S022, name: Bursa Mağaza 3, city: Bursa, lat: 40.32254, lon: 29.12761}
          - {id: S004, name: Bursa Mağaza 1, city: Bursa, lat: 40.26288, lon: 28.9117}
          - {id: S013, name: Bursa Mağaza 2, city: Bursa, lat: 40.25907, lon: 28.91654}
          - {id: S003, name: İzmir Mağaza 1, city: İzmir, lat: 38.47421, lon: 27.11965}
          - {id: S002, name: Ankara Mağaza 1, city: Ankara, lat: 39.82101, lon: 33.00533}
        lanes:
          - id: km25
            title: "t-1 · İstek 1 · Sayfa açılınca · 25 km"
