            back_say: >-
              Uygulama önerileri olduğu gibi tarayıcına gönderdi; sayma ve sıralama Neptune'da yapıldı. Tarayıcın kartları
              çizecek, görselleri S3'ten isteyecek.
            hops:
              - title: Onu alanlar
                say: "1. hop: Kablosuz Kulaklık'a gelen BOUGHT kenarları takip edildi. Bu ürünü alan 3 müşteriye ulaşıldı."
                nodes:
