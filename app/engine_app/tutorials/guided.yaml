# Mission of the Guided e-commerce app (static/js/mission.js, coach marks and the "Perde arkası" panel). Turkish, 101 level.
# Each step: page (page id), path (shop path; the app base goes in front), engines, use_case, title,
#   why (the idea before the action), do (one instruction), target (CSS selector of the ONE control that is lit),
#   action: click | look | type | change,
#   wait: the Engine call that completes the action {method, path ("*" at the end = prefix), query, body ("*" = any value), any}
#         or {click: true} / {change: true} / {value: "5"} for a control with no Engine call,
#   focus (selector that is lit after the action: the result), result (the "Behind the scenes" text),
#   panel: the "Perde arkası" panel (see static/js/mission.js). Steps with no panel show `result` in the small card.
finish_url: /e2etutorial
steps:
  # ---------------------------------------------------------------- Home: DocumentDB, ElastiCache
  - page: home
    path: /
    engines: [docdb]
    use_case: Product catalog
    title: The category tiles are one aggregation
    why: >-
      Each product is one JSON document in DocumentDB. The page asked DocumentDB to group the 200 products by category
      and count them. DocumentDB did the counting on the server and returned only five small results.
    do: Look at the lit category tiles. Read the Behind-the-scenes note, then answer the checkpoint.
    target: "#cats"
    action: look
    wait: {method: GET, path: /docdb/api/home}
    result: The pipeline has a $group stage. DocumentDB counted the documents of each category and sent only the counts and the lowest prices to the Engine App.

  - page: home
    path: /
    engines: [elasticache]
    use_case: Hot data in memory
    title: The flash deal comes from memory
    why: >-
      Every Visitor reads the flash deal, and its stock changes many times each minute.
      ElastiCache (Valkey) keeps it in memory as a hash and a counter. A read takes less than one millisecond inside the VPC.
    do: Look at the lit flash deal box.
    target: "#hero-deal"
    action: look
    wait: {method: GET, path: /elasticache/api/deal}
    result: HGETALL lm:deal returned the fields of the deal hash. GET lm:deal:stock returned the counter. Look at the time of each command.

  # ---------------------------------------------------------------- Category: DocumentDB indexes
  - page: category
    path: /c/Elektronik
    engines: [docdb]
    use_case: Index ile filtreleme
    title: Index'i kapat
    why: >-
      Bu sayfadaki ürünler DocumentDB adlı veritabanından geliyor. Sayfa sadece Elektronik ürünlerini istiyor ve puanı en
      yüksek olanı en üste koyuyor. Bunu hızlı yapmak için veritabanı bir index kullanıyor. Index, kitabın sonundaki dizin
      gibidir: aradığın kelimenin hangi sayfalarda olduğunu söyler, kitabı baştan sona okuman gerekmez. Şimdi aynı listeyi
      index olmadan isteyeceğiz ve veritabanının ne kadar fazla iş yaptığını göreceğiz.
    do: Aydınlık "Collection scan" butonuna tıkla. "Collection scan", index'i kullanmadan bütün ürünleri tek tek okumak demek.
    target: "#exp-index [data-value=off]"
    action: click
    wait: {method: GET, path: /docdb/api/products, query: {index: "off"}}
    focus: "#products"
    # Perde arkası paneli (mission.js + guided-sim.js). Sıra: need, concept, sim, live, query, remember, why_db.
    panel:
      need: >-
        Sayfa, 200 ürünlük katalogdan sadece "Elektronik" kategorisindekileri istiyor ve onları puana göre büyükten küçüğe
        sıralı istiyor. Az önce aynı listeyi iki farklı yolla aldın: önce index ile (sayfa açılırken), şimdi index olmadan.
        Ekrandaki ürünler iki seferde de aynı. Farkı görmek için perde arkasına bakmak gerekiyor.
      concept:
        term: Index (dizin)
        text: >-
          Index, kitabın sonundaki dizine benzer. "Elektronik" kelimesini dizinde bulursun, dizin sana hangi sayfalara
          bakacağını söyler ve sadece o sayfaları açarsın. Dizin yoksa kitabı ilk sayfadan son sayfaya kadar okuman gerekir.
          Bu katalogdaki index iki alanı birlikte tutuyor: önce kategori, sonra puan. Bu yüzden index'te Elektronik ürünleri
          yan yana ve zaten puan sırasında duruyor.
        terms:
          - [Doküman, "Bir ürünün bütün bilgisi. DocumentDB her ürünü bir JSON dokümanı olarak saklar. Tablodaki her satır bir doküman."]
          - [Koleksiyon, "Aynı türden dokümanların bulunduğu yer. Burada adı products."]
          - [Collection scan, "Index kullanmadan koleksiyondaki dokümanları baştan sona tek tek okumak."]
      sim:
        kind: index-vs-scan
        caption: >-
          Gerçek katalogdan alınmış 8 ürünlük bir kesit. Sol tarafta DocumentDB index'i kullanıyor, sağ tarafta index'i
          kullanmıyor. İki taraf aynı hızda adım atıyor: her adımda en fazla bir doküman okunuyor.
        columns: [[id, Ürün no], [name, Ürün], [category, Kategori], [rating, Puan]]
        filter: [category, Elektronik]
        sort: [rating, desc]
        index_name: "{ category: 1, rating: -1 }"
        rows:
          - {id: P0014, name: Python ile Veri, category: Kitap, rating: 4.7}
          - {id: P0021, name: Akıllı Saat, category: Elektronik, rating: 4.8}
          - {id: P0052, name: Kahve Makinesi, category: Ev & Yaşam, rating: 4.9}
          - {id: P0061, name: Powerbank, category: Elektronik, rating: 4.5}
          - {id: P0083, name: Spor Çantası, category: Spor, rating: 4.7}
          - {id: P0105, name: Deri Ceket, category: Moda, rating: 4.8}
          - {id: P0131, name: Mekanik Klavye, category: Elektronik, rating: 4.8}
          - {id: P0176, name: Bluetooth Hoparlör, category: Elektronik, rating: 4.7}
      live:
        title: Gerçek katalogda ne oldu?
        intro: >-
          Simülasyonda 8 ürün vardı. Gerçek katalogda 200 ürün var. Aşağıdaki sayılar, senin tıklamanla DocumentDB'ye giden
          gerçek isteklerden geliyor. Sayfa bunları DocumentDB'nin explain komutuyla ölçüyor: explain, veritabanına
          "bu sorguyu nasıl çalıştırdın, kaç doküman okudun?" diye sorar.
        runs:
          - {label: Index ile, fetch: "/docdb/api/products?category=Elektronik&index=on&sort=rating"}
          - {label: Index olmadan, trigger: true}
        metrics: [[Okunan doküman, examined], [Dönen doküman, returned], [Süre, ms]]
        bar: examined
        stages_cap: "DocumentDB'nin yaptığı işler, sırasıyla:"
        reading: >-
          İki çalıştırmada da 40 ürün döndü, ekrandaki liste aynı. Fark okunan doküman sayısında: index ile DocumentDB sadece
          eşleşen 40 dokümanı okudu. Index olmadan 200 dokümanın hepsini okudu, 160'ını "Elektronik değil" diye attı, sonra
          kalan 40'ı bellekte puana göre sıraladı. Süre (ms) her denemede biraz değişir ve 200 ürünlük küçük bir katalogda fark
          küçüktür. Asıl önemli ölçü okunan doküman sayısıdır: katalog 100 kat büyürse index olmadan okunan doküman sayısı da
          100 kat artar. Index ile sadece eşleşen dokümanlar okunur.
        stages:
          IXSCAN: "Index'te arama: dizinde doğru bölüme gider, sadece eşleşen dokümanları okur."
          COLLSCAN: "Koleksiyon taraması: dokümanları baştan sona tek tek okur ve filtreyi her birinde dener."
          SORT: "Bellekte sıralama: eşleşen dokümanları okuduktan sonra puana göre ayrıca dizer."
          LIMIT_SKIP: "Sınır: sonuçtan en fazla 48 dokümanı alır."
      query:
        title: Sayfa DocumentDB'ye ne dedi?
        intro: >-
          Simülasyondaki iki taraf, DocumentDB'ye giden iki gerçek komuttan geliyor. Burada da aynı düzen var: solda index
          ile çalışan komut, sağda index olmadan çalışan komut. Önce komutun Türkçesini oku, sonra aynı renkteki kod parçasını
          bul. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        # parts: one piece of a command each (fields: ~/.claude/skills/guided-step/references/panel-schema.md).
        parts:
          - id: coll
            say: products koleksiyonundaki
            code: db.products.find(
            name: Nereden?
            note: "products, ürünlerin durduğu koleksiyon. find, \"bul ve getir\" demek."
            hl: table
          - id: filter
            say: kategorisi Elektronik olan ürünleri
            code: '{ category: "Elektronik" },'
            indent: 2
            name: Hangileri?
            note: Filtre. Sadece category alanı "Elektronik" olan dokümanlar sonuca girer, diğerleri girmez.
            hl: filter
          - id: proj
            say: sadece kartta gereken bilgileriyle
            code: "{ name: 1, price: 1, rating: 1, category: 1, brand: 1, tags: 1, stock: 1 } )"
            indent: 2
            name: Hangi bilgiler?
            note: >-
              Projection. 1 "bu alanı getir" demek. Ürün kartı ad, fiyat, puan, kategori, marka, etiket ve stok gösteriyor;
              dokümandaki diğer alanlar (açıklama, renk, ürün özellikleri) gelmiyor. Böylece ağdan daha az veri taşınır.
            hl: columns
          - id: sort
            say: puanı en yüksek olan en üstte olacak şekilde sıralayıp
            code: ".sort({ rating: -1 })"
            name: Hangi sırayla?
            note: Sıralama. rating alanına göre sıralar. -1 "büyükten küçüğe", 1 olsaydı "küçükten büyüğe" demek olurdu.
            hl: sort
          - id: limit
            say: en fazla 48 tane getir
            code: ".limit(48)"
            name: Kaç tane?
            note: Sınır. Sayfa en fazla 48 ürün gösteriyor. Elektronik'te 40 ürün olduğu için 40'ın hepsi geliyor.
            hl: result
          - id: hint
            say: ve bunu yaparken index'i kullanma.
            code: ".hint({ $natural: 1 })"
            name: Nasıl?
            note: >-
              Hint, veritabanına "bu sorguyu şu yolla çalıştır" diye yol göstermek. $natural, "dokümanları diskte durdukları
              sırayla, baştan sona oku" demek. Yani index'i bırak, collection scan yap. Bu parça sadece "Collection scan"
              seçiliyken eklenir.
            hl: scan
            tag: sadece sağdaki komutta var
        columns:
          - label: Index ile
            sub: Sayfa ilk açıldığında giden komut ("Use the index" seçili).
            parts: [coll, filter, proj, sort, limit]
          - label: Index olmadan (collection scan)
            sub: Senin "Collection scan" tıklamanla giden komut.
            parts: [coll, filter, proj, sort, limit, hint]
            mark: [hint]
        note: >-
          Dikkat: soldaki komutta "index" kelimesi hiç geçmiyor. Index'i komutta yazmazsın. DocumentDB komuttaki filtreye
          (category) ve sıralamaya (rating) bakar, bunlara uyan bir index varsa onu kendisi seçer. Kategori filtresi iki
          komutta da aynı, yani filtre index kullanıldığını göstermez. Sağdaki komutun tek farkı 6. parça: .hint ile
          DocumentDB'ye "index'i bırak, baştan sona oku" diyoruz. Bu tek parça, okunan doküman sayısını 40'tan 200'e çıkardı.
      remember: >-
        Sonuç aynı, yapılan iş farklı. Index olmadan veritabanı her dokümanı okumak zorunda kalır. Index, sık kullanılan bir
        filtre ve sıralama için doğru bölüme doğrudan gitmeyi sağlar.
      why_db: >-
        Neden DocumentDB? Ürünler farklı yapılarda bilgi taşıyor: kulaklığın pil süresi, ceketin bedeni ve rengi var. DocumentDB
        her ürünü kendi alanlarıyla tek bir doküman olarak saklar ve bu alanlar üzerinde index kurmana izin verir. Index'in de
        bir bedeli var: her yeni ürün yazıldığında index de güncellenir. Bu yüzden sadece sık kullanılan filtreler için index
        kurulur.

  - page: category
    path: /c/Elektronik
    engines: [docdb]
    use_case: Query a nested field
    title: Filter on a field inside the document
    why: >-
      The colour is inside a nested object, attributes.renk. DocumentDB can filter on it with dot notation, and an index on attributes.renk keeps the filter fast.
    do: Select a colour in the lit list.
    target: "#color"
    action: change
    wait: {method: GET, path: /docdb/api/products, query: {color: "*"}}
    focus: "#products"
    result: The filter is now {category, "attributes.renk"}. In a relational model, optional attributes like this often need a separate table.

  # ---------------------------------------------------------------- Search: OpenSearch
  - page: search
    path: /search?q=kablosuz%20kulaklik
    engines: [opensearch]
    use_case: Full-text search
    title: The analyzer decides which words match
    why: >-
      OpenSearch keeps an inverted index: for each word, the list of products that contain it. The tr_folded analyzer changes "ı" to "i"
      at index time and at query time. So the query word "kulaklik" matches the name "Kulaklık".
    do: Click the lit button "standard".
    target: "#exp-analyzer [data-value=standard]"
    action: click
    wait: {method: GET, path: /opensearch/api/search, query: {analyzer: standard}}
    focus: "#hits"
    result: The same products came back, but the score of each one is about half. With the standard analyzer, only "kablosuz" matches the name now.

  - page: search
    path: /search?q=kulaklk
    engines: [opensearch]
    use_case: Typo tolerance
    title: Fuzziness accepts a typo
    why: >-
      "kulaklk" has a missing letter. With fuzziness AUTO, OpenSearch also matches words that are one or two edits away.
      An edit is one added, removed or changed letter.
    do: Click the lit button "Exact words".
    target: "#exp-fuzzy [data-value=off]"
    action: click
    wait: {method: GET, path: /opensearch/api/search, query: {fuzzy: "off", q: kulaklk}}
    focus: "#hits"
    result: The match query has no "fuzziness" now, so the typo finds no product. Fuzziness costs more work, but it saves the search of a shopper who types fast.

  - page: search
    path: /search?q=kablosuz%20kulaklik
    engines: [opensearch]
    use_case: Facets
    title: The facet counts come from the same request
    why: >-
      The category and price counts at the left are aggregations. OpenSearch calculates them in the same request as the hits.
    do: Click the lit category name in the facet list.
    target: "#facet-cat [data-cat]:not([data-cat=''])"
    action: click
    wait: {method: GET, path: /opensearch/api/search, query: {category: "*"}}
    focus: "#hits"
    result: The query now has a filter on the keyword field "category". A filter does not change the relevance score, and OpenSearch can cache it.

  # ---------------------------------------------------------------- Stores: OpenSearch geo
  - page: stores
    path: /stores
    engines: [opensearch]
    use_case: Geospatial search
    title: Find the stores near a point
    why: >-
      Each store document has a location field of type geo_point. A geo_distance filter keeps the stores inside a circle, and a sort puts the nearest first.
    do: Click the lit button "100 km".
    target: "#exp-km [data-value='100']"
    action: click
    wait: {method: GET, path: /opensearch/api/stores, query: {km: "100"}}
    focus: "#map"
    result: The geo_distance query now has distance 100km. More stores are inside the circle, and the list is sorted by distance.

  # ---------------------------------------------------------------- Product: DocumentDB, Keyspaces, Neptune, DynamoDB
  - page: product
    path: /p/P0001
    engines: [docdb]
    use_case: One read for one product
    title: Read fewer fields
    why: >-
      The product, its attributes and its tags are in one document. One read by _id returns all of it. A projection returns only the fields that you ask for.
    do: Click the lit button "Card fields only".
    target: "#exp-proj [data-value=card]"
    action: click
    wait: {method: GET, path: /docdb/api/product/*, query: {projection: card}}
    focus: "#pdp"
    result: The document size in the note is smaller now. The card projection has no description and no attributes, so less data goes over the network.

  - page: product
    path: /p/P0001
    engines: [keyspaces]
    use_case: Kullanıcı başına olay geçmişi
    title: Sayfa, baktığın ürünü Keyspaces'e yazdı
    why: >-
      Bu sayfa açılırken iki şey oldu: önce "bu ürüne baktın" bilgisi Keyspaces adlı veritabanına bir satır olarak yazıldı,
      sonra "Son baktıkların" şeridi aynı yerden okundu. Keyspaces her kullanıcının satırlarını bir arada tutar, tıpkı
      her kişinin ayrı bir defteri olması gibi. Bu deftere partition denir.
    do: Aydınlık "Recently viewed" (son baktıkların) şeridine bak. Sonra kartın altındaki butonla perde arkasını yeni sekmede aç.
    target: "#recent-wrap"
    action: look
    wait: {method: GET, path: /keyspaces/api/recent}
    panel:
      need: >-
        Mağaza her ziyaretçinin ne yaptığını (baktığı, sepete eklediği, aradığı ürünleri) kaydediyor. Bu kayıtlar çok
        sık yazılıyor ve hep aynı soruyla okunuyor: "bu kişinin son yaptıkları ne?". Binlerce ziyaretçinin milyonlarca
        satırı arasından sadece senin satırlarını, en yenisi en üstte, hızlıca bulmak gerekiyor.
      concept:
        term: Partition (kişiye ait defter)
        text: >-
          Keyspaces tabloyu partition'lara böler. Her ziyaretçinin satırları kendi partition'ında, yani kendi defterinde
          durur. Defterin hangisi olduğunu user_id söyler. Defterin içindeki satırlar da zamana göre sıralıdır: en yeni
          sayfa en üstte. Yeni bir olay yazılınca deftere en üste eklenir; okurken sadece o defter açılır ve baştan okunur.
          Başka kimsenin defterine bakılmaz.
        terms:
          - [Partition key, "Satırın hangi partition'a gideceğini belirleyen alan. Bu tabloda user_id."]
          - [Clustering key, "Partition içindeki sırayı belirleyen alan. Bu tabloda event_time, yeniden eskiye."]
          - [Keyspaces, "Amazon'un Apache Cassandra uyumlu, sunucusuz geniş sütunlu (wide column) veritabanı."]
      sim:
        kind: partition
        title: "Keyspaces tablosu: dbws.activity_by_user"
        caption: >-
          Tablodan küçük bir kesit: üç ziyaretçinin partition'ı. Ayşe ve Mert'in satırları canlı tablodan; senin
          partition'ındaki eski satırlar örnek. Önce sayfanın INSERT'i, sonra SELECT'i oynuyor.
        result_title: Son baktıkların şeridi
        partitions:
          - label: C00002 · Mert
            rows:
              - {time: "26 Eki 09:12", type: view, product: P0090 Kahve Makinesi}
              - {time: "25 Eki 18:40", type: purchase, product: P0044 Bulut Mimarisi}
          - label: "7f3a… (bu tarayıcı)"
            me: true
            rows:
              - {time: "2 dk önce", type: add_to_cart, product: P0021 Akıllı Saat}
              - {time: "3 dk önce", type: view, product: P0021 Akıllı Saat}
              - {time: "5 dk önce", type: view, product: P0131 Mekanik Klavye}
              - {time: "6 dk önce", type: view, product: P0021 Akıllı Saat}
          - label: C00001 · Ayşe
            rows:
              - {time: "26 Eki 10:39", type: search, product: P0084 Algoritmalar}
              - {time: "26 Eki 02:00", type: purchase, product: P0147 Kahve Makinesi}
              - {time: "25 Eki 20:13", type: search, product: P0173 Dambıl Seti}
        insert: {time: "şimdi", type: view, product: P0001 Kablosuz Kulaklık}
        summary: >-
          Yazma da okuma da tek bir partition'a gitti. Tablo ne kadar büyürse büyüsün, senin geçmişini okumak için sadece
          senin defterin açılır.
      live:
        title: Gerçek tabloda ne oldu?
        intro: >-
          Bu sayfa açılırken Keyspaces'e iki gerçek istek gitti. Sayılar o isteklerin kayıtlarından geliyor.
        runs:
          - label: "1. Yazma: INSERT"
            page_call: {path: /keyspaces/api/events}
            metrics: [[Yazılan satır, items], [Kapasite, capacity], [Süre, ms]]
          - label: "2. Okuma: SELECT"
            trigger: true
            metrics: [[Şeritteki ürün, items], [Süre, ms]]
        reading: >-
          INSERT tek bir satır yazdı ve 1 WRU (write request unit, yazma birimi) harcadı. Keyspaces sunucusuz çalışır:
          sunucu kiralamazsın, her okuma ve yazma birimi için ödersin. SELECT senin partition'ından en fazla 40 satır
          okudu; uygulama bunların içinden "view" olanları ve tekrar etmeyenleri ayıklayıp en fazla 8 ürünü şeride koydu.
          Sen bu tarayıcıyla ilk kez geziyorsan şeritte sadece bu ürün vardır. Süre her istekte biraz değişir.
      query:
        title: Sayfa Keyspaces'e ne dedi?
        intro: >-
          Simülasyondaki iki adım, iki gerçek CQL komutundan geliyor (CQL, Cassandra'nın SQL'e benzeyen sorgu dili).
          Solda önce giden yazma, sağda sonra giden okuma var. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada
          aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: ins
            say: activity_by_user tablosuna
            code: INSERT INTO dbws.activity_by_user
            name: Nereye?
            note: Olaylar tablosuna yeni bir satır yaz. dbws, tabloyu içeren keyspace (veritabanı gibi bir klasör).
            hl: table
          - id: cols
            say: kim, ne zaman, ne yaptı ve hangi ürün bilgilerini içeren
            code: (user_id, event_time, event_id, event_type, product_id, detail)
            name: Hangi alanlar?
            note: >-
              Satırın alanları. user_id partition key: satırın hangi deftere gideceğini o belirler. event_time clustering
              key: defterin içindeki sırayı belirler. event_id aynı anda iki olay olursa karışmasınlar diye.
            hl: pk
            indent: 2
          - id: vals
            say: yeni bir satır ekle.
            code: VALUES (?, ?, ?, ?, ?, ?)
            name: Hangi değerler?
            note: >-
              Her ? yerine uygulama gerçek değeri koyar: senin kimliğin, şu anki zaman, yeni bir kimlik, "view", ürün no
              ve ürünün adı. Satır 7 gün sonra kendiliğinden silinir (tablonun TTL ayarı).
            hl: insert
            indent: 2
          - id: sel
            say: activity_by_user tablosundan ürün, açıklama ve olay türünü
            code: SELECT product_id, detail, event_type FROM dbws.activity_by_user
            name: Ne okunuyor?
            note: Sadece şerit için gereken üç alanı oku.
            hl: type
          - id: where
            say: sadece bu tarayıcının partition'ından
            code: WHERE user_id = '7f3a…'
            name: Hangi defter?
            note: >-
              Partition key ile filtre. Keyspaces bu değerden doğru partition'ı bulur ve sadece onu okur. Partition key
              vermeden bu tabloda arama yapamazsın: Keyspaces hangi defteri açacağını bilemez.
            hl: where
            indent: 2
          - id: limit
            say: en fazla 40 satır oku.
            code: LIMIT 40
            name: Kaç tane?
            note: >-
              En yeni 40 satırda dur. Satırlar zaten yeniden eskiye sıralı durduğu için ORDER BY yazmaya gerek yok; ilk 40
              satır en yeni 40 olaydır.
            hl: ck
            indent: 2
        columns:
          - label: "1. Yazma"
            sub: Sayfa açılır açılmaz arka planda giden komut.
            parts: [ins, cols, vals]
          - label: "2. Okuma"
            sub: Hemen ardından "Son baktıkların" şeridi için giden komut.
            parts: [sel, where, limit]
        note: >-
          Dikkat: iki komutta da sıralama için bir şey yazmıyoruz. Sıra, tablo kurulurken bir kez belirlendi
          (CLUSTERING ORDER BY event_time DESC). Keyspaces satırları yazarken o sıraya koyuyor, okurken sadece baştan okuyor.
      remember: >-
        Keyspaces'te soruyu tablo tasarlanırken seçersin. "Bu kişinin son olayları" sorusu için satırlar kişiye göre
        partition'lara ayrılır ve zamana göre sıralı tutulur. Bu soru her ölçekte hızlıdır; tasarıma uymayan bir soru
        (ör. "bu ürüne kimler baktı?") için ayrı bir tablo gerekir.
      why_db: >-
        Neden Keyspaces? Olay kayıtları çok sık yazılır, hiç güncellenmez ve hep kişiye göre okunur. Keyspaces bu tür
        yoğun yazmayı sunucu yönetmeden karşılar ve eski satırları TTL ile kendisi siler. Bedeli: JOIN yok, esnek arama
        yok; her yeni soru için tabloyu o soruya göre tasarlaman gerekir.

  - page: product
    path: /p/P0001
    engines: [neptune]
    use_case: Öneriler
    title: Öneriler bir graf üzerinde yürüyüştür
    why: >-
      "Bunu alanlar şunları da aldı" önerileri Neptune adlı bir graf veritabanından geliyor. Graf, bir arkadaşlık ağı
      haritası gibidir: kişiler ve ürünler noktalar, "satın aldı" bilgisi de aralarındaki çizgilerdir. Şimdi önerileri
      bu ürüne göre değil, senin seçtiğin müşteriye göre isteyeceğiz.
    do: Aydınlık "For my persona" (benim için) butonuna tıkla.
    target: "#exp-recs [data-value=persona]"
    action: click
    wait: {method: GET, path: /neptune/api/recs, query: {mode: persona}}
    focus: "#recs-wrap"
    panel:
      need: >-
        İyi bir öneri için şu soru sorulur: "Benim gibi alışveriş yapanlar başka ne aldı?" Bunun cevabı tek bir kayıtta
        yazmaz. Müşteriden aldığı ürünlere, oradan o ürünleri alan diğer müşterilere, oradan da onların aldıklarına
        gitmek gerekir. Sayfa açılırken öneriler "bu ürüne göre" (2 adım) geldi; tıklamanla "sana göre" (3 adım) geldi.
      concept:
        term: Graf ve hop
        text: >-
          Bir graf, noktalar ve onları bağlayan çizgilerden oluşur. Noktalara düğüm (vertex), çizgilere kenar (edge)
          denir. Burada her müşteri ve her ürün bir düğüm, her satın alma da müşteriden ürüne giden bir BOUGHT kenarı.
          Bir kenar boyunca bir adım gitmeye hop denir. Neptune bir düğümden başlar ve kenarları takip eder, tıpkı bir
          haritada yol takip etmek gibi. Hiçbir tabloyu baştan sona taramaz.
        terms:
          - [Düğüm (vertex), "Bir şey: bir müşteri ya da bir ürün."]
          - [Kenar (edge), "İki düğüm arasındaki ilişki. Burada BOUGHT: bu müşteri bu ürünü aldı."]
          - [openCypher, "Graf sorgulama dili. Yolu çizer gibi yazarsın: (müşteri)-[:BOUGHT]->(ürün)."]
      sim:
        kind: graph-walk
        caption: >-
          Gerçek graftan küçük bir kesit: canlı Neptune'dan okunan müşteriler ve alımları. Gerçek grafta her ürünü
          onlarca müşteri almış; burada her yolu görebilmen için sadece birkaçı var. İki yürüyüş yan yana, aynı hızda.
        tick_ms: 1600
        summary: >-
          Soldaki yürüyüş herkese aynı önerileri verir ve senin zaten aldıklarını da önerebilir. Sağdaki yürüyüş bir adım
          daha uzun ama sana özel: aldıklarını eler, sana en çok benzeyenlerin seçtiklerini öne çıkarır.
        lanes:
          - id: product
            title: Bu ürüne göre (2 hop)
            start: {id: P0001, label: Kablosuz Kulaklık, type: product}
            start_title: Bu ürün
            start_say: Yürüyüş bu sayfadaki ürünün düğümünden, Kablosuz Kulaklık'tan başlıyor.
            hops:
              - title: Onu alanlar
                say: "1. hop: Kablosuz Kulaklık'a gelen BOUGHT kenarları takip edildi. Bu ürünü alan 3 müşteriye ulaşıldı."
                nodes:
                  - {id: C00944, label: Ece Koç, type: customer, from: [P0001]}
                  - {id: C00828, label: Selin Çelik, type: customer, from: [P0001]}
                  - {id: C00630, label: Ozan Schmidt, type: customer, from: [P0001]}
              - title: Onların aldıkları
                say: "2. hop: bu 3 müşterinin BOUGHT kenarları takip edildi ve aldıkları ürünlere ulaşıldı. Powerbank'a iki ayrı yoldan gelindi."
                nodes:
                  - {id: P0066, label: Powerbank, type: product, from: [C00944, C00828]}
                  - {id: P0053, label: Dambıl Seti, type: product, from: [C00944]}
                  - {id: P0014, label: Python ile Veri, type: product, from: [C00944]}
                  - {id: P0027, label: Masa Lambası, type: product, from: [C00828]}
                  - {id: P0063, label: Alpen Spor Çantası, type: product, from: [C00630]}
                  - {id: P0028, label: Toros Spor Çantası, type: product, from: [C00630]}
            end_say: >-
              Her ürün kaç farklı müşteriden ulaşıldığına göre sayıldı. Powerbank 2 ile en üstte. Python ile Veri ve
              Toros Spor Çantası da listede, oysa Ayşe bunları zaten almış: bu yürüyüş kimin baktığını bilmez.
          - id: persona
            title: Sana göre (3 hop)
            start: {id: C00001, label: Ayşe Yılmaz, type: me}
            start_title: Sen
            start_say: Yürüyüş senin seçtiğin müşterinin, Ayşe Yılmaz'ın düğümünden başlıyor.
            hops:
              - title: Senin aldıkların
                say: "1. hop: Ayşe'nin BOUGHT kenarları takip edildi. Kesitte Ayşe'nin aldığı 3 ürün var."
                nodes:
                  - {id: P0001, label: Kablosuz Kulaklık, type: product, from: [C00001]}
                  - {id: P0002, label: Hava Temizleyici, type: product, from: [C00001]}
                  - {id: P0019, label: Toros Bulut Mimarisi, type: product, from: [C00001]}
              - title: Aynılarını alanlar
                say: "2. hop: bu ürünlere gelen kenarlar takip edildi. Ayşe ile aynı ürünü almış 5 müşteriye ulaşıldı."
                nodes:
                  - {id: C00630, label: Ozan Schmidt, type: customer, from: [P0001]}
                  - {id: C00226, label: Can Weber, type: customer, from: [P0002]}
                  - {id: C00040, label: Seda Yılmaz, type: customer, from: [P0002]}
                  - {id: C00685, label: Kerem Çelik, type: customer, from: [P0002]}
                  - {id: C00378, label: Naz Yılmaz, type: customer, from: [P0019]}
              - title: Onların aldıkları
                say: >-
                  3. hop: bu 5 müşterinin aldıklarına gidildi. Ayşe'nin zaten aldığı ürünler elendi (üstü çizili).
                  Alpen Spor Çantası'na dört ayrı yoldan gelindi.
                nodes:
                  - {id: P0063, label: Alpen Spor Çantası, type: product, from: [C00630, C00226, C00040, C00378]}
                  - {id: P0114, label: Rhein Bulut Mimarisi, type: product, from: [C00226]}
                  - {id: P0148, label: Yoga Matı, type: product, from: [C00685]}
                  - {id: P0028, label: Toros Spor Çantası, type: product, from: [C00630, C00226], excluded: zaten aldın}
                  - {id: P0030, label: Deri Ceket, type: product, from: [C00378], excluded: zaten aldın}
            end_say: >-
              Kalan ürünler kaç farklı müşteriden ulaşıldığına göre sayıldı. Alpen Spor Çantası 4 ile en üstte; canlı sonuçta
              da Ayşe için ilk sıralarda bu ürün var.
      live:
        title: Gerçek grafta ne oldu?
        intro: >-
          İki gerçek sorgu: sayfa açılırken giden "bu ürüne göre" sorgusu ve senin tıklamanla giden "sana göre" sorgusu.
          Gerçek grafta 1000 müşteri ve 200 ürün var.
        runs:
          - label: Bu ürüne göre (2 hop)
            page_call: {path: /neptune/api/recs, query: {mode: product}}
            metrics: [[Önerilen ürün, items], [Süre, ms]]
          - label: Sana göre (3 hop)
            trigger: true
            metrics: [[Önerilen ürün, items], [Süre, ms]]
        reading: >-
          İki sorgu da en fazla 6 öneri döndürdü. Sağdaki bir hop daha uzun: daha çok kenar takip eder, bu yüzden genelde
          daha uzun sürer. Bu kurulumda Neptune Serverless çalışıyor (en az 1 NCU) ve yük artınca kapasitesini kendisi
          büyütüyor. Bir süre sorulmayan bir sorgunun ilk çalışması birkaç saniye sürebilir, çünkü veri henüz bellekte değildir;
          sonraki çalıştırmalar hızlanır. Ekrandaki puanlar (örn. "71 shared customers") ortak müşteri sayısıdır:
          simülasyondaki küçük sayıların gerçek grafta büyümüş hâli.
      query:
        title: Sayfa Neptune'a ne dedi?
        intro: >-
          İki sütun, simülasyondaki iki yürüyüşün gerçek openCypher sorguları. Yolu bir resim gibi okuyabilirsin: parantez
          bir düğüm, köşeli parantez bir kenar, ok da kenarın yönü.
        cards_title: Parça parça
        parts:
          - id: pstart
            say: Bu ürünün düğümünden başla,
            code: "MATCH (p:Product {`~id`: $pid})"
            name: Nereden?
            note: Başlangıç düğümü bu sayfanın ürünü. $pid yerine ürün no (P0001) gelir.
            hl: start
          - id: pback
            say: onu alan müşterilere git,
            code: "<-[:BOUGHT]-(c:Customer)"
            name: 1. hop
            note: Ürüne gelen BOUGHT kenarlarını geriye doğru takip et. Ok ürünü gösteriyor, çünkü kenar müşteriden ürüne gider.
            hl: hop1
            indent: 2
          - id: pfwd
            say: onların aldığı ürünlere git,
            code: "-[:BOUGHT]->(rec:Product)"
            name: 2. hop
            note: Bu müşterilerin BOUGHT kenarlarını ileri doğru takip et; vardığın ürünler öneri adayları.
            hl: hop2
            indent: 2
          - id: pwhere
            say: bu ürünün kendisini çıkar,
            code: "WHERE rec <> p"
            name: Ne elensin?
            note: Ürünün kendisini kendine önerme. Başka hiçbir şey elenmiyor; senin zaten aldıkların da listede kalabilir.
            hl: exclude
          - id: pret
            say: her ürünü kaç farklı müşteri almış say ve en çok paylaşılan 6 ürünü getir.
            code: "RETURN rec, count(DISTINCT c) AS score ORDER BY score DESC LIMIT 6"
            name: Nasıl sıralansın?
            note: >-
              Her öneri adayına kaç ayrı müşteriden ulaşıldığını say (score), en yüksek 6'yı döndür. Gerçek sorguda
              RETURN ürün no, ad ve kategoriyi de getirir.
            hl: result
          - id: mstart
            say: Senin düğümünden başla, aldığın ürünlere git,
            code: "MATCH (me:Customer {`~id`: $cid})-[:BOUGHT]->(:Product)"
            name: Nereden? + 1. hop
            note: Başlangıç senin seçtiğin müşteri ($cid = C00001). İlk kenar seni aldığın ürünlere götürür.
            hl: hop1
          - id: mback
            say: aynı ürünleri alan diğer müşterilere git,
            code: "<-[:BOUGHT]-(o:Customer)"
            name: 2. hop
            note: O ürünlere gelen kenarlarla, aynı ürünü almış diğer müşterilere (o) ulaş.
            hl: hop2
            indent: 2
          - id: mfwd
            say: onların aldıklarına git,
            code: "-[:BOUGHT]->(rec:Product)"
            name: 3. hop
            note: Bu müşterilerin aldıkları ürünler öneri adayları.
            hl: hop3
            indent: 2
          - id: mwhere
            say: kendini ve zaten aldıklarını çıkar,
            code: "WHERE o <> me AND NOT (me)-[:BOUGHT]->(rec)"
            name: Ne elensin?
            note: >-
              İki eleme: yolu senin üzerinden geri dönen kendini sayma, ve senden rec'e zaten bir BOUGHT kenarı varsa o
              ürünü önerme. Simülasyonda üstü çizilen ürünler bu satır yüzünden elendi.
            hl: exclude
            tag: sadece sağdaki sorguda var
          - id: mret
            say: her ürünü kaç farklı müşteri almış say ve en çok paylaşılan 6 ürünü getir.
            code: "RETURN rec, count(DISTINCT o) AS score ORDER BY score DESC LIMIT 6"
            name: Nasıl sıralansın?
            note: "Soldakiyle aynı sayma: her adaya kaç ayrı müşteriden (o) ulaşıldı."
            hl: result
        columns:
          - label: Bu ürüne göre (2 hop)
            sub: Sayfa ilk açıldığında giden sorgu.
            parts: [pstart, pback, pfwd, pwhere, pret]
          - label: Sana göre (3 hop)
            sub: Senin "For my persona" tıklamanla giden sorgu.
            parts: [mstart, mback, mfwd, mwhere, mret]
            mark: [mwhere]
        note: >-
          Dikkat: iki sorguda da "tabloyu tara" diyen bir şey yok. Sorgu bir yol çiziyor ve Neptune o yolu başlangıç
          düğümünden takip ediyor. Sağdaki sorgunun farkı başlangıç noktası (ürün yerine sen), bir hop fazlası ve senin
          aldıklarını eleyen NOT (me)-[:BOUGHT]->(rec) parçası.
      remember: >-
        İlişkiler üzerinden giden sorularda ("benim gibi alanlar ne aldı?") graf veritabanı yolu doğrudan takip eder.
        Bir hop eklemek sorguya bir parça eklemek kadar kolaydır.
      why_db: >-
        Neden Neptune? Aynı soruyu ilişkisel bir veritabanında sorsaydık her hop, büyük bir alımlar tablosuna bir JOIN
        daha demek olurdu; 3 hop, aynı tabloya 3 kez JOIN. Neptune kenarları düğümlerin yanında tutar ve sadece
        başlangıç noktasının çevresini okur. Bedeli: toplamlar, raporlar ve sıradan tablo işleri için uygun değildir;
        satış raporu gibi işler başka bir veritabanında yapılır.

  - page: product
    path: /p/P0001
    engines: [dynamodb]
    use_case: Alışveriş sepeti
    title: Ürünü sepete ekle
    why: >-
      Sepet DynamoDB adlı veritabanında duruyor. Senin sepetin, içinde ürün kartları olan bir çekmece gibi: çekmecenin
      etiketi senin tarayıcının kimliği (pk = CART#…), her kart da sepetteki bir ürün (sk = ITEM#P0001). DynamoDB bir
      ürünü bulmak için bu iki etikete bakar, başka hiçbir şeyi taramaz.
    do: Aydınlık "Add to cart" (sepete ekle) butonuna tıkla. Adet 1 kalsın.
    target: "#add"
    action: click
    wait: {method: POST, path: /dynamodb/api/cart/items}
    focus: "#add-msg"
    result: >-
      DynamoDB sepetine 1 adet yazdı. Yazma tek komutla yapıldı (UpdateItem, ADD qty): ürün sepette yoksa oluşturuldu,
      varsa adedi 1 arttı. Aşağıdaki satır bu yazmanın süresini ve harcadığı yazma birimini (WRU) gösteriyor. Bu 1 adet,
      sonraki iki adımda kuralı denemek için gerekli.

  - page: product
    path: /p/P0001
    engines: [dynamodb]
    use_case: Koşullu yazma
    title: Kuralı bozacak bir yazma hazırla
    why: >-
      Sepet kuralı: bir üründen en fazla 5 adet. Az önceki adımda sepete 1 adet ekledin. Şimdi 5 adet daha eklemeyi
      deneyeceğiz; bu, toplamı 6 yapar ve kuralı bozar.
    do: Aydınlık adet (quantity) kutusuna 5 yaz.
    target: "#qty"
    action: type
    wait: {value: "5"}

  - page: product
    path: /p/P0001
    engines: [dynamodb]
    use_case: Koşullu yazma
    title: Bir koşul kötü bir yazmayı durdurur
    why: >-
      Sepet DynamoDB adlı veritabanında duruyor. Sayfa "5 adet ekle" derken yanına bir koşul da koyuyor: "sadece toplam 5'i
      geçmeyecekse yaz". Bu, bir kapı görevlisine benzer: kontrol eder ve uygun değilse içeri almaz. Kontrol ve yazma tek
      hamlede yapılır.
    do: Aydınlık "Add to cart" (sepete ekle) butonuna tıkla. Üstteki "Limit 5 per product" kutusu işaretli kalsın.
    target: "#add"
    action: click
    wait: {method: POST, path: /dynamodb/api/cart/items, body: {qty: "5"}}
    focus: "#add-msg"
    panel:
      need: >-
        Sepete "5 adet daha" yazılmadan önce mevcut adedin kontrol edilmesi gerekiyor. Bunu uygulama yapsaydı, önce
        okuyup sonra yazması gerekirdi; aynı anda iki sekmeden ekleme yapılırsa ikisi de eski değeri görüp kuralı
        aşabilirdi. Kontrolün veritabanının içinde, yazmayla aynı anda yapılması gerekiyor.
      concept:
        term: Koşullu yazma (ConditionExpression)
        text: >-
          DynamoDB'ye bir yazma gönderirken yanına bir koşul ekleyebilirsin. DynamoDB önce koşulu, item'ın o anki
          değerine bakarak kontrol eder. Koşul doğruysa yazar, yanlışsa hiçbir şey yazmaz ve "koşul tutmadı" der. Kontrol
          ile yazma tek bir adımdır, arada başka bir yazma araya giremez. Item, DynamoDB'de bir kayıt (bir satır) demek.
        terms:
          - [Item, "DynamoDB'deki tek bir kayıt. Burada sepetindeki bir ürün."]
          - ["pk + sk (anahtar)", "Item'ı bulmanın adresi. pk sepetin (CART#…), sk sepetteki ürün (ITEM#P0001)."]
          - [WRU, "Write request unit: DynamoDB'de yazma başına ödenen birim. Reddedilen koşullu yazma da 1 WRU harcar."]
      sim:
        kind: condition-write
        caption: >-
          Sepet tablosundan örnek bir kesit: üç ziyaretçinin sepetindeki altı item. Senin sepetinde Kablosuz Kulaklık'tan
          1 adet var. Solda senin isteğin (koşullu), sağda aynı istek koşulsuz gitseydi ne olurdu.
        add: 5
        max: 5
        labels: {cond: Koşulla (senin isteğin), free: Koşulsuz ("Limit" kutusu kapalı olsaydı)}
        rows:
          - {pk: "CART#7f3a…", sk: ITEM#P0001, name: Kablosuz Kulaklık, qty: 1, target: true}
          - {pk: "CART#7f3a…", sk: ITEM#P0131, name: Mekanik Klavye, qty: 2}
          - {pk: "CART#c41e…", sk: ITEM#P0021, name: Akıllı Saat, qty: 1}
          - {pk: "CART#c41e…", sk: ITEM#P0066, name: Powerbank, qty: 3}
          - {pk: "CART#09bd…", sk: ITEM#P0105, name: Deri Ceket, qty: 1}
          - {pk: "CART#09bd…", sk: ITEM#P0176, name: Bluetooth Hoparlör, qty: 4}
        summary: >-
          İki istek de aynı item'ı aynı anahtarla, tek okumada buldu. Fark tek bir şey: koşul. Koşul olunca DynamoDB
          kuralı kendisi korudu; koşul olmasa sepete 6 adet yazılırdı.
      live:
        title: Gerçek tabloda ne oldu?
        intro: Senin tıklamanla DynamoDB'ye giden gerçek istek ve cevabı.
        runs:
          - label: Senin isteğin (koşullu)
            trigger: true
            metrics: [[Sonuç, data.refused, {set: "Reddedildi ✗", empty: "Yazıldı ✓"}], [Kapasite, capacity], [Süre, ms]]
        reading: >-
          DynamoDB koşulu kontrol etti ve yazmayı reddetti; sepetinde hâlâ 1 adet var. Ekrandaki kırmızı mesaj bu
          reddin sonucu. Reddedilen yazma da 1 WRU harcadı: DynamoDB kontrol için item'ı okumak zorundaydı. Sonuç
          "Yazıldı" görünüyorsa sepetinde bu üründen hiç yoktu: önceki adımı (sepete 1 adet ekleme) atlamış olabilirsin.
      query:
        title: Sayfa DynamoDB'ye ne dedi?
        intro: >-
          İki sütun, simülasyondaki iki tarafın komutu. Solda senin gönderdiğin koşullu komut, sağda "Limit" kutusu
          kapalıyken gidecek komut. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: key
            say: Bu sepetteki bu ürünün item'ını bul,
            code: "table.update_item(Key={'pk': 'CART#7f3a…', 'sk': 'ITEM#P0001'},"
            name: Hangi item?
            note: >-
              Anahtar: pk senin sepetin, sk sepetteki ürün. DynamoDB anahtarla item'a doğrudan gider; tabloyu taramaz.
            hl: key
          - id: upd
            say: adedine 5 ekle, adını, fiyatını ve silinme zamanını yaz,
            code: "UpdateExpression='ADD qty :q SET #n = :n, unit_price = :p, expires_at = :e',"
            name: Ne yazılsın?
            note: >-
              ADD qty :q adedi :q (5) kadar artırır; item yoksa 5 ile oluşturur. SET diğer alanları yazar. expires_at,
              sepetin 24 saat sonra kendiliğinden silinme zamanıdır (TTL).
            hl: add
            indent: 2
          - id: cond
            say: "ama sadece item yoksa ya da adedi 0'dan fazla değilse,"
            code: "ConditionExpression='attribute_not_exists(qty) OR qty <= :max',"
            name: Hangi koşulla?
            note: >-
              Koşul. attribute_not_exists(qty): sepette bu ürün hiç yoksa yaz. qty <= :max: varsa, adedi :max'ı
              geçmiyorsa yaz. Uygulama :max'ı 5 − 5 = 0 olarak gönderdi; senin adedin 1, yani koşul tutmadı.
            hl: cond
            indent: 2
            tag: sadece soldaki komutta var
          - id: cap
            say: ve ne kadar kapasite harcandığını da söyle.
            code: "ReturnConsumedCapacity='TOTAL')"
            name: Ek bilgi
            note: DynamoDB'den bu isteğin kaç birim harcadığını cevapta geri istemek. Paneldeki "Kapasite" sayısı buradan geliyor.
            hl: result
            indent: 2
        columns:
          - label: Koşulla (senin isteğin)
            sub: Senin "Add to cart" tıklamanla giden komut ("Limit 5 per product" işaretli).
            parts: [key, upd, cond, cap]
            mark: [cond]
          - label: Koşulsuz
            sub: '"Limit 5 per product" kutusu kapalıyken gidecek komut.'
            parts: [key, upd, cap]
        note: >-
          Dikkat: kural "en fazla 5" ama komutta 5 yazmıyor, 0 yazıyor. Uygulama koşulu "şimdiki adet + eklenecek ≤ 5"
          yerine "şimdiki adet ≤ 5 − eklenecek" olarak gönderiyor, çünkü DynamoDB koşulda item'ın şimdiki değerine bakar.
          Sağdaki komutun tek farkı ConditionExpression parçasının olmaması: DynamoDB bu durumda hiçbir şeyi kontrol etmez.
      remember: >-
        Bir kuralı korumak için önce okuyup sonra yazma; kuralı yazmanın içine koşul olarak koy. Kontrol ve yazma tek
        adımda olunca, aynı anda gelen iki istek kuralı birlikte aşamaz.
      why_db: >-
        Neden DynamoDB? Sepet, ziyaretçi başına küçük ve çok sık değişen bir veri. DynamoDB bunu anahtarla, her ölçekte
        birkaç milisaniyede okur ve yazar; koşullu yazma ve TTL'yi kendisi sunar. Bedeli: anahtarı bilmeden esnek
        sorgu yapamazsın ve tablo, hangi sorular sorulacağına göre önceden tasarlanır.

  # ---------------------------------------------------------------- Cart: DynamoDB
  - page: cart
    path: /cart
    engines: [dynamodb]
    use_case: Read consistency
    title: Read the cart for half the cost
    why: >-
      A strongly consistent read returns the last write. An eventually consistent read can be a moment behind, and it costs half the read capacity.
    do: Click the lit button "Eventually consistent".
    target: "#exp-consistent [data-value=false]"
    action: click
    wait: {method: GET, path: /dynamodb/api/cart, query: {consistent: "false"}}
    focus: "#cart"
    result: The Query used half the read request units (RRU). Checkout still reads the cart strongly consistent, because the order must have the last quantity.

  - page: cart
    path: /cart
    engines: [dynamodb]
    use_case: Burst traffic
    title: A burst of shoppers
    why: >-
      On-demand mode needs no capacity plan. The simulation writes from 200 synthetic shoppers in parallel.
    do: Click the lit button "Start the simulation".
    target: "#sim-run"
    action: click
    wait: {method: POST, path: /dynamodb/api/simulate, any: true}
    focus: "#sim-out"
    result: Look at the writes per second and the latency percentiles. If the simulation limit refused the run, the note names the limit.

  # ---------------------------------------------------------------- Deals: ElastiCache
  - page: deals
    path: /deals
    engines: [elasticache]
    use_case: Atomic counter
    title: Buy one piece with DECR
    why: >-
      The stock is one integer key. DECR lowers it by one and returns the new value in one atomic command.
    do: Click the lit button "Buy one now".
    target: "#buy"
    action: click
    wait: {method: POST, path: /elasticache/api/deal/buy}
    focus: "#deal"
    result: DECR returned the new stock. No other command can run between the read and the write, because they are one command.

  - page: deals
    path: /deals
    engines: [elasticache]
    use_case: Yarış durumu
    title: Güvensiz yolu seç
    why: >-
      Fırsat ürününün stoğu ElastiCache'te bellekte duran bir sayaç. "Önce oku, sonra yaz" yolunda her alıcı önce stoğu
      okur, sonra bir eksiğini yazar. Aynı anda iki alıcı aynı değeri okuyabilir.
    do: Aydınlık "Read, then write" (önce oku, sonra yaz) butonuna tıkla.
    target: "#exp-mode [data-value=naive]"
    action: click
    wait: {click: true}

  - page: deals
    path: /deals
    engines: [elasticache]
    use_case: Yarış durumu
    title: İzdihamı başlat
    why: >-
      Şimdi 300 alıcı aynı anda 10 parçalık stoğu almaya çalışacak. Bu bir yarış: herkes aynı sayaca aynı anda
      koşuyor. Kazananı belirleyen şey, sayacın nasıl azaltıldığı.
    do: Aydınlık "Start the rush" (izdihamı başlat) butonuna tıkla.
    target: "#sim-run"
    action: click
    wait: {method: POST, path: /elasticache/api/deal/simulate, body: {mode: naive}, any: true}
    focus: "#sim-out"
    panel:
      need: >-
        Fırsat ürününün stoğu sınırlı ve çok kişi aynı anda almak istiyor. Stoktan fazla satılmaması gerekiyor: 10 parça
        varsa tam 10 kişi almalı. Sorun şu: "stoğu oku, 0'dan büyükse bir eksiğini yaz" iki ayrı adım ve iki adımın
        arasında başka alıcılar da okuyabiliyor.
      concept:
        term: Yarış durumu (race condition) ve atomik işlem
        text: >-
          Bir dükkânda tek bir ürün kalmış ve iki satıcı aynı anda rafa bakıp "bir tane var" diyor. İkisi de ürünü
          satıyor ama rafta sadece bir tane var. Buna yarış durumu denir. Çözüm, bakmak ve almak işini tek hamlede yapmak:
          buna atomik işlem denir. ElastiCache'in (Valkey) DECR komutu sayacı tek hamlede azaltır ve yeni değeri söyler.
          Valkey komutları tek tek sırayla çalıştırdığı için iki DECR asla aynı değeri göremez.
        terms:
          - [GET / SET, "GET sayacı okur, SET sayaca bir değer yazar. İki ayrı komut."]
          - [DECR, "Sayacı 1 azaltır ve yeni değeri döndürür. Okuma ve yazma tek komut."]
          - [ElastiCache (Valkey), "Veriyi bellekte tutan, mikrosaniyeler içinde cevap veren anahtar-değer veritabanı."]
      sim:
        kind: race
        caption: >-
          Küçük bir örnek: 3 parçalık stok ve 6 alıcı. Gerçek denemede 300 alıcı ve 10 parça var; burada her adımı
          görebilmen için sayılar küçük. Alıcılar ikişer ikişer neredeyse aynı anda geliyor.
        key: lm:sim
        stock: 3
        buyers: [Ayşe, Mert, Elif, Lukas, Zeynep, Can]
        tick_ms: 1100
        labels: {naive: '"Önce oku, sonra yaz" (senin seçtiğin)', atomic: Atomik DECR}
      live:
        title: Gerçek izdihamda ne oldu?
        intro: >-
          Senin başlattığın gerçek deneme iki tur çalıştı: önce "önce oku, sonra yaz" yoluyla, hemen ardından aynı alıcı
          ve stok sayısıyla atomik DECR ile. İki tur da ElastiCache'te geçici bir sayaçla çalışır, gerçek stoğa dokunmaz.
        runs:
          - label: '"Önce oku, sonra yaz" (senin denemen)'
            trigger: true
            metrics: [[Alıcı, data.buyers], [Stok, data.stock], [Satılan, data.winners], [Fazla satış, data.oversold], ["Süre (p50, ms)", data.p50_ms]]
          - label: Atomik DECR (aynı denemede)
            trigger: true
            metrics: [[Alıcı, data.buyers], [Stok, data.stock], [Satılan, data.atomic.winners], [Fazla satış, data.atomic.oversold], ["Süre (p50, ms)", data.atomic.p50_ms]]
        reading: >-
          Atomik DECR tam stok kadar sattı ve fazla satış 0. "Önce oku, sonra yaz" yolunda alıcılar okuma ile yazma
          arasında birbirinin değerini ezdi ve stoktan fazla satıldı; fazla satış sayısı her denemede değişir, çünkü kimin
          ne zaman araya girdiği şansa bağlı. Süre (p50), alıcıların yarısının bu süreden kısa sürede cevap aldığı süredir
          (milisaniye). Güvensiz yol okuma ile yazma arasında uygulama işi yaptığı için daha yavaştır.
      query:
        title: Uygulama ElastiCache'e ne dedi?
        intro: >-
          Simülasyondaki iki tarafın komutları. Solda her alıcının gönderdiği iki ayrı komut, sağda tek komut. Bir
          parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: get
            say: Sayacı oku,
            code: v = GET lm:sim
            name: 1. komut
            note: Sayacın o anki değerini oku. Bu cevap yola çıktığı an eskimeye başlar; başka alıcılar sayacı değiştirebilir.
            hl: get
          - id: work
            say: biraz iş yap,
            code: "# ... uygulama işi (1–4 ms)"
            name: Arada
            note: >-
              Gerçek bir uygulama okuma ile yazma arasında iş yapar (ödeme kontrolü gibi). Denemede bu 1–4 ms'lik bir
              bekleme. Yarış tam bu aralıkta olur.
            hl: naive
          - id: set
            say: 0'dan büyükse bir eksiğini yaz.
            code: "if v > 0: SET lm:sim v-1"
            name: 2. komut
            note: >-
              Okunan değerin bir eksiğini yaz. Bu arada başka bir alıcı da aynı v'yi okuduysa, ikisi de aynı değeri yazar:
              iki satış olur, sayaç bir azalır.
            hl: set
          - id: decr
            say: Sayacı tek hamlede bir azalt ve yeni değeri söyle; sonuç 0 veya üstüyse satın aldın.
            code: "DECR lm:sim   → sonuç >= 0 ise kazandın"
            name: Tek komut
            note: >-
              DECR okuma ve yazmayı tek komutta yapar. Valkey komutları sırayla çalıştırır, bu yüzden her alıcı farklı bir
              sonuç görür: 2, 1, 0, sonra −1, −2... Eksi sonuç "parça kalmadı" demek.
            hl: decr
        columns:
          - label: '"Önce oku, sonra yaz"'
            sub: Senin "Read, then write" seçip "Start the rush" tıklamanla giden komutlar (her alıcı için).
            parts: [get, work, set]
          - label: Atomik DECR
            sub: '"Atomic DECR" seçiliyken giden komut (her alıcı için).'
            parts: [decr]
        note: >-
          Dikkat: soldaki iki komut tek tek doğru çalışıyor; hata komutlarda değil, aralarındaki boşlukta. ElastiCache
          her komutu doğru yaptı, ama iki komutun arasında başka alıcıların komutları da çalıştı. Sağdaki tek komutta
          böyle bir boşluk yok.
      remember: >-
        Bir değeri okuyup ona göre yazıyorsan, araya başkası girebilir. Sayaç gibi paylaşılan bir değeri tek bir atomik
        komutla (DECR, INCR) değiştir; okuma ile yazma arasında boşluk bırakma.
      why_db: >-
        Neden ElastiCache? Fırsat stoğu çok sayıda kişinin aynı anda okuduğu ve değiştirdiği küçük bir değer. ElastiCache
        bunu bellekte tutar, mikrosaniyeler içinde cevap verir ve DECR gibi atomik komutları hazır sunar. Bedeli: veri
        bellekte durur; kalıcı kayıt (siparişin kendisi) Aurora gibi bir veritabanına yazılır.

  - page: deals
    path: /deals
    engines: [elasticache]
    use_case: Session with TTL
    title: Make the session short-lived
    why: Your session is a hash with a time to live (TTL). Valkey deletes the key when the TTL gets to zero.
    do: Select a TTL in the lit list.
    target: "#ttl"
    action: change
    wait: {change: true}

  - page: deals
    path: /deals
    engines: [elasticache]
    use_case: Session with TTL
    title: Write the session with its TTL
    why: The button writes the session hash and sets its expiry.
    do: Click the lit button that refreshes the session.
    target: "#ttl-set"
    action: click
    wait: {method: POST, path: /elasticache/api/session, body: {ttl: "*"}}
    focus: "#session"
    result: HSET wrote the fields, and EXPIRE set the TTL. Each read shows a smaller TTL. The app needs no cleanup job.

  # ---------------------------------------------------------------- Checkout: Aurora and the fan-out
  - page: checkout
    path: /checkout
    engines: [aurora]
    use_case: Transaction rollback
    title: Make the payment fail
    why: >-
      Aurora PostgreSQL writes the order in one transaction. If one step fails, ROLLBACK cancels all the steps.
    do: Tick the lit check box "Make the payment fail".
    target: "#exp-fail"
    action: click
    wait: {click: true}

  - page: checkout
    path: /checkout
    engines: [aurora]
    use_case: Transaction rollback
    title: Place the order and watch the rollback
    why: The stock UPDATE runs first. Then the payment step fails.
    do: Click the lit button "Place the order".
    target: "#place"
    action: click
    wait: {method: POST, path: /aurora/api/orders, body: {fail_after_stock: "true"}}
    focus: "#flow"
    result: The calls show BEGIN, the UPDATE of the stock, then ROLLBACK. No order row exists, the stock is back, and your cart did not change.

  - page: checkout
    path: /checkout
    engines: [aurora]
    use_case: One order, six Engines
    title: Let the payment succeed
    why: Now place a real order.
    do: Clear the lit check box.
    target: "#exp-fail"
    action: click
    wait: {click: true}

  - page: checkout
    path: /checkout
    engines: [aurora, dynamodb, elasticache, keyspaces, influxdb, neptune]
    use_case: One order, six Engines
    title: Place the order
    why: >-
      Aurora commits the order. Then five more Engines get an update: DynamoDB empties the cart, ElastiCache updates the leaderboard,
      Keyspaces records a purchase event, InfluxDB counts the order, and Neptune adds BOUGHT edges.
    do: Click the lit button "Place the order".
    target: "#place"
    action: click
    wait: {method: POST, path: /neptune/api/purchase}
    focus: "#flow"
    result: Six Engines stored the part of the order that each one is good at. Aurora holds the official order. The others hold copies or counters for their own job.

  - page: orders
    path: /orders
    engines: [aurora]
    use_case: JOIN on related tables
    title: Your orders come from three tables
    why: orders, order_items and products are separate tables. One SELECT with JOINs builds the list.
    do: Look at the lit list of your orders.
    target: "#orders"
    action: look
    wait: {method: GET, path: /aurora/api/orders}
    result: The query joins on order_id and product_id. Each join is a lookup by a primary key index.

  # ---------------------------------------------------------------- Activity: Keyspaces
  - page: activity
    path: /account/activity
    engines: [keyspaces]
    use_case: Event history
    title: Read the history of your persona
    why: Your persona has seeded history. Its events are in one partition, sorted by time.
    do: Click the lit button "My persona".
    target: "#exp-who [data-value=persona]"
    action: click
    wait: {method: GET, path: /keyspaces/api/activity, query: {who: persona}}
    focus: "#feed"
    result: Keyspaces read one partition, newest first, and stopped after the limit.

  - page: activity
    path: /account/activity
    engines: [keyspaces]
    use_case: Tunable consistency
    title: Read one replica for half the cost
    why: >-
      Keyspaces stores three replicas of each row. LOCAL_QUORUM reads two of them. LOCAL_ONE reads one replica, at half the read cost, and it can miss a very new write.
    do: Click the lit button "LOCAL_ONE".
    target: "#exp-cl [data-value=LOCAL_ONE]"
    action: click
    wait: {method: GET, path: /keyspaces/api/activity, query: {consistency: LOCAL_ONE}}
    focus: "#feed"
    result: The result is the same here, because nobody wrote to this partition in the last moment. The read cost is half.

  # ---------------------------------------------------------------- Reports: Redshift
  - page: reports
    path: /admin/reports
    engines: [redshift]
    use_case: Analytics on history
    title: Group the history by city
    why: >-
      Redshift stores each column in separate blocks. A report that groups revenue by city reads two columns, not the full rows.
    do: Click the lit button "City".
    target: "#exp-dim [data-value=city]"
    action: click
    wait: {method: GET, path: /redshift/api/report, query: {dim: city}}
    focus: "#chart-wrap"
    result: The SQL has GROUP BY city. Redshift scanned many rows but only the columns that the query needs.

  - page: reports
    path: /admin/reports
    engines: [redshift, aurora]
    use_case: Zero-ETL
    title: Read the live copy of Aurora
    why: The zero-ETL integration copies changes from Aurora to Redshift in near real time. You write no pipeline code.
    do: Click the lit button "Live from Aurora".
    target: "#exp-src [data-value=live]"
    action: click
    wait: {method: GET, path: /redshift/api/report, query: {source: live}}
    focus: "#chart-wrap"
    result: This query reads the Aurora tables that zero-ETL copied into Redshift. Your order from checkout is in it.

  - page: reports
    path: /admin/reports
    engines: [redshift, aurora]
    use_case: Zero-ETL
    title: How fresh is the copy?
    why: The status shows how long ago Redshift received the newest order.
    do: Click the lit button that refreshes the status.
    target: "#repl-refresh"
    action: click
    wait: {method: GET, path: /redshift/api/replication}
    focus: "#repl"
    result: Compare the time of your order with the time in Redshift. The difference is the replication lag.

  - page: order_report
    path: /admin/orders
    engines: [aurora]
    use_case: Query plan
    title: Read the query plan
    why: "EXPLAIN ANALYZE shows how PostgreSQL ran the report: the join order, the scans and the time of each step."
    do: Tick the lit check box that shows the plan.
    target: "#exp-explain"
    action: click
    wait: {method: GET, path: /aurora/api/report, query: {explain: "on"}}
    focus: "#plan-wrap"
    result: Each plan node shows rows and time. Large reports on the checkout database compete with checkout traffic. This is why the big reports run in Redshift.

  # ---------------------------------------------------------------- Live: ElastiCache sorted set
  - page: live
    path: /admin/live
    engines: [elasticache]
    use_case: Leaderboard
    title: A sorted set keeps the order at each write
    why: >-
      The leaderboard is a sorted set. Your checkout added the order total to your persona with ZINCRBY. ZREVRANGE returns the top members with no sort at read time.
    do: Look at the lit leaderboard.
    target: "#board"
    action: look
    wait: {method: GET, path: /elasticache/api/leaderboard}
    result: ZREVRANGE lm:leaderboard 0 9 WITHSCORES returned the top 10. ZCOUNT counted the Visitors active in the last 5 minutes.

  # ---------------------------------------------------------------- Ops: InfluxDB
  - page: ops
    path: /admin/ops
    engines: [influxdb]
    use_case: Time-series metrics
    title: One value per time window
    why: >-
      Each sensor reading is one point: a time, tags and a value. aggregateWindow calculates one mean per window. A larger window returns fewer points.
    do: Click the lit button "1 h".
    target: "#exp-win [data-value='1h']"
    action: click
    wait: {method: GET, path: /influxdb/api/series, query: {window: 1h}}
    focus: "#temp-wrap"
    result: The Flux query has range, filter and aggregateWindow. Fewer, smoother points came back. The raw points stay in the bucket.

  # ---------------------------------------------------------------- Graph: Neptune
  - page: graph
    path: /admin/graph
    engines: [neptune]
    use_case: Relationship analysis
    title: The neighbourhood of a customer
    why: Lukas Weber buys books only. Other customers bought the same books. A graph query follows edges. It does not join tables.
    do: Select "Lukas Weber" in the lit list.
    target: "#who"
    action: change
    wait: {method: GET, path: /neptune/api/graph, query: {persona: C00004}}
    focus: "#graph"
    result: The graph shows Lukas, his books, and other buyers of the same books.

  # ---------------------------------------------------------------- Seller: S3
  - page: seller
    path: /seller
    engines: [s3]
    use_case: Private files, direct download
    title: A presigned URL
    why: >-
      The bucket is private. The Engine App signs a URL with its IAM role. The browser then downloads the object from S3 itself, and the bytes do not go through EC2.
    do: Click the lit button "Presigned URL, straight from S3".
    target: "#via-presign"
    action: click
    wait: {method: GET, path: /s3/api/presign/*}
    focus: "#direct"
    result: The URL host is the S3 endpoint. The query string has X-Amz-Signature and X-Amz-Expires.

  - page: seller
    path: /seller
    engines: [s3]
    use_case: Object storage
    title: Upload an image as an object
    why: S3 stores each file as an object with a key, the bytes and metadata. Versioning keeps the old version when you upload to the same key again.
    do: In the lit form, select a small JPEG or PNG file, then click "Upload".
    target: "#upload"
    action: click
    wait: {method: POST, path: /s3/api/upload}
    focus: "#gallery-wrap"
    result: PutObject stored your file with its metadata and returned a new version ID. The uploads/ list shows the object.
