# Mission of the Guided e-commerce app (static/js/mission.js, coach marks and the "Perde arkası" panel). Turkish, 101 level.
# Each step: page (page id), path (shop path; the app base goes in front), engines, use_case, title,
#   why (the idea before the action), do (one instruction), target (CSS selector of the ONE control that is lit),
#   action: click | look | type | change,
#   wait: the Engine call that completes the action {method, path ("*" at the end = prefix), query, body ("*" = any value), any}
#         or {click: true} / {change: true} / {value: "5"} for a control with no Engine call,
#   focus (selector that is lit after the action: the result), result (the "Behind the scenes" text),
#   panel: the "Perde arkası" panel (see static/js/mission.js). Steps with no panel show `result` in the small card.
finish_url: /e2etutorial
steps:
  # ---------------------------------------------------------------- Home: DocumentDB, ElastiCache
  - page: home
    path: /
    engines: [docdb]
    use_case: Ürün kataloğu
    title: Kategori kutuları tek bir gruplama sorgusundan gelir
    why: >-
      Mağazanın ana sayfasındasın. Ortadaki kutular her kategoride kaç ürün olduğunu ve en ucuz fiyatı gösteriyor. Bu
      sayılar elle yazılmadı: sayfa açılırken veritabanı 200 ürünü saydı. Bu adımda tıklama yok, sadece bakacaksın.
    do: Aydınlık "Categories" (kategoriler) kutularına bak. Sonra kartın altındaki butonla perde arkasını aç.
    target: "#cats"
    action: look
    wait: {method: GET, path: /docdb/api/home}
    result: The pipeline has a $group stage. DocumentDB counted the documents of each category and sent only the counts and the lowest prices to the app.
    panel:
      need: >-
        Ana sayfa her kategori için iki sayı gösteriyor: kaç ürün var ve en ucuzu kaç lira. Katalogda 200 ürün var ve her
        ziyaretçi ana sayfayı açıyor. Bu sayıları her seferinde 200 ürünü tek tek uygulamaya taşıyıp orada saymak hem yavaş
        hem israf olurdu. Saymanın, verinin durduğu yerde yapılması gerekiyor.
      concept:
        term: Doküman ve aggregation (gruplama)
        text: >-
          DocumentDB her ürünü bir doküman olarak saklar: ürünün bütün bilgisi, JSON biçiminde tek bir kayıtta. Aggregation,
          veritabanına bir "tarif" göndermektir: "dokümanları kategoriye göre grupla, her grupta say, en düşük fiyatı bul".
          Bunu bir kütüphane görevlisine benzetebilirsin: kitapları sana tek tek getirmez, rafların başına bakar ve "Roman
          rafında 40 kitap var" diye sadece sonucu söyler. Tarifin adımlarına stage (aşama) denir; burada iki aşama var:
          $group ve $sort.
        terms:
          - [Doküman, "Bir ürünün bütün bilgisi, JSON biçiminde tek bir kayıt. Burada her ürün bir doküman."]
          - [Koleksiyon, "Aynı türden dokümanların durduğu yer. Burada adı products; 200 doküman var."]
          - [$group, "Dokümanları bir alana göre gruplayan ve her grupta hesap (sayma, en küçük, toplam) yapan aşama."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde katalog ve özet sorguları için hazırlık
        intro: >-
          Ana sayfa hiç açılmadan, katalog koleksiyonu ve sayfanın özet sorusu hazırlanır. Aşağıdaki beş adım bu hazırlığın
          sırasıdır.
        text:
          - title: Önce sayfanın soruları yazılır
            text: >-
              Ana sayfanın iki sorusu var: "her kategoride kaç ürün var ve en ucuzu kaç?" (özet) ve "puanı en yüksek 8
              ürün" (vitrin). Özet sorusu bir aggregation, vitrin sorusu sıralı bir find olur.
            code: |-
              db.products.aggregate([ { $group: { _id: "$category", products: { $sum: 1 }, from_price: { $min: "$price" } } },
                                      { $sort: { _id: 1 } } ])
          - title: Her ürün tek bir doküman olur
            text: >-
              Ürünler farklı yapıda bilgi taşır: kulaklığın pil süresi, ceketin bedeni. Ortak alanlar (ad, kategori, fiyat,
              puan) her dokümanda aynı adla durur; farklı olanlar attributes altında toplanır. Gruplama ve filtreleme ortak
              alanlar üzerinden yapılır.
            code: |-
              { _id: "P0021", name: "Akıllı Saat", category: "Elektronik", price: 1299.90, rating: 4.8,
                attributes: { renk: "siyah", garanti_ay: 24 }, tags: ["yeni"] }
          - title: Gruplama sunucuda yapılır
            text: >-
              Sayma, en küçük ve toplam gibi hesaplar veritabanında, aggregation ile yapılır; uygulamaya sadece sonuç gider.
              Aggregation'ın başına bir $match konursa (ör. sadece stokta olanlar) önce bir index'le eleme yapılır, sonra
              gruplanır.
          - title: Çok okunan özet önbelleğe alınabilir
            text: >-
              Kategori sayıları dakikalar içinde pek değişmez ama her ziyarette sorulur. Katalog çok büyüdüğünde bu sonuç
              birkaç dakikalığına bellekte (ör. ElastiCache) tutulur ya da ürün eklenip silindikçe güncellenen küçük bir özet
              dokümanına yazılır.
          - title: Plan ve süre izlenir
            text: >-
              Aggregation'ın planı explain ile görülür. Katalog büyüdükçe süre izlenir; özet sorgusu yavaşlarsa önbellek ya
              da özet dokümanı devreye alınır.
            code: |-
              db.products.explain("executionStats").aggregate([ … ])
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Katalog yönetimi: ürün ekleyen, fiyat ve stok güncelleyen arka ofis ekranları ya da tedarikçi dosyalarını aktaran bir
          iş. Hepsi uygulama üzerinden yazar.
        reads: Uygulama, mağaza sayfaları için (ana sayfa, kategori, ürün sayfası).
        kind: >-
          Uygulama orkestrasyonu. DocumentDB başka bir veritabanından kendiliğinden veri çekmez. Kendi değişikliklerini ise
          change streams ile dışarı verebilir.
        with: >-
          Ana sayfa tek bir veritabanıyla çalışmaz: fırsat kutusu bellekte duran bir veritabanından (ElastiCache), ürün
          görselleri nesne deposundan (S3, büyük sistemlerde bir CDN ile), "son baktıkların" şeridi bir olay tablosundan
          (Keyspaces) gelir. Hepsini aynı sayfada tarayıcı birleştirir; her bölüm kendi isteğiyle gelir.
        best: >-
          Katalog tek yerde tutulur, diğer sistemler oradan beslenir. Ana sayfa gibi çok okunan bir sayfada her bölüm ayrı
          istekle ve birbirini beklemeden yüklenir; biri yavaşlarsa diğerleri gecikmez.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, ana sayfa açılırken gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda
          çalışan veritabanları var.
        steps:
          - text: >-
              Mağazaya girdin ve bir müşteri seçtin (ör. Ayşe Yılmaz). Şifreyle giriş yok: tarayıcın iki çerez taşıyor.
              lm_visitor bu tarayıcının kimliği, lm_persona seçtiğin müşteri.
          - text: >-
              Ana sayfa açılır açılmaz arka planda oturum kaydın oluşturuldu: hangi müşteri olduğun ve hangi sayfada olduğun,
              30 dakikalık bir süreyle bellekte.
            engines: [elasticache]
          - text: >-
              Aynı anda tarayıcın uygulamaya "ana sayfanın verisini ver" dedi. Uygulama DocumentDB'ye iki komut gönderdi: bir
              aggregation (kategori kutuları) ve bir find (puanı en yüksek 8 ürün). Simülasyon ilk komutu gösteriyor.
            engines: [docdb]
          - text: >-
              Kutular çizildi: her kategori için ürün sayısı ve "from ₺…" fiyatı. Vitrin kartlarının adı ve fiyatı da
              DocumentDB'den geldi; görselleri her kart için ayrı bir istekle S3'ten.
            engines: [docdb, s3]
          - text: >-
              Sayfanın üstündeki fırsat kutusu ayrı bir istekle bellekten (ElastiCache) geldi. Daha önce ürünlere baktıysan
              "Recently viewed" şeridi de Keyspaces'ten geldi.
            engines: [elasticache, keyspaces]
      sim:
        kind: doc-group
        caption: >-
          Gerçek katalogdan 9 ürünlük bir kesit (üç kategoriden üçer ürün; her kategorinin en ucuzu dahil). Gerçek katalogda
          5 kategori ve her birinde 40 ürün var. Solda gerçekte olan: DocumentDB dokümanları okurken grupluyor. Sağda olsaydı ne
          olurdu: bütün dokümanlar uygulamaya taşınıp orada sayılsaydı; o istek gönderilmedi. Üstteki etiketler o anda işi
          kimin yaptığını gösterir.
        labels:
          server: "t0 · Sayfa açılınca · DocumentDB'de grupla ($group)"
          client: "Olsaydı · Hepsini uygulamaya çek, orada say"
        send_server: >-
          Ana sayfayı açtın. Tarayıcın "ana sayfanın verisini ver" dedi; uygulama DocumentDB'ye aggregation tarifini
          gönderiyor: kategoriye göre grupla, say, en düşük fiyatı bul, ada göre sırala.
        back_server: >-
          Uygulama gelen kategori satırlarını tarayıcına gönderdi. Tarayıcın kutuları çizecek; her kutu bir satır.
        send_client: >-
          Olsaydı: uygulama bütün ürünleri isterdi (filtresiz find, sadece kategori ve fiyat alanları).
        back_client: >-
          Uygulama kendi saydığı sonucu tarayıcına gönderirdi. Sonuç aynı, ama 200 ürünlük gerçek katalogda 200 doküman
          ağdan geçerdi.
        rows:
          - {id: P0009, name: Nordwind Python ile Veri 9, category: Kitap, price: 101.43}
          - {id: P0068, name: Anadolu Spor Çantası 68, category: Spor, price: 495.48}
          - {id: P0084, name: Anadolu Algoritmalar 84, category: Kitap, price: 397.42}
          - {id: P0090, name: Kapadokya Sırt Çantası 90, category: Moda, price: 81.52}
          - {id: P0113, name: Kapadokya Dambıl Seti 113, category: Spor, price: 194.94}
          - {id: P0119, name: Anadolu Algoritmalar 119, category: Kitap, price: 590.12}
          - {id: P0130, name: Nordwind Yün Kazak 130, category: Moda, price: 291.71}
          - {id: P0143, name: Alpen Koşu Ayakkabısı 143, category: Spor, price: 478.65}
          - {id: P0175, name: Anadolu Yün Kazak 175, category: Moda, price: 601.17}
        summary: >-
          Sonuç iki yolda da aynı: Kitap 3 · ₺101,43, Moda 3 · ₺81,52, Spor 3 · ₺194,94. Fark, ağdan geçen veride: solda 3 küçük
          satır, sağda 9 dokümanın hepsi. Gerçek katalogda bu fark 5 satıra karşı 200 doküman olur.
      wire:
        what: >-
          Uygulama, DocumentDB'ye açık tuttuğu bağlantılar üzerinden komutu gönderir (pymongo kütüphanesi). Bağlantılar her
          istekte yeniden kurulmaz.
        dst: "dbws-docdb.cluster-ccgs3qxfidad.eu-central-1.docdb.amazonaws.com : 27017"
        dst_note: >-
          DocumentDB cluster'ının adresi. Okuma tercihi "secondaryPreferred" olduğu için bu okuma replica'ya gider. Cluster
          internete kapalı veri alt ağında duruyor.
        rows:
          - [Şifreleme, TLS, gerçek, DocumentDB'nin sertifikası AWS'nin sertifika dosyasıyla kontrol edilir.]
          - [Protokol, MongoDB wire protokolü (OP_MSG), gerçek, "MongoDB sürücülerinin konuştuğu ikili dil. DocumentDB bu dili anlar."]
          - [Kimlik, "Kullanıcı adı + şifre, bağlantı açılırken", gerçek, "Şifre kodda yazmaz; uygulama onu çalışırken AWS Secrets Manager'dan alır."]
        body_label: Çerçevenin içeriği (okunur hâle getirilmiş)
        body: |-
          OP_MSG   veritabanı: shop
          { aggregate: "products",
            pipeline: [ { $group: { _id: "$category", products: { $sum: 1 }, from_price: { $min: "$price" } } },
                        { $sort: { _id: 1 } } ],
            cursor: {},
            $readPreference: { mode: "secondaryPreferred" } }
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Mor etiketli
        satırda bir şey bir yerden bir yere gider; gri "Uygulamanın içinde" etiketli satırda iş uygulamanın kendi içinde
        yapılır, hiçbir yere bir şey gitmez.
      app_code:
        - file: engines/docdb.py
          func: api_home
          title: Ana sayfa isteği
          sub: Sayfa açılırken gelen istek; iki komut gönderir.
          lines:
            - {match: '@bp.get("/api/home")', say: Ana sayfanın veri isteği buraya gelir., tag: Tarayıcı → Uygulama}
            - {match: 'pipeline = [{"$group":', say: "Gruplama tarifini hazırlar: kategoriye göre grupla, say, en düşük fiyatı bul; sonra ada göre sırala.", tag: Uygulamanın içinde, hl: group}
            - {match: 'cats = list(db().products.aggregate(pipeline))', say: "Tarif DocumentDB'ye gider; her kategori için bir satır döner.", tag: [Uygulama → DocumentDB, DocumentDB → Uygulama], hl: count}
            - {match: 'featured = [_doc(d) for d in db().products.find({"rating": {"$gte": 4.5}}', say: "İkinci komut: puanı 4,5 ve üstü olan en iyi 8 ürün (vitrin).", tag: [Uygulama → DocumentDB, DocumentDB → Uygulama]}
            - {match: 'return jsonify(trace.payload({"categories":', say: "Kategori satırlarının alan adlarını sayfanın beklediği adlara çevirir ve vitrinle birlikte tarayıcıya gönderir.", tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek katalogda ne oldu?
        intro: >-
          Ana sayfa açılırken DocumentDB'ye giden gerçek aggregation. Gerçek katalogda 200 ürün var.
        runs:
          - label: Kategori aggregation'ı (sayfa açılınca)
            trigger: true
            metrics: [[Dönen satır (kategori), items], [Süre, ms]]
        reading: >-
          200 doküman okundu ama uygulamaya sadece kategori sayısı kadar küçük satır döndü (her kategoride 40 ürün var).
          Süre her istekte biraz değişir. Katalog büyüdükçe okunan doküman sayısı artar; uygulamaya giden satır sayısı ise
          kategori sayısı kadar kalır.
      query:
        title: Sayfa DocumentDB'ye ne dedi?
        intro: >-
          İki sütun, simülasyondaki iki şeridin komutu. Solda gerçekten gönderilen aggregation, sağda "olsaydı" yolunun
          komutu. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: agg
            say: products koleksiyonundaki dokümanları
            code: "db.products.aggregate(["
            name: Nereden?
            note: "products, ürünlerin durduğu koleksiyon. aggregate, \"şu aşamalardan geçir\" demek."
            hl: table
          - id: grp
            say: kategoriye göre grupla,
            code: '  { $group: { _id: "$category",'
            name: Neye göre?
            note: "$group aşaması. _id, grubun anahtarı: her farklı category değeri bir grup olur. $ işareti \"bu alanın değeri\" demek."
            hl: group
          - id: cnt
            say: her grupta kaç doküman olduğunu say,
            code: "      products: { $sum: 1 },"
            name: Ne hesaplansın?
            note: "Her doküman için 1 ekle: grubun ürün sayısı. Sonuçta bu alanın adı products."
            hl: count
            indent: 2
          - id: mn
            say: en düşük fiyatı bul,
            code: '      from_price: { $min: "$price" } } },'
            name: Ne hesaplansın?
            note: Grubun en küçük price değeri. Kutudaki "from ₺…" bu sayı.
            hl: min
            indent: 2
          - id: srt
            say: sonra gruplar ada göre sırala.
            code: "  { $sort: { _id: 1 } } ])"
            name: Hangi sırayla?
            note: İkinci aşama. Grupları kategori adına göre A'dan Z'ye dizer. 1 küçükten büyüğe demek.
            hl: count
          - id: all
            say: products koleksiyonundaki bütün dokümanların kategori ve fiyatını getir.
            code: "db.products.find({}, { category: 1, price: 1 })"
            name: Olsaydı
            note: "Filtresiz find: {} \"hepsi\" demek. Her doküman ağdan uygulamaya gider; sayma işi uygulamaya kalır."
            hl: table
            tag: sadece sağdaki komutta var
        columns:
          - label: DocumentDB'de grupla
            sub: Sayfa açılırken giden gerçek komut.
            via: >-
              Uygulama bu komutu pymongo kütüphanesinin aggregate() metoduyla gönderir; sonucu satır satır okur.
            parts: [agg, grp, cnt, mn, srt]
          - label: "Olsaydı: hepsini çek, uygulamada say"
            sub: Gönderilmeyen, karşılaştırma için yazılmış komut.
            via: Uygulama bu komutu find() ile gönderir ve saymayı kendi kodunda yapardı.
            parts: [all]
            mark: [all]
        note: >-
          Dikkat: soldaki komut "sonucu" değil, "nasıl hesaplanacağını" söylüyor. DocumentDB bu tarifi verinin yanında çalıştırır
          ve sadece sonucu gönderir. Sağdaki komut kısa görünür ama bütün katalogu ağdan taşır.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          DocumentDB'nin işi sonucu verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: DocumentDB → Uygulama
            text: "{items} kategori satırı geldi; ardından ikinci komutun cevabı olarak vitrinin 8 ürünü geldi."
          - who: Uygulama
            text: >-
              Kategori satırlarındaki _id alanının adını name yaptı, vitrin ürünlerinin _id'sini product_id yaptı ve ikisini
              tek bir cevapta topladı.
          - who: Uygulama → Tarayıcın
            text: Kategorileri, vitrini ve isteğin kaydını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: Her kategori satırını bir kutuya çevirdi ("40 products, from ₺…") ve vitrin kartlarını çizdi.
          - who: Tarayıcın → S3
            text: >-
              Vitrin kartlarının görsellerini ürün numarasından kurduğu adresle (/s3/api/img/P0103) ayrı ayrı istedi; görseller
              S3'ten geldi. Kartta adı ve fiyatı (DocumentDB) görselle (S3) birleştiren tarayıcıdır.
          - who: Sonra
            text: >-
              Bir kategori kutusuna tıklarsan o kategorinin sayfası açılır; orada DocumentDB filtre ve index ile çalışır
              (Adım 3).
      remember: >-
        Sayma, en küçük, toplam gibi hesapları verinin durduğu yerde yaptır. Aggregation ile veritabanı binlerce dokümanı
        okur ama uygulamaya sadece birkaç satırlık sonucu gönderir.
      why_db: >-
        Neden DocumentDB? Ürünler farklı yapılarda bilgi taşıyor ve her biri tek bir doküman olarak saklanıyor. DocumentDB bu
        dokümanlar üzerinde gruplama, sıralama ve hesaplama aşamalarını sunucuda çalıştırır. Bedeli: çok büyük katalogda her
        ziyarette yeniden hesaplamak pahalılaşır; o zaman sonuç önbelleğe ya da bir özet dokümanına alınır.

  - page: home
    path: /
    engines: [elasticache]
    use_case: Bellekteki sıcak veri
    title: Fırsat kutusu bellekten gelir
    why: >-
      Ana sayfanın üstündeki fırsat kutusu günün indirimli ürününü ve kalan adedi gösteriyor. Her ziyaretçi bu kutuyu
      görüyor ve adet dakikada birçok kez değişiyor. Bu adımda tıklama yok, sadece bakacaksın.
    do: Aydınlık fırsat kutusuna bak. Sonra kartın altındaki butonla perde arkasını aç.
    target: "#hero-deal"
    action: look
    wait: {method: GET, path: /elasticache/api/deal}
    result: HGETALL lm:deal returned the fields of the deal hash. GET lm:deal:stock returned the counter.
    panel:
      need: >-
        Fırsat kutusu her sayfa açılışında okunuyor ve kalan adet satış oldukça değişiyor. Binlerce ziyaretçi aynı anda aynı
        küçük veriyi istiyor. Bu veriyi her seferinde diskte duran bir veritabanından okumak gereksiz yük ve gecikme demek;
        cevap milisaniyenin altında gelmeli.
      concept:
        term: Anahtar-değer ve bellek (in-memory)
        text: >-
          ElastiCache (Valkey) veriyi bellekte, anahtar-değer çiftleri olarak tutar. Bir vestiyer gibi düşünebilirsin: fişin
          numarasını verirsin, görevli bütün askıları aramaz, doğrudan o numaralı askıya gider. Anahtar fişin numarası, değer
          askıdaki paltodur. Değer düz bir metin ya da sayı olabileceği gibi, birden fazla alanı olan bir hash da olabilir.
        terms:
          - [Anahtar (key), "Değerin adı. Burada lm:deal (fırsat kartı) ve lm:deal:stock (kalan adet)."]
          - [Hash, "Alanları olan bir değer: product_id, name, price… HGETALL hepsini bir kerede getirir."]
          - [Hash slot, "Anahtarın adından hesaplanan 0–16383 arası bir numara. Anahtarın hangi parçada (shard) durduğunu bu belirler."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde bellekteki fırsat verisi için hazırlık
        intro: >-
          Ana sayfa hiç açılmadan, fırsat verisi belleğe yazılır ve nasıl okunacağı belirlenir. Aşağıdaki beş adım bu
          hazırlığın sırasıdır.
        text:
          - title: Önce sayfanın sorusu yazılır
            text: >-
              Her sayfa aynı iki şeyi soruyor: "fırsat ne?" (ad, fiyat, ürün) ve "kaç tane kaldı?". İkisi de tek bir anahtarla
              cevaplanır; arama ya da filtre yoktur.
            code: |-
              HGETALL lm:deal          → fırsat kartının alanları
              GET     lm:deal:stock    → kalan adet
          - title: Veriye uygun yapı seçilir
            text: >-
              Kartın birden fazla alanı olduğu için hash; kalan adet ise tek bir sayı olduğu için düz bir değer (string) olur.
              Sayının ayrı bir anahtarda durmasının sebebi, satış sırasında DECR ile tek hamlede azaltılabilmesidir.
            code: |-
              HSET lm:deal product_id P0001 name "Alpen Kablosuz Kulaklık 1" price 2024.30 old_price 3373.84
              SET  lm:deal:stock 50
          - title: Bellekteki veri bir kopyadır
            text: >-
              Ürünün asıl kaydı katalogdadır. Kampanya başlarken kart katalogdan kopyalanır. Okumada anahtar bulunamazsa
              uygulama asıl kayda gider ve belleği yeniden doldurur (cache-aside). Bu yüzden bellek kaybolsa da veri kaybolmaz.
          - title: Kampanya bitince anahtar kendiliğinden silinir
            text: >-
              Anahtarlara bir son kullanma zamanı verilir; kampanya bitince fırsat kartı ve sayaç bellekten kendiliğinden düşer.
              Silme işi için ayrı bir program gerekmez.
            code: |-
              EXPIREAT lm:deal <bitiş zamanı>
              EXPIREAT lm:deal:stock <bitiş zamanı>
          - title: Birlikte işlenecek anahtarlar aynı slota konur
            text: >-
              ElastiCache anahtarları adlarından hesaplanan slotlara, slotları da parçalara dağıtır. lm:deal ile lm:deal:stock
              farklı slotlardadır; ayrı ayrı okumak sorun değildir ama ikisini tek bir transaction'da (MULTI) değiştirmek
              istenirse CROSSSLOT hatası alınır. O zaman adlara aynı hash tag konur: süslü parantezin içi slotu belirler.
            code: |-
              lm:{deal}  ve  lm:{deal}:stock   → ikisi de aynı slotta
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Kampanyayı başlatan bir iş: ürünü katalogdan kopyalar, fiyatı indirir ve sayacı stoktan kurar. Satış sırasında her
          alım sayacı uygulama üzerinden DECR ile azaltır.
        reads: Uygulama, fırsatın göründüğü her sayfa için (ana sayfa, fırsatlar sayfası).
        kind: >-
          Uygulama orkestrasyonu. ElastiCache başka bir veritabanından kendiliğinden veri çekmez; içine ne yazılırsa onu
          tutar.
        with: >-
          Fırsat kartı tek başına durmaz: ürünün asıl bilgisi katalogda (DocumentDB), görseli nesne deposunda (S3, büyük
          sistemlerde bir CDN ile), satın almanın asıl kaydı sipariş veritabanında (Aurora) durur.
        best: >-
          Bellekteki veri her zaman asıl kayıttan yeniden kurulabilir olmalıdır. Okumada anahtar yoksa uygulama asıl kayda
          gider ve belleği doldurur (cache-aside); asıl kayıt değişince bellekteki kopya silinir ya da güncellenir.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, ana sayfa açılırken gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda
          çalışan veritabanları var.
        steps:
          - text: >-
              Mağazanın ana sayfasındasın; bir önceki adımda kategori kutularına baktın. Tarayıcın seni lm_visitor ve
              lm_persona çerezleriyle tanıyor.
          - text: >-
              Sayfa açılırken birkaç istek aynı anda yola çıktı: oturum kaydın (bellek), ana sayfa verisi (DocumentDB), fırsat
              kutusu (bellek) ve "Recently viewed" şeridi (Keyspaces). Biri yavaşlasa diğerleri onu beklemez.
            engines: [elasticache, docdb, keyspaces]
          - text: >-
              Fırsat isteği için uygulama ElastiCache'e iki komut gönderdi: HGETALL lm:deal (kartın bütün alanları) ve
              GET lm:deal:stock (kalan adet). Simülasyon bu iki komutu gösteriyor.
            engines: [elasticache]
          - text: >-
              Kutu çizildi: ürünün adı, indirimli ve eski fiyatı, "pieces left" (kalan adet). Görsel, karttaki ürün
              numarasından kurulan adresle ayrı bir istekte S3'ten geldi.
            engines: [elasticache, s3]
      sim:
        kind: kv
        title: "ElastiCache (Valkey) belleği: anahtarlardan bir kesit"
        caption: >-
          Bellekteki anahtarlardan küçük bir kesit, canlı değerleriyle (oturum anahtarındaki kimlik kısaltıldı). lm:deal ve
          lm:deal:stock bu adımın anahtarları; diğerleri bu mağazanın bellekte tuttuğu başka anahtarlar. Slot, anahtar adından hesaplanan gerçek numaradır. Üstteki etiketler o
          anda işi kimin yaptığını gösterir.
        keys:
          - {key: "lm:session:7f3a…", type: hash, value: "persona C00001, last_page /", slot: "…"}
          - {key: "lm:deal:stock", type: string, value: "45", slot: 1725}
          - {key: "lm:leaderboard", type: sorted set, value: "C00002 → 1168114.91, C00001 → 465187.51, …", slot: 10162}
          - {key: "lm:deal", type: hash, value: "product_id P0001, name Alpen Kablosuz Kulaklık 1, price 2024.3, old_price 3373.84, ends_at …", slot: 3299}
          - {key: "lm:name:C00001", type: string, value: "Ayşe Yılmaz", slot: 10945}
        commands:
          - cmd: HGETALL
            key: lm:deal
            returns: "5 alan (product_id, name, price, old_price, ends_at)"
            say_send: >-
              Ana sayfayı açtın. Tarayıcın fırsatı istedi; uygulama ElastiCache'e ilk komutu gönderiyor: HGETALL lm:deal.
          - cmd: GET
            key: lm:deal:stock
            returns: '"45"'
            say_send: Uygulama ikinci komutu gönderiyor - GET lm:deal:stock, yani kalan adet.
        back: >-
          Uygulama iki cevabı tek bir cevapta birleştirdi (adedi metinden sayıya çevirdi) ve tarayıcına gönderdi. Tarayıcın
          kutuyu çizecek, görseli S3'ten isteyecek.
        summary: >-
          İki komut, iki anahtar, iki doğrudan erişim. Bellekte kaç anahtar olursa olsun ElastiCache aramaz: adından yerini
          hesaplar ve oraya gider.
      wire:
        what: >-
          Uygulama, ElastiCache'e açık tuttuğu bağlantılar üzerinden komutları gönderir (redis-py kütüphanesi, cluster
          istemcisi). İstemci slotların hangi parçada olduğunu bilir ve her komutu doğru parçaya yollar.
        dst: "dbws-cache-qtkvec.serverless.euc1.cache.amazonaws.com : 6379"
        dst_note: >-
          ElastiCache Serverless'ın adresi. Bu ad, VPC'nin içindeki uç noktaya çözülür; cache internete kapalıdır.
        rows:
          - [Şifreleme, TLS, gerçek, ElastiCache Serverless sadece şifreli bağlantı kabul eder.]
          - [Protokol, RESP (Redis/Valkey protokolü), gerçek, "Her komut kısa bir metin çerçevesidir: komut adı ve parametreleri. HTTP değil."]
          - [Kimlik, "ACL kullanıcısı + şifre, bağlantı açılırken", gerçek, "Şifre kodda yazmaz; uygulama onu çalışırken AWS Secrets Manager'dan alır."]
        body_label: Komutlar ve cevaplar (okunur hâle getirilmiş)
        body: |-
          HGETALL lm:deal
            → product_id "P0001", name "Alpen Kablosuz Kulaklık 1", price "2024.3", old_price "3373.84", ends_at "…"
          GET lm:deal:stock
            → "45"

          Ağdaki ham hâli (RESP): *2\r\n$7\r\nHGETALL\r\n$7\r\nlm:deal\r\n
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Mor etiketli
        satırda bir şey bir yerden bir yere gider; gri "Uygulamanın içinde" etiketli satırda iş uygulamanın kendi içinde
        yapılır.
      app_code:
        - file: engines/elasticache.py
          func: api_deal
          title: Fırsat isteği
          sub: Sayfa açılırken gelen istek; iki komut gönderir.
          lines:
            - {match: '@bp.get("/api/deal")', say: Fırsat kutusunun veri isteği buraya gelir., tag: Tarayıcı → Uygulama}
            - {match: 'deal = cmd("HGETALL"', say: "İlk komut: lm:deal hash'inin bütün alanları istenir.", tag: [Uygulama → ElastiCache, ElastiCache → Uygulama], hl: key}
            - {match: 'stock = cmd("GET"', say: "İkinci komut: kalan adet istenir.", tag: [Uygulama → ElastiCache, ElastiCache → Uygulama], hl: key}
            - {match: 'return jsonify(trace.payload({**deal, "stock": int(stock or 0)}))', say: "İki cevabı tek bir cevapta birleştirir, adedi metinden sayıya çevirir ve tarayıcıya gönderir.", tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek bellekte ne oldu?
        intro: >-
          Ana sayfa açılırken ElastiCache'e giden iki gerçek komutun süreleri. Süre, uygulamanın komutu göndermesinden cevabın
          gelmesine kadar geçen zaman.
        runs:
          - label: Fırsat isteği (sayfa açılınca)
            trigger: true
            metrics: [["HGETALL lm:deal", ms], ["GET lm:deal:stock", e1.ms], [Kalan adet, data.stock]]
        reading: >-
          İki komut da birkaç milisaniyenin altında, çoğu zaman 1 milisaniye civarında cevaplanır; sürenin büyük kısmı ağdadır,
          bellekteki arama ise mikrosaniyeler sürer. Süre her istekte biraz değişir. Kalan adet, satış oldukça azalır.
      query:
        title: Sayfa ElastiCache'e ne dedi?
        intro: >-
          İki sütun, simülasyondaki iki komut. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        parts:
          - id: hg
            say: lm:deal hash'inin bütün alanlarını getir.
            code: HGETALL lm:deal
            name: Ne isteniyor?
            note: "HGETALL, \"hash'in bütün alanları\" demek. Tek bir alan isteseydik HGET lm:deal price yazardık."
            hl: key
          - id: gt
            say: lm:deal:stock anahtarının değerini getir.
            code: GET lm:deal:stock
            name: Ne isteniyor?
            note: GET, düz bir değeri okur. Cevap her zaman metindir ("45"); sayıya çeviren uygulamadır.
            hl: key
        columns:
          - label: 1. Fırsat kartı
            sub: Sayfa açılırken giden ilk komut.
            via: Uygulama bu komutu redis-py kütüphanesinin hgetall() metoduyla gönderir.
            parts: [hg]
          - label: 2. Kalan adet
            sub: Hemen ardından giden ikinci komut.
            via: Uygulama bu komutu redis-py'nin get() metoduyla gönderir.
            parts: [gt]
        note: >-
          Dikkat: iki komutta da "ara" ya da "filtrele" yok. Anahtarın adı biliniyor; ElastiCache yerini addan hesaplar.
          Adını bilmediğin bir değeri bu şekilde bulamazsın.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          ElastiCache'in işi iki cevabı verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: ElastiCache → Uygulama
            text: >-
              Hash'in 5 alanı ve kalan adet geldi. Bellekteki bütün değerler metindir: fiyat bile "2024.3" olarak gelir.
          - who: Uygulama
            text: Kalan adedi sayıya çevirdi ve hash'in alanlarıyla tek bir cevapta birleştirdi.
          - who: Uygulama → Tarayıcın
            text: Fırsatı ve isteğin kaydını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: Kutuyu çizdi; fiyatları Türk lirası biçimine çevirdi ve eski fiyatın üstünü çizdi.
          - who: Tarayıcın → S3
            text: >-
              Kutudaki görseli ürün numarasından kurduğu adresle (/s3/api/img/P0001) istedi; görsel S3'ten geldi. Kartta
              bilgiyi (ElastiCache) görselle (S3) birleştiren tarayıcıdır.
          - who: Sonra
            text: >-
              Fırsatlar sayfasında "Buy one now" (hemen bir tane al) butonuna basınca sayaç DECR ile tek hamlede azalır (Adım 17).
      remember: >-
        Çok okunan küçük veriyi bellekte, adıyla bulunan bir anahtarda tut. Bellek arama yapmaz: anahtarın yerini hesaplar ve
        doğrudan oraya gider; bu yüzden cevap milisaniyenin altındadır.
      why_db: >-
        Neden ElastiCache? Fırsat kartı küçük, çok sık okunuyor ve adedi sık değişiyor. ElastiCache bunu bellekte tutar, her
        okumaya milisaniyenin altında cevap verir ve DECR gibi atomik komutları hazır sunar. Bedeli: veri bellekte durur ve
        aranamaz; asıl kayıt başka bir veritabanında tutulur.

  # ---------------------------------------------------------------- Category: DocumentDB indexes
  - page: category
    path: /c/Elektronik
    engines: [docdb]
    use_case: Index ile filtreleme
    title: Index'i kapat
    why: >-
      Bu sayfadaki ürünler DocumentDB adlı veritabanından geliyor. Sayfa sadece Elektronik ürünlerini istiyor ve puanı en
      yüksek olanı en üste koyuyor. Bunu hızlı yapmak için veritabanı bir index kullanıyor. Index, kitabın sonundaki dizin
      gibidir: aradığın kelimenin hangi sayfalarda olduğunu söyler, kitabı baştan sona okuman gerekmez. Şimdi aynı listeyi
      index olmadan isteyeceğiz ve veritabanının ne kadar fazla iş yaptığını göreceğiz.
    do: Aydınlık "Collection scan" butonuna tıkla. "Collection scan", index'i kullanmadan bütün ürünleri tek tek okumak demek.
    target: "#exp-index [data-value=off]"
    action: click
    wait: {method: GET, path: /docdb/api/products, query: {index: "off"}}
    focus: "#products"
    # Perde arkası paneli (mission.js + guided-sim.js). Sıra: need, concept, sim, live, query, remember, why_db.
    panel:
      need: >-
        Sayfa, 200 ürünlük katalogdan sadece "Elektronik" kategorisindekileri istiyor ve onları puana göre büyükten küçüğe
        sıralı istiyor. Az önce aynı listeyi iki farklı yolla aldın: önce index ile (sayfa açılırken), şimdi index olmadan.
        Ekrandaki ürünler iki seferde de aynı. Farkı görmek için perde arkasına bakmak gerekiyor.
      concept:
        term: Index (dizin)
        text: >-
          Index, kitabın sonundaki dizine benzer. "Elektronik" kelimesini dizinde bulursun, dizin sana hangi sayfalara
          bakacağını söyler ve sadece o sayfaları açarsın. Dizin yoksa kitabı ilk sayfadan son sayfaya kadar okuman gerekir.
          Bu katalogdaki index iki alanı birlikte tutuyor: önce kategori, sonra puan. Bu yüzden index'te Elektronik ürünleri
          yan yana ve zaten puan sırasında duruyor.
        terms:
          - [Doküman, "Bir ürünün bütün bilgisi. DocumentDB her ürünü bir JSON dokümanı olarak saklar. Tablodaki her satır bir doküman."]
          - [Koleksiyon, "Aynı türden dokümanların bulunduğu yer. Burada adı products."]
          - [Collection scan, "Index kullanmadan koleksiyondaki dokümanları baştan sona tek tek okumak."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde kategori sorgusu için hazırlık
        intro: >-
          Kategori sayfası hiç açılmadan, veritabanı bu sayfanın sorusuna göre hazırlanır. Aşağıdaki beş adım bu hazırlığın
          sırasıdır.
        text:
          - title: Önce sayfanın sorusu yazılır
            text: >-
              Index'ler veriye göre değil, sorulara göre kurulur. Kategori sayfasının sorusu her ziyarette aynıdır:
              "category = X olan ürünler, puanı yüksek olan önce, en fazla 48, sadece kart alanları". Bu soru listesi sayfa
              tasarlanırken çıkarılır ve her yeni ekranla güncellenir.
            code: |-
              db.products.find({ category: "Elektronik" }, { name: 1, price: 1, rating: 1, … })
                         .sort({ rating: -1 }).limit(48)
          - title: Soruya uyan bileşik index kurulur
            text: >-
              Alan sırası kuralı (ESR): önce eşitlik alanı (category), sonra sıralama alanı (rating), en sonda aralık alanı
              (ör. fiyat). Bu sırayla index'in "Elektronik" bölümü zaten puan sırasındadır: veritabanı oraya gider, 48. kayıtta
              durur, ayrıca sıralamaz. Ters sırada bütün index'i dolaşırdı.
            code: |-
              db.products.createIndex({ category: 1, rating: -1 })
          - title: Yayından önce plan kontrol edilir
            text: >-
              explain, veritabanına "bunu nasıl çalıştıracaksın?" diye sorar. Doğru hazırlıkta plan IXSCAN der ve okunan
              doküman sayısı dönen sayıya eşittir. COLLSCAN ya da ayrı bir SORT görülürse index eksik ya da sırası yanlıştır.
            code: |-
              ….explain("executionStats")  →  IXSCAN { category: 1, rating: -1 },  totalDocsExamined = nReturned
          - title: Index bellekte durmalı ve bedeli izlenmeli
            text: >-
              Hız, index'in sunucu belleğinde olmasına bağlıdır (CloudWatch: IndexBufferCacheHitRatio). Her yazma bütün
              index'leri günceller; kullanılmayan index $indexStats ile bulunur ve silinir.
            code: |-
              db.products.aggregate([{ $indexStats: {} }])   →  index başına kullanım sayısı ve boyut
          - title: Okumalar kopyalara dağıtılır
            text: >-
              Katalog çok okunur, az yazılır. Okuma tercihi secondaryPreferred olur: kategori sorguları replica'lara gider,
              ana kopya (primary) yazmalara kalır. Replica'lar genelde 100 ms'den kısa gecikmeyle günceldir; "az önce
              kaydettiğimi hemen göster" gereken ekranlar ise primary'den okur.
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Katalog yönetimi: ürün ekleyen, fiyat ve stok güncelleyen arka ofis ekranları ya da tedarikçiden gelen ürün
          dosyalarını aktaran bir iş. Hepsi uygulama üzerinden yazar.
        reads: Uygulama, mağaza sayfaları için (kategori, ürün sayfası, ana sayfa vitrini).
        kind: >-
          Uygulama orkestrasyonu. DocumentDB başka bir veritabanından kendiliğinden veri çekmez. Ama kendi değişikliklerini
          dışarı verebilir: change streams açıksa her ekleme ve güncelleme sırayla okunabilen bir kayıt olarak çıkar.
        with: >-
          Kategori sayfası tek bir veritabanıyla çalışmaz. Ürün görselleri bir nesne deposunda (Amazon S3) durur: ürün
          dokümanı görselin S3'teki adını (anahtarını) tutar, görselin kendisini tarayıcı ayrı bir istekle alır ve büyük
          sistemlerde bu istek bir CDN'den (Amazon CloudFront) karşılanır; uygulama görselin byte'larını taşımaz. Oturum
          bilgisi (kim, hangi sayfada) bellekte duran bir veritabanında (ElastiCache) kısa ömürlü bir kayıt olarak tutulur.
          Metinle arama ise ayrı bir arama motoruna (OpenSearch) gider.
        best: >-
          Katalog tek yerde (burada DocumentDB) tutulur, diğer sistemler oradan beslenir. Metin araması için ürünler
          OpenSearch'e aktarılır: DocumentDB'nin OpenSearch ile zero-ETL entegrasyonu ya da change streams'i okuyan küçük
          bir program bu işi yapar. Uygulama aynı ürünü iki yere ayrı ayrı yazmaz, çünkü biri unutulunca iki kopya birbirini
          tutmaz.
      scenario:
        title: Ne oldu? Senin gözünden
        intro: >-
          Simülasyondan önce, bu adımda gerçekte ne yaşadığını sırayla anlatalım. Her satırın sağında o anda çalışan
          veritabanları var.
        steps:
          - text: >-
              Mağazaya bir müşteri olarak girdin (ör. Ayşe Yılmaz). Şifreyle giriş yok: tarayıcın iki çerez taşıyor.
              lm_visitor bu tarayıcının kimliği, lm_persona seçtiğin müşteri. Mağaza seni her istekte bu çerezlerden tanıyor.
          - text: >-
              Ana sayfada kategori kutularından "Elektronik"e tıkladın ve /c/Elektronik sayfası açıldı. Sayfa açılır açılmaz
              arka planda oturum kaydın güncellendi: hangi müşteri olduğun ve son baktığın sayfa, 30 dakikalık bir süreyle
              bellekte tutuluyor.
            engines: [elasticache]
          - text: >-
              Aynı anda tarayıcın uygulamaya "Elektronik ürünlerini, puanı yüksek olan önce getir" isteğini gönderdi.
              Uygulama bu isteği DocumentDB'ye bir find komutu olarak iletti. "Use the index" seçiliydi, yani DocumentDB
              index'i kullandı. Simülasyonun sol şeridi bu istek.
            engines: [docdb]
          - text: >-
              Liste geldi ve tarayıcın 40 ürün kartını çizdi. Kartların adı, fiyatı ve puanı DocumentDB'den geldi; ama
              görseller DocumentDB'de değil. Tarayıcın, ekranda görünen her kart için ürün numarasından bir görsel adresi
              kurdu (/s3/api/img/P0021) ve görseli ayrı bir istekle aldı. Bu istekler S3'e gider. Ürün bilgisini ve
              görseli kartta birleştiren tarayıcıdır.
            engines: [docdb, s3]
          - text: >-
              Sonra sayfanın üstündeki "Collection scan" butonuna bastın. Tarayıcın aynı listeyi bu kez index=off ile istedi;
              uygulama aynı find komutunu, sonuna "index'i kullanma" (hint) ekleyerek gönderdi. Simülasyonun sağ şeridi bu
              istek. Görseller değişmediği için büyük olasılıkla tarayıcının önbelleğinden geldi.
            engines: [docdb]
      sim:
        kind: index-vs-scan
        caption: >-
          Gerçek katalogdan alınmış 8 ürünlük bir kesit. İki şerit iki ayrı gerçek istek: soldaki sayfa açılırken giden,
          sağdaki senin tıklamanla giden. Sorgu aynı; tek fark, sağdakinde DocumentDB'ye index'i kullanmaması söyleniyor.
          İki taraf aynı hızda adım atıyor: her adımda en fazla bir doküman okunuyor. Üstteki etiketler o anda işi kimin
          yaptığını gösterir: uygulama mı, DocumentDB mi.
        labels:
          index: "t-1 · İstek 1 · Sayfa açılınca · Index ile"
          scan: "t0 · İstek 2 · Senin tıklaman · Index olmadan (collection scan)"
        send_index: >-
          Elektronik kategorisine tıkladın. Tarayıcın "Elektronik ürünlerini, puanı yüksek olan önce" istedi; uygulama da
          DocumentDB'ye find komutunu gönderiyor. Komutta index adı yok: DocumentDB uygun index'i kendisi seçecek.
        back_index: >-
          Uygulama dokümanları aldı ve tarayıcına gönderdi. Tarayıcın kartları çizecek, her kartın görselini de ayrıca
          S3'ten isteyecek.
        send_scan: >-
          "Collection scan" butonuna bastın. Tarayıcın aynı listeyi index=off ile istedi; uygulama aynı find komutunu, sonuna
          hint ekleyerek gönderiyor: "index'i kullanma, baştan sona oku".
        back_scan: >-
          Uygulama aynı dokümanları aldı ve tarayıcına gönderdi. Liste soldakiyle aynı; görseller büyük olasılıkla
          tarayıcının önbelleğinden gelecek.
        columns: [[id, Ürün no], [name, Ürün], [category, Kategori], [rating, Puan]]
