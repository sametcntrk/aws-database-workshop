            - {match: 'stores = [{"store_id": h["_id"], "distance_km": round(h["sort"][0], 1)', say: "Her mağazanın uzaklığını sıralama değerinden alır ve bir basamağa yuvarlar.", tag: Uygulamanın içinde}
            - {match: 'return jsonify(trace.payload(stores))', say: Mağazalar tarayıcıya gider., tag: Uygulama → Tarayıcı}
