            limit: 48,
            hint: { $natural: 1 },          ← sadece "Collection scan" seçiliyken
            $readPreference: { mode: "secondaryPreferred" } }
      code_intro: >-
        Kod bilmen gerekmiyor. Solda uygulamanın gerçek kodundan birkaç satır, sağda her satırın Türkçesi. Her satırın
        etiketi işin nerede olduğunu söyler: mor etiketli satırda bir şey bir yerden bir yere gider (tarayıcıdan uygulamaya,
        uygulamadan DocumentDB'ye ya da geri). Gri "Uygulamanın içinde" etiketli satırda iş uygulamanın kendi içinde
        yapılır, hiçbir yere bir şey gitmez. İki istek de aynı kodu çalıştırır; fark tek bir satırda.
      app_code:
        - file: engines/docdb.py
          func: api_products
          title: Kategori listesi (iki istekte de aynı kod)
          sub: Adresteki index=on ya da index=off seçimi tek farkı belirler.
          lines:
            - {match: '@bp.get("/api/products")', say: Kategori sayfasının ürün listesi isteği buraya gelir., tag: Tarayıcı → Uygulama}
            - {match: 'use_index = request.args.get("index", "on") == "on"', say: "Adresteki seçime bakar: index kullanılsın mı?", tag: Uygulamanın içinde}
            - {match: 'cur = db().products.find(flt, CARD).sort(order).limit(48)', say: "Komutu kurar: kategori filtresi, kart alanları, puana göre sıra, en fazla 48. Henüz bir şey gönderilmedi.", tag: Uygulamanın içinde, hl: table}
            - {match: 'cur = cur.hint([("$natural", 1)])', say: "\"Collection scan\" seçildiyse komuta hint eklenir: index'i kullanma.", tag: Uygulamanın içinde, hl: scan}
            - {match: 'items = [_doc(d) for d in cur]', say: "Komut şimdi gönderilir, dokümanlar gelir. Uygulama her dokümanın _id alanının adını product_id yapar.", tag: [Uygulama → DocumentDB, DocumentDB → Uygulama], hl: result}
            - {match: 'plan = db().command("explain", find, verbosity="executionStats")', say: "Aynı sorgu bir kez daha, explain ile gider: DocumentDB kaç doküman okuduğunu ve hangi yolu seçtiğini söyler. Ölçümler buradan.", tag: [Uygulama → DocumentDB, DocumentDB → Uygulama]}
            - {match: 'colors = db().products.distinct(', say: "Üçüncü bir komut: bu kategorideki renkleri ister (sayfadaki renk filtresi için).", tag: [Uygulama → DocumentDB, DocumentDB → Uygulama]}
            - {match: 'return jsonify(trace.payload({"items": items, "colors": sorted(colors)}))', say: Ürünler ve renkler tek bir cevapta tarayıcıya gider., tag: Uygulama → Tarayıcı}
      live:
        title: Gerçek katalogda ne oldu?
        intro: >-
          Simülasyonda 8 ürün vardı. Gerçek katalogda 200 ürün var. Aşağıdaki sayılar, senin tıklamanla DocumentDB'ye giden
          gerçek isteklerden geliyor. Sayfa bunları DocumentDB'nin explain komutuyla ölçüyor: explain, veritabanına
          "bu sorguyu nasıl çalıştırdın, kaç doküman okudun?" diye sorar.
        runs:
          - {label: Index ile, fetch: "/docdb/api/products?category=Elektronik&index=on&sort=rating"}
          - {label: Index olmadan, trigger: true}
        metrics: [[Okunan doküman, examined], [Dönen doküman, returned], [Süre, ms]]
        bar: examined
        stages_cap: "DocumentDB'nin yaptığı işler, sırasıyla:"
        reading: >-
          İki çalıştırmada da 40 ürün döndü, ekrandaki liste aynı. Fark okunan doküman sayısında: index ile DocumentDB sadece
          eşleşen 40 dokümanı okudu. Index olmadan 200 dokümanın hepsini okudu, 160'ını "Elektronik değil" diye attı, sonra
          kalan 40'ı bellekte puana göre sıraladı. Süre (ms) her denemede biraz değişir ve 200 ürünlük küçük bir katalogda fark
          küçüktür. Asıl önemli ölçü okunan doküman sayısıdır: katalog 100 kat büyürse index olmadan okunan doküman sayısı da
          100 kat artar. Index ile sadece eşleşen dokümanlar okunur.
        stages:
          IXSCAN: "Index'te arama: dizinde doğru bölüme gider, sadece eşleşen dokümanları okur."
          COLLSCAN: "Koleksiyon taraması: dokümanları baştan sona tek tek okur ve filtreyi her birinde dener."
          SORT: "Bellekte sıralama: eşleşen dokümanları okuduktan sonra puana göre ayrıca dizer."
          LIMIT_SKIP: "Sınır: sonuçtan en fazla 48 dokümanı alır."
      query:
        title: Sayfa DocumentDB'ye ne dedi?
        intro: >-
          Simülasyondaki iki taraf, DocumentDB'ye giden iki gerçek komuttan geliyor. Burada da aynı düzen var: solda index
          ile çalışan komut, sağda index olmadan çalışan komut. Önce komutun Türkçesini oku, sonra aynı renkteki kod parçasını
          bul. Bir parçanın üzerine gelince cümlede, kodda ve açıklamada aynı yer parlar.
        cards_title: Parça parça
        # parts: one piece of a command each (fields: ~/.claude/skills/guided-step/references/panel-schema.md).
        parts:
          - id: coll
            say: products koleksiyonundaki
            code: db.products.find(
            name: Nereden?
            note: "products, ürünlerin durduğu koleksiyon. find, \"bul ve getir\" demek."
            hl: table
          - id: filter
            say: kategorisi Elektronik olan ürünleri
            code: '{ category: "Elektronik" },'
            indent: 2
            name: Hangileri?
            note: Filtre. Sadece category alanı "Elektronik" olan dokümanlar sonuca girer, diğerleri girmez.
            hl: filter
          - id: proj
            say: sadece kartta gereken bilgileriyle
            code: "{ name: 1, price: 1, rating: 1, category: 1, brand: 1, tags: 1, stock: 1 } )"
            indent: 2
            name: Hangi bilgiler?
            note: >-
              Projection. 1 "bu alanı getir" demek. Ürün kartı ad, fiyat, puan, kategori, marka, etiket ve stok gösteriyor;
              dokümandaki diğer alanlar (açıklama, renk, ürün özellikleri) gelmiyor. Böylece ağdan daha az veri taşınır.
            hl: columns
          - id: sort
            say: puanı en yüksek olan en üstte olacak şekilde sıralayıp
            code: ".sort({ rating: -1 })"
            name: Hangi sırayla?
            note: Sıralama. rating alanına göre sıralar. -1 "büyükten küçüğe", 1 olsaydı "küçükten büyüğe" demek olurdu.
            hl: sort
          - id: limit
            say: en fazla 48 tane getir
            code: ".limit(48)"
            name: Kaç tane?
            note: Sınır. Sayfa en fazla 48 ürün gösteriyor. Elektronik'te 40 ürün olduğu için 40'ın hepsi geliyor.
            hl: result
          - id: hint
            say: ve bunu yaparken index'i kullanma.
            code: ".hint({ $natural: 1 })"
            name: Nasıl?
            note: >-
              Hint, veritabanına "bu sorguyu şu yolla çalıştır" diye yol göstermek. $natural, "dokümanları diskte durdukları
              sırayla, baştan sona oku" demek. Yani index'i bırak, collection scan yap. Bu parça sadece "Collection scan"
              seçiliyken eklenir.
            hl: scan
            tag: sadece sağdaki komutta var
        columns:
          - label: Index ile
            sub: Sayfa ilk açıldığında giden komut ("Use the index" seçili).
            via: >-
              Uygulama bu komutu pymongo kütüphanesinin find() metoduyla gönderir; sonra aynı sorguyu explain komutuyla
              bir kez daha gönderip ölçer.
            parts: [coll, filter, proj, sort, limit]
          - label: Index olmadan (collection scan)
            sub: Senin "Collection scan" tıklamanla giden komut.
            via: >-
              Aynı find() çağrısı, sonuna pymongo'nun hint() metoduyla eklenen tek parçayla. Gerisi soldakinin aynısı.
            parts: [coll, filter, proj, sort, limit, hint]
            mark: [hint]
        note: >-
          Dikkat: soldaki komutta "index" kelimesi hiç geçmiyor. Index'i komutta yazmazsın. DocumentDB komuttaki filtreye
          (category) ve sıralamaya (rating) bakar, bunlara uyan bir index varsa onu kendisi seçer. Kategori filtresi iki
          komutta da aynı, yani filtre index kullanıldığını göstermez. Sağdaki komutun tek farkı 6. parça: .hint ile
          DocumentDB'ye "index'i bırak, baştan sona oku" diyoruz. Bu tek parça, okunan doküman sayısını 40'tan 200'e çıkardı.
      back:
        title: Cevap dönünce ne oldu?
        intro: >-
          DocumentDB'nin işi dokümanları verince bitti. Bundan sonrası uygulamada ve tarayıcında oluyor.
        steps:
          - who: DocumentDB → Uygulama
            text: >-
              {items} doküman geldi (Elektronik'te 40 ürün var, sınır 48). Ardından explain'in cevabı (kaç doküman okundu,
              hangi yol seçildi) ve renk listesi geldi.
          - who: Uygulama
            text: >-
              Her dokümanın _id alanının adını product_id yaptı, renkleri alfabetik sıraladı ve explain'den okunan ve dönen
              doküman sayılarını isteğin kaydına (trace) yazdı.
          - who: Uygulama → Tarayıcın
            text: Ürünleri, renk listesini ve isteğin kaydını tek bir JSON cevabında gönderdi.
          - who: Tarayıcın
            text: >-
              Ürün kartlarını yeniden çizdi. Liste index ile gelen listeyle aynı: sonuç değişmedi, sadece DocumentDB'nin yaptığı
              iş değişti.
          - who: Tarayıcın → S3
            text: >-
              Kartların görselleri DocumentDB'den gelmez. Tarayıcın her kart için ürün numarasından görsel adresini kurar
              (/s3/api/img/P0021) ve ayrı bir istek gönderir. Bu istek ALB'den S3'ün uygulama sunucusuna gider; o da S3'ten
              products/P0021.jpg nesnesini okuyup gönderir. Görsel 5 dakika tarayıcının önbelleğinde kalır; bu yüzden aynı
              kartlar yeniden çizilince görseller çoğu zaman tekrar istenmez. Ürün bilgisi ile görseli kartta tarayıcı birleştirir.
          - who: Sonra
            text: >-
              "Use the index" butonuna basarsan sayfa index'li komutu yeniden gönderir. Hint'i burada sadece deney için
              kullandık; gerçek bir sistemde DocumentDB doğru index'i kendisi seçer ve hint'e nadiren gerek kalır.
      remember: >-
        Sonuç aynı, yapılan iş farklı. Index olmadan veritabanı her dokümanı okumak zorunda kalır. Index, sık kullanılan bir
        filtre ve sıralama için doğru bölüme doğrudan gitmeyi sağlar.
      why_db: >-
        Neden DocumentDB? Ürünler farklı yapılarda bilgi taşıyor: kulaklığın pil süresi, ceketin bedeni ve rengi var. DocumentDB
        her ürünü kendi alanlarıyla tek bir doküman olarak saklar ve bu alanlar üzerinde index kurmana izin verir. Index'in de
        bir bedeli var: her yeni ürün yazıldığında index de güncellenir. Bu yüzden sadece sık kullanılan filtreler için index
        kurulur.

  - page: category
    path: /c/Elektronik?index=on
    engines: [docdb]
    use_case: İç içe alanla filtreleme
    title: Dokümanın içindeki bir alanla filtrele
    why: >-
      Elektronik kategorisindesin. Ürünlerin rengi, her ürünün kendi özellikleri arasında saklanıyor. Şimdi listeyi bir
      renge göre daraltacaksın ve veritabanının bu iç içe bilgiye nasıl ulaştığını göreceksin.
    do: Aydınlık "Colour" (renk) listesinden bir renk seç, örneğin siyah.
    target: "#color"
    action: change
    wait: {method: GET, path: /docdb/api/products, query: {color: "*"}}
    focus: "#products"
    result: The filter is now {category, "attributes.renk"}.
    panel:
      need: >-
        Ürünlerin ortak alanları (ad, kategori, fiyat, puan) her dokümanda aynı yerde duruyor. Renk, garanti süresi, ağırlık
        gibi ürüne göre değişen bilgiler ise dokümanın içinde attributes adlı ayrı bir bölümde. Sayfa şimdi "Elektronik ve
        rengi siyah olanlar, puanı yüksek olan önce" istiyor; yani filtrenin dokümanın içine bakması gerekiyor.
      concept:
        term: İç içe alan ve nokta gösterimi (dot notation)
        text: >-
          Bir doküman, içinde başka bir küçük doküman taşıyabilir: attributes: { renk: "siyah", garanti_ay: 36 }. Buna iç içe
          (nested) alan denir. İçteki alana adresiyle ulaşılır: "attributes.renk", tıpkı bir dosyanın klasör yolu gibi. Filtre,
          index ve sıralama bu adresle yazılır; veriyi ayrı bir tabloya bölmeye gerek yoktur.
        terms:
          - ["attributes.renk", "attributes bölümünün içindeki renk alanının adresi. Nokta, \"içindeki\" demek."]
          - [Bileşik index, "Birden fazla alanı birlikte tutan index. Alanların sırası önemlidir."]
          - [explain, "Veritabanına \"bu sorguyu nasıl çalıştırdın, kaç doküman okudun?\" diye sormak."]
          - [Uygulama, "Mağazanın arka uç programı (EC2 sunucusunda). Tarayıcından gelen isteği alır, veritabanına komutu o gönderir, cevabı o hazırlar."]
      prior:
        title: Gerçek bir sistemde iç içe alanlar için hazırlık
        intro: >-
          Renk listesi hiç kullanılmadan, dokümanın şekli ve bu filtrenin index'i hazırlanır. Aşağıdaki beş adım bu hazırlığın
          sırasıdır.
        text:
          - title: Önce sayfanın sorusu yazılır
            text: >-
              Kategori sayfasının ikinci sorusu: "bu kategori, şu renk, puanı yüksek olan önce, en fazla 48". Renk listesinin
              kendisi de bir sorudur: "bu kategoride hangi renkler var?".
            code: |-
              db.products.find({ category: "Elektronik", "attributes.renk": "siyah" }).sort({ rating: -1 }).limit(48)
              db.products.distinct("attributes.renk", { category: "Elektronik" })
          - title: Değişken özellikler bir bölümde toplanır
            text: >-
              Her üründe olan alanlar üst seviyede, ürüne göre değişenler attributes altında durur. Böylece yeni bir özellik
              eklemek şema değişikliği gerektirmez; sadece yeni dokümanlar o alanı taşır.
            code: |-
              { _id: "P0021", category: "Elektronik", rating: 4.8, …,
                attributes: { renk: "siyah", garanti_ay: 36, agirlik_kg: 5.1 } }
          - title: Sık sorulan birleşim için bileşik index kurulur
            text: >-
              Alan sırası kuralı (ESR): eşitlik alanları önce (category, attributes.renk), sıralama alanı sonra (rating). Bu
              index'le veritabanı doğrudan "Elektronik · siyah" bölümüne gider ve okuduğu her doküman sonuca girer.
            code: |-
              db.products.createIndex({ category: 1, "attributes.renk": 1, rating: -1 })
          - title: Plan explain ile kontrol edilir
            text: >-
              Veritabanı her sorgu için genelde tek bir index seçer. Sadece { "attributes.renk": 1 } index'i varsa, sıralamayı
              da karşılayan { category: 1, rating: -1 } seçilebilir ve renk okunduktan sonra elenir. explain'de okunan doküman
              sayısı dönen sayıdan büyükse index eksiktir.
            code: |-
              ….explain("executionStats")  →  totalDocsExamined: 40, nReturned: 9   (index eksik)
          - title: Çok çeşitli özellikler için tek bir dizi kullanılır
            text: >-
              Ürün türü arttıkça özellik sayısı yüzlere çıkar ve her biri için index kurmak imkânsızlaşır. O zaman özellikler
              { k, v } çiftlerinden oluşan bir diziye yazılır ve tek bir index hepsini karşılar.
            code: |-
              attrs: [ { k: "renk", v: "siyah" }, { k: "garanti_ay", v: 36 } ]
              db.products.createIndex({ "attrs.k": 1, "attrs.v": 1 })
      feed:
        title: Veri nereden geliyor?
        writes: >-
          Katalog yönetimi: ürün ekleyen ve özelliklerini güncelleyen arka ofis ekranları ya da tedarikçi dosyalarını aktaran
          bir iş. Tedarikçi yeni bir özellik gönderdiğinde (ör. "su geçirmez") doküman o alanı kendisi taşır.
        reads: Uygulama, kategori ve ürün sayfaları için.
        kind: >-
          Uygulama orkestrasyonu. DocumentDB başka bir veritabanından kendiliğinden veri çekmez. Kendi değişikliklerini ise
          change streams ile dışarı verebilir.
        with: >-
          Kategori sayfası tek bir veritabanıyla çalışmaz: ürün görselleri nesne deposundan (S3, büyük sistemlerde bir CDN ile)
          gelir, oturum bellekte (ElastiCache) tutulur. Çok sayıda özellikle aynı anda filtreleme ve her filtrenin yanında
          sayılar (facet) gerekiyorsa bu iş bir arama motoruna (OpenSearch) verilir.
        best: >-
