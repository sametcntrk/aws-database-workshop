        yapılır. İki istek de aynı kodu çalıştırır; hangi alanda aranacağını adresteki analyzer belirler.
      app_code:
        - file: engines/opensearch.py
          func: api_search
          title: Arama isteği (iki istekte de aynı kod)
          sub: Adresteki analyzer=folded ya da analyzer=standard hangi alanda aranacağını seçer.
          lines:
            - {match: '@bp.get("/api/search")', say: "Arama isteği buraya gelir; adres aranan metni ve seçimleri taşır.", tag: Tarayıcı → Uygulama}
