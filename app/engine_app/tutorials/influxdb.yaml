ops:
  steps:
    - title: Points in time
      text: Each sensor reading is one point with a time, tags and a value. InfluxDB stores points in time order.
      target: "#temp-wrap"
    - title: Windows
      text: Select 1 minute, then 1 hour. aggregateWindow calculates one value per window. The panel shows the point count.
      target: "#exp-win"
    - title: Orders per minute
      text: Each checkout writes one point to the orders measurement. Place an order and look at the last minute of the chart.
      target: "#orders-wrap"
