home:
  steps:
    - title: This shop uses ten databases
      text: Each part of Lale Market uses a different AWS database. We call each database an Engine. The panel on the right shows each call that this page makes.
      target: "#bts"
    - title: DocumentDB holds the catalog
      text: Each product is one JSON document. A document can have nested fields, and two documents can have different fields.
      target: "#featured"
    - title: The category menu is one aggregation
      text: DocumentDB groups the products by category and counts them on the server. Find the aggregate call in the panel.
      target: "#cats"
    - title: Other Engines fill other parts
      text: ElastiCache supplies the flash deal and Keyspaces supplies your recently viewed products. The tag on each part names its Engine.
      target: "#hero-deal"
    - title: Start the guided journey
      text: The journey takes you through search, product, cart, checkout and reports. Each stop teaches one Engine.
      target: "#start-journey"
category:
  steps:
    - title: A filter on a document field
      text: The page asks DocumentDB for the products of one category, sorted by rating. The filter can also use a nested field, such as attributes.renk.
      target: "#products"
    - title: Indexes decide the cost
      text: Look at "docs examined" in the panel. With the index, DocumentDB examines only the documents that match.
      target: "#exp-index"
    - title: Try a collection scan
      text: Select "Collection scan". DocumentDB now examines every document. On a large catalog, this makes the query slow and expensive.
      target: "#exp-index"
    - title: Filter on a nested field
      text: Select a colour. The filter uses attributes.renk, a field inside the document. A second index makes this filter fast.
      target: "#color"
product:
  steps:
    - title: Four Engines on one page
      text: DocumentDB supplies the product, Neptune the recommendations, Keyspaces your history and DynamoDB the cart. Each call has its own entry in the panel.
      target: "#bts"
    - title: One read returns the full product
      text: The product, its attributes and its tags come back in one document read. A relational model needs several tables and JOINs for this.
      target: "#pdp"
    - title: Projections return less data
      text: Select "Card fields only". DocumentDB returns fewer fields, and the document size in the panel becomes smaller.
      target: "#exp-proj"
    - title: Recommendations are a graph traversal
      text: Neptune follows BOUGHT edges from this product to its buyers, then to their other products. Select "For my persona" for a personal result.
      target: "#exp-recs"
    - title: A view event goes to Keyspaces
      text: This page wrote one row to your partition in Keyspaces. The recently viewed strip reads the same partition, newest first.
      target: "#recent-wrap"
    - title: Add the product to the cart
      text: DynamoDB updates your cart with one atomic write. The condition stops more than 5 pieces of one product. Add 5 pieces two times and compare.
      target: "#add"
admin:
  steps:
    - title: The instructor loads the shared catalog
      text: Each Engine App writes its slice of the catalog to its Engine. Only the instructor can do this. The key is in the dbws/admin secret.
      target: "#key"
    - title: Seed all Engines
      text: Select a dataset size, then click "Seed all Engines". Each row shows the result and the time.
      target: "#seed-all"
    - title: Connect zero-ETL
      text: After the first Seed, connect Redshift to the Aurora integration. Redshift then copies the Aurora tables and keeps them in step.
      target: "#zeroetl"
    - title: Control the cost
      text: Load Simulation sends bursts of requests. You can turn it off for each Engine. Each run has a limit of 2,000 requests.
      target: "#engines"
