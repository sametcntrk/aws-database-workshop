checkout:
  steps:
    - title: An order touches six Engines
      text: Aurora writes the order. DynamoDB, ElastiCache, Keyspaces, InfluxDB and Neptune then get updates. The list shows each step.
      target: "#flow"
    - title: One transaction in Aurora
      text: Place the order. In the panel, find BEGIN, the stock UPDATE, the two INSERTs and COMMIT. They are one unit.
      target: "#place"
    - title: Make the payment fail
      text: Add a product to the cart again. Select the experiment and place the order. Aurora rolls back, and the stock comes back.
      target: "#exp"
    - title: Why the stock UPDATE has a condition
      text: The UPDATE runs only when the stock is large enough. The row lock stops two checkouts from selling the last piece two times.
      target: "#flow"
orders:
  steps:
    - title: Three tables, one query
      text: Your orders come from orders, order_items and products. Aurora joins them by their keys in one statement.
      target: "#orders"
    - title: Foreign keys protect the data
      text: An order item must point to an order and a product that exist. PostgreSQL rejects a row that breaks this rule.
      target: "#orders"
order_report:
  steps:
    - title: Operational reports
      text: Aurora answers reports on current data well. This report groups revenue by customer segment.
      target: "#seg"
    - title: Read the query plan
      text: Select the experiment. EXPLAIN ANALYZE shows the join order and the time of each step.
      target: "#exp"
    - title: When to use Redshift
      text: For scans over years of data, Aurora competes with your checkout traffic. The Redshift report does those scans in a separate Engine.
      target: "#ws"
