activity:
  steps:
    - title: One partition per Visitor
      text: Your browser id is the partition key. All your events are in one partition, sorted by time, newest first.
      target: "#feed"
    - title: Seeded history
      text: Select "My persona". The page reads the events of your persona from the shared catalog.
      target: "#exp-who"
    - title: Consistency costs capacity
      text: Select LOCAL_ONE. Keyspaces reads one replica, at half the cost. LOCAL_QUORUM reads two of the three replicas.
      target: "#exp-cl"
    - title: High write volume
      text: Start the burst. Keyspaces accepts thousands of events. Writes that a new table cannot take yet get a retry with backoff.
      target: "#sim"
