# E2E tutorials in reading order. One template per Engine: templates/e2e/<id>.html. ASD-STE100 English.
# minutes: reading and practice time. question: the question that the tutorial answers.
lessons:
  - id: aurora
    minutes: 150
    question: How does a relational database keep related data correct while many users write?
    question_tr: Birçok kullanıcı aynı anda yazarken relational database birbiriyle ilişkili veriyi nasıl doğru tutar?
  - id: dynamodb
    minutes: 150
    question: How do you get the same fast read at any table size, if you design the key first?
    question_tr: Key'i önce tasarlarsan her table boyutunda nasıl aynı hızlı okumayı elde edersin?
  - id: docdb
    minutes: 150
    question: When is one nested document better than many related rows?
    question_tr: Tek bir iç içe doküman ne zaman birçok ilişkili row'dan daha iyidir?
  - id: elasticache
    minutes: 35
    question: What do you get when the data lives in memory, and what do you give up?
    question_tr: Veri bellekte yaşadığında ne kazanırsın ve neden vazgeçersin?
  - id: keyspaces
    minutes: 60
    question: How does a wide-column store keep billions of events per user in time order?
    question_tr: Bir wide-column store, kullanıcı başına milyarlarca event'i zaman sırasında nasıl tutar?
  - id: opensearch
    minutes: 150
    question: How does a search engine find "kulaklik" in "Kablosuz Kulaklık" with a typo?
    question_tr: Bir search engine, yazım hatasıyla "Kablosuz Kulaklık" içinde "kulaklik"i nasıl bulur?
  - id: neptune
    minutes: 140
    question: When are the connections between records the data that you query?
    question_tr: Kayıtlar arasındaki bağlantılar ne zaman query'lediğin verinin kendisidir?
  - id: redshift
    minutes: 150
    question: Why does a columnar warehouse scan a year of sales faster than the checkout database?
    question_tr: Columnar bir warehouse, bir yıllık satışı checkout database'inden neden daha hızlı tarar?
  - id: influxdb
    minutes: 140
    question: How do you store and ask questions about values that arrive every few seconds?
    question_tr: Birkaç saniyede bir gelen değerleri nasıl saklar ve onlar hakkında nasıl soru sorarsın?
  - id: s3
    minutes: 140
    question: How do you store files of any size at any scale, and give access without a server?
    question_tr: Her boyuttaki dosyayı her ölçekte nasıl saklar ve bir sunucu olmadan nasıl erişim verirsin?
# The 00 tutorial before the Engines: what data is, its types, its formats, how it is stored and queried. Not an Engine:
# it has no Engine App, no meta in catalog.py; name, category and data_type live here (templates/e2e/veri.tr.html).
intro:
  id: veri
  num: "00"
  name: Veri nedir?
  category: Temel kavramlar
  data_type: Bütün veri tipleri
  minutes: 60
  question: What is data, how is it stored, and how do you ask a database for it?
  question_tr: Veri nedir, nasıl saklanır ve bir veritabanından nasıl istenir?
