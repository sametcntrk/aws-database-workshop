# Glossary of the E2E tutorials. Key = the anchor that k.term() links to. "in" = the tutorials that use the term.
# en follows ASD-STE100. tr keeps the term in English and explains it in Turkish.
acid:
  term: ACID
  in: [aurora]
  en: Four promises of a transaction. Atomicity (all or nothing), consistency (the rules stay true), isolation (parallel transactions do not see half work) and durability (a committed change survives a crash).
  tr: Bir transaction'ın dört sözü. Atomicity (ya hep ya hiç), consistency (kurallar doğru kalır), isolation (paralel transaction'lar yarım işi görmez) ve durability (commit edilen değişiklik bir çökmeden sağ çıkar).
access-pattern:
  term: access pattern
  in: [dynamodb]
  en: One question that the application asks the database, with its keys, for example "all items of cart 7f3a". In DynamoDB, you list the access patterns first and design the keys for them.
  tr: Uygulamanın database'e sorduğu, key'leriyle birlikte tek bir soru, örneğin "7f3a sepetinin bütün item'ları". DynamoDB'de önce access pattern'leri listeler, sonra key'leri onlara göre tasarlarsın.
aggregate-ddd:
  term: aggregate (document design)
  in: [docdb]
  en: A group of data that the application always reads and changes together, for example a product with its variants. A document database stores one aggregate as one document.
  tr: Uygulamanın her zaman birlikte okuduğu ve değiştirdiği bir veri grubu, örneğin varyantlarıyla bir ürün. Bir document database bir aggregate'i tek bir document olarak saklar.
aggregate-function:
  term: aggregate function
  in: [aurora]
  en: A SQL function that makes one value from many rows, for example count(), sum(), avg(), min() and max().
  tr: Birçok row'dan tek bir değer üreten SQL fonksiyonu, örneğin count(), sum(), avg(), min() ve max().
aggregation:
  term: aggregation (search)
  in: [opensearch]
  en: A calculation over the matching documents of a search, in the same request. Example - the count of hits per category next to the results.
  tr: Bir aramanın eşleşen document'ları üzerinde, aynı request içinde yapılan hesap. Örnek - sonuçların yanında kategori başına hit sayısı.
aggregation-pipeline:
  term: aggregation pipeline
  in: [docdb]
  en: A list of stages that documents go through in order, for example $match, $group and $sort. Each stage gives its output to the next stage.
  tr: Document'ların sırayla geçtiği aşamalar listesi, örneğin $match, $group ve $sort. Her aşama çıktısını bir sonrakine verir.
analyzer:
  term: analyzer
  in: [opensearch]
  en: The part of a search engine that turns text into tokens. It splits the text and changes each token, for example to lowercase or to letters without accents.
  tr: Bir search engine'in metni token'lara çeviren parçası. Metni böler ve her token'ı değiştirir, örneğin küçük harfe ya da aksansız harflere.
atomic:
  term: atomic
  in: [elasticache]
  en: An operation is atomic when no other operation can see or change its middle state. It happens completely or not at all.
  tr: Bir işlemin ara durumunu başka hiçbir işlem göremiyor ya da değiştiremiyorsa o işlem atomic'tir. Ya tamamen olur ya hiç olmaz.
b-tree:
  term: B-tree
  in: [aurora]
  en: A sorted tree of pages that most database indexes use. A lookup goes from the root to a leaf in a few page reads, also for millions of rows.
  tr: Çoğu database index'inin kullandığı sıralı bir sayfa ağacı. Bir arama, milyonlarca row için de birkaç sayfa okumasıyla kökten yaprağa gider.
bucket:
  term: bucket
  in: [s3]
  en: A container for objects in Amazon S3. Its name is unique, and it belongs to one AWS Region.
  tr: Amazon S3'te object'ler için bir kap. Adı benzersizdir ve bir AWS Region'ına aittir.
cache-aside:
  term: cache-aside
  in: [elasticache]
  en: A cache pattern. The application reads the cache first. On a miss, it reads the database and writes the result into the cache with a TTL.
  tr: Bir cache pattern'i. Uygulama önce cache'i okur. Bulamazsa database'i okur ve sonucu bir TTL ile cache'e yazar.
cardinality:
  term: cardinality
  in: [influxdb]
  en: The number of different series in a time-series database. Each new tag value can add series, so a tag with millions of values makes a very large index.
  tr: Bir time-series database'teki farklı series sayısı. Her yeni tag değeri series ekleyebilir, bu yüzden milyonlarca değeri olan bir tag çok büyük bir index oluşturur.
clustering-column:
  term: clustering column
  in: [keyspaces]
  en: A column of the Cassandra primary key after the partition key. It sets the sort order of the rows inside one partition.
  tr: Cassandra primary key'inde partition key'den sonra gelen kolon. Bir partition'ın içindeki row'ların sıralamasını belirler.
cluster-volume:
  term: cluster volume
  in: [aurora]
  en: The shared storage of an Aurora or Neptune cluster. It keeps copies of the data in three Availability Zones, and all instances of the cluster use it.
  tr: Bir Aurora ya da Neptune cluster'ının ortak storage'ı. Verinin kopyalarını üç Availability Zone'da tutar ve cluster'ın bütün instance'ları onu kullanır.
collection:
  term: collection
  in: [docdb]
  en: A group of documents in a document database, similar to a table. The documents of one collection can have different fields.
  tr: Bir document database'te bir table'a benzeyen document grubu. Bir collection'ın document'larının farklı field'ları olabilir.
collection-scan:
  term: collection scan
  in: [docdb]
  en: A query plan that reads every document of a collection, because no index fits the filter.
  tr: Filtreye uyan bir index olmadığı için bir collection'ın her document'ını okuyan query planı.
column-store:
  term: column store
  in: [redshift]
  en: A storage layout that keeps the values of one column together in blocks. A query reads only the columns that it needs.
  tr: Bir kolonun değerlerini bloklarda bir arada tutan saklama düzeni. Bir query sadece ihtiyaç duyduğu kolonları okur.
condition-expression:
  term: condition expression
  in: [dynamodb]
  en: A condition on a DynamoDB write. DynamoDB does the write only if the condition is true at that moment, for example "stock >= 2".
  tr: Bir DynamoDB yazmasındaki koşul. DynamoDB yazmayı sadece koşul o anda doğruysa yapar, örneğin "stock >= 2".
constraint:
  term: constraint
  in: [aurora]
  en: A rule that the database checks on each write, for example NOT NULL, UNIQUE, CHECK or a foreign key. The database refuses a write that breaks it.
  tr: Database'in her yazmada kontrol ettiği bir kural, örneğin NOT NULL, UNIQUE, CHECK ya da bir foreign key. Database onu bozan bir yazmayı reddeder.
coordinator:
  term: coordinator
  in: [keyspaces]
  en: The node that receives a Cassandra request. It sends the request to the replicas of the partition and collects their answers.
  tr: Bir Cassandra request'ini alan node. Request'i partition'ın replica'larına gönderir ve cevaplarını toplar.
db-cluster:
  term: DB cluster
  in: [aurora]
  en: In Aurora, one writer instance, up to 15 reader instances and the cluster volume that they share.
  tr: Aurora'da bir writer instance, en fazla 15 reader instance ve onların paylaştığı cluster volume.
db-instance:
  term: DB instance
  in: [aurora]
  en: One database server with its CPU and memory. In Aurora, an instance does not own the data. The data lives in the cluster volume.
  tr: CPU'su ve belleğiyle tek bir database sunucusu. Aurora'da bir instance verinin sahibi değildir. Veri cluster volume'da yaşar.
dimension-table:
  term: dimension table
  in: [redshift]
  en: A table that describes the keys of a fact table, for example customers, products or dates.
  tr: Bir fact table'ın key'lerini tanımlayan table, örneğin müşteriler, ürünler ya da tarihler.
distribution-style:
  term: distribution style
  in: [redshift]
  en: The Redshift setting that decides on which slice each row goes - KEY, EVEN, ALL or AUTO.
  tr: Her row'un hangi slice'a gideceğine karar veren Redshift ayarı - KEY, EVEN, ALL ya da AUTO.
document:
  term: document
  in: [docdb]
  en: One record in a document database. It is a JSON-like object with fields, arrays and embedded objects.
  tr: Bir document database'teki bir kayıt. Field'ları, array'leri ve gömülü object'leri olan JSON benzeri bir object'tir.
dynamodb-streams:
  term: DynamoDB Streams
  in: [dynamodb]
  en: An ordered log of the item changes of a DynamoDB table. Another process, for example a Lambda function, can read it and react to each change.
  tr: Bir DynamoDB table'ının item değişikliklerinin sıralı bir log'u. Başka bir süreç, örneğin bir Lambda fonksiyonu, onu okuyup her değişikliğe tepki verebilir.
edge:
  term: edge
  in: [neptune]
  en: A relation between two vertices in a graph. It has a direction, a label and properties, for example BOUGHT with order_id.
  tr: Bir graph'ta iki vertex arasındaki ilişki. Bir yönü, bir label'ı ve property'leri vardır, örneğin order_id'li BOUGHT.
edit-distance:
  term: edit distance
  in: [opensearch]
  en: The number of single-letter changes that turn one word into another. An added, deleted or changed letter, or two swapped neighbor letters, each count as one.
  tr: Bir kelimeyi diğerine çeviren tek harflik değişikliklerin sayısı. Eklenen, silinen ya da değiştirilen bir harf veya yer değiştiren iki komşu harf birer sayılır.
endpoint:
  term: endpoint
  in: [aurora]
  en: A DNS name that an application connects to. Aurora has a cluster endpoint for writes and a reader endpoint that spreads reads over the replicas.
  tr: Bir uygulamanın bağlandığı DNS adı. Aurora'da yazmalar için bir cluster endpoint ve okumaları replica'lara dağıtan bir reader endpoint vardır.
fact-table:
  term: fact table
  in: [redshift]
  en: The large table of a data warehouse with one row for each event, for example one row for each order line, with numbers and keys.
  tr: Bir data warehouse'un her event için bir row tutan büyük table'ı, örneğin her sipariş satırı için sayılar ve key'lerle bir row.
flux:
  term: Flux
  in: [influxdb]
  en: The query language of InfluxDB 2. A query is a chain of functions joined with the operator |>.
  tr: InfluxDB 2'nin query dili. Bir query, |> operatörüyle bağlanan bir fonksiyon zinciridir.
foreign-key:
  term: foreign key
  in: [aurora]
  en: A column that holds the primary key of a row in another table. The database refuses a value that does not exist in that table.
  tr: Başka bir table'daki bir row'un primary key'ini tutan kolon. Database o table'da olmayan bir değeri reddeder.
geo_point:
  term: geo_point
  in: [opensearch]
  en: An OpenSearch field type that stores a latitude and a longitude, so that queries can filter and sort by distance.
  tr: Bir enlem ve bir boylam saklayan OpenSearch field type'ı; böylece query'ler mesafeye göre filtreleyip sıralayabilir.
global-secondary-index:
  term: global secondary index
  in: [dynamodb]
  en: A second copy of a DynamoDB table with a different partition key and sort key. DynamoDB keeps it up to date, so a second access pattern can use Query.
  tr: Bir DynamoDB table'ının farklı partition key ve sort key'li ikinci bir kopyası. DynamoDB onu güncel tutar, böylece ikinci bir access pattern Query kullanabilir.
group-by:
  term: GROUP BY
  in: [aurora]
  en: A SQL clause that puts rows with equal values in groups, so that an aggregate function gives one result for each group.
  tr: Eşit değerli row'ları gruplara koyan SQL clause'u; böylece bir aggregate function her grup için bir sonuç verir.
hash-function:
  term: hash function
  in: [dynamodb]
  en: A function that turns a key into a number. The same key always gives the same number, and different keys spread over the possible numbers.
  tr: Bir key'i bir sayıya çeviren fonksiyon. Aynı key her zaman aynı sayıyı verir ve farklı key'ler olası sayılara dağılır.
having:
  term: HAVING
  in: [aurora]
  en: A SQL clause that filters groups after GROUP BY, for example "HAVING count(*) > 2".
  tr: GROUP BY'dan sonra grupları filtreleyen SQL clause'u, örneğin "HAVING count(*) > 2".
hot-partition:
  term: hot partition
  in: [dynamodb]
  en: A partition that gets much more traffic than the others, because many requests use the same partition key.
  tr: Birçok request aynı partition key'i kullandığı için diğerlerinden çok daha fazla trafik alan partition.
identifier:
  term: identifier
  in: [aurora]
  en: A value that names exactly one thing, for example a customer id. One component owns it and other components borrow it.
  tr: Tam olarak tek bir şeyi adlandıran değer, örneğin bir müşteri id'si. Bir bileşen onun sahibidir ve diğer bileşenler onu ödünç alır.
in-memory-database:
  term: in-memory database
  in: [elasticache]
  en: A database that keeps its data in memory, so that reads and writes take microseconds.
  tr: Verisini bellekte tutan database; böylece okumalar ve yazmalar mikrosaniyeler sürer.
index:
  term: index
  in: [aurora]
  en: A sorted structure next to a table that points to its rows. It lets the database find rows without a read of the whole table.
  tr: Bir table'ın yanında, row'larını gösteren sıralı bir yapı. Database'in bütün table'ı okumadan row'ları bulmasını sağlar.
inverted-index:
  term: inverted index
  in: [opensearch]
  en: A search structure that lists, for each word, the documents that contain it. It is like the index at the back of a book.
  tr: Her kelime için onu içeren document'ları listeleyen arama yapısı. Bir kitabın arkasındaki dizine benzer.
item:
  term: item
  in: [dynamodb]
  en: One record in a DynamoDB table. Its primary key identifies it, and it can have any other attributes.
  tr: Bir DynamoDB table'ındaki bir kayıt. Onu primary key'i tanımlar ve başka herhangi attribute'ları olabilir.
item-collection:
  term: item collection
  in: [dynamodb]
  en: All items with the same partition key. DynamoDB stores them together, sorted by the sort key.
  tr: Aynı partition key'e sahip bütün item'lar. DynamoDB onları sort key'e göre sıralı olarak bir arada saklar.
join:
  term: JOIN
  in: [aurora]
  en: A SQL operation that combines rows of two tables when a condition matches, usually a foreign key equal to a primary key.
  tr: Bir koşul eşleştiğinde iki table'ın row'larını birleştiren SQL işlemi; çoğunlukla bir primary key'e eşit bir foreign key.
key:
  term: key (S3)
  in: [s3]
  en: The full name of an object in an S3 bucket, for example products/P0001.jpg.
  tr: Bir S3 bucket'ındaki bir object'in tam adı, örneğin products/P0001.jpg.
key-value-store:
  term: key-value store
  in: [elasticache]
  en: A database that stores values under keys and finds a value only by its key.
  tr: Değerleri key'ler altında saklayan ve bir değeri sadece key'i ile bulan database.
lifecycle-rule:
  term: lifecycle rule
  in: [s3]
  en: An S3 bucket rule that moves objects to another storage class, or deletes them, after a number of days.
  tr: Object'leri belirli bir gün sayısından sonra başka bir storage class'a taşıyan ya da silen S3 bucket kuralı.
line-protocol:
  term: line protocol
  in: [influxdb]
  en: The text format of InfluxDB for one point - measurement, tags, fields and a timestamp, in one line.
  tr: InfluxDB'nin bir point için metin formatı - measurement, tag'ler, field'lar ve bir timestamp, tek satırda.
lost-update:
  term: lost update
  in: [aurora]
  en: An error in which two transactions read the same value and both write a new value. The second write deletes the change of the first one.
  tr: İki transaction'ın aynı değeri okuyup ikisinin de yeni bir değer yazdığı hata. İkinci yazma birincinin değişikliğini siler.
mpp:
  term: MPP
  in: [redshift]
  en: Massively parallel processing. The system splits the data and the work across many slices that run at the same time.
  tr: Massively parallel processing. Sistem veriyi ve işi aynı anda çalışan birçok slice'a böler.
mvcc:
  term: MVCC
  in: [aurora]
  en: Multi-version concurrency control. A database keeps old row versions, so that readers see a consistent snapshot and do not wait for writers.
  tr: Multi-version concurrency control. Database eski row version'larını tutar; böylece okuyucular tutarlı bir snapshot görür ve yazıcıları beklemez.
normalization:
  term: normalization
  in: [aurora]
  en: A table design in which each fact is stored once. Other tables point to it with foreign keys.
  tr: Her bilginin bir kez saklandığı table tasarımı. Diğer table'lar onu foreign key'lerle gösterir.
object:
  term: object
  in: [s3]
  en: The bytes of a file plus its metadata, stored under a key in an S3 bucket. One request writes or reads the whole object.
  tr: Bir dosyanın byte'ları artı metadata'sı; bir S3 bucket'ında bir key altında saklanır. Tek bir istek bütün object'i yazar ya da okur.
olap:
  term: OLAP
  in: [redshift]
  en: Online analytical processing. Few queries, each one reads many rows but only some columns. Reports and analytics are OLAP.
  tr: Online analytical processing. Az sayıda query; her biri çok row ama sadece bazı kolonları okur. Raporlar ve analitik OLAP'tır.
oltp:
  term: OLTP
  in: [redshift]
  en: Online transaction processing. Many small queries, each one reads or writes a few complete rows. A checkout is OLTP.
  tr: Online transaction processing. Çok sayıda küçük query; her biri birkaç tam row okur ya da yazar. Bir checkout OLTP'dir.
page:
  term: page
  in: [aurora]
  en: The unit in which PostgreSQL reads and writes a table on disk, 8 KB. A page holds several rows.
  tr: PostgreSQL'in bir table'ı diskte okuduğu ve yazdığı birim, 8 KB. Bir page birkaç row tutar.
partition:
  term: partition
  in: [dynamodb]
  en: A part of the storage of a table. The hash of the partition key decides which partition holds an item or a row.
  tr: Bir table'ın storage'ının bir parçası. Bir item'ı ya da row'u hangi partition'ın tutacağına partition key'in hash'i karar verir.
partition-key:
  term: partition key
  in: [dynamodb, keyspaces]
  en: The part of the primary key that decides the partition. All items or rows with the same partition key are stored together.
  tr: Primary key'in partition'a karar veren kısmı. Aynı partition key'e sahip bütün item'lar ya da row'lar bir arada saklanır.
planner:
  term: planner
  in: [aurora]
  en: The part of the database that selects how to run a query, for example an index scan or a sequential scan. EXPLAIN shows its plan.
  tr: Database'in bir query'nin nasıl çalıştırılacağını seçen kısmı, örneğin bir index scan ya da bir sequential scan. EXPLAIN onun planını gösterir.
point:
  term: point
  in: [influxdb]
  en: One measurement in a time-series database - a series key, one or more field values and a timestamp.
  tr: Bir time-series database'te bir ölçüm - bir series key, bir ya da daha fazla field değeri ve bir timestamp.
posting-list:
  term: posting list
  in: [opensearch]
  en: The list of documents that contain one token. It is one entry of the inverted index.
  tr: Bir token'ı içeren document'ların listesi. Inverted index'in bir girdisidir.
prefix:
  term: prefix
  in: [s3]
  en: The common start of some S3 keys, for example uploads/. The console shows prefixes as folders.
  tr: Bazı S3 key'lerinin ortak başlangıcı, örneğin uploads/. Konsol prefix'leri klasör olarak gösterir.
presigned-url:
  term: presigned URL
  in: [s3]
  en: A URL that contains a signature and an expiry time. Anyone who has it can do one operation on one object until it expires.
  tr: Bir imza ve bir süre sonu içeren URL. Ona sahip olan herkes süresi dolana kadar bir object üzerinde tek bir işlem yapabilir.
primary-key:
  term: primary key
  in: [aurora, dynamodb, keyspaces]
  en: The column or columns whose value identifies exactly one row or item. No two rows can have the same primary key.
  tr: Değeri tam olarak tek bir row'u ya da item'ı tanımlayan kolon ya da kolonlar. İki row aynı primary key'e sahip olamaz.
projection:
  term: projection
  in: [docdb]
  en: The part of a query that selects which fields come back, for example only name and price.
  tr: Hangi field'ların döneceğini seçen query kısmı, örneğin sadece name ve price.
property-graph:
  term: property graph
  in: [neptune]
  en: A graph model with vertices and edges. Both have a label and properties.
  tr: Vertex'ler ve edge'lerden oluşan graph modeli. İkisinin de bir label'ı ve property'leri vardır.
query:
  term: query
  in: [aurora]
  en: A request to a database for data, for example a SELECT statement in SQL.
  tr: Database'e veri için yapılan istek, örneğin SQL'de bir SELECT statement'ı.
race-condition:
  term: race condition
  in: [elasticache]
  en: An error whose result depends on the order of parallel operations, for example two clients that read a counter and write it back.
  tr: Sonucu paralel işlemlerin sırasına bağlı olan hata, örneğin bir sayacı okuyup geri yazan iki client.
read-request-unit:
  term: read request unit
  in: [dynamodb]
  en: The unit in which DynamoDB on-demand charges reads. One unit is one strongly consistent read of up to 4 KB, or two eventually consistent reads.
  tr: DynamoDB on-demand'in okumaları ücretlendirdiği birim. Bir birim, 4 KB'a kadar bir strongly consistent okuma ya da iki eventually consistent okumadır.
relational-database:
  term: relational database
  in: [aurora]
  en: A database that stores data in tables with columns and rows, links tables with keys and answers SQL queries.
  tr: Veriyi kolonlu ve row'lu table'larda saklayan, table'ları key'lerle bağlayan ve SQL query'lerini cevaplayan database.
replica:
  term: replica
  in: [opensearch]
  en: A copy of data on another node. It protects against the loss of a node and adds capacity for reads.
  tr: Verinin başka bir node'daki kopyası. Bir node'un kaybına karşı korur ve okumalar için kapasite ekler.
retention-period:
  term: retention period
  in: [influxdb]
  en: How long a bucket keeps data. InfluxDB deletes data that is older, in complete shard groups.
  tr: Bir bucket'ın veriyi ne kadar süre tuttuğu. InfluxDB daha eski veriyi bütün shard group'lar hâlinde siler.
row-lock:
  term: row lock
  in: [aurora]
  en: A lock on one row that a transaction holds until it ends. Another transaction that wants to change the same row waits.
  tr: Bir transaction'ın bitene kadar tuttuğu tek bir row üzerindeki kilit. Aynı row'u değiştirmek isteyen başka bir transaction bekler.
schema:
  term: schema
  in: [aurora]
  en: The definition of the tables, their columns, types and rules. The database checks each write against it.
  tr: Table'ların, kolonlarının, tiplerinin ve kurallarının tanımı. Database her yazmayı ona göre kontrol eder.
seq-scan:
  term: Seq Scan
  in: [aurora]
  en: A PostgreSQL plan step that reads every page of a table in order.
  tr: Bir table'ın her page'ini sırayla okuyan PostgreSQL plan adımı.
series:
  term: series
  in: [influxdb]
  en: All points with the same measurement, tag set and field key, stored in time order.
  tr: Aynı measurement, tag set ve field key'e sahip, zaman sırasıyla saklanan bütün point'ler.
shard:
  term: shard
  in: [opensearch]
  en: A part of an index with a part of the documents. Shards let an index spread over several nodes.
  tr: Document'ların bir kısmını tutan index parçası. Shard'lar bir index'in birkaç node'a yayılmasını sağlar.
slice:
  term: slice
  in: [redshift]
  en: A part of a Redshift compute node with its own share of the data. All slices work on a query at the same time.
  tr: Verinin kendi payını tutan Redshift compute node parçası. Bütün slice'lar bir query üzerinde aynı anda çalışır.
sort-key:
  term: sort key
  in: [dynamodb, redshift]
  en: In DynamoDB, the part of the primary key that sorts the items of one partition key. In Redshift, the columns that set the order of rows on disk.
  tr: DynamoDB'de bir partition key'in item'larını sıralayan primary key kısmı. Redshift'te row'ların diskteki sırasını belirleyen kolonlar.
sorted-set:
  term: sorted set
  in: [elasticache]
  en: A Valkey and Redis data type that keeps members sorted by a score, for example a top-10 list.
  tr: Üyeleri bir score'a göre sıralı tutan Valkey ve Redis veri tipi, örneğin bir ilk-10 listesi.
storage-class:
  term: storage class
  in: [s3]
  en: The S3 setting of an object that sets its price per GB, the cost of a read and the time to get it back.
  tr: Bir object'in GB başına fiyatını, okuma maliyetini ve geri getirme süresini belirleyen S3 ayarı.
system-of-record:
  term: system of record
  in: [aurora]
  en: The database that holds the official copy of some data. Other systems copy from it.
  tr: Bazı verilerin resmi kopyasını tutan database. Diğer sistemler ondan kopyalar.
token:
  term: token
  in: [opensearch]
  en: One unit of text after analysis, usually one word in a normal form.
  tr: Analizden sonra metnin bir birimi, çoğunlukla normal biçimde bir kelime.
transaction:
  term: transaction
  in: [aurora]
  en: A group of changes that the database applies completely or not at all.
  tr: Database'in tamamen uyguladığı ya da hiç uygulamadığı değişiklik grubu.
transactwriteitems:
  term: TransactWriteItems
  in: [dynamodb]
  en: A DynamoDB operation that writes up to 100 items as one transaction, with a condition on each item.
  tr: Her item üzerinde bir koşulla, en fazla 100 item'ı tek bir transaction olarak yazan DynamoDB işlemi.
traversal:
  term: traversal
  in: [neptune]
  en: A graph query that starts at a vertex and follows edges. It reads only the part of the graph that it walks through.
  tr: Bir vertex'ten başlayıp edge'leri takip eden graph query'si. Graph'ın sadece içinden geçtiği kısmını okur.
ttl:
  term: TTL
  in: [dynamodb, elasticache]
  en: Time to live. A time after which the database deletes an item or a key automatically.
  tr: Time to live. Database'in bir item'ı ya da key'i otomatik olarak sildiği zaman.
update-anomaly:
  term: update anomaly
  in: [aurora]
  en: An error that occurs when the same fact is stored in several rows and an update changes only some of them.
  tr: Aynı bilgi birkaç row'da saklandığında ve bir güncelleme sadece bazılarını değiştirdiğinde ortaya çıkan hata.
versioning:
  term: versioning
  in: [s3]
  en: An S3 bucket setting. Each write to a key adds a new version, and a delete adds a delete marker. Old versions stay.
  tr: Bir S3 bucket ayarı. Bir key'e her yazma yeni bir version ekler ve bir silme bir delete marker ekler. Eski version'lar kalır.
vertex:
  term: vertex
  in: [neptune]
  en: A thing in a graph, for example a customer or a product. It has a label and properties.
  tr: Bir graph'taki bir şey, örneğin bir müşteri ya da bir ürün. Bir label'ı ve property'leri vardır.
wide-column-store:
  term: wide-column store
  in: [keyspaces]
  en: A database that groups rows by a partition key and keeps them sorted inside each partition. Apache Cassandra is an example.
  tr: Row'ları bir partition key'e göre gruplayan ve her partition'ın içinde sıralı tutan database. Apache Cassandra bir örnektir.
zone-map:
  term: zone map
  in: [redshift]
  en: The smallest and largest value of each 1 MB block of a Redshift column. Redshift uses it to skip blocks that cannot match a filter.
  tr: Bir Redshift kolonunun her 1 MB'lık bloğunun en küçük ve en büyük değeri. Redshift onu bir filtreyle eşleşemeyecek blokları atlamak için kullanır.
