{% extends "base.html" %}
{% block main %}
<div class="section-head"><div><h1>My orders</h1><p>Orders of this browser, from Aurora PostgreSQL with one JOIN over three tables.</p></div>
  <span class="engine-tag">Aurora</span></div>
<div class="panel" id="orders"><table><thead><tr><th>Order</th><th>Date</th><th>Status</th><th>Products</th><th class="num">Total</th></tr></thead><tbody id="rows"></tbody></table></div>
{% endblock %}
{% block scripts %}
<script>
(async () => {
  const { api, esc, tl, $ } = lm;
  try {
    const rows = await api("/aurora/api/orders", { label: "Read my orders", source: "#orders" });
    $("#rows").innerHTML = rows.map((o) => `<tr><td>${esc(o.order_id)}</td><td>${new Date(o.order_date).toLocaleString("tr-TR")}</td><td>${esc(o.status)}</td>
      <td>${esc(o.products)}</td><td class="num">${tl(o.total)}</td></tr>`).join("")
      || '<tr><td colspan="5">You have no order yet. Add a product to the cart and go to checkout.</td></tr>';
  } catch (e) { lm.errorBox($("#rows"), e); }
})();
</script>
{% endblock %}
