# 101 lessons for Amazon OpenSearch Service (Turkish). The search lesson has its own template.
search:
  title: "OpenSearch 101: ürün araması"
  apis: ["/api/search"]
  template: "learn/opensearch/search.html"

suggest:
  title: "OpenSearch 101: yazarken öneri"
  apis: ["/api/suggest"]
  kicker: "OpenSearch 101: search-as-you-type"
  headline: "Arama kutusuna üç harf yazdığında öneriler nasıl hemen geldi?"
  lead: "Header'daki arama kutusu, sen yazarken OpenSearch'e önek (prefix) sorgusu gönderdi. Bu sayfa önekle aramanın nasıl çalıştığını gösteriyor."
  focus: "data:product_id"
  need: "Bu dersi kendi verinle görmek için üstteki arama kutusuna en az 3 harf yaz, sonra paneldeki 101 bağlantısına tıkla."
  big:
    title: "Büyük resim: index ve önerilen ürünler"
    text: "Her kare products index'indeki bir belge. Teal kareler yazdığın harflerle başlayan ve öneri olarak gelen ürünler."
    legend: '<span><i class="k"></i>Aranan alan</span>'
  sections:
    - title: "Önek araması nasıl çalışır?"
      html: |
        <p><code>match_phrase_prefix</code> sorgusu, yazdığın son kelimeyi bir önek sayar. <q>kabl</q> yazdığında OpenSearch ters dizinde <q>kabl</q> ile başlayan kelimeleri
        (<q>kablo</q>, <q>kablosuz</q>) bulur ve bu kelimeleri içeren ürünleri getirir.</p>
        <p>Ters dizindeki kelimeler alfabetik sırada durduğu için <q>şununla başlayanlar</q> sorusu sözlükte bir sayfaya atlamak kadar hızlıdır.
        Öneri her tuş vuruşunda değil, yazmayı 250 ms bıraktığında gider; böylece gereksiz istek yapılmaz.</p>
  explain:
    "_search (prefix)":
      title: "Önekle aramak"
      text: "Yazdığın metin analyzer'dan geçti; son kelime önek olarak arandı. Yalnız ad ve kategori döndü, en fazla 6 öneri."
  analogy:
    icon: "🔤"
    html: "<p>Bir sözlükte <q>kab</q> ile başlayan kelimeleri arıyorsun. Sayfaları baştan çevirmezsin; K harfine, sonra <q>ka</q>'ya, sonra <q>kab</q>'a atlarsın. Önek araması bu atlamadır.</p>"
  alternatives:
    engine: "OpenSearch"
    criteria: ["Her tuşta hızlı", "Türkçe harfsiz yazım", "Alakaya göre sıra"]
    rows:
      - { name: "OpenSearch match_phrase_prefix", chosen: true, cells: [[y, "Ters dizinde önek"], [y, "Aynı analyzer"], [y, "Puanlı"]] }
      - { name: "Aurora LIKE 'kab%'", sub: "B-tree index", cells: [[p, "Yalnız ad başında"], [n, "ı ≠ i"], [n, "Yok"]] }
      - { name: "ElastiCache", sub: "önceden hazırlanmış öneri listesi", cells: [[y, "Çok hızlı"], [p, "Listeyi sen hazırlarsın"], [p, "Sen sıralarsın"]] }
    verdict: "Öneri, aramayla aynı index'ten ve aynı Türkçe kurallarla gelmeli. OpenSearch ikisini tek yerden verir."
  try:
    - { href: "/", label: "Arama kutusuna 'kabl' yaz" }
  glossary:
    - ["Önek (prefix)", "Bir kelimenin baş kısmı."]
    - ["match_phrase_prefix", "Son kelimeyi önek kabul eden OpenSearch sorgusu."]

geo:
  title: "OpenSearch 101: en yakın mağaza"
  apis: ["/api/stores"]
  kicker: "OpenSearch 101: coğrafi arama"
  headline: "Haritada sana en yakın mağazalar nasıl bulundu ve sıralandı?"
  lead: "Mağaza bulucu OpenSearch'e bir nokta ve bir yarıçap gönderdi. Bu sayfa konumun nasıl saklandığını ve mesafeye göre nasıl arandığını gösteriyor."
  focus: "data:store_id"
  sample: { url: "/opensearch/api/stores?lat=41.0082&lon=28.9784&km=25", label: "Stores near Istanbul" }
  big:
    title: "Büyük resim: stores index'i ve yarıçapın içindekiler"
    text: "Her kare bir mağaza, raflar şehirler. Teal kareler senin seçtiğin yarıçapın içine düşen mağazalar."
    legend: '<span><i class="k"></i>Konum alanı (geo_point)</span>'
  sections:
    - title: "Kaynakta veri böyleydi, OpenSearch'te böyle duruyor"
      html: |
        <div class="src-store">
          <div><h3>Kaynak: mağaza adresi</h3><pre>Lale Market Kadıköy
        İstanbul
        41.0082 K, 28.9784 D</pre></div>
          <div><h3>OpenSearch'te: geo_point</h3><pre>{ "name": "Lale Market Kadıköy",
          "city": "İstanbul",
          "location": { "lat": 41.0082, "lon": 28.9784 } }</pre></div>
        </div>
        <p><code>geo_point</code> tipindeki alan, enlem ve boylamı dünyayı küçük karelere bölen bir ızgarada index'ler. <q>25 km içindekiler</q> sorusu için OpenSearch önce çemberle kesişen kareleri seçer,
        sonra yalnız o karelerdeki mağazaların gerçek mesafesini hesaplar. Bütün mağazalara mesafe hesaplanmaz.</p>
  explain:
    "_search (geo_distance)":
      title: "Yarıçap filtresi ve mesafeye göre sıralama"
      text: "<code>geo_distance</code> yarıçapın dışındakileri eler, <code>_geo_distance</code> sıralaması kalanları yakından uzağa dizer. Dönen her mağazanın yanında kilometre cinsinden mesafe var."
  analogy:
    icon: "📍"
    html: "<p>Bir haritayı karelere bölmüş bir rehber düşün. <q>Bana 2 km içindeki eczaneler</q> dediğinde rehber önce bulunduğun kareye ve komşu karelere bakar; şehrin öbür ucundaki kareleri hiç açmaz.</p>"
  alternatives:
    engine: "OpenSearch"
    criteria: ["Yarıçap araması", "Mesafeye göre sıra", "Metin aramasıyla birlikte"]
    rows:
      - { name: "OpenSearch geo_point", chosen: true, cells: [[y, "geo_distance"], [y, "_geo_distance"], [y, "Aynı sorguda"]] }
      - { name: "Aurora + PostGIS", sub: "coğrafi eklenti", cells: [[y, "ST_DWithin"], [y, "ORDER BY mesafe"], [p, "Ayrı metin araması"]] }
      - { name: "DocumentDB 2dsphere", sub: "coğrafi index", cells: [[y, "$geoNear"], [y, "Mesafeyle"], [p, "Metin araması İngilizce"]] }
      - { name: "Amazon Location Service", sub: "harita ve yer arama hizmeti", cells: [[p, "Geofence ve yer arama"], [p, "Kendi mağaza listen için ek iş"], [n, "Ayrı hizmet"]] }
    verdict: "Mağaza bulucu zaten metin araması için kullanılan OpenSearch'te durur: aynı index ailesi hem <q>Kadıköy</q> kelimesini hem 25 km yarıçapını cevaplar. Ayrı bir coğrafi sistem gerekmez."
  try:
    - { href: "/stores", label: "Mağaza bulucuda yarıçapı değiştir" }
  glossary:
    - ["geo_point", "Enlem ve boylam tutan OpenSearch alan tipi."]
    - ["geo_distance", "Bir noktaya belli mesafedeki belgeleri seçen filtre."]
    - ["Enlem / boylam", "Bir noktanın dünyadaki kuzey-güney ve doğu-batı konumu."]
