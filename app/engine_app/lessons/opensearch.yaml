# 101 lessons for Amazon OpenSearch Service (English, ASD-STE100). The search lesson has its own template.
search:
  title: "OpenSearch 101: product search"
  apis: ["/api/search"]
  template: "learn/opensearch/search.html"

suggest:
  title: "OpenSearch 101: suggestions while you type"
  apis: ["/api/suggest"]
  kicker: "OpenSearch 101: search-as-you-type"
  headline: "When you typed three letters in the search box, how did the suggestions come so fast?"
  lead: "While you typed, the search box in the header sent prefix queries to OpenSearch. This page shows how a prefix search works."
  focus: "data:product_id"
  need: "To see this lesson with your own data, type at least 3 letters in the search box at the top, then click the 101 link in the panel."
  big:
    title: "The big picture: the index and the suggested products"
    text: "Each square is one document in the products index. The teal squares are the products that start with the letters that you typed and that came back as suggestions."
    legend: '<span><i class="k"></i>The searched field</span>'
  sections:
    - title: "How does a prefix search work?"
      html: |
        <p>The query <code>match_phrase_prefix</code> treats the last word that you typed as a prefix. When you type <q>kabl</q>, OpenSearch finds the words in the inverted index that start with <q>kabl</q>
        (<q>kablo</q>, <q>kablosuz</q>) and returns the products that contain these words.</p>
        <p>The words in the inverted index are in alphabetical order, so the question <q>words that start with this</q> is as fast as a jump to one page of a dictionary.
        The suggestion is not sent at each key press. It is sent when you stop typing for 250 ms, so the shop does not send unnecessary requests.</p>
  explain:
    "_search (prefix)":
      title: "Search with a prefix"
      text: "The text that you typed went through the analyzer, and OpenSearch searched for the last word as a prefix. Only the name and the category came back, with at most 6 suggestions."
  analogy:
    icon: "🔤"
    html: "<p>You look for the words that start with <q>kab</q> in a dictionary. You do not turn the pages from the start. You go to the letter K, then to <q>ka</q>, then to <q>kab</q>. A prefix search is this jump.</p>"
  alternatives:
    engine: "OpenSearch"
    criteria: ["Fast at each key", "Typing without Turkish letters", "Order by relevance"]
    rows:
      - { name: "OpenSearch match_phrase_prefix", chosen: true, cells: [[y, "Prefix in the inverted index"], [y, "The same analyzer"], [y, "Scored"]] }
      - { name: "Aurora LIKE 'kab%'", sub: "B-tree index", cells: [[p, "Only at the start of the name"], [n, "ı ≠ i"], [n, "No"]] }
      - { name: "ElastiCache", sub: "a prepared suggestion list", cells: [[y, "Very fast"], [p, "You prepare the list"], [p, "You sort it"]] }
    verdict: "Suggestions must come from the same index as the search, with the same Turkish rules. OpenSearch gives both from one place."
  try:
    - { href: "/", label: "Type 'kabl' in the search box" }
  glossary:
    - ["Prefix", "The first part of a word."]
    - ["match_phrase_prefix", "An OpenSearch query that treats the last word as a prefix."]

geo:
  title: "OpenSearch 101: the nearest store"
  apis: ["/api/stores"]
  kicker: "OpenSearch 101: geographic search"
  headline: "How did the shop find and sort the stores nearest to you on the map?"
  lead: "The store finder sent a point and a radius to OpenSearch. This page shows how the location is stored and how OpenSearch searches by distance."
  focus: "data:store_id"
  sample: { url: "/opensearch/api/stores?lat=41.0082&lon=28.9784&km=25", label: "Stores near Istanbul" }
  big:
    title: "The big picture: the stores index and the stores inside the radius"
    text: "Each square is one store, and the shelves are cities. The teal squares are the stores inside the radius that you selected."
    legend: '<span><i class="k"></i>The location field (geo_point)</span>'
  sections:
    - title: "The data at the source, and the data in OpenSearch"
      html: |
        <div class="src-store">
          <div><h3>Source: the store address</h3><pre>Lale Market Kadıköy
        İstanbul
        41.0082 N, 28.9784 E</pre></div>
          <div><h3>In OpenSearch: geo_point</h3><pre>{ "name": "Lale Market Kadıköy",
          "city": "İstanbul",
          "location": { "lat": 41.0082, "lon": 28.9784 } }</pre></div>
        </div>
        <p>A field of type <code>geo_point</code> indexes the latitude and the longitude in a grid that divides the world into small cells. For the question <q>stores within 25 km</q>, OpenSearch first selects the cells that the circle touches.
        Then it calculates the real distance only for the stores in these cells. It does not calculate the distance to every store.</p>
  explain:
    "_search (geo_distance)":
      title: "Radius filter and sort by distance"
      text: "<code>geo_distance</code> removes the stores outside the radius, and the <code>_geo_distance</code> sort puts the others from the nearest to the farthest. Each returned store has its distance in kilometers."
  analogy:
    icon: "📍"
    html: "<p>Think of a city guide that divides the map into squares. When you ask for <q>pharmacies within 2 km of me</q>, the guide first looks at your square and the squares next to it. It never opens the squares at the other end of the city.</p>"
  alternatives:
    engine: "OpenSearch"
    criteria: ["Radius search", "Order by distance", "Together with text search"]
    rows:
      - { name: "OpenSearch geo_point", chosen: true, cells: [[y, "geo_distance"], [y, "_geo_distance"], [y, "In the same query"]] }
      - { name: "Aurora + PostGIS", sub: "geographic extension", cells: [[y, "ST_DWithin"], [y, "ORDER BY distance"], [p, "Separate text search"]] }
      - { name: "DocumentDB 2dsphere", sub: "geographic index", cells: [[y, "$geoNear"], [y, "With the distance"], [p, "Text search in English"]] }
      - { name: "Amazon Location Service", sub: "map and place search service", cells: [[p, "Geofences and place search"], [p, "Extra work for your own store list"], [n, "A separate service"]] }
    verdict: "The store finder lives in OpenSearch, which the shop already uses for text search. The same family of indexes answers both the word <q>Kadıköy</q> and the 25 km radius. No separate geographic system is necessary."
  try:
    - { href: "/stores", label: "Change the radius in the store finder" }
  glossary:
    - ["geo_point", "An OpenSearch field type that holds a latitude and a longitude."]
    - ["geo_distance", "A filter that selects the documents within a distance of a point."]
    - ["Latitude / longitude", "The north-south and east-west position of a point on the world."]
