# 101 lessons for Amazon S3 (Turkish).
objects:
  title: "S3 101: görseller ve nesne depolama"
  apis: ["/api/gallery", "/api/upload", "/api/presign", "/api/img"]
  kicker: "S3 101: nesne (blob) depolama"
  headline: "Ürün fotoğrafları ve yüklediğin görseller nerede ve nasıl duruyor?"
  lead: "Satıcı paneli S3'teki görselleri listeledi, birinin bilgisini okudu ya da yeni bir görsel yükledi. Bu sayfa bir dosyanın S3'te nesneye nasıl dönüştüğünü gösteriyor."
  focus: ["data:key", "path"]
  sample: { url: "/s3/api/gallery", label: "List the gallery" }
  big:
    title: "Büyük resim: bucket ve içindeki nesneler"
    text: "Her kare bir nesne. Raflar anahtarın öneki: <code>products/</code> ürün fotoğrafları, <code>uploads/</code> ziyaretçilerin yüklediği görseller. Teal kareler senin çağrının dokunduğu nesneler."
    legend: '<span><i class="k"></i>Anahtar ve metadata</span>'
  sections:
    - title: "Kaynakta veri böyleydi, S3'te böyle duruyor"
      html: |
        <p>Kaynakta veri bir dosyadır: bir JPEG fotoğraf. S3 dosyayı açıp içine bakmaz; baytları olduğu gibi saklar ve yanına onu tarif eden bilgileri (metadata) koyar.</p>
        <div class="src-store">
          <div><h3>Kaynak: bilgisayardaki dosya</h3><pre>kulaklik.jpg   184 KB
        Çeken: Wikimedia Commons katkıcısı
        Lisans: CC BY-SA 4.0</pre></div>
          <div><h3>S3'te: bir nesne</h3><pre>Key:          products/P0001.jpg
        Body:         184.211 bayt
        Content-Type: image/jpeg
        x-amz-meta-author, x-amz-meta-license
        VersionId, ETag, StorageClass</pre></div>
        </div>
        <ul>
          <li><b>Anahtar (key)</b> nesnenin tam adıdır. <code>products/</code> bir klasör gibi görünür ama S3'te klasör yoktur: tek, düz bir ad uzayı vardır ve önek yalnız adın başıdır.</li>
          <li><b>Metadata</b> nesneyle birlikte saklanan küçük bilgilerdir. HEAD isteği baytları indirmeden yalnız bunları getirir.</li>
          <li><b>Versioning</b> açık: aynı anahtara yeniden yüklersen eski hali silinmez, eski bir sürüm olarak kalır.</li>
          <li>S3 nesneyi en az 3 Availability Zone'a yazar ve 11 dokuzluk (%99,999999999) dayanıklılık için tasarlanmıştır.</li>
        </ul>
  explain:
    ListObjectsV2:
      title: "Önekle listelemek"
      text: "Bir önekle başlayan anahtarlar sıralı olarak listelendi (en fazla 12). Liste nesnelerin içeriğini değil, adını, boyutunu ve tarihini verir."
    HeadObject:
      title: "Metadata'yı okumak"
      text: "HEAD, nesnenin baytlarını indirmeden içerik tipini, boyutunu, sürüm kimliğini ve senin yazdığın <code>x-amz-meta-*</code> alanlarını getirir."
    PutObject:
      title: "Nesne yazmak"
      text: "Görselin baytları ve metadata'sı tek istekte yazıldı. S3 yazmayı onayladığında nesne birden fazla AZ'de durur ve hemen okunabilir."
    generate_presigned_url:
      title: "Süreli bağlantı üretmek"
      text: "Engine App, kendi yetkisiyle imzalanmış ve 5 dakika geçerli bir URL üretti. Bu sırada S3'e hiç gidilmedi: imza yerel olarak hesaplandı. Bağlantıyı alan kişi bucket'a erişim izni olmadan yalnız bu nesneyi indirebilir."
  analogy:
    icon: "📦"
    html: "<p>Bir emanet deposunda her paketin üzerinde bir etiket var: paketin numarası (anahtar) ve kısa notlar (metadata). Görevli paketi açmaz, yalnız saklar ve numarayla geri verir. Depo hiç dolmaz ve her paketin iki ayrı binada yedeği vardır.</p>"
  alternatives:
    engine: "S3"
    criteria: ["Büyük dosyalar", "Sınırsız alan", "Dayanıklılık", "Tarayıcıya doğrudan verme", "Maliyet"]
    rows:
      - { name: "Amazon S3", chosen: true, cells: [[y, "Nesne başına 5 TB"], [y, "Sınırsız"], [y, "11 dokuz, çok AZ"], [y, "Presigned URL, CloudFront"], [y, "GB başına düşük, kullandığın kadar"]] }
      - { name: "Amazon EFS", sub: "paylaşılan dosya sistemi", cells: [[y, "Dosya"], [y, "Esnek"], [y, "Çok AZ"], [n, "Uygulama sunmalı"], [p, "S3'ten pahalı"]] }
      - { name: "Veritabanında BLOB", sub: "ör. Aurora bytea", cells: [[p, "Veritabanını şişirir"], [p, "Depolama sınırı"], [y, "Aurora kadar"], [n, "Uygulama sunmalı"], [n, "En pahalı GB"]] }
    verdict: "Fotoğraf gibi büyük, değişmeyen ve olduğu gibi sunulan dosyalar veritabanına değil nesne deposuna gider. Veritabanı yalnız anahtarı (ör. <code>products/P0001.jpg</code>) bilir."
  try:
    - { href: "/seller", label: "Satıcı panelinden bir görsel yükle" }
    - { href: "/seller", label: "Presigned URL üret" }
  glossary:
    - ["Nesne (object)", "S3'te saklanan baytlar ve metadata'sı."]
    - ["Bucket", "Nesnelerin durduğu, adı dünyada tekil olan kap."]
    - ["Anahtar (key)", "Bucket içinde nesnenin tam adı."]
    - ["Presigned URL", "Belli bir süre geçerli, imzalı indirme bağlantısı."]
    - ["Versioning", "Aynı anahtarın eski hallerini sürüm olarak saklamak."]
