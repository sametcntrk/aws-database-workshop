# 101 lessons for Amazon S3 (English, ASD-STE100).
objects:
  title: "S3 101: images and object storage"
  apis: ["/api/gallery", "/api/upload", "/api/presign", "/api/img"]
  kicker: "S3 101: object (blob) storage"
  headline: "Where and how are the product photos and your uploaded images stored?"
  lead: "The seller panel listed the images in S3, read the information of one image or uploaded a new image. This page shows how a file becomes an object in S3."
  focus: ["data:key", "path"]
  sample: { url: "/s3/api/gallery", label: "List the gallery" }
  big:
    title: "The big picture: the bucket and its objects"
    text: "Each square is one object. The shelves are key prefixes: <code>products/</code> holds the product photos, and <code>uploads/</code> holds the images that visitors uploaded. The teal squares are the objects that your call touched."
    legend: '<span><i class="k"></i>Key and metadata</span>'
  sections:
    - title: "The data at the source, and the data in S3"
      html: |
        <p>At the source, the data is a file: a JPEG photo. S3 does not open the file or look inside it. It stores the bytes as they are, and next to them the information that describes them (metadata).</p>
        <div class="src-store">
          <div><h3>Source: the file on a computer</h3><pre>kulaklik.jpg   184 KB
        Author: a Wikimedia Commons contributor
        License: CC BY-SA 4.0</pre></div>
          <div><h3>In S3: one object</h3><pre>Key:          products/P0001.jpg
        Body:         184,211 bytes
        Content-Type: image/jpeg
        x-amz-meta-author, x-amz-meta-license
        VersionId, ETag, StorageClass</pre></div>
        </div>
        <ul>
          <li><b>The key</b> is the full name of the object. <code>products/</code> looks like a folder, but S3 has no folders. It has one flat name space, and the prefix is only the start of the name.</li>
          <li><b>Metadata</b> is small information that S3 stores with the object. A HEAD request gets only the metadata, without a download of the bytes.</li>
          <li><b>Versioning</b> is on. If you upload to the same key again, the old object is not deleted. It stays as an older version.</li>
          <li>S3 Standard stores the object in at least 3 Availability Zones and is designed for 11 nines (99.999999999%) of durability.</li>
        </ul>
  explain:
    ListObjectsV2:
      title: "List by prefix"
      text: "The keys that start with a prefix were listed in sorted order (at most 12). The list gives the name, the size and the date of each object, not its content."
    HeadObject:
      title: "Read the metadata"
      text: "HEAD gets the content type, the size, the version id and the <code>x-amz-meta-*</code> fields that you wrote, without a download of the bytes."
    PutObject:
      title: "Write an object"
      text: "One request wrote the bytes and the metadata of the image. When S3 confirms the write, the object is stored in more than one AZ and you can read it immediately."
    generate_presigned_url:
      title: "Make a link with an expiry"
      text: "The Engine App made a URL that it signed with its own permissions. The URL is valid for 5 minutes. The Engine App did not call S3 for this: it calculated the signature locally. A person who gets the link can download only this object, with no permission on the bucket."
  analogy:
    icon: "📦"
    html: "<p>In a left-luggage office, each parcel has a label: the number of the parcel (the key) and short notes (the metadata). The attendant does not open the parcel. The attendant only keeps it and gives it back for the number. The office never becomes full, and each parcel has a copy in two other buildings.</p>"
  alternatives:
    engine: "S3"
    criteria: ["Large files", "Unlimited space", "Durability", "Direct delivery to the browser", "Cost"]
    rows:
      - { name: "Amazon S3", chosen: true, cells: [[y, "5 TB per object"], [y, "Unlimited"], [y, "11 nines, several AZs"], [y, "Presigned URL, CloudFront"], [y, "Low per GB, pay for use"]] }
      - { name: "Amazon EFS", sub: "shared file system", cells: [[y, "Files"], [y, "Elastic"], [y, "Several AZs"], [n, "The app must serve it"], [p, "More expensive than S3"]] }
      - { name: "BLOB in a database", sub: "for example Aurora bytea", cells: [[p, "Makes the database large"], [p, "Storage limit"], [y, "As Aurora"], [n, "The app must serve it"], [n, "The most expensive GB"]] }
    verdict: "Large files that do not change and that the shop serves as they are, like photos, go to an object store, not to a database. The database knows only the key (for example <code>products/P0001.jpg</code>)."
  try:
    - { href: "/seller", label: "Upload an image in the seller panel" }
    - { href: "/seller", label: "Make a presigned URL" }
  glossary:
    - ["Object", "The bytes stored in S3, with their metadata."]
    - ["Bucket", "The container of the objects. Its name is unique in the world."]
    - ["Key", "The full name of an object in a bucket."]
    - ["Presigned URL", "A signed download link that is valid for a set time."]
    - ["Versioning", "Keep the old contents of the same key as versions."]
