# 101 lessons for Amazon DocumentDB (Turkish). Rendered by templates/learn/lesson.html.
catalog:
  title: "DocumentDB 101: ana sayfa vitrini"
  apis: ["/api/home"]
  kicker: "DocumentDB 101: belge veritabanı"
  headline: "Ana sayfadaki kategori menüsü ve vitrin, tek bir koleksiyondan nasıl çıktı?"
  lead: "Ana sayfa açılınca Lale Market, ürün kataloğuna iki soru sordu: hangi kategoriler var, en beğenilen ürünler hangileri? Bu sayfa iki sorunun da DocumentDB içinde nasıl cevaplandığını gösteriyor."
  focus: "data:product_id"
  sample: { url: "/docdb/api/home", label: "Load the home page" }
  big:
    title: "Büyük resim: kataloğun tamamı ve vitrine çıkanlar"
    text: "Her kare <code>products</code> koleksiyonundaki bir ürün belgesi. Teal kareler vitrine seçilen ürünler. Bir kareye tıkla; sağda o ürünün belgesi iç içe alanlarıyla açılır."
    legend: '<span><i class="k"></i>Index''i olan alanlar</span>'
  sections:
    - title: "Kaynakta veri böyleydi, DocumentDB'de böyle duruyor"
      html: |
        <p>Bir ürünün bilgileri tek bir yerde, tek bir <b>belge</b> (document) olarak durur. Belge bir JSON nesnesidir: içinde metin, sayı, liste ve başka nesneler olabilir.
        İlişkisel bir veritabanında aynı ürün için ürün, renk, etiket ve garanti bilgisi ayrı tablolara bölünürdü. Burada hepsi bir arada.</p>
        <div class="src-store">
          <div><h3>Kaynak: katalog ekibinin elindeki ürün</h3><pre>Ad: Alpen Kablosuz Kulaklık 1
        Kategori: Elektronik, fiyat: 1.299 TL
        Renk: siyah, garanti: 24 ay
        Etiketler: yeni, çok satan</pre></div>
          <div><h3>DocumentDB'de: tek bir belge</h3><pre>{ "_id": "P0001", "name": "…", "category": "Elektronik",
          "price": 1299.9,
          "attributes": { "renk": "siyah", "garanti_ay": 24 },
          "tags": ["yeni", "çok satan"] }</pre></div>
        </div>
        <p>Ürünlerin alanları birbirinden farklı olabilir: bir kitabın sayfa sayısı, bir ayakkabının numarası olur. Belge veritabanı bunun için tabloyu değiştirmeni istemez.</p>
  explain:
    aggregate:
      title: "Kategori menüsü: aggregation"
      text: "DocumentDB bütün ürünleri kategoriye göre grupladı, her grupta ürünleri saydı ve en düşük fiyatı buldu (<code>$group</code>). Hesap sunucuda yapıldı; tarayıcıya yalnız 5 satır geldi."
    find:
      title: "Vitrin: filtre, sıralama ve projection"
      text: "Puanı 4,5 ve üstü olan belgeler seçildi, puana göre sıralandı ve ilk 8'i alındı. <b>Projection</b> ile yalnız kartta gereken alanlar döndü; açıklama ve öteki alanlar ağa hiç çıkmadı."
  analogy:
    icon: "📁"
    html: "<p>Her ürün için bir dosya klasörü düşün. Ürünle ilgili her kâğıt (fiyat, renk, garanti belgesi, etiketler) o klasörün içinde. Bir ürünü görmek için tek bir klasörü açarsın, beş farklı dolaba gitmezsin.</p><p>Belge veritabanı bu klasörlerin dolabıdır. Kategori menüsü ise dolabın kapağındaki özet: her rafta kaç klasör var.</p>"
  alternatives:
    engine: "DocumentDB"
    criteria: ["Farklı alanlı ürünler", "İç içe veri tek okumada", "Kategori özeti", "Mevcut MongoDB kodu", "Kim işletir"]
    rows:
      - { name: "Amazon DocumentDB", chosen: true, cells: [[y, "Şema serbest belge"], [y, "Bir belge, bir okuma"], [y, "Aggregation pipeline"], [y, "MongoDB API uyumlu"], [y, "AWS: yedek, kopya, yama"]] }
      - { name: "Aurora PostgreSQL", sub: "tablolar, istersen <code>jsonb</code>", cells: [[p, "<code>jsonb</code> sütunuyla"], [p, "JOIN veya jsonb"], [y, "<code>GROUP BY</code>"], [n, "SQL'e çevirmek gerekir"], [y, "AWS"]] }
      - { name: "DynamoDB", sub: "anahtar-değer ve belge", cells: [[y, "Şema serbest item"], [y, "400 KB'a kadar item"], [n, "Sunucuda gruplama yok"], [n, "Farklı API"], [y, "AWS, sunucusuz"]] }
      - { name: "EC2 üzerinde MongoDB", sub: "kendi kurulumun", cells: [[y, "Aynı"], [y, "Aynı"], [y, "Aynı"], [y, "Aynı"], [n, "Sen: kurulum, yedek, yama"]] }
    verdict: "Ürün kataloğu farklı alanlı, iç içe kayıtlardan oluşur ve çoğu zaman bir ürünün tamamı birlikte okunur. Belge modeli bu şekle birebir uyar. DocumentDB bunu MongoDB API'siyle ve AWS'nin işlettiği bir hizmet olarak verir."
  try:
    - { href: "/", label: "Ana sayfayı yeniden yükle" }
    - { href: "/c/Elektronik", label: "Bir kategoriye git" }
  glossary:
    - ["Belge (document)", "JSON biçiminde tek bir kayıt. İçinde liste ve nesne olabilir."]
    - ["Koleksiyon (collection)", "Belgelerin durduğu yer; tablonun belge veritabanındaki karşılığı."]
    - ["Aggregation", "Belgeleri sunucuda gruplayıp sayan, toplayan işlem dizisi."]
    - ["Projection", "Bir sorguda yalnız istenen alanları döndürmek."]

category:
  title: "DocumentDB 101: kategori listesi ve index"
  apis: ["/api/products"]
  kicker: "DocumentDB 101: index ile arama"
  headline: "Kategori sayfası, 200 belgenin içinden doğru ürünleri nasıl bu kadar hızlı seçti?"
  lead: "Kategori sayfası DocumentDB'ye bir filtre gönderdi: bu kategori, istersen bu renk. Bu sayfa filtrenin index ile ve index olmadan nasıl çalıştığını gösteriyor."
  focus: "data:product_id"
  sample: { url: "/docdb/api/products?category=Elektronik", label: "List Elektronik" }
  big:
    title: "Büyük resim: koleksiyon ve filtrenin seçtikleri"
    text: "Teal kareler senin filtrene uyan belgeler. Index açıkken DocumentDB yalnız bu kareleri okur; index kapalıyken bütün kareleri tek tek okuyup eler."
    legend: '<span><i class="k"></i>Index''i olan alanlar</span>'
  sections:
    - title: "Index nedir, burada ne yaptı?"
      html: |
        <p><b>Index</b>, bir alanın değerlerini sıralı tutan ayrı bir listedir. <code>{ category: 1, rating: -1 }</code> index'i şöyle görünür:
        önce kategori, her kategorinin içinde puana göre büyükten küçüğe ürünler.</p>
        <div class="src-store">
          <div><h3>Index yokken (COLLSCAN)</h3><pre>200 belgenin hepsini oku
        her birinde: category == "Elektronik" mi?
        uyanları sırala, 48'ini al</pre></div>
          <div><h3>Index varken (IXSCAN)</h3><pre>index'te "Elektronik" bölümüne atla
        orada zaten puana göre sıralı
        ilk 48 belgeyi oku, bitti</pre></div>
        </div>
        <p>Paneldeki <code>docs examined</code> sayısı farkı gösterir: index'le okunan belge sayısı dönen sonuç kadardır, index'siz bütün koleksiyondur.
        200 üründe fark milisaniyelerdir; 2 milyon üründe saniyeler.</p>
  explain:
    "find + explain":
      title: "Filtre ve sorgu planı"
      text: "DocumentDB filtreyi çalıştırdı ve <code>explain</code> ile nasıl çalıştırdığını da anlattı: hangi index'i seçti, kaç belgeyi inceledi, kaçını döndürdü. Sorgu planı aşağıdaki gerçek istekte."
  analogy:
    icon: "📇"
    html: "<p>Bir kütüphanede İngilizce romanları arıyorsun. Kitapları raf raf gezersen (COLLSCAN) her kitaba bakarsın. Konu kataloğuna bakarsan (index) <q>İngilizce roman</q> kartından doğrudan raf numaralarına gidersin.</p>"
  alternatives:
    engine: "DocumentDB"
    criteria: ["İç içe alanda index", "Birleşik (compound) index", "Sorgu planını görme", "Kim işletir"]
    rows:
      - { name: "Amazon DocumentDB", chosen: true, cells: [[y, "<code>attributes.renk</code>"], [y, "category + rating"], [y, "<code>explain</code>"], [y, "AWS"]] }
      - { name: "Aurora PostgreSQL", sub: "B-tree, jsonb için GIN", cells: [[p, "jsonb ifadesi üzerinde"], [y, "Çok sütunlu index"], [y, "<code>EXPLAIN ANALYZE</code>"], [y, "AWS"]] }
      - { name: "DynamoDB", sub: "anahtar ve ikincil index", cells: [[n, "Yalnız üst düzey attribute"], [p, "GSI'da pk + sk"], [n, "Plan yok; anahtar ya da Scan"], [y, "AWS"]] }
    verdict: "Kategori, renk, puan gibi farklı alanlara göre esnek filtre isteniyor. DocumentDB iç içe alanlarda da index kurabildiği için katalog sorguları belge şeklini bozmadan hızlı kalır."
  try:
    - { href: "/c/Elektronik", label: "Kategori sayfasında index'i kapat" }
    - { href: "/c/Moda", label: "Renk filtresi dene" }
  glossary:
    - ["Index", "Bir alanın değerlerini sıralı tutan, aramayı hızlandıran ek yapı."]
    - ["COLLSCAN", "Index kullanmadan koleksiyonun bütün belgelerini okumak."]
    - ["IXSCAN", "Index üzerinden yalnız uyan belgelere gitmek."]
    - ["Sorgu planı", "Veritabanının sorguyu hangi yoldan çalıştırdığının açıklaması."]

product:
  title: "DocumentDB 101: ürün sayfası, tek belge"
  apis: ["/api/product"]
  kicker: "DocumentDB 101: bir belgeyi okumak"
  headline: "Ürün sayfasının bütün bilgisi tek bir okumayla nasıl geldi?"
  lead: "Ürün sayfası, ürünün kimliğiyle (_id) DocumentDB'den tek bir belge istedi. Bu sayfa o belgenin içini ve neden tek okumanın yettiğini gösteriyor."
  focus: "path"
  sample: { url: "/docdb/api/product/P0001", label: "Load product P0001" }
  big:
    title: "Büyük resim: koleksiyon ve okunan tek belge"
    text: "Teal kare senin açtığın ürün. Sağda o belgenin iç yapısı var: <code>attributes</code> bir nesne, <code>tags</code> bir liste. Hepsi aynı belgenin içinde."
    legend: '<span><i class="k"></i>Index''i olan alanlar</span>'
  sections:
    - title: "Neden JOIN gerekmedi?"
      html: |
        <p>İlişkisel bir veritabanında ürün sayfası için ürün tablosu, özellik tablosu ve etiket tablosu birleştirilirdi (JOIN).
        Burada ürünün özellikleri ve etiketleri zaten belgenin içinde. DocumentDB <code>_id</code> index'iyle belgeyi bulur ve olduğu gibi döndürür.</p>
        <p>Projection deneyini açarsan yalnız kart alanları döner ve belge küçülür. Paneldeki <b>Document size</b> notu bayt farkını gösterir.</p>
  explain:
    find_one:
      title: "Tek belgeyi _id ile okumak"
      text: "<code>_id</code> her koleksiyonda otomatik index'li ve tekildir. DocumentDB doğrudan o belgeye gider; iç içe alanlar dahil bütün belge tek cevapta gelir."
  analogy:
    icon: "🗂️"
    html: "<p>Müşteri dosyası numarasını bildiğin bir arşiv düşün. Numarayla tek bir klasörü çekersin ve içinde müşteriye ait her şey vardır. Ayrı ayrı faturalar dolabına, adresler dolabına gitmen gerekmez.</p>"
  alternatives:
    engine: "DocumentDB"
    criteria: ["Bütün ürün tek okumada", "Alan eklemek", "Belge boyutu sınırı", "Kim işletir"]
    rows:
      - { name: "Amazon DocumentDB", chosen: true, cells: [[y, "Bir belge"], [y, "Şema değişikliği yok"], [y, "16 MB"], [y, "AWS"]] }
      - { name: "Aurora PostgreSQL", sub: "normal tablolar", cells: [[p, "JOIN ile"], [p, "<code>ALTER TABLE</code>"], [y, "Satır başına geniş"], [y, "AWS"]] }
      - { name: "DynamoDB", sub: "GetItem", cells: [[y, "Bir item"], [y, "Şema serbest"], [p, "400 KB"], [y, "AWS, sunucusuz"]] }
    verdict: "Ürün sayfası her zaman bir ürünün tamamını ister. Belge modeli bu okumayı tek adımda yapar ve katalog ekibi yeni bir alan eklediğinde veritabanını değiştirmek gerekmez."
  try:
    - { href: "/p/P0001", label: "Bir ürün sayfası aç" }
  glossary:
    - ["_id", "Belgenin tekil kimliği; her koleksiyonda otomatik index'lidir."]
    - ["İç içe nesne", "Bir belgenin içindeki başka bir JSON nesnesi, ör. attributes."]
    - ["JOIN", "İlişkisel veritabanında tabloları ortak anahtarla birleştirmek."]
