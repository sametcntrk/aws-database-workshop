# 101 lessons for Amazon DocumentDB (English, ASD-STE100). Rendered by templates/learn/lesson.html.
catalog:
  title: "DocumentDB 101: the home page showcase"
  apis: ["/api/home"]
  kicker: "DocumentDB 101: a document database"
  headline: "How did the category menu and the showcase of the home page come from one collection?"
  lead: "When the home page opened, Lale Market asked the product catalog two questions: which categories exist, and which products have the best ratings? This page shows how DocumentDB answered both questions."
  focus: "data:product_id"
  sample: { url: "/docdb/api/home", label: "Load the home page" }
  big:
    title: "The big picture: the full catalog and the products in the showcase"
    text: "Each square is one product document in the <code>products</code> collection. The teal squares are the products that the showcase selected. Click a square to open the document of that product, with its embedded fields, at the right."
    legend: '<span><i class="k"></i>Fields with an index</span>'
  sections:
    - title: "The data at the source, and the data in DocumentDB"
      html: |
        <p>The information of one product is in one place, as one <b>document</b>. A document is a JSON object: it can contain text, numbers, lists and other objects.
        In a relational database, the product, its colors, tags and warranty data would be in separate tables. Here they are all together.</p>
        <div class="src-store">
          <div><h3>Source: the product that the catalog team has</h3><pre>Name: Alpen Kablosuz Kulaklık 1
        Category: Elektronik, price: 1,299 TL
        Color: black, warranty: 24 months
        Tags: new, best seller</pre></div>
          <div><h3>In DocumentDB: one document</h3><pre>{ "_id": "P0001", "name": "…", "category": "Elektronik",
          "price": 1299.9,
          "attributes": { "renk": "siyah", "garanti_ay": 24 },
          "tags": ["yeni", "çok satan"] }</pre></div>
        </div>
        <p>Products can have different fields: a book has a number of pages, a shoe has a size. A document database does not ask you to change a table for this.</p>
  explain:
    aggregate:
      title: "The category menu: aggregation"
      text: "DocumentDB grouped all products by category, counted the products in each group and found the lowest price (<code>$group</code>). The server did the calculation, and only 5 rows came to the browser."
    find:
      title: "The showcase: filter, sort and projection"
      text: "DocumentDB selected the documents with a rating of 4.5 or more, sorted them by rating and took the first 8. With a <b>projection</b>, only the fields that the card needs came back. The description and the other fields did not go over the network."
  analogy:
    icon: "📁"
    html: "<p>Think of a file folder for each product. Each paper about the product (price, color, warranty card, tags) is in that folder. To see one product, you open one folder. You do not go to five different cabinets.</p><p>A document database is the cabinet of these folders. The category menu is the summary on the cabinet door: how many folders each shelf has.</p>"
  alternatives:
    engine: "DocumentDB"
    criteria: ["Products with different fields", "Embedded data in one read", "Category summary", "Existing MongoDB code", "Who operates it"]
    rows:
      - { name: "Amazon DocumentDB", chosen: true, cells: [[y, "Flexible document schema"], [y, "One document, one read"], [y, "Aggregation pipeline"], [y, "MongoDB API compatible"], [y, "AWS: backups, copies, patches"]] }
      - { name: "Aurora PostgreSQL", sub: "tables, optionally <code>jsonb</code>", cells: [[p, "With a <code>jsonb</code> column"], [p, "JOIN or jsonb"], [y, "<code>GROUP BY</code>"], [n, "Must be rewritten as SQL"], [y, "AWS"]] }
      - { name: "DynamoDB", sub: "key-value and document", cells: [[y, "Flexible item schema"], [y, "Items up to 400 KB"], [n, "No grouping on the server"], [n, "A different API"], [y, "AWS, serverless"]] }
      - { name: "MongoDB on EC2", sub: "your own installation", cells: [[y, "The same"], [y, "The same"], [y, "The same"], [y, "The same"], [n, "You: installation, backups, patches"]] }
    verdict: "A product catalog is made of embedded records with different fields, and the shop usually reads all of one product together. The document model fits this shape exactly. DocumentDB gives it with the MongoDB API, as a service that AWS operates."
  try:
    - { href: "/", label: "Load the home page again" }
    - { href: "/c/Elektronik", label: "Go to a category" }
  glossary:
    - ["Document", "One record in JSON format. It can contain lists and objects."]
    - ["Collection", "The place of the documents. It is the table of a document database."]
    - ["Aggregation", "A series of operations that groups, counts and adds up documents on the server."]
    - ["Projection", "Return only the requested fields in a query."]

category:
  title: "DocumentDB 101: the category list and the index"
  apis: ["/api/products"]
  kicker: "DocumentDB 101: search with an index"
  headline: "How did the category page select the right products from 200 documents so fast?"
  lead: "The category page sent a filter to DocumentDB: this category, and optionally this color. This page shows how the filter works with an index and without one."
  focus: "data:product_id"
  sample: { url: "/docdb/api/products?category=Elektronik", label: "List Elektronik" }
  big:
    title: "The big picture: the collection and what the filter selected"
    text: "The teal squares are the documents that match your filter. With the index on, DocumentDB reads only these squares. With the index off, it reads every square and drops the ones that do not match."
    legend: '<span><i class="k"></i>Fields with an index</span>'
  sections:
    - title: "What is an index, and what did it do here?"
      html: |
        <p>An <b>index</b> is a separate list that keeps the values of a field in sorted order. The index <code>{ category: 1, rating: -1 }</code> looks like this:
        first the category, and inside each category the products from the highest rating to the lowest.</p>
        <div class="src-store">
          <div><h3>Without an index (COLLSCAN)</h3><pre>read all 200 documents
        for each one: is category == "Elektronik"?
        sort the matches, take 48</pre></div>
          <div><h3>With an index (IXSCAN)</h3><pre>jump to the "Elektronik" part of the index
        it is already sorted by rating
        read the first 48 documents, done</pre></div>
        </div>
        <p>The number <code>docs examined</code> in the panel shows the difference. With the index, the documents read are as many as the results. Without it, they are the whole collection.
        With 200 products, the difference is milliseconds. With 2 million products, it is seconds.</p>
  explain:
    "find + explain":
      title: "The filter and the query plan"
      text: "DocumentDB ran the filter, and with <code>explain</code> it also told how it ran it: which index it selected, how many documents it examined and how many it returned. The query plan is in the real request below."
  analogy:
    icon: "📇"
    html: "<p>You look for English novels in a library. If you walk along each shelf (COLLSCAN), you look at every book. If you use the subject catalog (index), the card <q>English novel</q> takes you directly to the shelf numbers.</p>"
  alternatives:
    engine: "DocumentDB"
    criteria: ["Index on an embedded field", "Compound index", "See the query plan", "Who operates it"]
    rows:
      - { name: "Amazon DocumentDB", chosen: true, cells: [[y, "<code>attributes.renk</code>"], [y, "category + rating"], [y, "<code>explain</code>"], [y, "AWS"]] }
      - { name: "Aurora PostgreSQL", sub: "B-tree, GIN for jsonb", cells: [[p, "On a jsonb expression"], [y, "Multi-column index"], [y, "<code>EXPLAIN ANALYZE</code>"], [y, "AWS"]] }
      - { name: "DynamoDB", sub: "keys and secondary indexes", cells: [[n, "Only top-level attributes"], [p, "pk + sk in a GSI"], [n, "No plan: a key or a Scan"], [y, "AWS"]] }
    verdict: "The shop needs flexible filters on different fields like category, color and rating. DocumentDB can index embedded fields too, so catalog queries stay fast and the document keeps its shape."
  try:
    - { href: "/c/Elektronik", label: "Turn off the index on the category page" }
    - { href: "/c/Moda", label: "Try the color filter" }
  glossary:
    - ["Index", "An extra structure that keeps the values of a field sorted and makes searches faster."]
    - ["COLLSCAN", "Read all documents of a collection with no index."]
    - ["IXSCAN", "Use an index to go only to the matching documents."]
    - ["Query plan", "A description of the way the database runs a query."]

product:
  title: "DocumentDB 101: the product page, one document"
  apis: ["/api/product"]
  kicker: "DocumentDB 101: read one document"
  headline: "How did all information of the product page come with one read?"
  lead: "The product page asked DocumentDB for one document with the id (_id) of the product. This page shows what is inside that document and why one read was enough."
  focus: "path"
  sample: { url: "/docdb/api/product/P0001", label: "Load product P0001" }
  big:
    title: "The big picture: the collection and the one document that was read"
    text: "The teal square is the product that you opened. At the right is the structure of that document: <code>attributes</code> is an object, and <code>tags</code> is a list. They are all in the same document."
    legend: '<span><i class="k"></i>Fields with an index</span>'
  sections:
    - title: "Why was no JOIN necessary?"
      html: |
        <p>In a relational database, the product page would join the product table, the attribute table and the tag table (JOIN).
        Here, the attributes and the tags of the product are already in the document. DocumentDB finds the document with the <code>_id</code> index and returns it as it is.</p>
        <p>If you turn on the projection experiment, only the card fields come back and the document becomes smaller. The <b>Document size</b> note in the panel shows the difference in bytes.</p>
  explain:
    find_one:
      title: "Read one document by _id"
      text: "<code>_id</code> is unique and has an automatic index in each collection. DocumentDB goes directly to that document, and the full document, with its embedded fields, comes in one answer."
  analogy:
    icon: "🗂️"
    html: "<p>Think of an archive where you know the number of the customer file. With the number, you take out one folder, and everything about the customer is in it. You do not go to a cabinet of invoices and a cabinet of addresses.</p>"
  alternatives:
    engine: "DocumentDB"
    criteria: ["The full product in one read", "Add a field", "Document size limit", "Who operates it"]
    rows:
      - { name: "Amazon DocumentDB", chosen: true, cells: [[y, "One document"], [y, "No schema change"], [y, "16 MB"], [y, "AWS"]] }
      - { name: "Aurora PostgreSQL", sub: "normal tables", cells: [[p, "With JOIN"], [p, "<code>ALTER TABLE</code>"], [y, "Wide per row"], [y, "AWS"]] }
      - { name: "DynamoDB", sub: "GetItem", cells: [[y, "One item"], [y, "Flexible schema"], [p, "400 KB"], [y, "AWS, serverless"]] }
    verdict: "The product page always needs all of one product. The document model does this read in one step, and when the catalog team adds a new field, the database needs no change."
  try:
    - { href: "/p/P0001", label: "Open a product page" }
  glossary:
    - ["_id", "The unique id of a document. It has an automatic index in each collection."]
    - ["Embedded object", "A JSON object inside a document, for example attributes."]
    - ["JOIN", "In a relational database, combine tables with a shared key."]
