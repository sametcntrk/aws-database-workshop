# 101 lessons for Amazon Neptune (Turkish).
recs:
  title: "Neptune 101: birlikte alınanlar önerisi"
  apis: ["/api/recs", "/api/purchase"]
  kicker: "Neptune 101: graf veritabanı"
  headline: "Ürün sayfasındaki “bunu alanlar şunları da aldı” listesi nasıl bulundu?"
  lead: "Ürün sayfası Neptune'a bir yol sordu: bu üründen, onu alan müşterilere, oradan da onların aldığı öteki ürünlere. Bu sayfa o yolu düğüm düğüm gösteriyor."
  focus: ["data:product_id", "query:product"]
  sample: { url: "/neptune/api/recs?mode=product&product=P0001", label: "Recommendations for P0001" }
  big:
    title: "Büyük resim: graftaki düğümler ve öneri yolu"
    text: "Her kare bir düğüm: ürünler kategori raflarında, en altta müşteriler. Teal kareler başlangıç ürünü ve önerilen ürünler. Bir ürüne tıkla: ona gelen BOUGHT kenarlarını ve iki adım ötedeki ürünleri gör."
    legend: '<span><i class="k"></i>Düğüm kimliği, etiketi ve öneri yolu</span>'
  sections:
    - title: "Kaynakta veri böyleydi, Neptune'da böyle duruyor"
      html: |
        <p>Kaynakta veri sipariş geçmişidir: hangi müşteri hangi ürünü aldı. Bir tabloda bu, milyonlarca satırlık bir <q>müşteri - ürün</q> listesidir.
        Graf veritabanında aynı bilgi <b>düğümler</b> (müşteri, ürün) ve onları bağlayan <b>kenarlar</b> (BOUGHT) olarak durur.</p>
        <div class="src-store">
          <div><h3>Kaynak: sipariş satırları</h3><pre>C00001 Ayşe   aldı  P0001 Kulaklık
        C00001 Ayşe   aldı  P0042 Powerbank
        C00017 Mehmet aldı  P0001 Kulaklık
        C00017 Mehmet aldı  P0093 Telefon kılıfı</pre></div>
          <div><h3>Neptune'da: düğümler ve kenarlar</h3><pre>(Ayşe)-[:BOUGHT]->(Kulaklık)
        (Ayşe)-[:BOUGHT]->(Powerbank)
        (Mehmet)-[:BOUGHT]->(Kulaklık)
        (Mehmet)-[:BOUGHT]->(Telefon kılıfı)</pre></div>
        </div>
        <p>Her düğüm komşularını doğrudan bilir. <q>Kulaklığı alanlar</q> sorusu için bütün siparişler taranmaz; Kulaklık düğümünden gelen kenarlar izlenir.
        Öneri bu yürüyüşün iki adımıdır: Kulaklık → onu alan müşteriler → onların aldığı öteki ürünler. En çok ortak müşterisi olan ürün en üste çıkar.</p>
  explain:
    openCypher:
      title: "Graf üzerinde yürümek: openCypher"
      text: "<code>MATCH (p)&lt;-[:BOUGHT]-(c)-[:BOUGHT]-&gt;(rec)</code> deseni, çizilen yolun aynısını arar. <code>count(DISTINCT c)</code> her öneriye kaç ortak müşterinin götürdüğünü sayar. SQL'de her adım büyük bir tabloda bir JOIN daha olurdu."
    "openCypher (write)":
      title: "Yeni kenar yazmak"
      text: "Checkout'tan sonra persona'ndan aldığın ürünlere yeni BOUGHT kenarları eklendi. Bir sonraki öneri bunları hemen hesaba katar; gece çalışan bir yeniden hesaplama yoktur."
  analogy:
    icon: "🕸️"
    html: "<p>Bir arkadaşına <q>bu kitabı sevenler başka neyi sevdi?</q> diye soruyorsun. Arkadaşın kitabı okuyan tanıdıklarını düşünür, sonra onların sevdiği öteki kitapları. Herkesin listesini baştan sona okumaz; tanıdıktan tanıdığa gider. Graf veritabanı bu <q>tanıdıktan tanıdığa</q> gitmeyi hızlı yapar.</p>"
  alternatives:
    engine: "Neptune"
    criteria: ["Çok adımlı ilişki sorgusu", "Yeni ilişki anında etkili", "Sorgunun okunabilirliği", "Kim işletir"]
    rows:
      - { name: "Amazon Neptune", chosen: true, cells: [[y, "Kenar izleyerek"], [y, "Yazınca hemen"], [y, "openCypher, Gremlin"], [y, "AWS, serverless seçeneği"]] }
      - { name: "Aurora PostgreSQL", sub: "order_items üzerinde self-JOIN", cells: [[p, "Her adım bir JOIN, büyüdükçe pahalı"], [y, "Hemen"], [p, "Uzun SQL"], [y, "AWS"]] }
      - { name: "Amazon Personalize", sub: "makine öğrenmesiyle öneri", cells: [[y, "Model öğrenir"], [p, "Yeniden eğitim veya olay akışı"], [p, "Kara kutu"], [y, "AWS"]] }
      - { name: "EC2 üzerinde graf veritabanı", sub: "kendi kurulumun", cells: [[y, "Aynı"], [y, "Aynı"], [y, "Aynı"], [n, "Sen"]] }
    verdict: "<q>Birlikte alınanlar</q> bir ilişki sorusudur ve cevabı ilişkileri izleyerek bulunur. Graf veritabanı bu yürüyüşü veri büyüdükçe de hızlı tutar ve yeni bir sipariş öneriyi anında değiştirir."
  try:
    - { href: "/p/P0001", label: "Bir ürün sayfasında önerilere bak" }
    - { href: "/admin/graph", label: "Müşteri grafını aç" }
  glossary:
    - ["Düğüm (node)", "Graftaki bir varlık: müşteri ya da ürün."]
    - ["Kenar (edge)", "İki düğümü bağlayan ilişki, ör. BOUGHT."]
    - ["Hop (adım)", "Bir kenar boyunca bir düğümden ötekine geçmek."]
    - ["openCypher", "Grafta desen arayan açık sorgu dili."]

graph:
  title: "Neptune 101: bir müşterinin komşuluğu"
  apis: ["/api/graph"]
  kicker: "Neptune 101: grafı görmek"
  headline: "Müşteri grafı ekranındaki ağ, tek bir sorguyla nasıl çizildi?"
  lead: "Müşteri grafı ekranı, bir müşterinin aldığı ürünleri ve o ürünleri alan öteki müşterileri istedi. Bu sayfa dönen ağın veritabanında nasıl durduğunu gösteriyor."
  focus: "data:id"
  sample: { url: "/neptune/api/graph", label: "Load the customer graph" }
  big:
    title: "Büyük resim: graf ve ekrandaki komşuluk"
    text: "Teal kareler ekrana çizilen düğümler: persona'n, aldığı ürünler ve aynı ürünleri alan öteki müşteriler. Bir müşteriye tıkla: ondan çıkan kenarları gör."
    legend: '<span><i class="k"></i>Düğüm kimliği ve etiketi</span>'
  sections:
    - title: "Komşuluk nedir?"
      html: |
        <p>Bir düğümün <b>komşuluğu</b>, ona bir ya da iki kenarla bağlı düğümlerdir. Ekrandaki ağ, persona'nın iki adımlık komşuluğudur:
        persona → aldığı ürünler → o ürünleri alan öteki müşteriler.</p>
        <p>Sorgu bu deseni bir kez tarif eder, Neptune deseni graf üzerinde arar. Dönen satırlar tarayıcıda düğüm ve kenar listesine çevrilip çizilir.</p>
  explain:
    openCypher:
      title: "Komşuluğu bulmak"
      text: "<code>OPTIONAL MATCH</code>, bir ürünü başka kimse almamış olsa bile ürünü sonuçta tutar. <code>collect(…)[0..3]</code> her ürün için en fazla üç öteki müşteri alır, ekran kalabalıklaşmasın diye."
  analogy:
    icon: "👥"
    html: "<p>Bir düğün davetiyesi listesi düşün: gelin, gelinin arkadaşları, arkadaşlarının eşleri. Listeyi oturma planına çevirmek için kimin kimi tanıdığını bilmen yeter. Graf bu <q>kim kimi tanıyor</q> bilgisidir.</p>"
  alternatives:
    engine: "Neptune"
    criteria: ["İki adımlık komşuluk", "Ağı çizmeye hazır sonuç", "Kim işletir"]
    rows:
      - { name: "Amazon Neptune", chosen: true, cells: [[y, "Tek desen"], [y, "Düğüm ve kenar"], [y, "AWS"]] }
      - { name: "Aurora PostgreSQL", sub: "recursive CTE veya JOIN'ler", cells: [[p, "Birkaç JOIN"], [p, "Satırları uygulama çevirir"], [y, "AWS"]] }
    verdict: "Ağı çizmek, ilişkileri olduğu gibi döndüren bir veritabanıyla en kolaydır. Neptune'da sorgu, ekrandaki resmin tarifine benzer."
  try:
    - { href: "/admin/graph", label: "Başka bir persona seç" }
  glossary:
    - ["Komşuluk", "Bir düğüme bir ya da birkaç kenarla bağlı düğümler."]
    - ["OPTIONAL MATCH", "Desen bulunmazsa da satırı tutan eşleşme."]
