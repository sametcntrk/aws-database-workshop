# 101 lessons for Amazon DynamoDB (Turkish).
cart:
  title: "DynamoDB 101: sepet, anahtar ve partition"
  apis: ["/api/cart"]
  kicker: "DynamoDB 101: anahtar-değer veritabanı"
  headline: "Sepetin, milyonlarca sepetin arasında nasıl tek adımda bulunuyor?"
  lead: "Sepete ürün eklediğinde, sildiğinde ya da sepeti açtığında Lale Market DynamoDB'ye anahtarıyla gitti. Bu sayfa anahtarın ne olduğunu ve sepetinin tabloda nerede durduğunu gösteriyor."
  sample: { url: "/dynamodb/api/cart", label: "Load the cart" }
  big:
    title: "Büyük resim: tablo, partition'lar ve senin sepetin"
    text: "Her raf bir <b>partition</b>: aynı <code>pk</code> değerini taşıyan item'lar. Her kare bir item. En üstteki raf senin sepetin; <code>SIM#</code> rafları Load Simulation'dan kalan geçici item'lar."
    legend: '<span><i class="k"></i>Anahtar (pk + sk) ve TTL</span>'
  sections:
    - title: "Kaynakta veri böyleydi, DynamoDB'de böyle duruyor"
      html: |
        <p>Sepet aslında basit bir listedir: <q>bu ziyaretçinin sepetinde şu ürünler, şu adetlerle var</q>. DynamoDB bunu iki parçalı bir anahtarla saklar.</p>
        <div class="src-store">
          <div><h3>Kaynak: ziyaretçinin sepeti</h3><pre>Ziyaretçi: 7f3c…
          2 × Kablosuz Kulaklık (1.299 TL)
          1 × Koşu Ayakkabısı (899 TL)</pre></div>
          <div><h3>DynamoDB'de: aynı partition'da iki item</h3><pre>pk = CART#7f3c…   sk = ITEM#P0001   qty = 2
        pk = CART#7f3c…   sk = ITEM#P0042   qty = 1
          + name, unit_price, expires_at (TTL)</pre></div>
        </div>
        <ul>
          <li><b>pk (partition key)</b> hangi sepet olduğunu söyler. DynamoDB bu değerden bir hash hesaplar ve item'ı o hash'in partition'ına koyar.</li>
          <li><b>sk (sort key)</b> sepetin içindeki ürünü söyler. Aynı pk altındaki item'lar sk'ya göre sıralı durur.</li>
          <li><b>expires_at (TTL)</b> 24 saat sonrasını gösterir. Süre dolunca DynamoDB item'ı yazma kapasitesi harcamadan, genelde birkaç gün içinde siler; terk edilen sepetler kendiliğinden temizlenir.</li>
        </ul>
  explain:
    Query:
      title: "Sepeti okumak: Query"
      text: "Tek bir <code>pk</code> ile Query, yalnız o partition'a gider ve içindeki item'ları sk sırasıyla döndürür. Tablo ne kadar büyürse büyüsün bu okuma aynı hızda kalır. <i>Strongly consistent</i> okuma son yazdığını kesin görür ve iki kat kapasite harcar."
    UpdateItem:
      title: "Ürün eklemek: UpdateItem ve koşul"
      text: "<code>ADD qty :q</code> adedi atomik artırır: iki sekme aynı anda eklese bile bir artış kaybolmaz. <code>ConditionExpression</code> ise <q>en fazla 5 adet</q> kuralını DynamoDB'nin içinde, yazmayla aynı adımda kontrol eder."
    DeleteItem:
      title: "Ürün silmek: DeleteItem"
      text: "Tam anahtarla (pk + sk) tek bir item silinir. Öteki ürünlere dokunulmaz."
    BatchWriteItem:
      title: "Sepeti boşaltmak: BatchWriteItem"
      text: "Checkout'tan sonra sepetin bütün item'ları tek istekte silinir (bir istekte en fazla 25 işlem)."
  analogy:
    icon: "🔑"
    html: "<p>Bir otelin emanet dolapları düşün. Her misafirin dolap numarası var (pk). Dolabın içinde numaralı çekmeceler var (sk). Görevli bütün dolapları aramaz; numarayla doğrudan doğru dolaba gider.</p><p>Dolap sayısı on katına çıksa da görevlinin hızı değişmez. DynamoDB'nin gücü bu: anahtarı biliyorsan, tablo büyüklüğü fark etmez.</p>"
  alternatives:
    engine: "DynamoDB"
    criteria: ["Anahtarla okuma hızı", "Trafik patlamasında ölçek", "Terk edilen sepetleri silmek", "Esnek sorgu", "Kim işletir"]
    rows:
      - { name: "Amazon DynamoDB", chosen: true, cells: [[y, "Tek basamaklı ms, her boyutta"], [y, "On-demand, plan yok"], [y, "TTL, kapasite harcamaz"], [n, "Yalnız anahtar ve index"], [y, "AWS, sunucusuz"]] }
      - { name: "Aurora PostgreSQL", sub: "bir sepet tablosu", cells: [[y, "Index'le hızlı"], [p, "Instance boyutuna bağlı"], [p, "Zamanlanmış DELETE işi"], [y, "Her türlü SQL"], [y, "AWS"]] }
      - { name: "ElastiCache (Valkey)", sub: "bellekte hash", cells: [[y, "Mikrosaniyeler"], [y, "Serverless"], [y, "EXPIRE"], [n, "Yalnız anahtar"], [p, "Kalıcılık için ek ayar gerekir"]] }
      - { name: "DocumentDB", sub: "sepet belgesi", cells: [[y, "_id ile hızlı"], [p, "Instance boyutuna bağlı"], [y, "TTL index"], [y, "Zengin sorgu"], [y, "AWS"]] }
    verdict: "Sepet hep aynı şekilde okunur: <q>bu ziyaretçinin sepeti</q>. Kampanya günü trafik on katına çıkabilir. Anahtarla erişimde her ölçekte aynı hızı veren, kapasite planı istemeyen ve TTL ile kendini temizleyen DynamoDB bu iş için en sade seçim."
  try:
    - { href: "/cart", label: "Sepette consistent okumayı kapat" }
    - { href: "/p/P0001", label: "Bir ürünü 6 kez ekle (koşul)" }
  glossary:
    - ["Partition key (pk)", "Item'ın hangi partition'da duracağını belirleyen anahtar."]
    - ["Sort key (sk)", "Aynı partition içindeki item'ları sıralayan ikinci anahtar."]
    - ["TTL", "Süresi dolan item'ı DynamoDB'nin kendiliğinden silmesi."]
    - ["Conditional write", "Koşul doğruysa yazan, yanlışsa yazmayan atomik işlem."]
    - ["RRU / WRU", "On-demand modda okuma ve yazma birimleri; fiyat bunlardan hesaplanır."]

simulate:
  title: "DynamoDB 101: trafik patlaması"
  apis: ["/api/simulate"]
  kicker: "DynamoDB 101: ölçek"
  headline: "Saniyeler içinde yüzlerce yazma geldiğinde DynamoDB ne yaptı?"
  lead: "Load Simulation, 200 sanal alışverişçiyle aynı anda sepetlere yazdı. Bu sayfa yükün partition'lara nasıl dağıldığını gösteriyor."
  need: "Bu dersi kendi verinle görmek için sepet sayfasında <b>Load Simulation</b>'ı çalıştır, sonra paneldeki 101 bağlantısına tıkla."
  big:
    title: "Büyük resim: simülasyonun açtığı partition'lar"
    text: "<code>SIM#</code> ile başlayan her raf bir sanal alışverişçinin sepeti. Yük 200 farklı pk'ya dağıldığı için tek bir partition'a yığılmadı."
    legend: '<span><i class="k"></i>Anahtar (pk + sk) ve TTL</span>'
  sections:
    - title: "Yük neden dağıldı?"
      html: |
        <p>DynamoDB her pk değerinden bir hash hesaplar ve item'ı o hash'in partition'ına koyar. Farklı pk'lar farklı partition'lara düşer, böylece yazmalar paralel çalışır.
        Hepsi aynı pk'ya yazsaydı tek bir partition'ın sınırına (saniyede 1.000 WRU) takılırdı; buna <b>sıcak partition</b> denir.</p>
        <p>On-demand modda kapasiteyi önceden ayarlamadın. DynamoDB gelen trafiği gördü ve karşıladı; ödediğin tutar yalnız yapılan yazma sayısı.</p>
  explain:
    "PutItem × N":
      title: "Yüzlerce eşzamanlı PutItem"
      text: "32 iş parçacığı, 200 farklı pk'ya yazdı. Paneldeki p50, p95, p99 değerleri bekleme sürelerinin dağılımını gösterir. Bu item'lar 10 dakika sonra TTL ile silinir."
  analogy:
    icon: "🛒"
    html: "<p>Kampanya günü bir markette tek kasa açık olsa kuyruk kilometrelerce uzar. 200 kasa açıksa ve herkes farklı kasaya giderse kuyruk olmaz. Partition key, müşterileri kasalara dağıtan görevlidir.</p>"
  alternatives:
    engine: "DynamoDB"
    criteria: ["Ani yükte ölçek", "Kapasite planı", "Ödeme şekli"]
    rows:
      - { name: "DynamoDB on-demand", chosen: true, cells: [[y, "Kendiliğinden"], [y, "Gerekmez"], [y, "İstek başına"]] }
      - { name: "DynamoDB provisioned", sub: "sabit kapasite", cells: [[p, "Auto scaling ile, gecikmeli"], [n, "Önceden ayarlanır"], [p, "Saatlik, ucuz ama sabit"]] }
      - { name: "Aurora PostgreSQL", sub: "tek yazar instance", cells: [[p, "Yazmalar tek instance'ta"], [n, "Instance boyutu seçilir"], [p, "Saatlik"]] }
    verdict: "Sepet trafiği öngörülemez: sabah sakin, kampanyada patlama. On-demand DynamoDB bu dalgalanmayı plan yapmadan karşılar ve yalnız kullanılanı faturalar."
  try:
    - { href: "/cart", label: "Load Simulation'ı yeniden çalıştır" }
  glossary:
    - ["On-demand", "Kapasite ayarı olmadan istek başına ödenen DynamoDB modu."]
    - ["Sıcak partition", "Trafiğin tek bir partition'a yığılması; o partition'ın sınırı darboğaz olur."]
    - ["p99", "İsteklerin yüzde 99'unun bu süreden kısa sürdüğü değer."]
