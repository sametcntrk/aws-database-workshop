# 101 lessons for Amazon DynamoDB (English, ASD-STE100).
cart:
  title: "DynamoDB 101: the cart, the key and the partition"
  apis: ["/api/cart"]
  kicker: "DynamoDB 101: a key-value database"
  headline: "How does DynamoDB find your cart among millions of carts in one step?"
  lead: "When you added a product to the cart, removed it or opened the cart, Lale Market went to DynamoDB with the key of the cart. This page shows what the key is and where your cart is in the table."
  sample: { url: "/dynamodb/api/cart", label: "Load the cart" }
  big:
    title: "The big picture: the table, the partitions and your cart"
    text: "Each shelf is one <b>partition</b>: the items with the same <code>pk</code> value. Each square is one item. The top shelf is your cart. The <code>SIM#</code> shelves are temporary items from the Load Simulation."
    legend: '<span><i class="k"></i>Key (pk + sk) and TTL</span>'
  sections:
    - title: "The data at the source, and the data in DynamoDB"
      html: |
        <p>A cart is a simple list: <q>the cart of this visitor has these products, in these quantities</q>. DynamoDB stores it with a key that has two parts.</p>
        <div class="src-store">
          <div><h3>Source: the cart of the visitor</h3><pre>Visitor: 7f3c…
          2 × Wireless Headphones (1,299 TL)
          1 × Running Shoes (899 TL)</pre></div>
          <div><h3>In DynamoDB: two items in the same partition</h3><pre>pk = CART#7f3c…   sk = ITEM#P0001   qty = 2
        pk = CART#7f3c…   sk = ITEM#P0042   qty = 1
          + name, unit_price, expires_at (TTL)</pre></div>
        </div>
        <ul>
          <li><b>pk (partition key)</b> tells which cart it is. DynamoDB calculates a hash of this value and puts the item in the partition of that hash.</li>
          <li><b>sk (sort key)</b> tells which product in the cart it is. The items with the same pk are stored in sk order.</li>
          <li><b>expires_at (TTL)</b> is a time 24 hours later. After that time, DynamoDB deletes the item with no write capacity, usually within a few days. So abandoned carts are deleted automatically.</li>
        </ul>
  explain:
    Query:
      title: "Read the cart: Query"
      text: "A Query with one <code>pk</code> goes only to that partition and returns its items in sk order. The speed of this read stays the same when the table grows. A <i>strongly consistent</i> read always sees your last write and uses two times the capacity."
    UpdateItem:
      title: "Add a product: UpdateItem with a condition"
      text: "<code>ADD qty :q</code> increases the quantity atomically: if two browser tabs add at the same time, no increase is lost. <code>ConditionExpression</code> checks the rule <q>at most 5 pieces</q> inside DynamoDB, in the same step as the write."
    DeleteItem:
      title: "Remove a product: DeleteItem"
      text: "One item is deleted with its full key (pk + sk). The other products do not change."
    BatchWriteItem:
      title: "Empty the cart: BatchWriteItem"
      text: "After the checkout, one request deletes all items of the cart (at most 25 operations in one request)."
  analogy:
    icon: "🔑"
    html: "<p>Think of the lockers of a hotel. Each guest has a locker number (pk). In the locker are numbered drawers (sk). The attendant does not search all lockers. The number takes the attendant directly to the right locker.</p><p>If the number of lockers becomes ten times larger, the attendant is not slower. This is the strength of DynamoDB: if you know the key, the size of the table does not matter.</p>"
  alternatives:
    engine: "DynamoDB"
    criteria: ["Read speed by key", "Scale in a traffic peak", "Delete abandoned carts", "Flexible queries", "Who operates it"]
    rows:
      - { name: "Amazon DynamoDB", chosen: true, cells: [[y, "Single-digit ms at any size"], [y, "On-demand, no plan"], [y, "TTL, uses no capacity"], [n, "Only keys and indexes"], [y, "AWS, serverless"]] }
      - { name: "Aurora PostgreSQL", sub: "a cart table", cells: [[y, "Fast with an index"], [p, "Depends on the instance size"], [p, "A scheduled DELETE job"], [y, "Any SQL"], [y, "AWS"]] }
      - { name: "ElastiCache (Valkey)", sub: "a hash in memory", cells: [[y, "Microseconds"], [y, "Serverless"], [y, "EXPIRE"], [n, "Only by key"], [p, "Durability needs extra settings"]] }
      - { name: "DocumentDB", sub: "a cart document", cells: [[y, "Fast by _id"], [p, "Depends on the instance size"], [y, "TTL index"], [y, "Rich queries"], [y, "AWS"]] }
    verdict: "The shop always reads a cart in the same way: <q>the cart of this visitor</q>. On a campaign day, the traffic can become ten times larger. DynamoDB gives the same speed by key at every scale, needs no capacity plan and deletes old carts with TTL. It is the simplest choice for this work."
  try:
    - { href: "/cart", label: "Turn off the consistent read in the cart" }
    - { href: "/p/P0001", label: "Add one product 6 times (condition)" }
  glossary:
    - ["Partition key (pk)", "The key that decides in which partition an item is stored."]
    - ["Sort key (sk)", "The second key that sorts the items inside one partition."]
    - ["TTL", "DynamoDB deletes an item automatically after its time ends."]
    - ["Conditional write", "An atomic operation that writes only if the condition is true."]
    - ["RRU / WRU", "The read and write units of on-demand mode. The price comes from them."]

simulate:
  title: "DynamoDB 101: a traffic peak"
  apis: ["/api/simulate"]
  kicker: "DynamoDB 101: scale"
  headline: "What did DynamoDB do when hundreds of writes came in a few seconds?"
  lead: "The Load Simulation wrote to carts with 200 virtual shoppers at the same time. This page shows how the load spread over the partitions."
  need: "To see this lesson with your own data, run the <b>Load Simulation</b> on the cart page, then click the 101 link in the panel."
  big:
    title: "The big picture: the partitions that the simulation used"
    text: "Each shelf that starts with <code>SIM#</code> is the cart of one virtual shopper. The load spread over 200 different pk values, so it did not collect on one partition."
    legend: '<span><i class="k"></i>Key (pk + sk) and TTL</span>'
  sections:
    - title: "Why did the load spread?"
      html: |
        <p>DynamoDB calculates a hash of each pk value and puts the item in the partition of that hash. Different pk values go to different partitions, so the writes run in parallel.
        If all writes used the same pk, they would hit the limit of one partition (1,000 WRU per second). This is a <b>hot partition</b>.</p>
        <p>In on-demand mode, you did not set the capacity before. DynamoDB saw the traffic and served it. You pay only for the number of writes.</p>
  explain:
    "PutItem × N":
      title: "Hundreds of parallel PutItem calls"
      text: "32 threads wrote to 200 different pk values. The p50, p95 and p99 values in the panel show the distribution of the wait times. TTL deletes these items after 10 minutes."
  analogy:
    icon: "🛒"
    html: "<p>On a campaign day in a supermarket, if only one cash desk is open, the queue becomes very long. If 200 desks are open and each customer goes to a different desk, there is no queue. The partition key is the person who sends the customers to the desks.</p>"
  alternatives:
    engine: "DynamoDB"
    criteria: ["Scale in a sudden load", "Capacity plan", "How you pay"]
    rows:
      - { name: "DynamoDB on-demand", chosen: true, cells: [[y, "Automatic"], [y, "Not necessary"], [y, "Per request"]] }
      - { name: "DynamoDB provisioned", sub: "fixed capacity", cells: [[p, "With auto scaling, with a delay"], [n, "Set in advance"], [p, "Per hour, cheap but fixed"]] }
      - { name: "Aurora PostgreSQL", sub: "one writer instance", cells: [[p, "Writes on one instance"], [n, "You select the instance size"], [p, "Per hour"]] }
    verdict: "Cart traffic is not predictable: quiet in the morning, a peak in a campaign. On-demand DynamoDB serves these changes with no plan and charges only for what you use."
  try:
    - { href: "/cart", label: "Run the Load Simulation again" }
  glossary:
    - ["On-demand", "The DynamoDB mode with no capacity setting, paid per request."]
    - ["Hot partition", "Traffic that collects on one partition. The limit of that partition becomes the bottleneck."]
    - ["p99", "The time under which 99 percent of the requests finished."]
