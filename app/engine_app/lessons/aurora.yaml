# 101 lessons for Amazon Aurora PostgreSQL (English, ASD-STE100).
transaction:
  title: "Aurora 101: checkout and the transaction"
  apis: ["POST /api/orders"]
  kicker: "Aurora 101: a relational database"
  headline: "When you place an order, why are the stock, the order and the order lines written all together or not at all?"
  lead: "In checkout, Aurora got one job: decrease the stock, write the order, write its lines. This page shows why these steps are in one transaction."
  need: "To see this lesson with your own data, add a product to the cart and complete the <b>checkout</b>, then click the 101 link in the panel. Try the rollback experiment too."
  big:
    title: "The big picture: four tables and your order"
    text: "Each shelf is one table, and each square is one row. The teal squares are your orders, their lines, the products in them and your persona customer. Click an order to open the linked rows of the other tables below it."
    legend: '<span><i class="k"></i>Key columns (primary key, foreign key)</span>'
  sections:
    - title: "The data at the source, and the data in Aurora"
      html: |
        <p>An order slip has the customer, the date, the total and the lines together. A relational database divides this slip into parts that do not repeat, and links the parts with <b>keys</b>.</p>
        <div class="src-store">
          <div><h3>Source: an order slip</h3><pre>Order W1730…  Ayşe Yılmaz  27.10.2026
          2 × Wireless Headphones   2,598 TL
          1 × Running Shoes           899 TL
        Total: 3,497 TL</pre></div>
          <div><h3>In Aurora: divided into four tables</h3><pre>orders       (order_id, customer_id, total, …)
        order_items  (order_id, product_id, qty, unit_price)
        products     (product_id, name, stock, …)
        customers    (customer_id, name, city, …)</pre></div>
        </div>
        <p>The name of the customer is written only once, in the <code>customers</code> table. The order points to it with <code>customer_id</code> (a foreign key).
        So when a value changes, it changes in one place. The rule <code>CHECK (stock &gt;= 0)</code> stops the stock from going below zero at the database level.</p>
  explain:
    BEGIN:
      title: "The transaction started"
      text: "From here to COMMIT, all commands are one job: either all of them become permanent, or none of them."
    "UPDATE (stock)":
      title: "The stock went down, and the row was locked"
      text: "The condition <code>stock &gt;= qty</code> stops the update if the stock is not enough. The updated row stays locked until the transaction ends, so two customers cannot buy the same last product at the same time."
    "INSERT (order)":
      title: "The order row was written"
      text: "A new row was added to the <code>orders</code> table. <code>customer_id</code> cannot point to a customer that is not in the customers table (foreign key)."
    "INSERT (order item)":
      title: "Each product of the order was written"
      text: "Each product becomes one row in the <code>order_items</code> table, with keys to both the order and the product."
    COMMIT:
      title: "COMMIT: the change is permanent"
      text: "Aurora confirms COMMIT after it writes the change to at least 4 of the 6 copies in 3 Availability Zones. Also if the power fails, the order is not lost."
    ROLLBACK:
      title: "ROLLBACK: nothing happened"
      text: "One step failed. PostgreSQL undid each change after BEGIN: the stock went back to its old value, and the order was never written. A half order does not exist."
  analogy:
    icon: "🏦"
    html: "<p>You send money from one bank account to another. Money that leaves one account and does not arrive in the other is not acceptable. The bank does the two movements as one operation: both happen, or neither happens.</p><p>Checkout is the same: the stock must never go down without the order, and the order must never exist without the stock change. A transaction gives this guarantee.</p>"
  alternatives:
    engine: "Aurora PostgreSQL"
    criteria: ["One transaction over many tables", "Data integrity rules", "SQL and JOIN in reports", "Durability", "Who operates it"]
    rows:
      - { name: "Amazon Aurora PostgreSQL", chosen: true, cells: [[y, "Full ACID"], [y, "Foreign key, CHECK"], [y, "Full SQL"], [y, "6 copies in 3 AZs"], [y, "AWS"]] }
      - { name: "RDS for PostgreSQL", sub: "classic managed PostgreSQL", cells: [[y, "Full ACID"], [y, "The same"], [y, "The same"], [p, "2 copies with Multi-AZ"], [y, "AWS"]] }
      - { name: "DynamoDB", sub: "TransactWriteItems", cells: [[p, "At most 100 items"], [n, "No foreign keys"], [n, "No JOIN"], [y, "3 AZs"], [y, "AWS, serverless"]] }
      - { name: "DocumentDB", sub: "multi-document transaction", cells: [[p, "Supported, with limits"], [n, "No foreign keys"], [p, "With $lookup"], [y, "6 copies in 3 AZs"], [y, "AWS"]] }
    verdict: "Orders are money: the stock, the order and the lines must always agree. The relational model and ACID transactions were made for this. Aurora gives the same PostgreSQL with a more durable storage layer."
  try:
    - { href: "/checkout", label: "Turn on the rollback experiment in checkout" }
    - { href: "/orders", label: "See my orders" }
  glossary:
    - ["Transaction", "Many commands that run as one job, all or nothing."]
    - ["ACID", "Atomic, consistent, isolated and durable: the four guarantees of a transaction."]
    - ["Primary key", "The column that identifies one row."]
    - ["Foreign key", "A column that points to a row of another table and must be valid."]
    - ["Row lock", "While one transaction changes a row, the others wait."]

join:
  title: "Aurora 101: my orders and JOIN"
  apis: ["GET /api/orders"]
  kicker: "Aurora 101: combine tables"
  headline: "How did data that is divided into four tables become one list of orders again?"
  lead: "The My orders page sent one SQL query to Aurora. This page shows how that query combined the tables with keys."
  sample: { url: "/aurora/api/orders", label: "Load my orders" }
  big:
    title: "The big picture: the tables and the rows linked to your orders"
    text: "The teal squares are the rows that the query combined. Click an order to see its order_items and products rows, opened with JOIN, below it."
    legend: '<span><i class="k"></i>Key columns</span>'
  sections:
    - title: "JOIN step by step"
      html: |
        <ol>
          <li>The query selects the rows of <code>orders</code> whose <code>visitor_id</code> is yours (this column has an index).</li>
          <li>For each order, it finds the rows of <code>order_items</code> with the same <code>order_id</code>.</li>
          <li>With the <code>product_id</code> of each row, it gets the product name from the <code>products</code> table.</li>
          <li><code>GROUP BY</code> reduces each order to one row, and <code>string_agg</code> joins the product names with commas.</li>
        </ol>
        <p>If the name of a product changes, the list of old orders also shows the new name, because the name is stored in only one place.</p>
  explain:
    "SELECT (JOIN)":
      title: "Three tables in one query"
      text: "The query planner of PostgreSQL decided itself with which table to start and which index to use. You wrote only <q>what you want</q>, not <q>how to find it</q>."
  analogy:
    icon: "🧩"
    html: "<p>A school keeps the student list, the course list and the grade sheet in separate books. For <q>the report card of Ayşe</q>, you put the three books side by side with the student number and the course code. JOIN is this side-by-side match. The keys are the numbers that link the books.</p>"
  alternatives:
    engine: "Aurora PostgreSQL"
    criteria: ["JOIN between tables", "A new query for a new question", "Who operates it"]
    rows:
      - { name: "Amazon Aurora PostgreSQL", chosen: true, cells: [[y, "Full SQL"], [y, "The schema stays the same"], [y, "AWS"]] }
      - { name: "DynamoDB", sub: "key-value", cells: [[n, "The app combines the data"], [n, "A new index or a copy of the data"], [y, "AWS"]] }
      - { name: "DocumentDB", sub: "$lookup", cells: [[p, "$lookup, with limits"], [p, "With a pipeline"], [y, "AWS"]] }
    verdict: "Order data is relational by nature: customer, order, line, product. To combine these relations at query time is the core work of SQL."
  try:
    - { href: "/orders", label: "Load my orders again" }
  glossary:
    - ["JOIN", "Match the rows of two tables by a shared column value."]
    - ["GROUP BY", "Group rows by a column and reduce each group to one row."]
    - ["Query planner", "The part of the database that selects the cheapest way to run a SQL query."]

report:
  title: "Aurora 101: the operational report"
  apis: ["/api/report"]
  kicker: "Aurora 101: a report on live data"
  headline: "How did Aurora calculate a report from live orders, and where is its limit?"
  lead: "The order report calculated the orders and the revenue for each segment. This page shows the query plan and where reports of this kind start to be difficult for Aurora."
  sample: { url: "/aurora/api/report", label: "Load the order report" }
  big:
    title: "The big picture: the tables that the report scans"
    text: "The report reads almost all rows of the orders, customers and order_items tables. The teal squares are your orders, and the report counts them too."
    legend: '<span><i class="k"></i>Key columns</span>'
  sections:
    - title: "The row store and the report"
      html: |
        <p>Aurora stores data <b>row by row</b>: all columns of an order are next to each other on disk. This is ideal for work like <q>read one order, write one order</q>.</p>
        <p>A report adds up one column (for example the amount) over millions of rows. A row store then also reads the columns that the report does not need. With small and medium data, this is no problem. With years of data, an analytical database (Redshift) is a better fit.
        This is why the sales history report of Lale Market runs in Redshift.</p>
  explain:
    "SELECT (report)":
      title: "Totals per segment"
      text: "The query joined three tables, grouped them by segment and added them up. This query runs in the same database as the live orders. If it becomes very large, it can make checkout slower."
    "EXPLAIN ANALYZE":
      title: "The query plan"
      text: "<code>EXPLAIN ANALYZE</code> runs the query and shows the time and the number of rows of each step: which table was scanned (Seq Scan), where an index was used, and which method the JOIN used (Hash Join)."
    "SELECT (workshop orders)":
      title: "Workshop orders hour by hour"
      text: "The orders that were placed in the workshop today were grouped by hour. There are few of these rows, so the query is fast."
  analogy:
    icon: "📒"
    html: "<p>A row store is a card index that keeps a separate card for each customer. You find <q>the card of Ayşe</q> immediately. For <q>the total spending of all customers</q>, you must take out each card. If you do this every day, you move the spending to a book that keeps it in one column (Redshift).</p>"
  alternatives:
    engine: "Aurora (for an operational report)"
    criteria: ["Live data", "Speed in a large scan", "Effect on checkout"]
    rows:
      - { name: "Aurora, primary instance", chosen: true, cells: [[y, "Immediate"], [p, "Good with small and medium data"], [p, "Uses the same resources"]] }
      - { name: "Aurora read replica (reader)", sub: "the same cluster", cells: [[y, "Milliseconds behind"], [p, "The same row store"], [y, "Does not touch the writer"]] }
      - { name: "Redshift + zero-ETL", sub: "column store", cells: [[y, "Seconds behind"], [y, "Billions of rows"], [y, "Does not touch Aurora"]] }
    verdict: "For a small, current operations report, Aurora is enough and the simplest way. When the report grows, it moves to a read replica, and when the analytical need grows, it moves to Redshift with zero-ETL. Lale Market shows both."
  try:
    - { href: "/admin/orders", label: "Turn on EXPLAIN in the report" }
    - { href: "/admin/reports", label: "Ask the same question in Redshift" }
  glossary:
    - ["Row store", "Store all columns of a row next to each other on disk."]
    - ["Seq Scan", "Read all rows of a table from start to end."]
    - ["Hash Join", "A JOIN method that builds a hash table from one table in memory and matches the other table with it."]
