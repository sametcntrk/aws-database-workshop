# 101 lessons for Amazon Timestream for InfluxDB (English, ASD-STE100).
ops:
  title: "InfluxDB 101: sensors and time series"
  apis: ["/api/series", "/api/orders-metric"]
  kicker: "Timestream for InfluxDB 101: a time-series database"
  headline: "How did thousands of sensor readings become a few smooth points in the chart?"
  lead: "The operations screen drew the warehouse temperature, the humidity and the number of orders per minute. This page shows how InfluxDB stores the raw readings and how it reduces them for the chart."
  focus: ["query:measure", "query:range", "query:window"]
  sample: { url: "/influxdb/api/series?measure=temperature&window=15m&range=-6h", label: "Warehouse temperature" }
  big:
    title: "The big picture: series and time windows"
    text: "Each shelf is one <b>series</b>: a measurement and the tags that describe it, for example <code>warehouse=IST-1, sensor=temperature</code>. Each square is one time window, the newest at the right. Click a square to see the raw points of that window."
    legend: '<span><i class="k"></i>Tags and the value that goes to the chart</span>'
  sections:
    - title: "The data at the source, and the data in InfluxDB"
      html: |
        <p>At the source, the data is the readings that sensors send at fixed intervals. Each reading has a timestamp, a value, and the information <q>which warehouse, which sensor</q>.</p>
        <div class="src-store">
          <div><h3>Source: sensor readings</h3><pre>İstanbul warehouse, temperature, 14:00 → 21.4 °C
        İstanbul warehouse, temperature, 14:05 → 21.6 °C
        Ankara warehouse, humidity,      14:05 → 43 %</pre></div>
          <div><h3>In InfluxDB: line protocol</h3><pre>warehouse_env,warehouse=IST-1,sensor=temperature value=21.4 1730037600
        warehouse_env,warehouse=IST-1,sensor=temperature value=21.6 1730037900
        warehouse_env,warehouse=ANK-1,sensor=humidity value=43 1730037900</pre></div>
        </div>
        <ul>
          <li><b>Measurement</b> is the name of the reading (<code>warehouse_env</code>, <code>orders</code>).</li>
          <li><b>Tags</b> describe the reading, and InfluxDB indexes them. Points with the same tags make one <b>series</b>.</li>
          <li><b>Field</b> is the measured value. It is not indexed.</li>
          <li>On disk, the points are stored series by series, sorted by time and compressed. The question <q>the last 6 hours</q> opens only the related time blocks.</li>
        </ul>
  explain:
    "Flux query":
      title: "Range, filter and window"
      text: "<code>range</code> selected the time range, and <code>filter</code> selected the series. <code>aggregateWindow</code> reduced the raw points of each window to one value (a mean or a sum). A wider window gives fewer points in the chart and a clearer trend."
    write:
      title: "Write a new point"
      text: "The order that you placed in checkout was written as one point to the measurement <code>orders</code>, with the tag <code>channel=workshop</code>. It shows in the order chart at once."
  analogy:
    icon: "🌡️"
    html: "<p>In a hospital, a nurse measures the temperature of a patient every hour and writes it on a chart. The doctor does not read each value. The doctor looks at the curve on the chart. A time-series database is this chart, and <code>aggregateWindow</code> is the hand that turns the values into the curve.</p>"
  alternatives:
    engine: "Timestream for InfluxDB"
    criteria: ["Continuous readings", "Summary per window", "Delete old data", "Chart tools", "Who operates it"]
    rows:
      - { name: "Amazon Timestream for InfluxDB", chosen: true, cells: [[y, "Compressed by time"], [y, "aggregateWindow"], [y, "Bucket retention period"], [y, "Grafana, InfluxDB API"], [y, "AWS"]] }
      - { name: "Aurora PostgreSQL", sub: "readings table", cells: [[p, "The table grows fast"], [p, "<code>date_trunc</code> + GROUP BY"], [p, "Scheduled DELETE"], [y, "SQL tools"], [y, "AWS"]] }
      - { name: "DynamoDB", sub: "pk = series, sk = time", cells: [[y, "High write rate"], [n, "No summary on the server"], [y, "TTL"], [n, "Extra code"], [y, "AWS"]] }
      - { name: "InfluxDB on EC2", sub: "your own installation", cells: [[y, "The same"], [y, "The same"], [y, "The same"], [y, "The same"], [n, "You: disks, backups, patches"]] }
    verdict: "Sensor and metric data always arrives with time, is always queried by a time range, and loses its value when it gets old. A time-series database does all three as built-in features."
  try:
    - { href: "/admin/ops", label: "Change the window on the operations screen" }
  glossary:
    - ["Time series", "A sequence of readings in time order."]
    - ["Measurement", "The name of a kind of reading."]
    - ["Tag", "An indexed label that identifies a series."]
    - ["Field", "The measured value."]
    - ["Line protocol", "The one-line write format of InfluxDB: measurement, tags, fields, time."]
