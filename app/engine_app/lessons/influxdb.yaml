# 101 lessons for Amazon Timestream for InfluxDB (Turkish).
ops:
  title: "InfluxDB 101: sensörler ve zaman serisi"
  apis: ["/api/series", "/api/orders-metric"]
  kicker: "Timestream for InfluxDB 101: zaman serisi veritabanı"
  headline: "Binlerce sensör ölçümü, grafikteki birkaç düzgün noktaya nasıl dönüştü?"
  lead: "Operasyon ekranı depo sıcaklığını, nemi ve dakikadaki sipariş sayısını çizdi. Bu sayfa ham ölçümlerin InfluxDB'de nasıl saklandığını ve grafiğe nasıl indirgendiğini gösteriyor."
  focus: ["query:measure", "query:range", "query:window"]
  sample: { url: "/influxdb/api/series?measure=temperature&window=15m&range=-6h", label: "Warehouse temperature" }
  big:
    title: "Büyük resim: seriler ve zaman pencereleri"
    text: "Her raf bir <b>seri</b>: bir ölçüm (measurement) ve onu tanımlayan etiketler (tag), ör. <code>warehouse=IST-1, sensor=temperature</code>. Her kare bir zaman penceresi; en yeni sağda. Tıkla: o penceredeki ham noktaları gör."
    legend: '<span><i class="k"></i>Tag''ler ve grafiğe giden değer</span>'
  sections:
    - title: "Kaynakta veri böyleydi, InfluxDB'de böyle duruyor"
      html: |
        <p>Kaynakta veri, sensörlerin belli aralıklarla gönderdiği ölçümlerdir. Her ölçüm bir zaman damgası, bir değer ve <q>hangi depo, hangi sensör</q> bilgisinden oluşur.</p>
        <div class="src-store">
          <div><h3>Kaynak: sensör ölçümleri</h3><pre>İstanbul deposu, sıcaklık, 14:00 → 21,4 °C
        İstanbul deposu, sıcaklık, 14:05 → 21,6 °C
        Ankara deposu, nem,       14:05 → 43 %</pre></div>
          <div><h3>InfluxDB'de: line protocol</h3><pre>warehouse_env,warehouse=IST-1,sensor=temperature value=21.4 1730037600
        warehouse_env,warehouse=IST-1,sensor=temperature value=21.6 1730037900
        warehouse_env,warehouse=ANK-1,sensor=humidity value=43 1730037900</pre></div>
        </div>
        <ul>
          <li><b>Measurement</b> ölçümün adıdır (<code>warehouse_env</code>, <code>orders</code>).</li>
          <li><b>Tag'ler</b> ölçümü tanımlar ve index'lenir. Aynı tag'leri taşıyan noktalar bir <b>seri</b> oluşturur.</li>
          <li><b>Field</b> ölçülen değerdir; index'lenmez.</li>
          <li>Noktalar diskte seri seri, zamana göre sıralı ve sıkıştırılmış durur. <q>Son 6 saat</q> sorusu yalnız ilgili zaman bloklarını açar.</li>
        </ul>
  explain:
    "Flux query":
      title: "Aralık, filtre ve pencere"
      text: "<code>range</code> zaman aralığını, <code>filter</code> seriyi seçti. <code>aggregateWindow</code> her pencerenin ham noktalarını tek bir değere (ortalama ya da toplam) indirdi. Pencere büyüdükçe grafikteki nokta sayısı azalır, eğilim belirginleşir."
    write:
      title: "Yeni bir nokta yazmak"
      text: "Checkout'ta verdiğin sipariş, <code>orders</code> measurement'ına <code>channel=workshop</code> tag'iyle bir nokta olarak yazıldı. Sipariş grafiğinde hemen görünür."
  analogy:
    icon: "🌡️"
    html: "<p>Bir hastanede hemşire her saat hastanın ateşini ölçüp çizelgeye yazar. Doktor bütün ölçümleri tek tek okumaz; çizelgedeki eğriye bakar. Zaman serisi veritabanı bu çizelgedir; <code>aggregateWindow</code> ise ölçümleri eğriye çeviren eldir.</p>"
  alternatives:
    engine: "Timestream for InfluxDB"
    criteria: ["Sürekli gelen ölçümler", "Pencereye göre özet", "Eski veriyi atma", "Grafik araçları", "Kim işletir"]
    rows:
      - { name: "Amazon Timestream for InfluxDB", chosen: true, cells: [[y, "Zamana göre sıkıştırılmış"], [y, "aggregateWindow"], [y, "Bucket saklama süresi"], [y, "Grafana, InfluxDB API"], [y, "AWS"]] }
      - { name: "Aurora PostgreSQL", sub: "ölçüm tablosu", cells: [[p, "Tablo hızla büyür"], [p, "<code>date_trunc</code> + GROUP BY"], [p, "Zamanlanmış DELETE"], [y, "SQL araçları"], [y, "AWS"]] }
      - { name: "DynamoDB", sub: "pk = seri, sk = zaman", cells: [[y, "Yüksek yazma"], [n, "Sunucuda özet yok"], [y, "TTL"], [n, "Ek kod"], [y, "AWS"]] }
      - { name: "EC2 üzerinde InfluxDB", sub: "kendi kurulumun", cells: [[y, "Aynı"], [y, "Aynı"], [y, "Aynı"], [y, "Aynı"], [n, "Sen: disk, yedek, yama"]] }
    verdict: "Sensör ve metrik verisi hep zamanla gelir, hep zaman aralığıyla sorulur ve eskiyince değerini yitirir. Zaman serisi veritabanı bu üçünü de yerleşik olarak yapar."
  try:
    - { href: "/admin/ops", label: "Operasyon ekranında pencereyi değiştir" }
  glossary:
    - ["Zaman serisi", "Zamana göre sıralı ölçümler dizisi."]
    - ["Measurement", "Bir ölçüm türünün adı."]
    - ["Tag", "Bir seriyi tanımlayan, index'lenen etiket."]
    - ["Field", "Ölçülen değer."]
    - ["Line protocol", "InfluxDB'nin tek satırlık yazma biçimi: measurement, tag'ler, field'lar, zaman."]
