# 101 lessons for Amazon Keyspaces (English, ASD-STE100).
activity:
  title: "Keyspaces 101: activity history and wide column"
  apis: ["/api/events", "/api/activity", "/api/recent", "/api/simulate"]
  kicker: "Keyspaces 101: a wide-column database"
  headline: "Where does each page that you visit go, and why is the newest always at the top?"
  lead: "When you looked at a product, added it to the cart or searched, TDS Academy Market wrote an event to Keyspaces. The activity page read these events from the newest to the oldest. This page shows how the events are arranged."
  sample: { url: "/keyspaces/api/activity", label: "Load my activity" }
  big:
    title: "The big picture: partitions and your history"
    text: "Each shelf is a <b>partition</b>: all events of one user. Each square is one event, and the newest event is at the left. The top shelf is yours. The <code>SIM-</code> shelves are the virtual shoppers of the Load Simulation."
    legend: '<span><i class="k"></i>Primary key: partition key + clustering key</span>'
  sections:
    - title: "The data at the source, and the data in Keyspaces"
      html: |
        <p>At the source, the data is a stream of events: who did what, and when. It comes all the time from millions of users. It is almost never updated. New events are only added.</p>
        <div class="src-store">
          <div><h3>Source: the event stream</h3><pre>14:02:11  7f3c…  view    P0001
        14:02:40  9a1b…  search  "kulaklik"
        14:03:05  7f3c…  cart    P0001
        …</pre></div>
          <div><h3>In Keyspaces: sorted rows for each user</h3><pre>PRIMARY KEY ((user_id), event_time, event_id)
        CLUSTERING ORDER BY (event_time DESC)

        partition 7f3c…: 14:03:05 cart, 14:02:11 view, …</pre></div>
        </div>
        <ul>
          <li><b>user_id (partition key)</b> decides the partition of an event. All history of one user is in the same place.</li>
          <li><b>event_time, event_id (clustering key)</b> decide the order inside the partition. The table keeps this order when it writes, so a read needs no sort.</li>
          <li><b>TTL 7 days:</b> old events are deleted automatically.</li>
        </ul>
        <p>Keyspaces is a service that is compatible with Apache Cassandra. The same CQL language and the same drivers work, but there are no servers.</p>
  explain:
    INSERT:
      title: "Write the event"
      text: "The event went into your partition. The write used <code>LOCAL_QUORUM</code>: at least 2 of the 3 copies confirmed it."
    SELECT:
      title: "Read the history"
      text: "One partition was read, and the rows came back already sorted from the newest to the oldest. <code>LOCAL_ONE</code> reads from one copy and costs half, but your last event may not be there yet."
    "INSERT × N":
      title: "Hundreds of parallel writes"
      text: "500 virtual shoppers wrote to 500 different partitions. The load spread over the partitions, so the writes ran in parallel. These rows are deleted after 10 minutes."
  analogy:
    icon: "📓"
    html: "<p>Think of a separate diary for each user. Each event is a new line in the diary, and the diary opens at the newest page. For the question <q>what did I look at last</q>, you look only at the first page of your own diary. You do not touch the diaries of other people.</p>"
  alternatives:
    engine: "Keyspaces"
    criteria: ["Very high write volume", "Sorted reads per user", "Delete old data", "Cassandra compatibility", "Who operates it"]
    rows:
      - { name: "Amazon Keyspaces", chosen: true, cells: [[y, "Serverless, horizontal"], [y, "Clustering order"], [y, "TTL"], [y, "CQL, the same drivers"], [y, "AWS"]] }
      - { name: "DynamoDB", sub: "pk = user, sk = time", cells: [[y, "Serverless"], [y, "With the sort key"], [y, "TTL"], [n, "A different API"], [y, "AWS"]] }
      - { name: "Aurora PostgreSQL", sub: "events table", cells: [[p, "One writer instance"], [y, "With an index"], [p, "Scheduled DELETE"], [n, "SQL"], [y, "AWS"]] }
      - { name: "Cassandra on EC2", sub: "your own cluster", cells: [[y, "Horizontal"], [y, "The same"], [y, "The same"], [y, "Full"], [n, "You: nodes, repair, patches"]] }
    verdict: "An activity stream is data that grows all the time, that is read in time order for each user, and that is deleted when it gets old. That is the core use of the wide-column model. DynamoDB can also do this work. Keyspaces was selected because it gives teams that know Cassandra the same language and tools, with no servers."
  try:
    - { href: "/account/activity", label: "Try LOCAL_ONE on the activity page" }
    - { href: "/search?q=kulaklik", label: "Do a search and see the new event" }
  glossary:
    - ["Partition key", "The column that decides in which partition the rows are stored."]
    - ["Clustering key", "The columns that decide the order of the rows inside a partition."]
