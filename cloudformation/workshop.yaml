            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: engine-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt AuroraCluster.MasterUserSecret.SecretArn

  AppProfileAurora:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub dbws-app-aurora-${AWS::Region}
      Roles:
        - !Ref AppRoleAurora

  TgAurora:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: dbws-tg-aurora
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8000
      TargetType: instance
      HealthCheckPath: /aurora/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '15'
      Targets:
        - Id: !Ref AppAurora
          Port: 8000

  RuleAurora:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /aurora
              - /aurora/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TgAurora

  AppAurora:
    Type: AWS::EC2::Instance
    DependsOn: [NatRouteA, VpcEndpointSecretsManager, VpcEndpointSsm]
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref AppSubnetA
