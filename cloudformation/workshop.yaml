          Value: dbws-app-aurora
        - Key: dbws:engine
          Value: aurora
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          cat > /etc/engine-app.env <<'EOF'
          ENGINE=aurora
          URL_PREFIX=/aurora
          AWS_REGION=${AWS::Region}
          AWS_DEFAULT_REGION=${AWS::Region}
          DB_HOST=${AuroraCluster.Endpoint.Address}
          DB_PORT=5432
          DB_NAME=shop
          DB_SECRET_ARN=${AuroraCluster.MasterUserSecret.SecretArn}
          EOF
          dnf install -y git
          git clone --depth 1 --branch ${AppRepoRef} ${AppRepoUrl} /opt/engine-app
          bash /opt/engine-app/app/deploy/bootstrap.sh

